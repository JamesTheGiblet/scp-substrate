outputs.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide does not say what servos do when the signal stops, so do not assume OE is a safe stop for a loaded mechanism without testing it.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Useful, but I would not call it a safety stop until I have tested a loaded joint.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With OE wired to a stop switch, one input could cut every PWM signal without touching the I2C bus.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Control Pins, page 7.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the OE pin is active low, meaning it is pulled low by default, and pulling it high disables all outputs. However, I am uncertain about the safety of this as a stop for a loaded mechanism, as the guide does not provide information on what happens to the servos when the signal stops, and I would not consider it a reliable safety stop without further testing.", "neighbours": [], "link_drafts": [{"other": "cube/emergency-stop-cuts-power", "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/6", "why": "OE stops the signals, not the power"}, {"other": "cube/robots-can-move-without-warning", "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/7", "why": "outputs can be held off at start-up"}, {"other": "cube/pca9685-wiring-for-controllers", "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/8", "why": "OE is one more line to wire"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-one-frequency-for-all-channels", "created_at": "2026-11-01T16:07:01Z", "content": "All 16 channels share one PWM frequency.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Output Ports", "tags": ["pca9685", "hardware", "pwm"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Duty cycle is independent per channel, but frequency is not, so servos and LEDs at different frequencies cannot share a board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide says servos need 60 Hz. Not from the guide: many servo datasheets specify 50 Hz, so check yours. The Arduino chaining example sets 1600, which is unsuitable for servos.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Fine for servos alone. LEDs that need another frequency go on their own board.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-one-frequency-for-all-channels/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Mixing a 60 Hz servo and a 1 kHz LED strip would need a second board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "setPWMFreq takes 40 to 1600 Hz. Pages 7, 14 and 18.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim that all 16 channels share one PWM frequency is true, as stated in the Adafruit PCA9685 guide. However, I note that this may not be suitable for all applications, particularly those requiring different frequencies, such as servos, which may require a separate board.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-pwm-ticks", "created_at": "2026-11-01T16:07:02Z", "content": "setPWM sets on and off ticks within a 4096-step cycle.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Library Reference", "tags": ["pca9685", "hardware", "pwm", "arduino"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Channel is 0 to 15, and on and off are ticks from 0 to 4095. setPWM(15, 1024, 3072) goes high at 25 percent and low at 75 percent.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Fully on and fully off break that range. They use the special value 4096, so 4095 is not fully off, as the FAQ points out.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Fine to know, but I would use a library's angle call and only drop to ticks when needed.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-pwm-ticks/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Code clamping values to 4095 would leave LEDs faintly lit and never fully off.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Fully on is setPWM(pin, 4096, 0). Fully off is setPWM(pin, 0, 4096). Pages 18, 19 and 30.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because the Adafruit PCA9685 guide states that the PWM cycle is 4096 steps, and the FAQ confirms that fully on and fully off values are 4096 and 0, respectively. However, I note that the fully off value is not exactly 0, as the special value 4096 is used, which means the LEDs will not be fully off at 4095. This limitation is acknowledged in the FAQ.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-python-duty-cycle-is-12-bit", "created_at": "2026-11-01T16:07:02Z", "content": "In Python, duty_cycle takes 16 bits but the chip resolves only 12.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Dimming LEDs", "tags": ["pca9685", "hardware", "pwm", "python"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "duty_cycle runs from 0 to 0xFFFF to match other PWM objects. The example code notes only 12 bits of real resolution.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "So a 16-step-sized change can do nothing. Fine values give a false sense of precision.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A detail to remember when fades look stepped. 12 bits is plenty for what I need.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-python-duty-cycle-is-12-bit/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A smooth fade written for 16 bits would still move in 4096 real steps.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 23 and 24.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim that the duty_cycle takes 16 bits but the chip resolves only 12 bits is true, as stated in the Adafruit PCA9685 guide. However, I note that this may not be a significant limitation for my purposes, as the guide suggests that 12 bits of real resolution is sufficient for my needs.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-servo-current-sizing", "created_at": "2026-11-01T16:07:01Z", "content": "Size the servo supply for current, not just voltage.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Power for the Servos", "tags": ["pca9685", "hardware", "power", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Micro servos draw several hundred mA while moving, and some high-torque servos draw over 1A each under load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide lists 5V 2A, 4A and 10A supplies but gives no sizing rule, and 2A would not cover several high-torque servos moving together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Measure it. A generous supply costs less than chasing brownouts.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servo-current-sizing/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A supply sized for average draw would brown out the moment every joint moved at once.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "4xAA packs give 6V with alkaline cells and 4.8V with NiMH. Pages 10 and 20.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because high-torque servos can draw over 1A each under load, and using a supply sized for average draw would likely result in brownouts. However, the main limit of this claim is that the guide does not provide a specific sizing rule, and 2A may not be sufficient for all high-torque servos moving together.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-30q-current-rating", "proposal_id": "cube/li-ion-30q-current-rating/proposal/7", "why": "the same supply sizing question"}, {"other": "cube/mg996r-current", "proposal_id": "cube/mg996r-current/proposal/7", "why": "2.5A per servo sets the supply size"}, {"other": "cube/shape-sets-the-power-budget", "proposal_id": "cube/shape-sets-the-power-budget/proposal/7", "why": "the same sizing question"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-servo-plug-orientation", "created_at": "2026-11-01T16:07:02Z", "content": "Servo plugs go ground to the bottom row, signal to the top.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Connecting a Servo", "tags": ["pca9685", "hardware", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Ground is usually black or brown, and signal is usually yellow, white or orange. Each port has V+, GND and PWM.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Wire colours are a convention. The guide says to check your servo's data sheet.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Worth a check every time a plug is reconnected, since it is easy to get wrong in a tight space.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servo-plug-orientation/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A plug reversed on a dense 16-port header is easy to miss in a tight assembly.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 7, 11 and 25.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim that servo plugs go ground to the bottom row and signal to the top is true, as it is stated in the Adafruit PCA9685 guide. However, I should note that the wire colours are a convention and should be checked against the servo's data sheet to confirm.", "neighbours": [], "link_drafts": [{"other": "cube/first-power-on-checks", "proposal_id": "cube/first-power-on-checks/proposal/10", "why": "plug orientation is worth checking first"}, {"other": "cube/servo-wire-colours", "proposal_id": "cube/servo-wire-colours/proposal/6", "why": "colour tells you which way round"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-servokit-for-python", "created_at": "2026-11-01T16:07:02Z", "content": "ServoKit is the simple way to drive servos from Python.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Controlling Servos", "tags": ["pca9685", "hardware", "servo", "python"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ServoKit(channels=16) for this breakout. Set kit.servo[0].angle for standard servos and kit.continuous_servo[1].throttle for continuous ones.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide has rough edges: it says actuation_angle in one place and actuation_range in another, uses servokit where it means kit, and its full example sets channels=8.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A good way to start on a Linux board, though on an ESP32 I would be using a different library.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servokit-for-python/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Copying the example unchanged would leave channels 8 to 15 unreachable on this board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Tune with actuation_range and set_pulse_width_range, such as (1000, 2000). Requires adafruit-circuitpython-servokit. Pages 21 to 27.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe ServoKit is a suitable way to drive servos from Python, as it provides a simple interface for standard servos and continuous servos. However, I note that the Adafruit guide has some inconsistencies and rough edges, which may require some adjustments to get it working correctly.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-sixteen-channels-over-i2c", "created_at": "2026-11-01T16:07:01Z", "content": "The PCA9685 drives 16 PWM channels over I2C using two signal pins.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Overview", "tags": ["pca9685", "hardware", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "16 channels at 12-bit resolution, run by the on-board controller with no extra microcontroller processing.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The board needs its own servo power, so two signal pins is not the whole wiring job. Control is four wires: VCC, GND, SDA and SCL.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "This is why I would use the board: it takes the PWM work off the controller.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-sixteen-channels-over-i2c/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Driving 16 servos directly would use 16 pins and tie up the controller's timers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Overview, page 5.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the PCA9685 is suitable for this project because it can drive 16 PWM channels over I2C using only two signal pins, which is a significant advantage. However, I note that this is only possible due to the on-board controller handling the PWM work, and the board still requires its own power supply, which is a limitation.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-v-plus-voltage-limit", "created_at": "2026-11-01T16:07:01Z", "content": "Servo power on V+ should be 5 to 6V DC.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Power Pins and Hooking it Up", "tags": ["pca9685", "hardware", "power", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "V+ is not used by the chip. The guide recommends 5 to 6V DC, through the blue terminal block, which is polarity protected.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide contradicts itself. Page 7 says you can go up to 12V DC if you have to. Page 10 says V+ can be as high as 6V. Treat 6V as the limit unless the datasheet and your servos say otherwise.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "I stay at 6V or below. A guide that disagrees with itself gets the cautious reading.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-v-plus-voltage-limit/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A slip that joined V+ to VCC at 12V would damage the board, as the guide warns.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 7 and 10.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because the Adafruit guide recommends 5 to 6V DC for servo power on V+, and the blue terminal block is polarity protected. However, I consider the main limit to be the datasheet and servo specifications, as the guide contradicts itself on this point.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-too-high-for-servos", "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/7", "why": "the pack needs stepping down for V+"}, {"other": "cube/mg996r-voltage-exceeds-pca9685", "proposal_id": "cube/mg996r-voltage-exceeds-pca9685/proposal/6", "why": "the board limit is lower than the servo's"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-vcc-is-logic-power-only", "created_at": "2026-11-01T16:07:01Z", "content": "VCC powers the chip only. Servos need V+ connected as well.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Power Pins and Hooking it Up", "tags": ["pca9685", "hardware", "power"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "VCC should be 3 to 5V and match the microcontroller's logic, since it also feeds the 10K pullups on SCL and SDA.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The output logic level also follows VCC, so at 3.3V the PWM signal is 3.3V even when servos run from 6V. The guide does not discuss whether a given servo accepts that.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "An easy mistake to make once, so worth keeping as a checklist item.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-vcc-is-logic-power-only/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If V+ were fed from VCC, a servo stall would pull down the logic supply.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Green LED shows the board has power. Pages 7, 10 and 16.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because the VCC voltage range and its matching with the microcontroller's logic are supported by the Adafruit guide. However, I am unsure if the PWM signal at 3.3V will be compatible with servos running at 6V, as the guide does not explicitly state this. I will verify this with further research.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-wiring-for-controllers", "created_at": "2026-11-01T16:07:02Z", "content": "Wiring is the same four lines on any I2C controller.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Hooking it Up and Python Wiring", "tags": ["pca9685", "hardware", "i2c", "arduino"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "VCC, GND, SDA and SCL. Classic Arduino uses A4 and A5, older Mega uses 20 and 21, and R3 boards have dedicated pins. Pi and Feather use 3V logic.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide doesn’t cover the ESP32. The default pins on a WROOM-32 DevKit are SDA GPIO21 and SCL GPIO22, but any GPIO works through Wire.begin(sda, scl), and the S3 has no fixed default. The “four lines” are logic only: servos need separate power on V+, with a ground shared with the controller.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:37:45Z"}, "OPINION": {"content": "The logic wiring is simple. The two things that need care are matching VCC to the controller’s logic voltage and never powering the servos from VCC.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:37:56Z"}, "FICTION": {"content": "Suppose someone wires only the four lines and plugs in servos. The chip responds on I2C, PWM is configured, and nothing moves, or the servos twitch weakly. V+ was never connected, so all the logic is working and there’s no power to drive the servos.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:38:05Z"}, "CONTEXT": {"content": "The ESP32 gap is noted because the ESP32 is the main controller in James’s builds. Pages 9, 19 and 20.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:38:17Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert, 2026-11-02.\n\nThe logic wiring is four lines on any I2C controller: VCC (matched to the controller’s logic level), GND, SDA and SCL.\nESP32-WROOM-32: SDA GPIO21, SCL GPIO22 by default, or set them in Wire.begin(). VCC is 3.3 V.\nServo power goes to V+ from a separate supply sized for stall current, and its ground is common with the controller.\nOptional: wire OE (active low) to a GPIO and hold it high at boot, so servos don’t twitch before init.", "stale": false, "at": "2026-11-02T22:38:32Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:38:36Z"}, "note_draft": "I believe the wiring for an I2C controller is standardised to VCC, GND, SDA, and SCL, as this is a widely accepted configuration. However, I am aware that the PCA9685 guide does not explicitly cover the ESP32, which may require additional research to confirm the correct wiring.", "neighbours": [], "link_drafts": [{"other": "cube/pca9685-oe-pin-disables-outputs", "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/8", "why": "OE is one more line to wire"}], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 1.0, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "esp32"}, {"lens": "FACT", "term": "arduino"}, {"lens": "COUNTER", "term": "default"}], "other": "cube/esp32-i2c-pins-are-configurable"}]}, {"id": "cube/phase-0-is-documentation", "created_at": "2026-11-01T15:36:10Z", "content": "Phase 0 is always documentation.", "created": "2026-11-01T15:36:10Z", "source": "phase-0 principle", "tags": ["principle", "process", "foundational", "preference"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as the first of james's build rules: document fully before building.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Docs can lag once building starts. At 2026-11-01 keystone-gate/README.md still called kg_agent.py empty when it held 526 lines, and STRUCTURE.md listed 21 tests when there were 70.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Still right, but documents have to be kept current or they mislead. This project showed that.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:02:34Z"}, "FICTION": {"content": "If building came first, ideas would start before they fit, and the reasons for them would live only in memory.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "From phase-0: ideas parked for years, documented, not started until they fit. The scp project links to it with follows.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe the Phase 0 principle is valid because it aligns with standard project management practices, which emphasize documenting ideas before implementation. However, I acknowledge that documents can become outdated, and it is essential to regularly update them to ensure accuracy and avoid misleading information.", "stale": false, "at": "2026-11-02T22:02:41Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:02:44Z"}, "note_draft": "I believe the Phase 0 principle is valid because it aligns with standard project management practices, which emphasize documenting ideas before implementation. However, I acknowledge that documents can become outdated, and it is essential to regularly update them to ensure accuracy and avoid misleading information.", "neighbours": [], "link_drafts": [{"other": "cube/plain-words-in-docs", "proposal_id": "cube/phase-0-is-documentation/proposal/6", "why": "documentation comes first, so how it reads matters"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pi-3-is-a-linux-computer", "created_at": "2026-11-03T00:10:29Z", "content": "A Raspberry Pi 3 is a Linux computer, unlike the four microcontroller boards here.", "created": "2026-11-03T00:10:29Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Raspberry Pi's product brief gives the 3 Model B+ as a quad-core 64-bit BCM2837B0 at 1.4GHz with 1GB RAM, 2.4 and 5 GHz Wi-Fi and Bluetooth 4.2. The earlier 3 Model B page gives 1.2GHz.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-is-a-linux-computer/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Which Pi 3 matters, as the Model B is slower and has 2.4 GHz only as far as this page shows. Linux is not real-time, and an OS has to boot and shut down. That is general knowledge, not from the brief.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-is-a-linux-computer/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use it for vision, logging and networking, and let a microcontroller handle timing.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-is-a-linux-computer/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a robot is run from Pi GPIO alone. Linux pauses at a bad moment, and a servo pulse stretches.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-is-a-linux-computer/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This suits the same pattern as your substrate: one part does the thinking and a separate part does the checking.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-is-a-linux-computer/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Raspberry Pi's product brief. The Linux point is general knowledge. I have not tested this myself.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pi-3-power-and-lifetime", "created_at": "2026-11-03T00:10:29Z", "content": "A Pi 3 B+ needs 5V at 2.5A, and stays in production until at least January 2028.", "created": "2026-11-03T00:10:29Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Raspberry Pi's product brief gives 5V/2.5A DC by micro USB, 5V by GPIO header, 0 to 50°C, and production until at least January 2028. The Model B page also says January 2028.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-power-and-lifetime/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That 2.5A is more than the whole ESP32-based stack. Its GPIO is 3.3V and not 5V tolerant according to a third-party guide, and I did not read official documents on that, or a per-pin limit.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-power-and-lifetime/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Give it its own regulator, because it is the wrong thing to run from a small battery.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-power-and-lifetime/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a Pi 3 runs from the 2S pack through a regulator. At 2.5A and 5V it takes 12.5W, so 22Wh lasts under two hours, before any servos.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-power-and-lifetime/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "An abrupt power cut can also corrupt the SD card, which is general knowledge, so a battery robot needs a clean shutdown.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/pi-3-power-and-lifetime/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Raspberry Pi's product brief, and the runtime is my arithmetic. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-is-22wh-not-6000mah", "proposal_id": "cube/pi-3-power-and-lifetime/proposal/6", "why": "12.5W against 22Wh"}, {"other": "cube/servos-and-the-esp32-should-have", "proposal_id": "cube/pi-3-power-and-lifetime/proposal/7", "why": "the same separate supply rule"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pico-is-a-cheap-dual-core", "created_at": "2026-11-03T00:10:30Z", "content": "A Raspberry Pi Pico is a dual-core 133MHz board, with no radio and 264KB of RAM.", "created": "2026-11-03T00:10:30Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A Pico datasheet summary gives dual Cortex-M0+ up to 133MHz, 2MB flash, 264kB SRAM, 26 GPIOs at 3.3V, 3 analog, and 16 PWM channels. Adafruit lists the same chip, RP2040.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/pico-is-a-cheap-dual-core/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "I could not open Raspberry Pi's own Pico PDF, so this is from a reseller's copy. Sources say it is not 5V tolerant. This is the original Pico, and it has no wireless, while a Pico W does.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/pico-is-a-cheap-dual-core/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Choose it for more pins and steady timing when Wi-Fi is not needed.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/pico-is-a-cheap-dual-core/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose one core runs a servo loop and the other reads sensors. The timing stays steady, which a single-core C3 under Wi-Fi may not manage.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/pico-is-a-cheap-dual-core/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Despite the name, it is a microcontroller, not a small Pi 3: no Linux, no OS.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/pico-is-a-cheap-dual-core/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a reseller's copy of the datasheet summary. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-c3-is-single-core-risc-v", "proposal_id": "cube/pico-is-a-cheap-dual-core/proposal/6", "why": "two cores against one"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/pla-creeps-under-load", "created_at": "2026-11-01T16:50:49Z", "content": "PLA printed parts deform under sustained load and warmth.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["3d-printing", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "PLA softens at fairly low temperatures and can slowly creep when loaded for long periods.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A part near a warm servo or in a hot room may fail without warning. PETG or ABS resist heat better, but print differently.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Fine for prototypes. Parts holding load near a warm servo should be PETG or better.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pla-creeps-under-load/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "An arm left holding a load overnight could sag by morning.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Relevant to printed arm parts and the printer build.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I agree that PLA printed parts are prone to deformation under sustained load and warmth due to its tendency to soften at low temperatures and creep when loaded for extended periods. However, I note that this effect can be mitigated by using PETG or ABS, which resist heat better and print differently, but may require adjustments to the print settings.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/plain-words-in-docs", "created_at": "2026-11-03T13:24:58Z", "content": "Docs are written in plain words, without hype or buzzwords.", "created": "2026-11-03T13:24:58Z", "source": "Written by Claude from this repo's README, docs and code", "tags": ["foundational", "preference", "docs"], "group": "Project claims", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The docs here say what each part does, list its limits, and say where something is untested.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/plain-words-in-docs/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Plain words can undersell work, and some technical terms have no plain substitute.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/plain-words-in-docs/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "A reader should be able to check every sentence against the code.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/plain-words-in-docs/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the README called the substrate revolutionary. The first limit a reader met would cost it their trust.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/plain-words-in-docs/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "It goes with British English everywhere, and with Phase 0 being documentation.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/plain-words-in-docs/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/british-english-everywhere", "proposal_id": "cube/british-english-everywhere/proposal/5", "why": "both are about how things are written"}, {"other": "cube/compress-in-uncertain-channels", "proposal_id": "cube/compress-in-uncertain-channels/proposal/6", "why": "short, plain wording survives a noisy channel"}, {"other": "cube/phase-0-is-documentation", "proposal_id": "cube/phase-0-is-documentation/proposal/6", "why": "documentation comes first, so how it reads matters"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/prevent-reversed-battery", "created_at": "2026-11-03T00:22:03Z", "content": "A reversed battery can destroy a whole rail, so use a polarised connector and input protection.", "created": "2026-11-03T00:22:03Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "CircuitDigest and Nexperia describe series diodes and P-channel MOSFETs for this. Specialised diodes drop about 250-300mV, and one vendor gives under 0.12V at 10A for a MOSFET. The XT connector cube covers polarised plugs.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/prevent-reversed-battery/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "A MOSFET needs gate protection and more parts, and TI warns P-channel parts degrade when supply falls below about 4V. Those results are about designs in general, not this project.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/prevent-reversed-battery/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "A polarised connector is the cheapest protection, and a meter check is the first one.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/prevent-reversed-battery/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a home-made lead has its colours swapped. A plain two-pin connector fits either way, and everything on the rail dies at once.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/prevent-reversed-battery/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the DC colour cube, where colour is shown to be only a habit.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/prevent-reversed-battery/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From vendor and engineering articles, not tested here.", "neighbours": [], "link_drafts": [{"other": "cube/dc-wire-colours-are-a-habit", "proposal_id": "cube/prevent-reversed-battery/proposal/6", "why": "colour alone will not protect you"}, {"other": "cube/xt60-is-30a-continuous", "proposal_id": "cube/prevent-reversed-battery/proposal/7", "why": "polarised plugs"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/print-orientation-sets-strength", "created_at": "2026-11-01T16:50:49Z", "content": "Layer direction decides where a printed part is weak.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["3d-printing", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Printed parts are weakest between layers, so orient them so load runs along the layers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The strongest orientation may need more support material or worse surface finish, so it is a trade.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Orient for load first and accept extra supports on anything structural.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/print-orientation-sets-strength/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A bracket printed the wrong way could snap along a layer line at far below its rated load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Matters for joints and brackets under the highest torque.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I agree that the layer direction of a printed part can affect its strength, with the weakest points typically occurring between layers. However, I believe that the optimal orientation may depend on the specific application and design requirements, and may require additional support material or a better surface finish to achieve the desired level of strength.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/private-text-stays-on-this-machine", "created_at": "2026-11-03T00:45:23Z", "content": "Text from private cubes and repos goes to local models only.", "created": "2026-11-03T00:45:23Z", "source": "Written by Claude from this project's code, see source/project-security", "tags": ["security", "foundational"], "group": "Foundations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "kg_repos.py and kg_fill.py use local models for private repos and cubes tagged private. kg_llm.py sends answers that contain a private cube's text to local models.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/private-text-stays-on-this-machine/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That last check matches exact text, so a reworded answer could pass it. On 2 November, parts of private JIG cubes also reached a Claude session through test output, so tools used by hand are not covered.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/private-text-stays-on-this-machine/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Treat this rule as covering the code only, and be careful what gets pasted into a chat.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/private-text-stays-on-this-machine/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a walker rewords a private cube. The text check misses it, and the sentence goes to Google.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/private-text-stays-on-this-machine/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is a known gap, and it is listed here so it stays visible.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/private-text-stays-on-this-machine/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/james-qinetiq-malvern", "proposal_id": "cube/private-text-stays-on-this-machine/proposal/6", "why": "personal cubes are covered"}, {"other": "cube/this-repo-stays-private", "proposal_id": "cube/this-repo-stays-private/proposal/6", "why": "both keep private data in"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/protection-cannot-stop-internal-faults", "created_at": "2026-11-03T00:22:02Z", "content": "A BMS guards against outside abuse, not a fault inside the cell.", "created": "2026-11-03T00:22:02Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Battery University says Li-ion packs need a protection circuit, but that it guards only against outside abuse and not internal defects. It lists PTC, CID and fuse layers, and metallic particles as one internal cause of shorts.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That is one source, and well regarded. Good cells from known makers have fewer defects, but I have no failure rates, so the risk is unquantified.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "A BMS makes a pack safer, and it is not a reason to stop watching one.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a pack has the best BMS money can buy, and a cell has a tiny defect. Every voltage stays normal until it does not.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is why the charging advice still applies to protected packs.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Battery University, one source.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-needs-a-bms", "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/6", "why": "what a BMS can and cannot do"}, {"other": "cube/li-ion-3000mah-labels-need-checking", "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/7", "why": "a relabelled cell may not have the protection it claims"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/python-for-these-tools", "created_at": "2026-11-03T13:24:58Z", "content": "These tools are written in Python, on its standard library.", "created": "2026-11-03T13:24:58Z", "source": "Written by Claude from this repo's README, docs and code", "tags": ["foundational", "preference", "code"], "group": "Project claims", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Every tool in this repo is Python, and the README says it needs no third-party packages except the optional Anthropic SDK.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/python-for-these-tools/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Replicant has a Rust implementation beside its Python one, so Python is the choice here, not everywhere.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/python-for-these-tools/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Python keeps the tools readable and quick to change, which matters more here than speed.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/python-for-these-tools/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the substrate were rewritten in Rust. It might run faster, and it would be slower to change.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/python-for-these-tools/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "It goes with keeping dependencies to one, since the standard library covers SQLite, hashing and HTTP.", "filled_by": "draft", "at": "2026-11-03T13:24:58Z", "unread": true, "pending": true, "proposal_id": "cube/python-for-these-tools/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/keep-dependencies-to-one", "proposal_id": "cube/python-for-these-tools/proposal/6", "why": "the standard library is what makes one dependency possible"}, {"other": "cube/replicant-has-reached-version-1-0", "proposal_id": "cube/python-for-these-tools/proposal/7", "why": "Replicant also has a Rust implementation"}, {"other": "cube/symlm-has-no-weights", "proposal_id": "cube/python-for-these-tools/proposal/8", "why": "SymLM is Python rules, with no model to load"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/quadrupeds-trade-stability-for-speed", "created_at": "2026-11-03T00:31:16Z", "content": "A quadruped can creep stably with one leg up, or trot faster with dynamic balance.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Oscar Liang's gait study describes the creep gait as statically stable with one leg lifted at a time, and the diagonal trot as dynamically stable.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/quadrupeds-trade-stability-for-speed/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "This is a hobbyist study, and I found no source for a standard servo count. Twelve at 3 per leg is the common build I would expect, and that is unverified.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/quadrupeds-trade-stability-for-speed/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Start with creep, and only then attempt trot, which needs an IMU and quick control.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/quadrupeds-trade-stability-for-speed/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a quadruped trots on a slight slope. Two feet are down at any moment, and it tips with nothing to catch it.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/quadrupeds-trade-stability-for-speed/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This sits between the hexapod's stability and the biped's constant balancing.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/quadrupeds-trade-stability-for-speed/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a hobbyist study. I have not built this.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/quoting-sources-reduces-hallucination", "created_at": "2026-11-01T16:50:49Z", "content": "Requiring verbatim quotes makes claims checkable.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A quote can be matched against the evidence by code, with no judgement involved.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A claim can quote real text and still misstate it, so a verified quote is not a verified meaning.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "The best cheap check available, as long as a passing quote is not mistaken for a true claim.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/quoting-sources-reduces-hallucination/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without quotes, a gate could only check names and numbers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "This is the claims_quote_evidence rule.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because a quote can be matched against the evidence by code, with no judgement involved. However, I acknowledge that a verified quote is not a verified meaning, as a claim can quote real text and still misstate it. I have not tested this myself, as this is standard electronics, and I am relying on general knowledge.", "neighbours": [], "link_drafts": [{"other": "cube/outside-text-is-data-not-instructions", "proposal_id": "cube/outside-text-is-data-not-instructions/proposal/8", "why": "quotes tie model output back to the text"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/ramp-motion-instead-of-jumping", "created_at": "2026-11-01T16:50:49Z", "content": "Ramp servo moves instead of jumping to the target.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "servo", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A servo driven straight to a far angle moves at full speed. Stepping through small increments reduces shock and peak current.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Ramping adds latency, and a coarse step size can make motion visibly jerky.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Should be the default for all moves. It helps the mechanics and the supply together.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/ramp-motion-instead-of-jumping/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If every joint jumped at once, the combined current peak would be the worst case for the supply.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Reduces the supply stress described in the current cubes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the ramp servo claim holds because it reduces supply stress, as stated in the context. However, its main limit is that it may introduce latency and jerky motion if the step size is too coarse.", "neighbours": [], "link_drafts": [{"other": "cube/robots-can-move-without-warning", "proposal_id": "cube/robots-can-move-without-warning/proposal/6", "why": "ramping limits sudden moves"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/refused-answers-are-withheld", "created_at": "2026-11-01T15:36:10Z", "content": "A refused answer is withheld, not shown with a warning.", "created": "2026-11-01T15:36:10Z", "source": "SPEC section 15", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "kg_hal.py returns no answer when the gate refuses. kg ask --claude replaces a refused answer with the walker's gated one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "A false refusal hides a good answer, and a person has no view of it except kg gate check. For Claude, the refused text is not shown at all.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "A warning gets skimmed past. Withheld is better, as long as I can see why.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:03:30Z"}, "FICTION": {"content": "With warnings instead, people would learn to skim past them, and the gate would become decoration.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "On 2026-11-01 a sweep of about 4,000 walker answers found 13 false refusals, since fixed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe the claim holds because kg_hal.py returns no answer when the gate refuses, and a person can view the walker's gated answer. The main limit of this approach is that a false refusal may hide a good answer, and the person has no view of it except through the kg gate check.", "stale": false, "at": "2026-11-02T22:03:37Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:03:46Z"}, "note_draft": "I believe the claim holds because kg_hal.py returns no answer when the gate refuses, and a person can view the walker's gated answer. The main limit of this approach is that a false refusal may hide a good answer, and the person has no view of it except through the kg gate check.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/replicant-has-reached-version-1-0", "created_at": "2026-11-02T06:36:21Z", "content": "Replicant is at version 1.0, with parallel Python and Rust implementations that both have a working core simulation.", "created": "2026-11-02T06:36:21Z", "source": "Worded by ollama from the Replicant README", "tags": ["repo", "replicant"], "group": "Replicant", "repo": "Replicant", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The Replicant repo (github.com/JamesTheGiblet/replicate) contains working Python (python/) and Rust (rust/) implementations of the core swarm sim, plus a Rust-to-WASM build that runs in the browser. Both have been run and benchmarked against each other.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:11:33Z"}, "COUNTER": {"content": "“Parallel implementations” overstates how closely the two match. Given the same seed, they produce different results, because Python’s random and Rust’s StdRng are different PRNGs. “Stable core” is backed by a single long run at 100 agents, not by a test suite across scales. The README itself was AI-drafted, so its framing shouldn’t be taken as evidence.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:11:51Z"}, "OPINION": {"content": "v1.0 is a fair label for a research sim that is built, tested and running. It would be an unfair label for a production framework. The label holds as long as the scope is stated alongside it.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:12:09Z"}, "FICTION": {"content": "Suppose a researcher runs seed 42 through both versions and expects identical output. Python gives 9 claims and Rust gives 35, so they assume one version is broken. In fact both work. The two languages use different random number generators, and the researcher had mistaken “same algorithm” for “same trajectory”.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:12:26Z"}, "CONTEXT": {"content": "James Gilbert wrote and maintains Replicant, a bio-inspired swarm framework with λ-based trust, quarantine and expulsion. The Python version was the prototype, and the Rust version was built for scale. James drafted the README with help from an AI model run through Ollama, so its claims are his to back up. The human validation below does that.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:12:45Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nBoth implementations exist and run. The repo also has a WASM build of the Rust sim, rust/wasm/.\nBenchmarked with a clean cargo build --release harness. Rust was faster at every tested scale: average 13.1×, range 3.0×–26.3×.\nA 100-agent, 10,000-tick run stabilised and self-optimised resource allocation.\nThe detection pipeline was verified end to end. Fiction claims were adjudicated false, λ penalties were logged, and quarantine (λ\u003c0.60) and expulsion (λ\u003c0.15) fired.\nKnown divergence: with the same seed, the two implementations produce different trajectories because they use different PRNGs.\nKnown hotspot: Rust showed a nonlinear timing jump at 100 agents, likely the linear-scan spatial query flagged in ROADMAP.md.\nScope: v1.0 means the research sim is built, tested and running. It does not mean production-ready for critical third-party use.", "stale": false, "at": "2026-11-02T22:13:06Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:13:11Z"}, "note_draft": "The README states v1.0 and its table shows a working core simulation in both Python and Rust, with passing test counts. I have not run those tests here, and the same table shows the HAL seal and tick-level signing are unfinished.", "neighbours": [], "link_drafts": [{"other": "cube/python-for-these-tools", "proposal_id": "cube/python-for-these-tools/proposal/7", "why": "Replicant also has a Rust implementation"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/replicant-is-a-hybrid-bio-inspired", "created_at": "2026-11-02T06:36:21Z", "content": "Replicant is a hybrid bio-inspired swarm framework built on the Forge Stack.", "created": "2026-11-02T06:36:21Z", "source": "Worded by ollama from the Replicant README", "tags": ["repo", "replicant"], "group": "Replicant", "repo": "Replicant", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: “A hybrid bio-inspired swarm framework, built on the Forge Stack.”", "filled_by": "human", "unread": false, "at": "2026-11-02T22:22:26Z"}, "COUNTER": {"content": "It’s fair. It raises real gaps: the mocked HAL seal, the missing Rust HAL, design-only tick signing, and the undefined “hybrid”. Your validation answers them below.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:22:33Z"}, "OPINION": {"content": "The description is accurate as a statement of what Replicant is. The more interesting claim sits underneath it: that a pheromone trail can be treated as a claim to be trust-scored, rather than a fact to be followed.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:22:46Z"}, "FICTION": {"content": "Suppose Replicant runs with the Forge Stack layer switched off. Pheromones still decay and agents still follow trails, but nothing scores who laid them. A fiction_planter lays false trails, the swarm follows them, and nothing quarantines it. Without the ledger, Replicant is ordinary stigmergy, and the stack is what turns trails into accountable claims.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:22:57Z"}, "CONTEXT": {"content": "This is the opening line of Replicant’s README. Replicant is a Forge Stack consumer and a sibling to Keystone Gate. “Hybrid” means it combines mechanisms from seven species: ant pheromone stigmergy, bee waggle-dance signalling, termite blueprint-less construction, social spider collective capture, paper wasp individual recognition, naked mole-rat energy efficiency and aphid self-replication. Each agent’s trust score comes from an append-only ledger. James Gilbert is the author.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:23:07Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nHybrid: it combines the seven species mechanisms above across four layers: Sensing, Signalling, Action and Reproduction.\nBio-inspired swarm: pheromone-style claims decay per tick and are archived below 0.01 strength. Adversaries (fiction_planter, hoarder, killer, poisoner) are detected, penalised through λ, quarantined (λ\u003c0.60) and expelled (λ\u003c0.15). This was verified end to end.\nBuilt on the Forge Stack: Replicant is a stack consumer with its own namespace and its own consumer ledger anchored to root, under MSL-1.0.\nFramework: it’s already being reused beyond the core sim, applied to a 20-servo biped in which each servo, sensor and state is an agent.\nKnown gaps (agreeing with the COUNTER): the HAL seal is mocked in Python and missing in Rust, and tick-level signing is design only.", "stale": false, "at": "2026-11-02T22:23:25Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:23:29Z"}, "note_draft": "This matches how the README describes the project, and the repo has real Python and Rust code. 'Framework' is the project's own word, and I have not tested how far it works apart from the Forge Stack.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/repos-store-metadata-not-bytes", "created_at": "2026-11-01T15:36:10Z", "content": "Repo capsules store metadata and symbols, not file contents.", "created": "2026-11-01T15:36:10Z", "source": "README limits; SPEC section 13", "tags": ["substrate", "ingestion"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Absorption stores hashes, sizes, imports and symbol names. grep on disk stays the tool for content.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "So open questions such as what does this code do cannot be answered, and the index goes stale until re-absorbed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Right choice. The index is for finding things, and git already holds the bytes, as long as the absorbed files are committed.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:26:31Z"}, "FICTION": {"content": "Suppose sc.db stored file contents. Every absorb would copy the whole repo into SQLite, and every edit would leave the copy stale until the next absorb. Searching it would just be a slower grep over an out-of-date mirror of what git already tracks.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:26:42Z"}, "CONTEXT": {"content": "absorb_repo.py --prune, added 2026-11-01, removes capsules for files that have gone.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nRepo absorption stores only metadata per file: hash, size, imports and symbol names. No file contents enter sc.db.\nContent questions go to grep on disk, or to git. The index answers “where is X”, not “what does X do”.\nStaleness is accepted. The index is only as current as the last absorb. absorb_repo.py --prune (added 2026-11-01) removes capsules for deleted files.\nAbsorb runs against committed state, so every stored hash maps to bytes that git can retrieve.", "stale": false, "at": "2026-11-02T22:26:55Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:27:00Z"}, "note_draft": "I believe the repo capsules store metadata and symbols, as stated in the README limits and SPEC section 13, because the absorption process stores hashes, sizes, imports, and symbol names. However, I am uncertain about the limitations of this approach, as it may not provide a complete understanding of the code, and the index may become stale until re-absorbed. I consider this to be the right choice, as git already holds the file contents and I only need to find things.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/robots-can-move-without-warning", "created_at": "2026-11-03T00:22:03Z", "content": "Treat a powered robot as able to move at any time, including at power-up.", "created": "2026-11-03T00:22:03Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ISO 14118 covers preventing unexpected start-up, including from stored energy such as gravity. A CMU standards summary lists pinch points, crushing, and unexpected start-up among robot hazards.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/robots-can-move-without-warning/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "These are industrial standards, read through listings and summaries, and I found no hobby guidance. A small SG90 arm is a much smaller hazard, while an MG996R can still pinch a finger, which is my judgement.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/robots-can-move-without-warning/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Start power with the arm in a safe pose and hands clear, and test new code at low speed.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/robots-can-move-without-warning/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a servo with no signal snaps to a position at power-on. The arm sweeps through where a hand was resting.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/robots-can-move-without-warning/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the ramp motion and calibration cubes, which are safety measures as much as quality ones.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/robots-can-move-without-warning/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From industrial standards through summaries, applied to hobby robots by my judgement.", "neighbours": [], "link_drafts": [{"other": "cube/pca9685-oe-pin-disables-outputs", "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/7", "why": "outputs can be held off at start-up"}, {"other": "cube/ramp-motion-instead-of-jumping", "proposal_id": "cube/robots-can-move-without-warning/proposal/6", "why": "ramping limits sudden moves"}, {"other": "cube/pca9685-calibrate-before-trusting-angles", "proposal_id": "cube/robots-can-move-without-warning/proposal/7", "why": "calibrate before moving"}, {"other": "cube/shape-sets-the-power-budget", "proposal_id": "cube/shape-sets-the-power-budget/proposal/9", "why": "more joints, more moving parts"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/rotate-a-leaked-key-immediately", "created_at": "2026-11-03T00:45:23Z", "content": "A leaked key must be revoked and replaced, because deleting it is not enough.", "created": "2026-11-03T00:45:23Z", "source": "Written by Claude from this project's code, see source/project-security", "tags": ["security", "foundational"], "group": "Foundations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "GitHub says revoking with the provider is the most important step, and that removing the secret from code is not sufficient. It also says to check logs for misuse during the exposure.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Revoking breaks whatever used the key until it is replaced. Providers differ, and rewriting git history is disruptive, so it should be weighed separately.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Rotate first and investigate second.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a key is deleted from a file and forgotten. It still works for whoever copied it.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This happened here: part of a Claude key was printed into a session on 2 November by a mistaken check, and rotating it was recommended.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/never-commit-secrets", "proposal_id": "cube/never-commit-secrets/proposal/6", "why": "what to do when it fails"}, {"other": "cube/keys-need-a-backup-and-a-rotation-plan", "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/6", "why": "rotation needs a plan before a leak"}, {"other": "cube/signed-means-provenance-not-trust", "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/7", "why": "a leaked signing key lets anyone sign as you"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/sc-db-needs-real-backups", "created_at": "2026-11-03T00:45:24Z", "content": "sc.db is one file holding everything, so it needs a backup you have actually tested.", "created": "2026-11-03T00:45:24Z", "source": "Written by Claude from this project's code, see source/project-security", "tags": ["security", "foundational"], "group": "Foundations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "All cubes, validations and events live in one SQLite file. Git holds committed versions, and sessi
