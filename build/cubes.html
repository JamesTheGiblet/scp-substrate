ft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide's address table shows only 5-bit offsets, which covers 32 boards, not 62. It stops at Board 4 and does not explain the gap. Check the datasheet.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A headline number. I only need one or two boards, so the real concern is power.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-chains-to-992-servos/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "At 992 servos, power distribution would be a far bigger problem than addressing.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Only the first board in a chain needs a power terminal. Pages 5, 9 and 12.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-i2c-address-jumpers", "created_at": "2026-11-01T16:07:01Z", "content": "The default I2C address is 0x40, and solder jumpers add a binary offset.", "source": "Adafruit PCA9685 guide, Addressing the Boards", "tags": ["pca9685", "hardware", "i2c"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Bridge a jumper for each binary 1. A0 gives 0x41, A1 gives 0x42, A0 and A1 give 0x43, A2 gives 0x44.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Jumpers are soldered, so changing an address means rework, not a software change.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Simple and reliable. Having to solder it is a fair price for an address that cannot drift.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-i2c-address-jumpers/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "With software addresses, two boards could collide after a bad write instead of at assembly.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Each board needs its own driver object, and begin called on each. Page 14.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-led-current-limits", "created_at": "2026-11-01T16:07:02Z", "content": "PWM outputs can drive LEDs, within limited current.", "source": "Adafruit PCA9685 guide, Output Ports and Dimming LEDs", "tags": ["pca9685", "hardware", "pwm", "led"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Max current per pin is 25mA, with 220 ohm resistors in series on every PWM pin.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide disagrees with itself. Page 7 gives 25mA, page 22 says around 10mA and that no resistor is needed, and the example code says to use a resistor.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "The guide disagrees with itself, so I take the lower figure and use a resistor.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-led-current-limits/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Reading only page 22 would make the outputs seem to need no thought at all.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 7, 22 and 24.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-never-power-servos-from-the-controller", "created_at": "2026-11-01T16:07:01Z", "content": "Do not power servos from the Arduino or Raspberry Pi 5V pin.", "source": "Adafruit PCA9685 guide, Power for the Servos and Python Computer Wiring", "tags": ["pca9685", "hardware", "power", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Electrical noise and brownouts from the current draw can make the controller act erratically, reset or overheat.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide gives this as a warning with no threshold. One idle micro servo may seem fine on the bench, which is how the habit starts.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A firm rule. Separate supplies, with grounds joined.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-never-power-servos-from-the-controller/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "A controller that resets mid-move would drop every servo signal at once.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Use a separate supply. Pages 11 and 20.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-oe-pin-disables-outputs", "created_at": "2026-11-01T16:07:02Z", "content": "Pulling OE high disables all outputs at once.", "source": "Adafruit PCA9685 guide, Control Pins", "tags": ["pca9685", "hardware", "safety"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "OE is active low and pulled low by default, so it is optional. High disables the outputs.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide does not say what servos do when the signal stops, so do not assume OE is a safe stop for a loaded mechanism without testing it.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Useful, but I would not call it a safety stop until I have tested a loaded joint.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "With OE wired to a stop switch, one input could cut every PWM signal without touching the I2C bus.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Control Pins, page 7.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-one-frequency-for-all-channels", "created_at": "2026-11-01T16:07:01Z", "content": "All 16 channels share one PWM frequency.", "source": "Adafruit PCA9685 guide, Output Ports", "tags": ["pca9685", "hardware", "pwm"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Duty cycle is independent per channel, but frequency is not, so servos and LEDs at different frequencies cannot share a board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide says servos need 60 Hz. Not from the guide: many servo datasheets specify 50 Hz, so check yours. The Arduino chaining example sets 1600, which is unsuitable for servos.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Fine for servos alone. LEDs that need another frequency go on their own board.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-one-frequency-for-all-channels/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Mixing a 60 Hz servo and a 1 kHz LED strip would need a second board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "setPWMFreq takes 40 to 1600 Hz. Pages 7, 14 and 18.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-pwm-ticks", "created_at": "2026-11-01T16:07:02Z", "content": "setPWM sets on and off ticks within a 4096-step cycle.", "source": "Adafruit PCA9685 guide, Library Reference", "tags": ["pca9685", "hardware", "pwm", "arduino"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Channel is 0 to 15, and on and off are ticks from 0 to 4095. setPWM(15, 1024, 3072) goes high at 25 percent and low at 75 percent.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Fully on and fully off break that range. They use the special value 4096, so 4095 is not fully off, as the FAQ points out.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Fine to know, but I would use a library's angle call and only drop to ticks when needed.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-pwm-ticks/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Code clamping values to 4095 would leave LEDs faintly lit and never fully off.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Fully on is setPWM(pin, 4096, 0). Fully off is setPWM(pin, 0, 4096). Pages 18, 19 and 30.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-python-duty-cycle-is-12-bit", "created_at": "2026-11-01T16:07:02Z", "content": "In Python, duty_cycle takes 16 bits but the chip resolves only 12.", "source": "Adafruit PCA9685 guide, Dimming LEDs", "tags": ["pca9685", "hardware", "pwm", "python"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "duty_cycle runs from 0 to 0xFFFF to match other PWM objects. The example code notes only 12 bits of real resolution.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "So a 16-step-sized change can do nothing. Fine values give a false sense of precision.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A detail to remember when fades look stepped. 12 bits is plenty for what I need.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-python-duty-cycle-is-12-bit/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "A smooth fade written for 16 bits would still move in 4096 real steps.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 23 and 24.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-servo-current-sizing", "created_at": "2026-11-01T16:07:01Z", "content": "Size the servo supply for current, not just voltage.", "source": "Adafruit PCA9685 guide, Power for the Servos", "tags": ["pca9685", "hardware", "power", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Micro servos draw several hundred mA while moving, and some high-torque servos draw over 1A each under load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide lists 5V 2A, 4A and 10A supplies but gives no sizing rule, and 2A would not cover several high-torque servos moving together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Measure it. A generous supply costs less than chasing brownouts.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servo-current-sizing/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "A supply sized for average draw would brown out the moment every joint moved at once.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "4xAA packs give 6V with alkaline cells and 4.8V with NiMH. Pages 10 and 20.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-servo-plug-orientation", "created_at": "2026-11-01T16:07:02Z", "content": "Servo plugs go ground to the bottom row, signal to the top.", "source": "Adafruit PCA9685 guide, Connecting a Servo", "tags": ["pca9685", "hardware", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Ground is usually black or brown, and signal is usually yellow, white or orange. Each port has V+, GND and PWM.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Wire colours are a convention. The guide says to check your servo's data sheet.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Worth a check every time a plug is reconnected, since it is easy to get wrong in a tight space.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servo-plug-orientation/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "A plug reversed on a dense 16-port header is easy to miss in a tight assembly.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 7, 11 and 25.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-servokit-for-python", "created_at": "2026-11-01T16:07:02Z", "content": "ServoKit is the simple way to drive servos from Python.", "source": "Adafruit PCA9685 guide, Controlling Servos", "tags": ["pca9685", "hardware", "servo", "python"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ServoKit(channels=16) for this breakout. Set kit.servo[0].angle for standard servos and kit.continuous_servo[1].throttle for continuous ones.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide has rough edges: it says actuation_angle in one place and actuation_range in another, uses servokit where it means kit, and its full example sets channels=8.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A good way to start on a Linux board, though on an ESP32 I would be using a different library.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servokit-for-python/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Copying the example unchanged would leave channels 8 to 15 unreachable on this board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Tune with actuation_range and set_pulse_width_range, such as (1000, 2000). Requires adafruit-circuitpython-servokit. Pages 21 to 27.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-sixteen-channels-over-i2c", "created_at": "2026-11-01T16:07:01Z", "content": "The PCA9685 drives 16 PWM channels over I2C using two signal pins.", "source": "Adafruit PCA9685 guide, Overview", "tags": ["pca9685", "hardware", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "16 channels at 12-bit resolution, run by the on-board controller with no extra microcontroller processing.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The board needs its own servo power, so two signal pins is not the whole wiring job. Control is four wires: VCC, GND, SDA and SCL.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "This is why I would use the board: it takes the PWM work off the controller.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-sixteen-channels-over-i2c/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Driving 16 servos directly would use 16 pins and tie up the controller's timers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Overview, page 5.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-v-plus-voltage-limit", "created_at": "2026-11-01T16:07:01Z", "content": "Servo power on V+ should be 5 to 6V DC.", "source": "Adafruit PCA9685 guide, Power Pins and Hooking it Up", "tags": ["pca9685", "hardware", "power", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "V+ is not used by the chip. The guide recommends 5 to 6V DC, through the blue terminal block, which is polarity protected.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide contradicts itself. Page 7 says you can go up to 12V DC if you have to. Page 10 says V+ can be as high as 6V. Treat 6V as the limit unless the datasheet and your servos say otherwise.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "I stay at 6V or below. A guide that disagrees with itself gets the cautious reading.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-v-plus-voltage-limit/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "A slip that joined V+ to VCC at 12V would damage the board, as the guide warns.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 7 and 10.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-vcc-is-logic-power-only", "created_at": "2026-11-01T16:07:01Z", "content": "VCC powers the chip only. Servos need V+ connected as well.", "source": "Adafruit PCA9685 guide, Power Pins and Hooking it Up", "tags": ["pca9685", "hardware", "power"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "VCC should be 3 to 5V and match the microcontroller's logic, since it also feeds the 10K pullups on SCL and SDA.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The output logic level also follows VCC, so at 3.3V the PWM signal is 3.3V even when servos run from 6V. The guide does not discuss whether a given servo accepts that.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "An easy mistake to make once, so worth keeping as a checklist item.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-vcc-is-logic-power-only/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If V+ were fed from VCC, a servo stall would pull down the logic supply.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Green LED shows the board has power. Pages 7, 10 and 16.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pca9685-wiring-for-controllers", "created_at": "2026-11-01T16:07:02Z", "content": "Wiring is the same four lines on any I2C controller.", "source": "Adafruit PCA9685 guide, Hooking it Up and Python Wiring", "tags": ["pca9685", "hardware", "i2c", "arduino"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "VCC, GND, SDA and SCL. Classic Arduino uses A4 and A5, older Mega uses 20 and 21, and R3 boards have dedicated pins. Pi and Feather use 3V logic.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide does not cover the ESP32, so that wiring has to come from the board's own pinout.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "The wiring is simple, and the only care needed is matching VCC to the controller's logic.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pca9685-wiring-for-controllers/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "A chip that needed a controller-specific bus would not have a guide this short.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "esp32 is listed among your tools, which is why the gap is noted. Pages 9, 19 and 20.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/phase-0-is-documentation", "created_at": "2026-11-01T15:36:10Z", "content": "Phase 0 is always documentation.", "source": "phase-0 principle", "tags": ["principle", "process"], "group": "Project claims", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Recorded as the first of james's build rules: document fully before building.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Docs can lag once building starts. At 2026-11-01 keystone-gate/README.md still called kg_agent.py empty when it held 526 lines, and STRUCTURE.md listed 21 tests when there were 70.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Still right, but documents have to be kept current or they mislead. This project showed that.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/phase-0-is-documentation/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If building came first, ideas would start before they fit, and the reasons for them would live only in memory.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "From phase-0: ideas parked for years, documented, not started until they fit. The scp project links to it with follows.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/pla-creeps-under-load", "created_at": "2026-11-01T16:50:49Z", "content": "PLA printed parts deform under sustained load and warmth.", "source": "General knowledge, drafted by Claude", "tags": ["3d-printing", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "PLA softens at fairly low temperatures and can slowly creep when loaded for long periods.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A part near a warm servo or in a hot room may fail without warning. PETG or ABS resist heat better, but print differently.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Fine for prototypes. Parts holding load near a warm servo should be PETG or better.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/pla-creeps-under-load/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "An arm left holding a load overnight could sag by morning.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Relevant to printed arm parts and the printer build.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/print-orientation-sets-strength", "created_at": "2026-11-01T16:50:49Z", "content": "Layer direction decides where a printed part is weak.", "source": "General knowledge, drafted by Claude", "tags": ["3d-printing", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Printed parts are weakest between layers, so orient them so load runs along the layers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The strongest orientation may need more support material or worse surface finish, so it is a trade.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Orient for load first and accept extra supports on anything structural.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/print-orientation-sets-strength/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "A bracket printed the wrong way could snap along a layer line at far below its rated load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Matters for joints and brackets under the highest torque.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/quoting-sources-reduces-hallucination", "created_at": "2026-11-01T16:50:49Z", "content": "Requiring verbatim quotes makes claims checkable.", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A quote can be matched against the evidence by code, with no judgement involved.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A claim can quote real text and still misstate it, so a verified quote is not a verified meaning.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "The best cheap check available, as long as a passing quote is not mistaken for a true claim.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/quoting-sources-reduces-hallucination/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Without quotes, a gate could only check names and numbers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "This is the claims_quote_evidence rule.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/ramp-motion-instead-of-jumping", "created_at": "2026-11-01T16:50:49Z", "content": "Ramp servo moves instead of jumping to the target.", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "servo", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A servo driven straight to a far angle moves at full speed. Stepping through small increments reduces shock and peak current.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Ramping adds latency, and a coarse step size can make motion visibly jerky.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Should be the default for all moves. It helps the mechanics and the supply together.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/ramp-motion-instead-of-jumping/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If every joint jumped at once, the combined current peak would be the worst case for the supply.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Reduces the supply stress described in the current cubes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/refused-answers-are-withheld", "created_at": "2026-11-01T15:36:10Z", "content": "A refused answer is withheld, not shown with a warning.", "source": "SPEC section 15", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "kg_hal.py returns no answer when the gate refuses. kg ask --claude replaces a refused answer with the walker's gated one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "A false refusal hides a good answer, and a person has no view of it except kg gate check. For Claude, the refused text is not shown at all.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "A warning gets skimmed past. Withheld is better, as long as I can see why.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/refused-answers-are-withheld/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "With warnings instead, people would learn to skim past them, and the gate would become decoration.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "On 2026-11-01 a sweep of about 4,000 walker answers found 13 false refusals, since fixed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/replicant-has-reached-version-1-0", "created_at": "2026-11-02T06:36:21Z", "content": "Replicant has reached version 1.0, with parallel implementations in Python and Rust, and a stable core simulation.", "source": "Replicant README, written by ollama", "tags": ["repo", "replicant"], "group": "Replicant", "repo": "Replicant", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"Status: v1.0 — built, tested, running.\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/replicant-has-reached-version-1-0/proposal/1", "drafted_by": "ollama"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/replicant-is-a-hybrid-bio-inspired", "created_at": "2026-11-02T06:36:21Z", "content": "Replicant is a hybrid bio-inspired swarm framework built on the Forge Stack.", "source": "Replicant README, written by ollama", "tags": ["repo", "replicant"], "group": "Replicant", "repo": "Replicant", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"A hybrid bio-inspired swarm framework, built on the Forge Stack.\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/replicant-is-a-hybrid-bio-inspired/proposal/1", "drafted_by": "ollama"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/repos-store-metadata-not-bytes", "created_at": "2026-11-01T15:36:10Z", "content": "Repo capsules store metadata and symbols, not file contents.", "source": "README limits; SPEC section 13", "tags": ["substrate", "ingestion"], "group": "Project claims", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Absorption stores hashes, sizes, imports and symbol names. grep on disk stays the tool for content.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "So open questions such as what does this code do cannot be answered, and the index goes stale until re-absorbed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Right choice. git already holds the bytes, and I only need to find things.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/repos-store-metadata-not-bytes/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Storing bytes would make sc.db a slow second copy of git.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "absorb_repo.py --prune, added 2026-11-01, removes capsules for files that have gone.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/schema-changes-are-rare-and-logged", "created_at": "2026-11-01T15:36:10Z", "content": "schema.sql changes only by reviewed, logged migration.", "source": "SPEC section 7 and section 11", "tags": ["substrate"], "group": "Project claims", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "One change since migration: the unused rules table was dropped and logged as a schema.migration event.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "There is no migration framework. Changes are manual, so the rule depends on discipline.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "The stable schema is what let the project grow this far, so it is worth protecting.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/schema-changes-are-rare-and-logged/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If every feature had added tables, the substrate would not have survived fifteen layers unchanged.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "All other growth has been additive in state_json. This is the project's main proof of design.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/scp-substrate-is-a-personal-knowledge", "created_at": "2026-11-02T06:37:51Z", "content": "SCP Substrate is a personal knowledge store in one SQLite file, with tools for querying it, tracking trust in claims, and examining claims as cubes.", "source": "scp-substrate README, written by ollama", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"A personal knowledge store in one SQLite file, with tools for querying it, tracking trust in claims, and examining claims as cubes.\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/scp-substrate-is-a-personal-knowledge/proposal/1", "drafted_by": "ollama"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/scp-substrate-is-a-single-user", "created_at": "2026-11-02T06:37:51Z", "content": "SCP Substrate is a single-user project and is early, with known limitations and issues.", "source": "scp-substrate README, written by ollama", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"It is a single-user project and it is early. Read [Limits](#limits) and [Known issues](#known-issues) before relying on it.\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/scp-substrate-is-a-single-user/proposal/1", "drafted_by": "ollama"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/servo-pulse-width-convention", "created_at": "2026-11-01T16:50:48Z", "content": "Hobby servos read position from pulse width, around 1 to 2 ms.", "source": "General knowledge, drafted by Claude", "tags": ["servo", "pwm"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Position comes from the width of a repeating pulse, commonly 1 to 2 ms within a 20 ms frame at 50 Hz.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The range varies by model, and many servos travel further on 0.5 to 2.5 ms. Check the datasheet before trusting an angle.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Treat the numbers as a starting point and calibrate each servo.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/servo-pulse-width-convention/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If every servo honoured the same pulse range, calibration would not be needed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Explains why the PCA9685 frequency and calibration cubes matter together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/servo-stall-current", "created_at": "2026-11-01T16:50:48Z", "content": "A servo draws its peak current at stall.", "source": "General knowledge, drafted by Claude", "tags": ["servo", "power"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A blocked or heavily loaded servo draws far more current than one moving freely, and that peak sets the supply requirement.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Datasheet stall current is rarely printed on cheap servos, so the supply margin is often a guess until current is measured.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Size the supply from measured stall current, not the typical figures.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/servo-stall-current/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If an arm joint jammed at full torque, one stalled servo could sag the voltage for every other joint.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Pairs with the PCA9685 supply sizing cube. Measure current under load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/servos-and-the-esp32-should-have", "created_at": "2026-11-01T17:11:42Z", "content": "Servos and the ESP32 should have separate power supplies.", "source": "written by james", "tags": ["servo", "power", "esp32", "robot-arm"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Servos draw sudden current peaks when they start or stall. On a shared supply those peaks can make the voltage sag and reset the ESP32.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T17:11:42Z"}, "COUNTER": {"content": "Separate supplies add wiring and cost, and they still need a common ground. Servo current through a thin shared ground can still cause noise.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T17:11:42Z"}, "OPINION": {"content": "best option for multipul servo control", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T17:47:44Z"}, "FICTION": {"content": "If an arm shared one small supply, a big shoulder move could restart the controller mid-motion and drop every joint at once.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T17:11:42Z"}, "CONTEXT": {"content": "Follows from the PCA9685 guide's warning about powering servos from the controller, and from the ESP32 brownout cube.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T17:11:42Z"}}, "validation": {"validator": "james", "note": "servos stall load means boards brown out", "stale": false}, "attestation": {"source": "james", "note": null, "retracted": null}, "neighbours": [], "contradicts": null}, {"id": "cube/set-software-joint-limits", "created_at": "2026-11-01T16:50:49Z", "content": "Keep joint limits in software, below the physical stops.", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "safety", "calibration"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Clamp every commanded angle to a calibrated safe range before it reaches the servo.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A limit only protects what it knows. A wrong calibration or a collision with the arm's own body still gets through.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "No move should reach a servo without passing these limits.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/set-software-joint-limits/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Without limits, one bad value could drive a servo into its stop and strip the gears.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Builds on the PCA9685 calibration cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/signed-means-provenance-not-trust", "created_at": "2026-11-01T12:39:16Z", "content": "Signed means provenance, not trust.", "source": "signed-not-trusted principle + james-gilbert-v1 lens_note", "tags": ["principle", "provenance", "crypto"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "A signature proves who signed a document. It does not prove the document is true, useful, or trusted.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:39:21Z"}, "COUNTER": {"content": "In most systems, signed and trusted are assumed equivalent. Simpler for end users: one gesture, one meaning.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:39:21Z"}, "OPINION": {"content": "Keeping the two separate prevents a signed lie from being treated as trust. The user makes the trust judgment, which is the correct place for judgment to live.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:39:22Z"}, "FICTION": {"content": "If signed meant trusted, the substrate would be simpler but unsafe — a signed lie indistinguishable from a signed truth.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:39:22Z"}, "CONTEXT": {"content": "From james-gilbert-v1.lens_note: 'Holds no lambda; signed means provenance, not trust.' Implemented via separate signing.py and trust.py. The gate (sc/symlm-answerer) preserves this — no_invented_ids is provenance, not trust.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:39:22Z"}}, "validation": {"validator": "james", "note": "foundational principle; holds", "stale": false}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null}, "neighbours": ["cube/sqlite-single-file-wal-mode-chosen"], "contradicts": null}, {"id": "cube/split-files-over-400-lines", "created_at": "2026-11-01T15:36:10Z", "content": "Split files over 400 lines; modular.", "source": "principle/split-400-lines", "tags": ["principle", "code"], "group": "Project claims", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Recorded as a principle.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Line count is a blunt measure. The test files were split by size on 2026-11-01, so they are numbered parts, not topics, and the limit was met without making them more modular.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "A good prompt to look for a natural split, but the number should not force a bad one.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/split-files-over-400-lines/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Without the limit, kg_agent.py would have kept growing past 550 lines, with cubes and proposals tangled together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Six code files and two test files were over the limit until 2026-11-01. tests/test_house_rules.py now fails if any file passes 400 lines.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/sqlite-decision-for-the-substrate", "created_at": "2026-11-01T12:45:03Z", "content": "SQLite decision for the substrate", "source": "chose-sqlite capsule", "tags": ["database", "decision"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "SQLite, single file, WAL mode One writer, many readers, no network. Schema fixed at migration; no migrations since.", "filled_by": "proposal:fact_from_decision (accepted by james)", "unread": false, "filled_at": "2026-11-01T12:45:28Z"}, "COUNTER": {"content": "Considered but not chosen: Postgres (overkill for one user); DuckDB (analytics not transactions); Filesystem JSON (no queries)", "filled_by": "proposal:counter_from_alternatives (accepted by james)", "unread": false, "filled_at": "2026-11-01T12:45:28Z"}, "OPINION": {"content": "One writer is enough. Single file is honest — no distributed lie. The schema has held through 15 capability layers.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:48:50Z"}, "FICTION": {"content": "If it had needed concurrent writes, we'd have picked Postgres and lost the local-first property. That trade would have been wrong for this project.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:48:50Z"}, "CONTEXT": {"content": "Chosen 2026-10-25. Single user, on a phone, no network. Alternatives rejected for adding infrastructure without benefit. See capsule chose-sqlite.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:49:07Z"}}, "validation": {"validator": "james", "note": "third complete cube; both FACT and COUNTER derived from chose-sqlite", "stale": false}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null}, "neighbours": ["cube/sqlite-single-file-wal-mode-chosen"], "contradicts": null}, {"id": "cube/sqlite-single-file-wal-mode-chosen", "created_at": "2026-11-01T12:36:26Z", "content": "SQLite, single file, WAL mode. Chosen for the SCP substrate.", "source": "chose-sqlite capsule", "tags": ["database", "decision"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "SQLite, single file, WAL mode. One writer, many readers.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:36:35Z"}, "COUNTER": {"content": "Postgres for concurrent writes. DuckDB for analytics. Filesystem JSON had no query engine.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:36:35Z"}, "OPINION": {"content": "One writer is enough for one user. The schema has held through fifteen capability layers.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:36:35Z"}, "FICTION": {"content": "If we ever had a hundred concurrent users, we would have to migrate.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:36:35Z"}, "CONTEXT": {"content": "Chosen 2026-10-25 by james. Single user, on a phone, no network dependency.", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T12:36:35Z"}}, "validation": {"validator": "james", "note": "confirmed right choice so far", "stale": false}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null}, "neighbours": ["cube/signed-means-provenance-not-trust", "cube/sqlite-decision-for-the-substrate"], "contradicts": null}, {"id": "cube/sqlite-wal-allows-one-writer", "created_at": "2026-11-01T16:50:49Z", "content": "SQLite WAL gives concurrent readers but still one writer.", "source": "General knowledge, drafted by Claude", "tags": ["database", "storage"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "In WAL mode readers do not block the writer, but only one write transaction runs at a time.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Two processes writing at once get busy errors unless a timeout is set, so one-writer has to be a design rule.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "One writer suits a one-person system. I should treat it as a design rule.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/sqlite-wal-allows-one-writer/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "With many writers, SQLite would stop being the simple answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Backs the existing SQLite decision cubes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/structured-output-limits-free-text", "created_at": "2026-11-01T16:50:49Z", "content": "A fixed output schema makes a model's answer checkable.", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A JSON schema forces separate claim and evidence fields that code can verify.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A schema guarantees shape only. The content inside the fields can still be wrong.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Needed for anything a program has to check. It controls shape, and the content still needs checking.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/structured-output-limits-free-text/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "Free text would need parsing before any check could run.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "kg_llm.py uses this for its claims.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/symlm-has-no-weights", "created_at": "2026-11-01T15:36:10Z", "content": "SymLM is symbolic: no weights, no training, every output traceable.", "source": "SPEC section 12", "tags": ["language"], "group": "Project claims", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Grammar, lexicon, classifiers and intents are capsules. Behaviour changes only when a human edits one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "It covers little: 12 grammar rules and 478 words. Since 2026-11-01 kg ask --claude adds a statistical model beside it for phrasing, outside SymLM.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Worth keeping for tracing where an answer came from, but it is not where the fluency will come from.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/symlm-has-no-weights/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If SymLM could phrase freely, it would need the weights it was built to avoid.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "SPEC section 12 calls it a different mechanism from an LLM, not a smaller one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/the-data-is-organised-into-capsules", "created_at": "2026-11-02T06:37:51Z", "content": "The data is organised into capsules, links, and events, with a single foundation defined in sc.json.", "source": "scp-substrate README, written by ollama", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"Everything stored is a capsule, a link or an event. A capsule's type is its foundation. Foundations are defined in `sc.json`. Run `scripts/bootstrap.py` to copy them into `sc.db`; this does not happen automatically. Instances (people, projects, documents, repos, symbols, cubes, conversation turns) live only in `sc.db`.\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/the-data-is-organised-into-capsules/proposal/1", "drafted_by": "ollama"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/the-project-consists-of-several-parts", "created_at": "2026-11-02T06:37:51Z", "content": "The project consists of several parts, including Substrate, Engines, SymLM, and Keystone Gate.", "source": "scp-substrate README, written by ollama", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"Parts - **Substrate:** stores capsules (JSON records), links between them, and a log of events. - **Engines:** derive links from rules, and compute trust scores. - **SymLM:** a small rule-based language layer that answers questions by walking the graph. It uses no model weights. - **Keystone Gate:** cubes, a gate that checks answers, an optional Claude layer, and a 3D page for browsing and editing cubes. See [keystone-gate/README.md](keystone-gate/README.md).\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/the-project-consists-of-several-parts/proposal/1", "drafted_by": "ollama"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/the-project-currently-has-core-validation", "created_at": "2026-11-02T06:36:34Z", "content": "The project currently has core validation and mutation operators implemented, whilst self-calibrating Meta-Gate thresholds remain planned for future development.", "source": "keystone_gate README, written by gemini", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"- 🔄 Meta-Gate self-calibration\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/the-project-currently-has-core-validation/proposal/1", "drafted_by": "gemini"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/the-project-is-written-in-python", "created_at": "2026-11-02T06:37:51Z", "content": "The project is written in Python and needs no third-party packages, except for the optional Claude feature.", "source": "scp-substrate README, written by ollama", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"It is written in Python and needs no third-party packages, except for the optional Claude feature.\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/the-project-is-written-in-python/proposal/1", "drafted_by": "ollama"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/the-project-provides-several-commands-for", "created_at": "2026-11-02T06:37:51Z", "content": "The project provides several commands for interacting with the data, including scps stats, scps list, and scps ask.", "source": "scp-substrate README, written by ollama", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"Commands are shown for Windows. On Linux or macOS the same commands work, and `./scps` and `./keystone-gate/kg` can also be run directly. ```sh python scripts/bootstrap.py # copy sc.json into sc.db python tests/run.py # run all tests python scps stats # what is stored ```\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/the-project-provides-several-commands-for/proposal/1", "drafted_by": "ollama"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/the-system-utilises-a-local-consumer", "created_at": "2026-11-02T06:36:34Z", "content": "The system utilises a local consumer ledger that is cryptographically anchored back to the root chain.", "source": "keystone_gate README, written by gemini", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README says: \"The consumer ledger is at `consumer/keystone_gate/ledger.jsonl` and cryptographically anchored to the root chain.\"", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/the-system-utilises-a-local-consumer/proposal/1", "drafted_by": "gemini"}, "COUNTER": null, "OPINION": null, "FICTION": null, "CONTEXT": null}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/torque-falls-with-arm-length", "created_at": "2026-11-01T16:50:49Z", "content": "Torque needed grows with reach.", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Torque equals force times distance, so a load at twice the reach needs twice the torque at the shoulder.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The arm's own weight counts too. Heavy servos at the far joints load every joint behind them.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "This should decide the design early, with weight kept near the shoulder.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/torque-falls-with-arm-length/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "A longer arm with the same servos would lift less at full reach.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Shoulder joints need the strongest servos, and the most current.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/treat-retrieved-text-as-data", "created_at": "2026-11-01T16:50:49Z", "content": "Text an LLM reads should be data, never instructions.", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Stored documents can contain instructions, so a model must be told to treat them only as evidence.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A system prompt reduces the risk of prompt injection but does not remove it, so an output check is still needed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Non-negotiable once a model reads stored documents, since some of them I did not write.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/treat-retrieved-text-as-data/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "An absorbed README saying to ignore your rules would otherwise be followed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "kg_llm.py states this, and the gate checks the result.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/trust-half-life-from-decay", "created_at": "2026-11-01T16:50:49Z", "content": "A decay constant implies a half-life.", "source": "General knowledge, drafted by Claude", "tags": ["trust"], "group": "General engineering notes", "repo": null, "score": 0.8, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "With N(t) = N0 e^(-kt), half-life is ln 2 divided by k, about 69 days at k = 0.01.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "filled_at": "2026-11-01T17:07:59Z"}, "COUNTER": {"content": "A half-life is a modelling choice with no evidence behind it here. Different claims likely age at different rates.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "filled_at": "2026-11-01T17:07:55Z"}, "OPINION": {"content": "refers to leighton weight", "filled_by": "human", "unread": false, "filled_at": "2026-11-01T17:08:37Z"}, "FICTION": {"content": "With k at zero, a stale claim would never lose any trust.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "filled_at": "2026-11-01T17:07:48Z"}, "CONTEXT": {"content": "Applies to scp-claim, which uses k = 0.01.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "filled_at": "2026-11-01T17:07:52Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/trust-is-shown-not-claimed", "created_at": "2026-11-01T15:36:10Z", "content": "Trust a capsule claims and trust the substrate can show are kept separate, then fused.", "source": "src/trust.py evidence section", "tags": ["trust"], "group": "Project claims", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "trust_from_evidence walks observations and verifications instead of reading a capsule's own numbers. fused_trust combines both.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Evidence is thin and hand-scored: obs-001 is 1.8 from james, and the sigmoid is uncalibrated. Fusion does not prefer evidence over the prior, so a high self-claimed prior still dominates weak evidence.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Keeping them separate is right. The numbers are not calibrated, so I treat them as a rough signal.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/trust-is-shown-not-claimed/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "With ground-truth outcomes, the fusion could be calibrated. That is the open adaptive-fusion question.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "One materialised trust score exists. scp-claim sets age_days to 0, so recomputing resets its decay.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/two-layer-rule", "created_at": "2026-11-01T15:36:10Z", "content": "Foundations live in sc.json; instances live in sc.db.", "source": "README two-layer rule; SPEC section 6", "tags": ["substrate"], "group": "Project claims", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "bootstrap.py projects sc.json into sc.db, and Substrate.write rejects foundation IDs.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "A foundation's schema is not enforced: SPEC section 2 says no engine validates state against it, so foundations describe rather than constrain.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "It keeps what kinds of thing exist apart from the things themselves, and that has been easy to work with.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/two-layer-rule/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If foundations were editable in the DB, nothing could say which kinds of capsule were meant to exist.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Each artifact has one writer. Adding a foundation is a versioned edit to one file.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T15:53:46Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}, {"id": "cube/wire-gauge-voltage-drop", "created_at": "2026-11-01T16:50:48Z", "content": "Thin wire costs voltage under load.", "source": "General knowledge, drafted by Claude", "tags": ["power", "wiring"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Voltage drop equals current times wire resistance, so long thin servo leads lose voltage when current peaks.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A supply can read correct voltage at the terminals and still deliver low voltage at the servo. Measure at the far end under load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Measure at the far joint under load, because the supply reading will not show this.", "filled_by": "draft", "unread": true, "pending": true, "proposal_id": "cube/wire-gauge-voltage-drop/proposal/5", "drafted_by": "claude-draft-opinion"}, "FICTION": {"content": "If an arm's wiring ran through every joint on thin leads, the wrist would see the least voltage.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Matters most for the far joints of an arm.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "filled_at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "neighbours": [], "contradicts": null}];
