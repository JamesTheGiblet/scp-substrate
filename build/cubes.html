e": false, "at": "2026-11-02T21:59:59Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:00:02Z"}, "note_draft": "I believe JIG can be used to build a wide range of applications, including habit trackers, home-automation logic, game rules, and compliance checklists, due to its flexibility and customizability. However, its limitations in handling complex logic and conditional statements may make it less suitable for applications requiring intricate rules or conditional decision-making.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/jig-is-a-deterministic-rule-engine", "created_at": "2026-11-02T06:42:29Z", "content": "JIG is a deterministic rule engine that allows users to extend it by writing capsules, which are small signed JSON documents that declare facts, rules, constraints, and goals.", "created": "2026-11-02T06:42:29Z", "source": "Worded by ollama from the JIG README", "tags": ["repo", "jig", "private"], "group": "JIG", "repo": "JIG", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"\u003cp align=\"center\">\u003cimg src=\"images/JIG%20Icon.png\" alt=\"JIG: deterministic by design\" width=\"240\">\u003c/p> # JIG **Deterministic by design.** A rule engine anyone can extend by writing capsules, and audit afterwards.\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:04Z"}, "COUNTER": {"content": "Some users have reported issues with the extensibility of JIG, citing difficulties in writing and deploying capsules, which may indicate that the claim that JIG is a deterministic rule engine is overly optimistic.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:06Z"}, "OPINION": {"content": "It is reasonable to assume that JIG's ability to extend itself through capsules is a key feature, but further investigation is needed to confirm whether this is a deterministic process.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:08Z"}, "FICTION": {"content": "What if JIG's capsules were not just signed JSON documents, but also contained a hidden backdoor that allowed the creator to manipulate the engine's behavior?", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:10Z"}, "CONTEXT": {"content": "JIG's development is closely tied to the needs of the open-source community, and its extensibility features are intended to facilitate collaboration and innovation, but the extent to which these features are deterministic is unclear.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:14Z"}}, "validation": {"validator": "james", "note": "I believe JIG is a deterministic rule engine because the README explicitly states that it is designed to be deterministic. However, I am uncertain about the extent to which its extensibility features, such as capsules, are deterministic, as some users have reported issues with writing and deploying them, which may indicate that the claim is overly optimistic.", "stale": false, "at": "2026-11-02T22:04:20Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:04:24Z"}, "note_draft": "I believe JIG is a deterministic rule engine because the README explicitly states that it is designed to be deterministic. However, I am uncertain about the extent to which its extensibility features, such as capsules, are deterministic, as some users have reported issues with writing and deploying them, which may indicate that the claim is overly optimistic.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/keys-need-a-backup-and-a-rotation-plan", "created_at": "2026-11-01T16:50:49Z", "content": "A signing key needs a backup and a rotation plan.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["crypto", "provenance"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A lost key cannot sign, and a leaked one can sign as you. Each needs a planned response.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Backups create more copies to protect, so safer storage and easier recovery pull against each other.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "I should write this plan down before I need it, not after a key is lost.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/keys-need-a-backup-and-a-rotation-plan/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If the only key were lost, old signatures would still verify but nothing new could be signed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "keygen.py warns to keep the key safe and back it up offline.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe a signing key needs a backup and a rotation plan because a lost key cannot sign, and a leaked one can sign as you, each requiring a planned response. However, this approach may create a trade-off between safer storage and easier recovery, as backups can generate more copies to protect.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/keystone-gate-functions-as-a-forge", "created_at": "2026-11-02T06:36:34Z", "content": "Keystone Gate functions as a Forge Stack consumer that provides a governance layer for semantic capsule evolution.", "created": "2026-11-02T06:36:34Z", "source": "Worded by gemini from the keystone_gate README", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: “It uses the existing stack infrastructure (SCP, DataCube, Leighton Weight Engine, ChronoSCRIBE, HAL) to provide a governance layer for semantic capsule evolution.”", "filled_by": "human", "unread": false, "at": "2026-11-02T22:16:23Z"}, "COUNTER": {"content": "“Existing stack infrastructure” may be stale wording. The tools Keystone Gate builds on were rebuilt as fresh Rust crates in the-forge (scp-core, store-sqlite, chronoscribe, datacube, leighton-engine, hal) rather than reused from the original Forge Stack. DataCube’s design also changed along the way, to five lenses plus a contradicts field. “Governance” is a strong word, too: it should only stand if something actually enforces the rules, not just records them.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:16:39Z"}, "OPINION": {"content": "Governance is the right way to frame it. Corrections become new, signed, trust-scored capsules instead of retraining a model. That makes every change to the system’s knowledge traceable and reversible, which is the point of a sovereign stack.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:16:52Z"}, "FICTION": {"content": "Suppose a user drops a new capsule into sc/ that contradicts an existing one. Without a governance layer, the newer capsule would silently win. With Keystone Gate, the conflict is caught, and the change is logged in ChronoSCRIBE and weighted by Leighton. The contradiction shows up as something to resolve, and the knowledge never quietly drifts.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:17:06Z"}, "CONTEXT": {"content": "Keystone Gate is one of two sibling apps built on the shared Forge tools in the-forge repo. The other is Replicant. In Keystone Gate, the LLM handles language only and never decides what’s true. Capsules define behaviour, and corrections are captured as new declared, classified, trust-scored and audited capsules rather than being used to fine-tune the model. James Gilbert is the author.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:17:17Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nKeystone Gate is a Forge Stack consumer. It builds on the-forge’s shared crates (scp-core, store-sqlite, chronoscribe, datacube, leighton-engine, hal), and the Phase 1 foundation passed 33/33 tests.\n“Governance of capsule evolution” means changes to knowledge arrive as new signed capsules with a hash-chained audit trail. They never come from retraining.\nTrust is gated by completeness: a cube is only eligible for Leighton attestation once all its faces are filled.\nWording fix: “existing stack infrastructure” should read “the-forge’s rebuilt Forge tools”. These are not the v1 implementations.", "stale": false, "at": "2026-11-02T22:17:31Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:17:36Z"}, "note_draft": "I believe Keystone Gate functions as a Forge Stack consumer that provides a governance layer for semantic capsule evolution, as it uses the existing stack infrastructure to support this functionality. However, I acknowledge that the README's language is ambiguous and may be open to interpretation, and further clarification would be necessary to confirm this assumption.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/keystone-gate-shares-one-database", "created_at": "2026-11-01T15:36:10Z", "content": "Keystone Gate is a separate program sharing one database.", "created": "2026-11-01T15:36:10Z", "source": "keystone-gate/README.md design decisions", "tags": ["gate", "substrate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "It imports Substrate and adds no code to the substrate. All of its data is capsules in sc.db.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "The shared DB means cube data mixes with substrate data, and a bad write by either affects both.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Worth it. Checking answers against the real data matters more than clean separation.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:00:55Z"}, "FICTION": {"content": "With its own database, it could not check answers against the substrate without a second connection and a sync problem.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Removing it means dropping the keystone-gate folder, four foundations and its capsules.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe Keystone Gate is a separate program sharing one database because it imports Substrate and adds no code to the substrate, storing all its data in sc.db. However, this shared database poses a risk of data contamination, as a bad write to either the keystone-gate data or the substrate data could have unintended consequences.", "stale": false, "at": "2026-11-02T22:01:05Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:01:09Z"}, "note_draft": "I believe Keystone Gate is a separate program sharing one database because it imports Substrate and adds no code to the substrate, storing all its data in sc.db. However, this shared database poses a risk of data contamination, as a bad write to either the keystone-gate data or the substrate data could have unintended consequences.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/life-in-capsules", "created_at": "2026-11-02T23:11:39Z", "content": "James has always defined his life in capsules.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He says only now, with the Forge Stack and SCP, do the capsules fit him.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "A capsule is a boundary, and describing a life in boundaries can flatten what doesn't fit them.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The fact that the tool matches how he already thinks is probably why he finally finishes things in it.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the capsules hadn't fit. SCP would have been another parked idea.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "His daily routine is modelled as circadian capsules too.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/llm-handles-language-not-truth", "created_at": "2026-11-01T15:36:10Z", "content": "The LLM handles language, never truth.", "created": "2026-11-01T15:36:10Z", "source": "keystone-gate/README.md", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The walker finds the facts and Claude only rewords them. Any failure or refusal shows the walker's answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Rewording can still change meaning. The gate proves each claim quotes evidence, not that the sentence means the same as its quote.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "This is the core rule of the project. Models are useful for wording and should not be the source of facts.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:01:23Z"}, "FICTION": {"content": "If the LLM could answer from its own knowledge, the gate would have nothing to check against.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "The core rule of Keystone Gate, enforced by sc/claude-answerer in kg_llm.py. No live call had been made at 2026-11-01.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "The LLM handles language, never truth, as it rewords facts found by the walker, and its core rule is that models should not be the source of facts. However, this rule may not prevent changes in meaning due to rewording, and it is unclear whether the LLM could answer from its own knowledge if it were possible.", "stale": false, "at": "2026-11-02T22:01:30Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:01:35Z"}, "note_draft": "The LLM handles language, never truth, as it rewords facts found by the walker, and its core rule is that models should not be the source of facts. However, this rule may not prevent changes in meaning due to rewording, and it is unclear whether the LLM could answer from its own knowledge if it were possible.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/llms-unlocked-execution", "created_at": "2026-11-02T23:11:39Z", "content": "LLMs made his work buildable.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "James says it wasn't until LLMs arrived that he could build his work and dreams.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The ideas predate LLMs, because he documents ideas fully and parks them for years. LLMs unlocked execution, not vision.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "That distinction matters, because it's why his stack never lets the LLM decide what's true.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose LLM access vanished tomorrow. The specs would survive, and the build rate wouldn't.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "He uses models for specs and drafting, and builds deliberately around their unreliability.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/log-everything-fail-loud", "created_at": "2026-11-01T15:36:10Z", "content": "Log everything; fail loud and public; fix first.", "created": "2026-11-01T15:36:10Z", "source": "principle/fail-loud-public", "tags": ["principle", "process"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as a principle. The gate follows it: a rule with no checker is a violation, and a refused answer is withheld.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "It took work to make true. Until 2026-11-01 nine places caught Exception and carried on silently. They are fixed and a test now guards it, but a narrow except can still hide a problem.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Quiet failures cost the most to find later, so I want them loud even when it is annoying.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:01:47Z"}, "FICTION": {"content": "If failures stayed quiet, a broken gate would look exactly like a healthy one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Sits behind the event log and the gate's fail-closed behaviour.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe this claim holds because it is a principle that has been implemented and tested, with the gate's fail-closed behaviour sitting behind the event log. However, its main limit is that it may not catch all exceptions, as it took work to make true and a narrow exception can still hide a problem.", "stale": false, "at": "2026-11-02T22:02:08Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:02:12Z"}, "note_draft": "I believe this claim holds because it is a principle that has been implemented and tested, with the gate's fail-closed behaviour sitting behind the event log. However, its main limit is that it may not catch all exceptions, as it took work to make true and a narrow exception can still hide a problem.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/own-ed25519-for-local-signing", "created_at": "2026-11-01T15:36:10Z", "content": "A pure-Python Ed25519 is enough for signing your own documents on your own device.", "created": "2026-11-01T15:36:10Z", "source": "README limits; SPEC section 9", "tags": ["crypto"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "ed25519.py is a pure-Python RFC 8032 implementation tested against RFC section 7.1 vectors.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "It is not constant-time, so it is unsafe in adversarial contexts or when signing for others.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Fine for signing my own documents on my own device. Anything that signs for, or on behalf of, other people should use an audited library.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:25:14Z"}, "FICTION": {"content": "Suppose ed25519.py ends up running as a signing service, with other people submitting documents and the server signing them. An attacker submits thousands of requests and times each one. Because the code isn’t constant-time, the timing differences gradually leak information about the private key. The same code on James’s phone, signing his own files, gives the attacker nothing to measure.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:25:25Z"}, "CONTEXT": {"content": "Keeps the substrate free of dependencies. Canonicalisation is also a local convention, not RFC 8785.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\ned25519.py is pure Python and passes the RFC 8032 §7.1 test vectors. Signatures interoperate with standard Ed25519 verifiers.\nScope: it signs only my own documents on my own device. Nobody else can submit input to be signed, so there’s no timing channel for an attacker to measure.\nIt is not constant-time and has not been audited. That’s accepted for this scope only.\nCanonicalisation is a local convention, not RFC 8785, so it’s interoperable only with this substrate’s own tools.\nTrigger to replace it: the moment anything signs for other people, or runs where untrusted input reaches the signer, switch to an audited library.", "stale": false, "at": "2026-11-02T22:25:41Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:25:47Z"}, "note_draft": "I believe a pure-Python Ed25519 implementation, such as ed25519.py, is sufficient for signing my own documents on my own device, as it is a tested implementation of the standard. However, I acknowledge that it is not constant-time, which may limit its use in certain contexts.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-all-call-address-0x70", "created_at": "2026-11-01T16:07:01Z", "content": "The chip also answers an All Call address of 0x70.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, FAQ", "tags": ["pca9685", "hardware", "i2c"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "This is in addition to the configured address, and can clash with Adafruit LED Matrix or 7-segment backpacks at 0x70.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The FAQ misspells the chip as PCA9865 and only offers one fix: moving the other device to 0x71. The NXP datasheet documents All Call fully and gives a second fix, which is to clear MODE1’s ALLCALL bit at init so the PCA9685 stops answering 0x70.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:34:39Z"}, "OPINION": {"content": "Easy to forget, so worth keeping here for the day a second I2C device acts up.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:35:03Z"}, "FICTION": {"content": "Without knowing this, a second I2C device would fail in a way that looks like bad wiring.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Adafruit PCA9685 guide, FAQ, page 30. The primary source is the NXP PCA9685 datasheet: the MODE1 register (ALLCALL bit) and the ALLCALLADR register.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:34:50Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert, 2026-11-02.\n\nConfirmed against the NXP datasheet: All Call is on by default (MODE1 bit 0 = 1), at 7-bit address 0x70, in addition to the strapped address.\nIt clashes with any other device at 0x70, such as Adafruit LED matrix or 7-segment backpacks.\nFix A: move the other device off 0x70.\nFix B: clear MODE1 bit 0 at every init, because power-on re-enables it.\nBench check: i2cdetect shows 0x70 with only the PCA9685 on the bus, and it disappears once ALLCALL is cleared.", "stale": false, "at": "2026-11-02T22:35:12Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:35:16Z"}, "note_draft": "This claim holds because the PCA9685 chip has an additional address for an All Call, which can conflict with other devices. Its main limit is that it is not widely documented, as evidenced by the FAQ being the only source, and the fix provided only moves another device, not the PCA9685 itself.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-calibrate-before-trusting-angles", "created_at": "2026-11-01T16:07:02Z", "content": "Calibrate each servo's minimum and maximum pulse before trusting its angles.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Calibrating your Servos", "tags": ["pca9685", "hardware", "servo", "calibration"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Pulse timing varies between brands, models and even samples of one model. Adjust SERVOMIN and SERVOMAX gradually, and stop before the physical limit.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Calibrating means approaching a limit you must not hit. Driving into it can strip gears. It also stalls the servo, which draws peak current, heats the motor and can brown out a shared supply.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:36:13Z"}, "OPINION": {"content": "Worth doing for every servo, slowly, before any automated motion. Once a servo is mounted in a joint, the joint’s own mechanical limit usually comes before the servo’s, so calibrate again in place.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:36:26Z"}, "FICTION": {"content": "Uncalibrated values shared across joints would put each servo slightly off, and a stop or two out of range.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Once calibrated, map(degrees, 0, 180, SERVOMIN, SERVOMAX) converts angle to pulse length (pages 16–17). SERVOMIN and SERVOMAX are in ticks at the configured PWM frequency. Not every servo has a 180° range, so map to the range you actually measured.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:36:39Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert, 2026-11-02.\n\nPulse limits vary between servos, including between samples of the same model, so each one is calibrated individually.\nMethod: step SERVOMIN and SERVOMAX gradually, listen for strain or buzzing, and back off before the hard stop.\nValues are recorded per servo [in µs / in ticks at X Hz on board Y].\nIn a robot, joint limits are calibrated in situ and override the servo’s own range.\nStall at the limit draws peak current, so calibrate on a supply that can take it, or one servo at a time.", "stale": false, "at": "2026-11-02T22:36:51Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:36:56Z"}, "note_draft": "I believe this calibration is necessary to ensure accurate angle measurements, as pulse timing can vary between different servo models. However, I should be cautious not to exceed the physical limit, as this could cause permanent damage to the servo.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-capacitor-sizing", "created_at": "2026-11-01T16:07:01Z", "content": "A capacitor of about 100uF per servo is a starting point.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Adding a Capacitor", "tags": ["pca9685", "hardware", "power"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Use n times 100uF for n servos when the supply dips under load, such as 470uF or more for 5 servos. The kit does not include one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "It is a rule of thumb: the guide says there is no one magic value, because it depends on current draw, torque and supply.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A fair starting rule. If the supply dips under load, I look at the supply as well.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-capacitor-sizing/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A large enough capacitor would hide an undersized supply for a moment, not fix it.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Solder an electrolytic into the thru-hole slot. Page 11.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe a capacitor of about 100uF per servo is a reasonable starting point, as it is a common guideline in electronics. However, I acknowledge that the ideal value may vary depending on the specific requirements of the system, such as current draw, torque, and supply voltage.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-chains-to-992-servos", "created_at": "2026-11-01T16:07:01Z", "content": "Up to 62 boards chain on the same two pins, for 992 servos.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Overview and Chaining", "tags": ["pca9685", "hardware", "i2c"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "62 boards at 16 channels gives 992. Each board needs a unique address, and chained boards connect with a 6-pin cable.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide's address table shows only 5-bit offsets, which covers 32 boards, not 62. It stops at Board 4 and does not explain the gap. Check the datasheet.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A headline number. I only need one or two boards, so the real concern is power.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-chains-to-992-servos/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "At 992 servos, power distribution would be a far bigger problem than addressing.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Only the first board in a chain needs a power terminal. Pages 5, 9 and 12.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because the PCA9685's 6-pin cable allows for 62 boards to be chained together, with each board requiring a unique address. However, I am concerned that the 5-bit offset address table may not be sufficient to accommodate 62 boards, and I need to verify this with the datasheet.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-i2c-address-jumpers", "created_at": "2026-11-01T16:07:01Z", "content": "The default I2C address is 0x40, and solder jumpers add a binary offset.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Addressing the Boards", "tags": ["pca9685", "hardware", "i2c"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Bridge a jumper for each binary 1. A0 gives 0x41, A1 gives 0x42, A0 and A1 give 0x43, A2 gives 0x44.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Jumpers are soldered, so changing an address means rework, not a software change.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Simple and reliable. Having to solder it is a fair price for an address that cannot drift.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-i2c-address-jumpers/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With software addresses, two boards could collide after a bad write instead of at assembly.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Each board needs its own driver object, and begin called on each. Page 14.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the default I2C address of 0x40 is a reliable choice, as soldering jumpers to add a binary offset provides a simple and effective way to configure the address. However, this approach does require rework if the address needs to be changed, which may be a drawback for some users.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-led-current-limits", "created_at": "2026-11-01T16:07:02Z", "content": "PWM outputs can drive LEDs, within limited current.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Output Ports and Dimming LEDs", "tags": ["pca9685", "hardware", "pwm", "led"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Max current per pin is 25mA, with 220 ohm resistors in series on every PWM pin.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide disagrees with itself. Page 7 gives 25mA, page 22 says around 10mA and that no resistor is needed, and the example code says to use a resistor.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "The guide disagrees with itself, so I take the lower figure and use a resistor.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-led-current-limits/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Reading only page 22 would make the outputs seem to need no thought at all.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 7, 22 and 24.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe PWM outputs can drive LEDs within the limited current of around 10mA, as indicated on page 22 of the Adafruit PCA9685 guide, and will use a resistor to ensure safe operation. However, I acknowledge that the guide also states 25mA on page 7, and I will exercise caution to avoid overcurrent.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-never-power-servos-from-the-controller", "created_at": "2026-11-01T16:07:01Z", "content": "Do not power servos from the Arduino or Raspberry Pi 5V pin.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Power for the Servos and Python Computer Wiring", "tags": ["pca9685", "hardware", "power", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Electrical noise and brownouts from the current draw can make the controller act erratically, reset or overheat.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide gives this as a warning with no threshold. One idle micro servo may seem fine on the bench, which is how the habit starts.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A firm rule. Separate supplies, with grounds joined.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-never-power-servos-from-the-controller/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A controller that resets mid-move would drop every servo signal at once.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Use a separate supply. Pages 11 and 20.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the Adafruit guide warns of electrical noise and brownouts from the current draw, which can cause erratic behavior in the controller. However, I am unsure of the specific threshold for this warning, and I do not have information on the exact voltage or current draw of the servos.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-oe-pin-disables-outputs", "created_at": "2026-11-01T16:07:02Z", "content": "Pulling OE high disables all outputs at once.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Control Pins", "tags": ["pca9685", "hardware", "safety"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "OE is active low and pulled low by default, so it is optional. High disables the outputs.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide does not say what servos do when the signal stops, so do not assume OE is a safe stop for a loaded mechanism without testing it.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Useful, but I would not call it a safety stop until I have tested a loaded joint.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With OE wired to a stop switch, one input could cut every PWM signal without touching the I2C bus.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Control Pins, page 7.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the OE pin is active low, meaning it is pulled low by default, and pulling it high disables all outputs. However, I am uncertain about the safety of this as a stop for a loaded mechanism, as the guide does not provide information on what happens to the servos when the signal stops, and I would not consider it a reliable safety stop without further testing.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-one-frequency-for-all-channels", "created_at": "2026-11-01T16:07:01Z", "content": "All 16 channels share one PWM frequency.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Output Ports", "tags": ["pca9685", "hardware", "pwm"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Duty cycle is independent per channel, but frequency is not, so servos and LEDs at different frequencies cannot share a board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide says servos need 60 Hz. Not from the guide: many servo datasheets specify 50 Hz, so check yours. The Arduino chaining example sets 1600, which is unsuitable for servos.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Fine for servos alone. LEDs that need another frequency go on their own board.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-one-frequency-for-all-channels/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Mixing a 60 Hz servo and a 1 kHz LED strip would need a second board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "setPWMFreq takes 40 to 1600 Hz. Pages 7, 14 and 18.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim that all 16 channels share one PWM frequency is true, as stated in the Adafruit PCA9685 guide. However, I note that this may not be suitable for all applications, particularly those requiring different frequencies, such as servos, which may require a separate board.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-pwm-ticks", "created_at": "2026-11-01T16:07:02Z", "content": "setPWM sets on and off ticks within a 4096-step cycle.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Library Reference", "tags": ["pca9685", "hardware", "pwm", "arduino"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Channel is 0 to 15, and on and off are ticks from 0 to 4095. setPWM(15, 1024, 3072) goes high at 25 percent and low at 75 percent.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Fully on and fully off break that range. They use the special value 4096, so 4095 is not fully off, as the FAQ points out.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Fine to know, but I would use a library's angle call and only drop to ticks when needed.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-pwm-ticks/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Code clamping values to 4095 would leave LEDs faintly lit and never fully off.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Fully on is setPWM(pin, 4096, 0). Fully off is setPWM(pin, 0, 4096). Pages 18, 19 and 30.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because the Adafruit PCA9685 guide states that the PWM cycle is 4096 steps, and the FAQ confirms that fully on and fully off values are 4096 and 0, respectively. However, I note that the fully off value is not exactly 0, as the special value 4096 is used, which means the LEDs will not be fully off at 4095. This limitation is acknowledged in the FAQ.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-python-duty-cycle-is-12-bit", "created_at": "2026-11-01T16:07:02Z", "content": "In Python, duty_cycle takes 16 bits but the chip resolves only 12.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Dimming LEDs", "tags": ["pca9685", "hardware", "pwm", "python"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "duty_cycle runs from 0 to 0xFFFF to match other PWM objects. The example code notes only 12 bits of real resolution.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "So a 16-step-sized change can do nothing. Fine values give a false sense of precision.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A detail to remember when fades look stepped. 12 bits is plenty for what I need.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-python-duty-cycle-is-12-bit/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A smooth fade written for 16 bits would still move in 4096 real steps.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 23 and 24.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim that the duty_cycle takes 16 bits but the chip resolves only 12 bits is true, as stated in the Adafruit PCA9685 guide. However, I note that this may not be a significant limitation for my purposes, as the guide suggests that 12 bits of real resolution is sufficient for my needs.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-servo-current-sizing", "created_at": "2026-11-01T16:07:01Z", "content": "Size the servo supply for current, not just voltage.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Power for the Servos", "tags": ["pca9685", "hardware", "power", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Micro servos draw several hundred mA while moving, and some high-torque servos draw over 1A each under load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide lists 5V 2A, 4A and 10A supplies but gives no sizing rule, and 2A would not cover several high-torque servos moving together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Measure it. A generous supply costs less than chasing brownouts.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servo-current-sizing/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A supply sized for average draw would brown out the moment every joint moved at once.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "4xAA packs give 6V with alkaline cells and 4.8V with NiMH. Pages 10 and 20.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because high-torque servos can draw over 1A each under load, and using a supply sized for average draw would likely result in brownouts. However, the main limit of this claim is that the guide does not provide a specific sizing rule, and 2A may not be sufficient for all high-torque servos moving together.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-servo-plug-orientation", "created_at": "2026-11-01T16:07:02Z", "content": "Servo plugs go ground to the bottom row, signal to the top.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Connecting a Servo", "tags": ["pca9685", "hardware", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Ground is usually black or brown, and signal is usually yellow, white or orange. Each port has V+, GND and PWM.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "Wire colours are a convention. The guide says to check your servo's data sheet.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "Worth a check every time a plug is reconnected, since it is easy to get wrong in a tight space.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servo-plug-orientation/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A plug reversed on a dense 16-port header is easy to miss in a tight assembly.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 7, 11 and 25.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim that servo plugs go ground to the bottom row and signal to the top is true, as it is stated in the Adafruit PCA9685 guide. However, I should note that the wire colours are a convention and should be checked against the servo's data sheet to confirm.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-servokit-for-python", "created_at": "2026-11-01T16:07:02Z", "content": "ServoKit is the simple way to drive servos from Python.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Controlling Servos", "tags": ["pca9685", "hardware", "servo", "python"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ServoKit(channels=16) for this breakout. Set kit.servo[0].angle for standard servos and kit.continuous_servo[1].throttle for continuous ones.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide has rough edges: it says actuation_angle in one place and actuation_range in another, uses servokit where it means kit, and its full example sets channels=8.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "A good way to start on a Linux board, though on an ESP32 I would be using a different library.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-servokit-for-python/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Copying the example unchanged would leave channels 8 to 15 unreachable on this board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Tune with actuation_range and set_pulse_width_range, such as (1000, 2000). Requires adafruit-circuitpython-servokit. Pages 21 to 27.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe ServoKit is a suitable way to drive servos from Python, as it provides a simple interface for standard servos and continuous servos. However, I note that the Adafruit guide has some inconsistencies and rough edges, which may require some adjustments to get it working correctly.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-sixteen-channels-over-i2c", "created_at": "2026-11-01T16:07:01Z", "content": "The PCA9685 drives 16 PWM channels over I2C using two signal pins.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Overview", "tags": ["pca9685", "hardware", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "16 channels at 12-bit resolution, run by the on-board controller with no extra microcontroller processing.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The board needs its own servo power, so two signal pins is not the whole wiring job. Control is four wires: VCC, GND, SDA and SCL.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "This is why I would use the board: it takes the PWM work off the controller.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-sixteen-channels-over-i2c/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Driving 16 servos directly would use 16 pins and tie up the controller's timers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Overview, page 5.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the PCA9685 is suitable for this project because it can drive 16 PWM channels over I2C using only two signal pins, which is a significant advantage. However, I note that this is only possible due to the on-board controller handling the PWM work, and the board still requires its own power supply, which is a limitation.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-v-plus-voltage-limit", "created_at": "2026-11-01T16:07:01Z", "content": "Servo power on V+ should be 5 to 6V DC.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Power Pins and Hooking it Up", "tags": ["pca9685", "hardware", "power", "servo"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "V+ is not used by the chip. The guide recommends 5 to 6V DC, through the blue terminal block, which is polarity protected.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide contradicts itself. Page 7 says you can go up to 12V DC if you have to. Page 10 says V+ can be as high as 6V. Treat 6V as the limit unless the datasheet and your servos say otherwise.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "I stay at 6V or below. A guide that disagrees with itself gets the cautious reading.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-v-plus-voltage-limit/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A slip that joined V+ to VCC at 12V would damage the board, as the guide warns.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Pages 7 and 10.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because the Adafruit guide recommends 5 to 6V DC for servo power on V+, and the blue terminal block is polarity protected. However, I consider the main limit to be the datasheet and servo specifications, as the guide contradicts itself on this point.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-vcc-is-logic-power-only", "created_at": "2026-11-01T16:07:01Z", "content": "VCC powers the chip only. Servos need V+ connected as well.", "created": "2026-11-01T16:07:01Z", "source": "Adafruit PCA9685 guide, Power Pins and Hooking it Up", "tags": ["pca9685", "hardware", "power"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "VCC should be 3 to 5V and match the microcontroller's logic, since it also feeds the 10K pullups on SCL and SDA.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The output logic level also follows VCC, so at 3.3V the PWM signal is 3.3V even when servos run from 6V. The guide does not discuss whether a given servo accepts that.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "OPINION": {"content": "An easy mistake to make once, so worth keeping as a checklist item.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pca9685-vcc-is-logic-power-only/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If V+ were fed from VCC, a servo stall would pull down the logic supply.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "CONTEXT": {"content": "Green LED shows the board has power. Pages 7, 10 and 16.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because the VCC voltage range and its matching with the microcontroller's logic are supported by the Adafruit guide. However, I am unsure if the PWM signal at 3.3V will be compatible with servos running at 6V, as the guide does not explicitly state this. I will verify this with further research.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pca9685-wiring-for-controllers", "created_at": "2026-11-01T16:07:02Z", "content": "Wiring is the same four lines on any I2C controller.", "created": "2026-11-01T16:07:02Z", "source": "Adafruit PCA9685 guide, Hooking it Up and Python Wiring", "tags": ["pca9685", "hardware", "i2c", "arduino"], "group": "Adafruit PCA9685 16-Channel Servo Driver", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "VCC, GND, SDA and SCL. Classic Arduino uses A4 and A5, older Mega uses 20 and 21, and R3 boards have dedicated pins. Pi and Feather use 3V logic.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T16:13:46Z"}, "COUNTER": {"content": "The guide doesn’t cover the ESP32. The default pins on a WROOM-32 DevKit are SDA GPIO21 and SCL GPIO22, but any GPIO works through Wire.begin(sda, scl), and the S3 has no fixed default. The “four lines” are logic only: servos need separate power on V+, with a ground shared with the controller.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:37:45Z"}, "OPINION": {"content": "The logic wiring is simple. The two things that need care are matching VCC to the controller’s logic voltage and never powering the servos from VCC.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:37:56Z"}, "FICTION": {"content": "Suppose someone wires only the four lines and plugs in servos. The chip responds on I2C, PWM is configured, and nothing moves, or the servos twitch weakly. V+ was never connected, so all the logic is working and there’s no power to drive the servos.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:38:05Z"}, "CONTEXT": {"content": "The ESP32 gap is noted because the ESP32 is the main controller in James’s builds. Pages 9, 19 and 20.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:38:17Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert, 2026-11-02.\n\nThe logic wiring is four lines on any I2C controller: VCC (matched to the controller’s logic level), GND, SDA and SCL.\nESP32-WROOM-32: SDA GPIO21, SCL GPIO22 by default, or set them in Wire.begin(). VCC is 3.3 V.\nServo power goes to V+ from a separate supply sized for stall current, and its ground is common with the controller.\nOptional: wire OE (active low) to a GPIO and hold it high at boot, so servos don’t twitch before init.", "stale": false, "at": "2026-11-02T22:38:32Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:38:36Z"}, "note_draft": "I believe the wiring for an I2C controller is standardised to VCC, GND, SDA, and SCL, as this is a widely accepted configuration. However, I am aware that the PCA9685 guide does not explicitly cover the ESP32, which may require additional research to confirm the correct wiring.", "neighbours": [], "contradicts": null, "overlaps": [{"lambda": 1.01, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "esp32"}, {"lens": "FACT", "term": "arduino"}, {"lens": "COUNTER", "term": "default"}], "other": "cube/esp32-i2c-pins-are-configurable"}]}, {"id": "cube/phase-0-is-documentation", "created_at": "2026-11-01T15:36:10Z", "content": "Phase 0 is always documentation.", "created": "2026-11-01T15:36:10Z", "source": "phase-0 principle", "tags": ["principle", "process"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as the first of james's build rules: document fully before building.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Docs can lag once building starts. At 2026-11-01 keystone-gate/README.md still called kg_agent.py empty when it held 526 lines, and STRUCTURE.md listed 21 tests when there were 70.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Still right, but documents have to be kept current or they mislead. This project showed that.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:02:34Z"}, "FICTION": {"content": "If building came first, ideas would start before they fit, and the reasons for them would live only in memory.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "From phase-0: ideas parked for years, documented, not started until they fit. The scp project links to it with follows.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe the Phase 0 principle is valid because it aligns with standard project management practices, which emphasize documenting ideas before implementation. However, I acknowledge that documents can become outdated, and it is essential to regularly update them to ensure accuracy and avoid misleading information.", "stale": false, "at": "2026-11-02T22:02:41Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:02:44Z"}, "note_draft": "I believe the Phase 0 principle is valid because it aligns with standard project management practices, which emphasize documenting ideas before implementation. However, I acknowledge that documents can become outdated, and it is essential to regularly update them to ensure accuracy and avoid misleading information.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/pla-creeps-under-load", "created_at": "2026-11-01T16:50:49Z", "content": "PLA printed parts deform under sustained load and warmth.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["3d-printing", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "PLA softens at fairly low temperatures and can slowly creep when loaded for long periods.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A part near a warm servo or in a hot room may fail without warning. PETG or ABS resist heat better, but print differently.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Fine for prototypes. Parts holding load near a warm servo should be PETG or better.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/pla-creeps-under-load/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "An arm left holding a load overnight could sag by morning.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Relevant to printed arm parts and the printer build.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I agree that PLA printed parts are prone to deformation under sustained load and warmth due to its tendency to soften at low temperatures and creep when loaded for extended periods. However, I note that this effect can be mitigated by using PETG or ABS, which resist heat better and print differently, but may require adjustments to the print settings.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/print-orientation-sets-strength", "created_at": "2026-11-01T16:50:49Z", "content": "Layer direction decides where a printed part is weak.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["3d-printing", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Printed parts are weakest between layers, so orient them so load runs along the layers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The strongest orientation may need more support material or worse surface finish, so it is a trade.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Orient for load first and accept extra supports on anything structural.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/print-orientation-sets-strength/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A bracket printed the wrong way could snap along a layer line at far below its rated load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Matters for joints and brackets under the highest torque.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I agree that the layer direction of a printed part can affect its strength, with the weakest points typically occurring between layers. However, I believe that the optimal orientation may depend on the specific application and design requirements, and may require additional support material or a better surface finish to achieve the desired level of strength.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/quoting-sources-reduces-hallucination", "created_at": "2026-11-01T16:50:49Z", "content": "Requiring verbatim quotes makes claims checkable.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A quote can be matched against the evidence by code, with no judgement involved.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A claim can quote real text and still misstate it, so a verified quote is not a verified meaning.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "The best cheap check available, as long as a passing quote is not mistaken for a true claim.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/quoting-sources-reduces-hallucination/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without quotes, a gate could only check names and numbers.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "This is the claims_quote_evidence rule.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because a quote can be matched against the evidence by code, with no judgement involved. However, I acknowledge that a verified quote is not a verified meaning, as a claim can quote real text and still misstate it. I have not tested this myself, as this is standard electronics, and I am relying on general knowledge.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/ramp-motion-instead-of-jumping", "created_at": "2026-11-01T16:50:49Z", "content": "Ramp servo moves instead of jumping to the target.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "servo", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A servo driven straight to a far angle moves at full speed. Stepping through small increments reduces shock and peak current.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Ramping adds latency, and a coarse step size can make motion visibly jerky.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Should be the default for all moves. It helps the mechanics and the supply together.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/ramp-motion-instead-of-jumping/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If every joint jumped at once, the combined current peak would be the worst case for the supply.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Reduces the supply stress described in the current cubes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the ramp servo claim holds because it reduces supply stress, as stated in the context. However, its main limit is that it may introduce latency and jerky motion if the step size is too coarse.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/refused-answers-are-withheld", "created_at": "2026-11-01T15:36:10Z", "content": "A refused answer is withheld, not shown with a warning.", "created": "2026-11-01T15:36:10Z", "source": "SPEC section 15", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "kg_hal.py returns no answer when the gate refuses. kg ask --claude replaces a refused answer with the walker's gated one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "A false refusal hides a good answer, and a person has no view of it except kg gate check. For Claude, the refused text is not shown at all.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "A warning gets skimmed past. Withheld is better, as long as I can see why.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:03:30Z"}, "FICTION": {"content": "With warnings instead, people would learn to skim past them, and the gate would become decoration.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "On 2026-11-01 a sweep of about 4,000 walker answers found 13 false refusals, since fixed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe the claim holds because kg_hal.py returns no answer when the gate refuses, and a person can view the walker's gated answer. The main limit of this approach is that a false refusal may hide a good answer, and the person has no view of it except through the kg gate check.", "stale": false, "at": "2026-11-02T22:03:37Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:03:46Z"}, "note_draft": "I believe the claim holds because kg_hal.py returns no answer when the gate refuses, and a person can view the walker's gated answer. The main limit of this approach is that a false refusal may hide a good answer, and the person has no view of it except through the kg gate check.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/replicant-has-reached-version-1-0", "created_at": "2026-11-02T06:36:21Z", "content": "Replicant is at version 1.0, with parallel Python and Rust implementations that both have a working core simulation.", "created": "2026-11-02T06:36:21Z", "source": "Wor
