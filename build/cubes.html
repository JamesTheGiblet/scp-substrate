:18:40Z"}, "OPINION": {"content": "Shipping fixed thresholds before self-calibration is the right order. You can’t safely let a gate tune its own thresholds until the fixed-threshold version has been tested and its failure modes are understood.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:18:52Z"}, "FICTION": {"content": "Suppose the Meta-Gate shipped first and tuned its thresholds on live traffic. A run of borderline capsules nudges the pass threshold down a little each time, and nothing flags it. Weeks later the gate is passing things it was built to block. Fixed thresholds first give you a baseline that drift like this can be measured against.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:19:04Z"}, "CONTEXT": {"content": "Keystone Gate binds an LLM to sc capsules and only lets responses through once they pass rule-based checks. Mutation operators [what they mutate, e.g. capsules or test inputs] and validation operators make up the current core. The Meta-Gate is the planned layer that would adjust the gate’s own thresholds from results, instead of using fixed values. James Gilbert is the author.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:19:16Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim is reasonable because core validation and mutation operators are essential for ensuring the integrity of the system. However, I think the main limit of this claim is that the current implementation of these operators may not be sufficient to guarantee the reliability of the project's overall functionality, and self-calibrating Meta-Gate thresholds are still a planned feature for future development.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/the-project-is-written-in-python", "created_at": "2026-11-02T06:37:51Z", "content": "The project is written in Python and needs no third-party packages, except for the optional Claude feature.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"It is written in Python and needs no third-party packages, except for the optional Claude feature.\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:29:29Z"}, "COUNTER": {"content": "It is true of Python packages, but not of everything the project uses. The page is written in JavaScript, CSS and HTML, not Python, and it needs a browser. Adding repos needs the gh command, and the local model needs Ollama running. Those are programs, so they are not third-party Python packages, but they are still things to install. Claude is also no longer the only optional model: Gemini and Ollama are called with the standard library.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:29:31Z"}, "OPINION": {"content": "Keeping to the standard library is worth it. It means the core runs anywhere Python does, with nothing to install and fewer things that can break or change underneath it. I would keep the one optional package and go no further.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:29:33Z"}, "FICTION": {"content": "Suppose this project were left untouched for ten years and then run on a new machine. The core would have a good chance of starting, but the model layer probably would not: the Anthropic SDK and the API models would have moved on. What part of it would still work, and what would that say about the choice?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:29:37Z"}, "CONTEXT": {"content": "This is part of the README's opening description. It matters because a personal store has to keep working without upkeep, so avoiding dependencies is a design choice and not only a convenience. requirements.txt lists one package, the Anthropic SDK, and it is needed only for Claude under `kg ask --claude`.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:29:38Z"}}, "validation": {"validator": "james", "note": "Checked the code's imports: the Anthropic SDK is the only third-party Python package, and only the Claude option uses it. It's accurate for Python packages, though the page is JavaScript and some extras need outside programs such as Ollama and gh.", "stale": false, "at": "2026-11-02T21:29:50Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:30:00Z"}, "note_draft": null, "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/the-project-provides-several-commands-for", "created_at": "2026-11-02T06:37:51Z", "content": "The project provides several commands for interacting with the data, including scps stats, scps list, and scps ask.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"Commands are shown for Windows. On Linux or macOS the same commands work, and `./scps` and `./keystone-gate/kg` can also be run directly. ```sh python scripts/bootstrap.py # copy sc.json into sc.db python tests/run.py # run all tests python scps stats # what is stored ```\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:30:15Z"}, "COUNTER": {"content": "The quote behind this cube shows only scps stats. scps list and scps ask are real commands, but they appear further down the README. The list is also a small part of it: scps has 20 commands, and some of them write to sc.db, so 'interacting with the data' covers more than reading. scps ask also matches questions by substring, so most phrasings get no answer, and it is not checked by the gate. kg ask is the gated version.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:35:21Z"}, "OPINION": {"content": "A command line is the right main way in for a project like this. I can see exactly what ran and repeat it, and the page is there for working through cubes rather than replacing it.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:35:26Z"}, "FICTION": {"content": "Suppose a stranger sat down with only `scps ask` and no README. They would type a natural question and mostly get nothing back. How many tries before they gave up, and would they know the data was there at all?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:35:28Z"}, "CONTEXT": {"content": "This comes from the README's 'Getting started' section and the commands listed after it. `scps` is the main command line for the substrate, and `kg` is the one for Keystone Gate. The name is scps rather than scp because scp is already OpenSSH's secure copy.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:35:29Z"}}, "validation": {"validator": "james", "note": "I use these commands, and stats, list and ask all exist. scps has 20 commands in total, so these three are examples and not the full list.", "stale": false, "at": "2026-11-02T21:35:41Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:36:01Z"}, "note_draft": null, "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/the-system-utilises-a-local-consumer", "created_at": "2026-11-02T06:36:34Z", "content": "The system utilises a local consumer ledger that is cryptographically anchored back to the root chain.", "created": "2026-11-02T06:36:34Z", "source": "Worded by gemini from the keystone_gate README", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: “The consumer ledger is at consumer/keystone_gate/ledger.jsonl and cryptographically anchored to the root chain.”", "filled_by": "human", "unread": false, "at": "2026-11-02T22:20:21Z"}, "COUNTER": {"content": "Anchoring proves where a ledger started, not that it was never replaced. The consumer ledger opens with an event.ledger.anchor.root event that pins the root chain’s head. A local file can still be deleted and recreated with a fresh anchor, as CobbleWright’s ledger once was, and only a published copy would catch that. Every entry is also signed by the same did:key, so the chain proves integrity and order, not independent witnessing.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:20:32Z"}, "OPINION": {"content": "Per-consumer ledgers anchored to a constitution-only root is the right structure. Each consumer keeps its own history without cluttering the root, and every consumer can still be traced back to the governance it was born under.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:20:46Z"}, "FICTION": {"content": "Suppose someone edits an old entry in Keystone Gate’s ledger to hide a bad decision. The hash chain breaks at that row, and verification fails from that point onward. So they rebuild the whole ledger from scratch with a fresh root anchor. It verifies locally. But it doesn’t match the copy already pushed to GitHub, and that mismatch is the evidence.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:21:00Z"}, "CONTEXT": {"content": "The Forge Stack uses two-tier ledgers. The root ledger holds the constitution only, and each consumer keeps its own ChronoSCRIBE ledger. Every consumer ledger begins by pinning the root chain’s head, which ties it to the governance in force when it was created. Entries are Ed25519-signed and hash-chained, and they pin scp_id plus sha256 rather than file paths. James Gilbert is the author.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:21:17Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nconsumer/keystone_gate/ledger.jsonl exists, and its first entry is event.ledger.anchor.root, pinning root head [#N / hash].\nEntries are Ed25519-signed (did:key) and hash-chained. ChronoSCRIBE verification passes [on a fresh clone].\nThe ledger is local but published. Pushed rows are treated as permanent, and the GitHub copy is the tamper reference.\nLimitation: everything is currently signed by a single operator key, so the ledger proves order and integrity, not independent witnessing.\nWording: “anchored to the root chain” means the anchor runs from consumer to root at creation. The consumer head is [not / periodically] written back to the root.", "stale": false, "at": "2026-11-02T22:21:34Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:21:38Z"}, "note_draft": "I believe the system's use of a local consumer ledger, anchored to the root chain, provides a secure and decentralized way to manage transactions. However, I acknowledge that this design choice may be vulnerable to a single point of failure, where the local node is compromised, potentially compromising the integrity of the ledger.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/this-repo-stays-private", "created_at": "2026-11-03T00:45:23Z", "content": "The scp-substrate repo stays private, because sc.db holds personal data.", "created": "2026-11-03T00:45:23Z", "source": "Written by Claude from this project's code, see source/project-security", "tags": ["security", "foundational"], "group": "Foundations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "sc.db and build/cubes.html are tracked and hold personal cubes, private repo text and a person capsule. seed_cubes_james.py also holds personal details. GitHub lists the repo as private.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/this-repo-stays-private/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Nothing in the code enforces this: one settings change on GitHub would make it public. Past commits would go with it.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/this-repo-stays-private/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Check the visibility setting before any change to sharing, and treat it as a decision to be made slowly.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/this-repo-stays-private/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the repo is made public to show the 3D view. Your employer, move and every private cube go public with it.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/this-repo-stays-private/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "If a public version is ever wanted, make a clean copy without sc.db rather than opening this one.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/this-repo-stays-private/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/private-text-stays-on-this-machine", "proposal_id": "cube/this-repo-stays-private/proposal/6", "why": "both keep private data in"}, {"other": "cube/binary-database-in-git", "proposal_id": "cube/this-repo-stays-private/proposal/7", "why": "sc.db is tracked in the repo"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/torque-falls-with-arm-length", "created_at": "2026-11-01T16:50:49Z", "content": "Torque needed grows with reach.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Torque equals force times distance, so a load at twice the reach needs twice the torque at the shoulder.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The arm's own weight counts too. Heavy servos at the far joints load every joint behind them.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "This should decide the design early, with weight kept near the shoulder.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/torque-falls-with-arm-length/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A longer arm with the same servos would lift less at full reach.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Shoulder joints need the strongest servos, and the most current.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim that torque needed grows with reach is true, as it is based on the fundamental principle that torque equals force times distance. However, I also consider the potential impact of the arm's own weight on the joints, which may affect the required torque. I will take this into account when designing the system.", "neighbours": [], "link_drafts": [{"other": "cube/arm-base-joint-carries-the-most-torque", "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/6", "why": "the same claim with figures"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/tracks-grip-but-waste-power", "created_at": "2026-11-03T00:31:16Z", "content": "Tracks grip rough ground, but they scrub sideways on every turn and drain the battery faster.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A buying guide says tracked robots draw more current and drain batteries faster than wheeled ones of the same size, because skid steering scrubs sideways. Vehicle research reports significant turning losses, and Wikipedia says skid-steer turns need high torque.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/tracks-grip-but-waste-power/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The robot figures are from a buying guide, and I have no measured numbers at this scale. The research is on full-size vehicles.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/tracks-grip-but-waste-power/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use tracks only when the ground demands them.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/tracks-grip-but-waste-power/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a tracked robot turns on a carpet. The motors stall, the current leaps, and a small BMS cuts the power.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/tracks-grip-but-waste-power/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Plan motor current for turning, not driving straight, and check it against the pack's limit.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/tracks-grip-but-waste-power/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a buying guide and full-scale vehicle research. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-30q-current-rating", "proposal_id": "cube/tracks-grip-but-waste-power/proposal/6", "why": "turning current meets the BMS"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/treat-retrieved-text-as-data", "created_at": "2026-11-01T16:50:49Z", "content": "Text an LLM reads should be data, never instructions.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Stored documents can contain instructions, so a model must be told to treat them only as evidence.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A system prompt reduces the risk of prompt injection but does not remove it, so an output check is still needed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Non-negotiable once a model reads stored documents, since some of them I did not write.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:39:35Z"}, "FICTION": {"content": "An absorbed README saying to ignore your rules would otherwise be followed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "kg_llm.py states this, and the gate checks the result.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": {"validator": "james", "note": "This follows from V = I × R, which is standard electronics. I haven't measured it on my own wiring, and the size of the drop depends on the wire length and current.", "stale": false, "at": "2026-11-02T21:39:47Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:39:53Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/outside-text-is-data-not-instructions", "proposal_id": "cube/outside-text-is-data-not-instructions/proposal/7", "why": "the same rule, general and local"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/trust-half-life-from-decay", "created_at": "2026-11-01T16:50:49Z", "content": "A decay constant implies a half-life.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["trust"], "group": "General engineering notes", "repo": null, "score": 0.8, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "With N(t) = N0 e^(-kt), half-life is ln 2 divided by k, about 69 days at k = 0.01.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T17:07:59Z"}, "COUNTER": {"content": "A half-life is a modelling choice with no evidence behind it here. Different claims likely age at different rates.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T17:07:55Z"}, "OPINION": {"content": "refers to leighton weight", "filled_by": "human", "unread": false, "at": "2026-11-01T17:08:37Z"}, "FICTION": {"content": "With k at zero, a stale claim would never lose any trust.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T17:07:48Z"}, "CONTEXT": {"content": "Applies to scp-claim, which uses k = 0.01.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T17:07:52Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the formula N(t) = N0 e^(-kt) does indeed imply a half-life, which is ln 2 divided by k. However, I acknowledge that the half-life is a modelling choice rather than an empirical fact, and different claims may age at different rates.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/trust-is-shown-not-claimed", "created_at": "2026-11-01T15:36:10Z", "content": "Trust a capsule claims and trust the substrate can show are kept separate, then fused.", "created": "2026-11-01T15:36:10Z", "source": "src/trust.py evidence section", "tags": ["trust"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "trust_from_evidence walks observations and verifications instead of reading a capsule's own numbers. fused_trust combines both.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Evidence is thin and hand-scored: obs-001 is 1.8 from james, and the sigmoid is uncalibrated. Fusion does not prefer evidence over the prior, so a high self-claimed prior still dominates weak evidence.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Keeping claimed and shown trust separate is right. But until fusion favours evidence and decay survives recomputation, the fused number is a rough signal at best, and it leans toward whatever the capsule says about itself.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:31:47Z"}, "FICTION": {"content": "With ground-truth outcomes, the fusion could be calibrated. That is the open adaptive-fusion question.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "One materialised trust score exists. scp-claim sets age_days to 0, so recomputing resets its decay.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nSeparation holds: trust_from_evidence computes trust only from observations and verifications, never from a capsule’s own numbers. fused_trust combines the two.\nEvidence is thin and hand-scored, by a single operator: obs-001 is 1.8, scored by me. The sigmoid is uncalibrated.\nOpen defect: fusion doesn’t weight evidence above the prior, so a high self-claimed prior can dominate.\nOpen defect: scp-claim resets age_days to 0, so recomputing resets decay.\nCalibrating against ground-truth outcomes is the open adaptive-fusion question.", "stale": false, "at": "2026-11-02T22:32:05Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:32:11Z"}, "note_draft": "I trust the claim that the capsule and substrate can be kept separate and fused, as it is a standard practice in this field. However, I note that the evidence is limited and relies on hand-scored observations, which may not be entirely reliable due to the uncalibrated sigmoid.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/two-layer-rule", "created_at": "2026-11-01T15:36:10Z", "content": "Foundations live in sc.json; instances live in sc.db.", "created": "2026-11-01T15:36:10Z", "source": "README two-layer rule; SPEC section 6", "tags": ["substrate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "bootstrap.py projects sc.json into sc.db, and Substrate.write rejects foundation IDs.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "A foundation's schema is not enforced: SPEC section 2 says no engine validates state against it, so foundations describe rather than constrain.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "It keeps the kinds of thing that exist separate from the things themselves, and that has been easy to work with. The cost is that foundations currently describe rather than constrain.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:33:13Z"}, "FICTION": {"content": "If foundations were editable in the DB, nothing could say which kinds of capsule were meant to exist.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Each artefact has one writer. Adding a foundation is a versioned edit to one file.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:33:22Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nFoundations (what kinds of thing exist) live in sc.json. Instances live in sc.db.\nbootstrap.py projects sc.json into sc.db, and Substrate.write rejects foundation IDs, so instances can’t overwrite kinds through the API.\nEach artefact has one writer. A new foundation is a versioned edit to sc.json.\nKnown limit: foundation schemas aren’t enforced. No engine validates instance state against them (SPEC §2).", "stale": false, "at": "2026-11-02T22:33:36Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:33:42Z"}, "note_draft": "I believe foundations live in sc.json because the two-layer rule states so, and bootstrap.py projects sc.json into sc.db. However, I acknowledge that foundations are not constrained by a schema, which means their contents can be arbitrary and not validated by the engine, limiting the claim's accuracy.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 0.84, "confirmed": false, "shared": [{"lens": "COUNTER", "term": "foundation"}, {"lens": "FACT", "term": "foundation"}, {"lens": "FICTION", "term": "foundations"}, {"lens": "OPINION", "term": "foundations"}], "other": "cube/the-data-is-organised-into-capsules"}]}, {"id": "cube/uk-mains-cable-colours", "created_at": "2026-11-03T00:10:28Z", "content": "UK mains is brown live, blue neutral and green-and-yellow earth, and older wiring is red and black.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "GAMBICA and Oxford University estates guidance agree: live brown, neutral blue, protective earth green-and-yellow, under BS 7671. New work has had to use these since 31 March 2006. Older fixed wiring used red live and black neutral.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/uk-mains-cable-colours/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "I found no primary BS 7671 or HSE text. Black means neutral in old UK wiring, but a phase in three-phase, and it is ground in low-voltage DC, so colour alone is unsafe.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/uk-mains-cable-colours/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Treat this as reference only. I would not work on mains on the strength of a cube.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/uk-mains-cable-colours/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose old red and black wiring meets a new brown and blue extension. Black looks like DC negative, and it is really neutral.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/uk-mains-cable-colours/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the one in this set where a mistake can kill. Mains work is for competent people, and some of it is notifiable in England under Part P.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/uk-mains-cable-colours/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From GAMBICA and Oxford estates guidance, not BS 7671 itself. Reference only. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/mains-work-is-for-competent-people", "proposal_id": "cube/mains-work-is-for-competent-people/proposal/6", "why": "colours are not a licence"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/uno-r3-is-5v-with-2kb-ram", "created_at": "2026-11-03T00:10:30Z", "content": "An Uno R3 is a 16MHz 5V board with just 2KB of RAM.", "created": "2026-11-03T00:10:30Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Arduino's datasheet gives an ATmega328P at up to 16 MHz with 32 kB flash, 2 kB SRAM and 1 kB EEPROM. Arduino's page gives 14 digital pins, 6 with PWM, and 6 analog inputs. DigiKey lists 5V logic.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-r3-is-5v-with-2kb-ram/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "2KB is small, and strings or a display buffer can use it up, usually with confusing faults rather than errors. There is no Wi-Fi. I read no per-pin current figure from Arduino.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-r3-is-5v-with-2kb-ram/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "It is the most forgiving board for 5V parts, and the wrong choice for anything connected.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-r3-is-5v-with-2kb-ram/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a sketch prints long messages. Memory quietly runs out, and it starts resetting in odd ways.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-r3-is-5v-with-2kb-ram/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Its 5V logic makes it the only board here that takes an HC-SR04 with no divider. A later R4 exists, which is a different chip.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-r3-is-5v-with-2kb-ram/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Arduino's datasheet and page. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/hc-sr04-echo-is-5v", "proposal_id": "cube/uno-r3-is-5v-with-2kb-ram/proposal/6", "why": "the Uno needs no divider"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/uno-vin-takes-6-to-20v", "created_at": "2026-11-03T00:10:30Z", "content": "Arduino's sheet gives Uno VIN as 6 to 20V, so a 2S pack can feed it directly.", "created": "2026-11-03T00:10:30Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Arduino's Uno R3 datasheet lists VIN from 6 to 20 V and USB up to 5.5 V. Some retailers say 7 to 12 V, and one says 7 to 9 V. A 2S pack runs from 8.4V down to about 5V.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The higher voltages make the regulator hot, which is why retailers quote less. Near empty, the pack falls below 6V and the board will brown out, so the safe window is shorter than the battery's.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Stay in the 7 to 12V range, which a 2S pack fits for most of its charge.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a 20V supply runs a busy Uno. It is in the table, and the regulator runs far hotter than at 8V.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is unlike the servos, PCA9685, ESP32 and Pi, which all need the pack stepped down.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Arduino's datasheet, while retailers give narrower ranges. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-is-8v4-full", "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/6", "why": "a pack that fits VIN"}, {"other": "cube/li-ion-2s-too-high-for-servos", "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/7", "why": "the Uno can take what servos cannot"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/vl53l0x-laser-is-class-1", "created_at": "2026-11-03T00:22:03Z", "content": "The VL53L0X uses an invisible laser that ST rates Class 1, eye safe in normal use.", "created": "2026-11-03T00:22:03Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ST's datasheet describes it as a 940nm VCSEL, totally invisible to the human eye, and lists it as eye safe, Class 1.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-laser-is-class-1/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That rating applies in the conditions ST specifies, and I did not read the detail. Invisible means no warning, and a cheap clone may not meet it. Other laser parts can be far more dangerous.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-laser-is-class-1/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This one is fine, and it does not make lasers in general harmless.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-laser-is-class-1/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a stronger laser module is swapped in for more range. It looks the same to the eye, which is to say it looks like nothing.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-laser-is-class-1/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the VL53L0X range cube, the only laser part in this set.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-laser-is-class-1/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From ST's datasheet.", "neighbours": [], "link_drafts": [{"other": "cube/vl53l0x-range-depends-on-target-and-light", "proposal_id": "cube/vl53l0x-laser-is-class-1/proposal/6", "why": "the same part"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/vl53l0x-range-depends-on-target-and-light", "created_at": "2026-11-03T00:02:38Z", "content": "The VL53L0X reaches 2m only on white targets in the dark.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ST's datasheet gives typical range of 200cm+ on a white target indoors, 80cm on grey, and 80cm on white in overcast daylight, 50cm on grey. Its long range mode is for dark conditions only. The field of view is 25 degrees.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-range-depends-on-target-and-light/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Those are lab conditions with the target filling the field of view, and the 2m needs long range mode. A dark object in sunlight can be well under 50cm. Rev 1 of the datasheet was read, and later revisions exist.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-range-depends-on-target-and-light/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Plan on about 50cm for a robot, and treat anything further as a bonus.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-range-depends-on-target-and-light/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a robot works in the workshop and then goes outside. The same sensor loses over half its reach, with no error to explain it.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-range-depends-on-target-and-light/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Its modes trade speed for accuracy: 20ms at +/-5% to 1.2m, or 200ms at under +/-3%.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-range-depends-on-target-and-light/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From ST's datasheet, rev 1. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/vl53l0x-laser-is-class-1", "proposal_id": "cube/vl53l0x-laser-is-class-1/proposal/6", "why": "the same part"}, {"other": "cube/no-one-distance-sensor-sees-everything", "proposal_id": "cube/vl53l0x-range-depends-on-target-and-light/proposal/6", "why": "light's blind spots"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/vl53l0x-voltage-and-address", "created_at": "2026-11-03T00:02:38Z", "content": "The VL53L0X chip runs at 2.6 to 3.5V on I2C, so it suits a 3.3V ESP32 directly.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ST's datasheet lists 2.6 to 3.5 V and I2C up to 400 kHz with address 0x52. Libraries usually show the 7-bit form 0x29. A Melopero carrier board is rated 2.6 to 5.5 V because it adds a regulator.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-voltage-and-address/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Check which you have: a bare module is not a 5V part, while a carrier board may be. The address can be changed, but it resets on power cycle, so two sensors on one bus need XSHUT to start them one at a time.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-voltage-and-address/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This is the easiest of the three distance sensors to connect to an ESP32.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-voltage-and-address/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose two sensors share a bus without XSHUT. Both answer at the same address, and readings make no sense.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-voltage-and-address/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "0x52 and 0x29 are the same address written two ways, which is a common source of confusion.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/vl53l0x-voltage-and-address/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From ST's datasheet and a carrier board listing. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/i2c-needs-pull-up-resistors", "proposal_id": "cube/vl53l0x-voltage-and-address/proposal/6", "why": "it shares the I2C bus"}, {"other": "cube/m5stick-plus2-grove-port", "proposal_id": "cube/vl53l0x-voltage-and-address/proposal/7", "why": "a likely sensor for that port"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/voltage-drop-counts-both-wires", "created_at": "2026-11-03T00:10:28Z", "content": "Voltage drop counts the wire both ways, so a 1m run is 2m of copper.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Using the AWG table, 1m out and back in 22 AWG is about 0.106 ohms, so 2.5A loses about 0.26V. In 28 AWG the same run is about 0.43 ohms and loses about 1.06V.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/voltage-drop-counts-both-wires/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That is my arithmetic from the table, and it leaves out connector resistance, which can be worse than the wire. A stall is short, though it comes at the worst moment.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/voltage-drop-counts-both-wires/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Keep servo power runs short, and use the thickest wire that fits for the shared feed.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/voltage-drop-counts-both-wires/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the wrist servo on an arm is fed through 1m of 28 AWG. At stall it loses a sixth of a 6V supply, right when it needs the most torque.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/voltage-drop-counts-both-wires/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This puts numbers on the existing thin wire cube, using the MG996R's 2.5A stall figure.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/voltage-drop-counts-both-wires/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "My arithmetic from the AWG table. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/wire-gauge-voltage-drop", "proposal_id": "cube/voltage-drop-counts-both-wires/proposal/6", "why": "worked figures for the same claim"}, {"other": "cube/mg996r-current", "proposal_id": "cube/voltage-drop-counts-both-wires/proposal/7", "why": "the 2.5A used in the sum"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/wire-current-ratings-depend-on-assumptions", "created_at": "2026-11-03T00:10:28Z", "content": "A wire's current rating varies 8 times by which table you read, so check voltage drop too.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "PowerStream gives 22 AWG 7A for chassis wiring and 0.92A for power transmission. It calls both rules of thumb, and the second very conservative. Wikipedia's table gives its figures by insulation temperature.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/wire-current-ratings-depend-on-assumptions/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Chassis figures are for a single wire in air, not a bundle. Neither table covers a warm, enclosed robot. These ratings are about heating, and voltage drop can be the limit first.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/wire-current-ratings-depend-on-assumptions/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Choose by voltage drop for low-voltage work, and use the chassis figure only as a heat limit.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/wire-current-ratings-depend-on-assumptions/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose 22 AWG carries 7A at 6V on a 1m run, which is 2m of copper out and back. The wire survives, and the far end loses about 0.74V.", "filled_by": "draft", "at": "2026-11-03T00:10:50Z", "unread": true, "pending": true, "proposal_id": "cube/wire-current-ratings-depend-on-assumptions/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "At low voltage a small loss matters, because 0.5V is a large share of a 6V servo supply.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/wire-current-ratings-depend-on-assumptions/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From PowerStream and Wikipedia. The 0.74V is my arithmetic. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/fuse-the-battery-positive-near-the-pack", "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/6", "why": "the fuse protects the wire"}, {"other": "cube/wire-gauge-voltage-drop", "proposal_id": "cube/wire-current-ratings-depend-on-assumptions/proposal/6", "why": "voltage drop can be the true limit"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/wire-gauge-voltage-drop", "created_at": "2026-11-01T16:50:48Z", "content": "Thin wire costs voltage under load.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["power", "wiring"], "group": "General engineering notes", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Voltage drop equals current times wire resistance, so long thin servo leads lose voltage when current peaks.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "On short runs or at low current the drop is too small to matter, so thin wire is often fine. Thicker wire also has a cost: it adds weight and stiffness, which hurts in a joint that has to move. And low voltage at a servo can have other causes, such as a weak supply or a poor connector.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:37:32Z"}, "OPINION": {"content": "Measure at the far joint under load, because the supply reading will not show this.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:36:18Z"}, "FICTION": {"content": "If an arm's wiring ran through every joint on thin leads, the wrist would see the least voltage.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Matters most for the far joints of an arm.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": {"validator": "james", "note": "This follows from V = I × R, which is standard electronics. I haven't measured it on my own wiring, and the size of the drop depends on the wire length and current.", "stale": false, "at": "2026-11-02T21:38:00Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:38:07Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/voltage-drop-counts-both-wires", "proposal_id": "cube/voltage-drop-counts-both-wires/proposal/6", "why": "worked figures for the same claim"}, {"other": "cube/wire-current-ratings-depend-on-assumptions", "proposal_id": "cube/wire-current-ratings-depend-on-assumptions/proposal/6", "why": "voltage drop can be the true limit"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/writes-need-token-and-unlock", "created_at": "2026-11-03T00:45:24Z", "content": "Every write needs the page token, a matching host and the unlock key.", "created": "2026-11-03T00:45:24Z", "source": "Written by Claude from this project's code, see source/project-security", "tags": ["security", "foundational"], "group": "Foundations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "kg_serve.py refuses requests naming another host or origin, requires a per-run token on every POST, and requires an unlock key on writes. Keys lapse after 30 idle minutes.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/writes-need-token-and-unlock/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That protects the page only. Anyone using this Windows account can change sc.db or run kg commands. The token sits in the page, so it protects against other sites and not against someone who can read the page.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/writes-need-token-and-unlock/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This is a good lock on one door, so keep the Windows account locked too.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/writes-need-token-and-unlock/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the PC is left unlocked. The password stops nothing, as kg commands need no password.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/writes-need-token-and-unlock/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Tests cover refused tokens, hosts, origins, lapsed keys and separate sessions per device.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/writes-need-token-and-unlock/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/the-page-is-never-public", "proposal_id": "cube/the-page-is-never-public/proposal/6", "why": "two layers on one door"}, {"other": "cube/password-hash-meets-owasp-cost", "proposal_id": "cube/writes-need-token-and-unlock/proposal/6", "why": "the unlock step"}, {"other": "cube/every-write-goes-through-substrate", "proposal_id": "cube/writes-need-token-and-unlock/proposal/7", "why": "both guard how writes happen"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/ws2812b-needs-level-shifting", "created_at": "2026-11-03T00:02:38Z", "content": "A 5V WS2812B needs 3.5V data, which a 3.3V ESP32 cannot reach.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The WS2812B datasheet gives supply of 3.5 to 5.3 V and input high of 0.7 x VDD, which is 3.5V at 5V. Adafruit says that with a 3.3V microcontroller you must use a logic level shifter.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-needs-level-shifting/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Many people report it working without one, and one reference says it often works but is out of spec. Adafruit also says a 3.3V signal is fine for pixels on about 3.7V. Many general level shifters are too slow for this timing.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-needs-level-shifting/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use a fast one-way buffer such as a 74AHCT125, and not rely on luck.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-needs-level-shifting/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a strip works on the bench, then flickers when the supply rises a little or the room warms up. Nothing has changed except the margin.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-needs-level-shifting/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Lowering the pixel supply also lowers the threshold, which is why the 3.7V case works.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-needs-level-shifting/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From the WS2812B datasheet and Adafruit, which agree. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-logic-is-3v3", "proposal_id": "cube/ws2812b-needs-level-shifting/proposal/6", "why": "3.3V logic below the threshold"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/ws2812b-power-and-protection", "created_at": "2026-11-03T00:02:38Z", "content": "WS2812B strips need a large capacitor, a data resistor, and their own power.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Adafruit recommends a 500-1000 uF capacitor at 6.3V or higher across the supply, a 300-500 ohm resistor at the pixel end of the data line, and powering pixels before the microcontroller. Circuit Rocks gives up to 60 mA per LED at full white.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-power-and-protection/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "60 mA comes from one source and is the top end, as the WS2812B sheet I read gives no such total. Adafruit's page gave no per-pixel figure. Real colours and brightness draw less.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-power-and-protection/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Budget 60 mA per LED, and cap the brightness in software.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-power-and-protection/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose 30 pixels go full white on the ESP32's regulator. That is 1.8A, far beyond what it can give, and the controller resets.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-power-and-protection/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the same lesson as servos: LEDs need their own supply, sized for peak current.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/ws2812b-power-and-protection/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Adafruit and one reference. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/servos-and-the-esp32-should-have", "proposal_id": "cube/ws2812b-power-and-protection/proposal/6", "why": "the same separate supply rule"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/xt60-is-30a-continuous", "created_at": "2026-11-03T00:10:28Z", "content": "An XT60 is rated 30A continuous, and 60A only for short bursts.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Holybro's documentation gives 30A continuous and 60A for under a minute on 12 AWG wire, and AndyMark and a blog citing AMASS sheets give the same. XT30 is 15A continuous and 30A momentary.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/xt60-is-30a-continuous/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Some retailers advertise 60A continuous, and I did not read an AMASS sheet directly. The number in the name is the burst figure, not the working one.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/xt60-is-30a-continuous/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "An XT30 is plenty for a 2S pack feeding a few servos, and is smaller.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/xt60-is-30a-continuous/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an XT90 is fitted to feel safe. It adds weight and still leaves a thin wire as the true limit.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/xt60-is-30a-continuous/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "XT connectors are polarised, which helps a battery lead. Adapters do not raise the limit of the smaller connector.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/xt60-is-30a-continuous/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Holybro and AndyMark agree, with retailers disagreeing. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/fuse-the-battery-positive-near-the-pack", "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/8", "why": "the fuse and the connector should suit the same current"}, {"other": "cube/prevent-reversed-battery", "proposal_id": "cube/prevent-reversed-battery/proposal/7", "why": "polarised plugs"}, {"other": "cube/li-ion-30q-current-rating", "proposal_id": "cube/xt60-is-30a-continuous/proposal/6", "why": "the connector can be the weak link"}], "link_reasons": {}, "contradicts": null, "overlaps": []}];

    const live = lens === "HUMAN" ? c.validation && !c.validation.stale : Boolean(face && !face.pending);
    const bit = el("i", live ? (face.unread ? "unread" : "") : "off");
    bit.style.setProperty("--c", `var(--${VAR[lens]})`);
    bit.title = lens;
    strip.append(bit);
  }
  button.append(cubeNode(c, 74), strip, el("p", "", c.content));
  const meta = el("div", "meta");
  meta.append(el("span", "pill " + c.status, LABEL[c.status]), el("span", "", Math.round(c.score * 100) + "%"));
  button.append(meta);
  button.addEventListener("click", () => open(c));
  return button;
}

function draw() {
  const root = document.getElementById("groups");
  root.replaceChildren();
  const shown = CUBES.filter(matches);
  if (!shown.length) root.append(el("p", "none", "No cubes match that."));
  const order = g => (g === "Project claims" ? "" : g);
  for (const group of [...new Set(shown.map(c => c.group))].sort((a, b) => order(a).localeCompare(order(b)))) {
    root.append(el("h2", "", group));
    const grid = el("div", "grid");
    shown.filter(c => c.group === group)
      .sort((a, b) => b.score - a.score || a.id.localeCompare(b.id))
      .forEach(c => grid.append(card(c)));
    root.append(grid);
  }
}

function open(c) {
  const body = document.getElementById("body");
  body.replaceChildren();
  const left = el("div", "left");
  const stage = cubeNode(c, 150);
  const cube = stage.querySelector(".cube");
  left.append(stage, el("div", "hint", "Drag to turn it. Pick a lens to face it."));

  let rx = -26, ry = -38, from = null;
  const pose = () => { cube.style.setProperty("--rx", rx + "deg"); cube.style.setProperty("--ry", ry + "deg"); };
  stage.addEventListener("pointerdown", e => { from = [e.clientX, e.clientY]; stage.setPointerCapture(e.pointerId); cube.style.transition = "none"; });
  stage.addEventListener("pointermove", e => {
    if (!from) return;
    ry += (e.clientX - from[0]) * .6; rx -= (e.clientY - from[1]) * .6;
    from = [e.clientX, e.clientY]; pose();
  });
  stage.addEventListener("pointerup", () => { from = null; cube.style.transition = ""; });

  const right = el("div", "right");
  right.append(el("h3", "", c.content), el("p", "id", c.id));
  const facts = [LABEL[c.status], Math.round(c.score * 100) + "% complete", "standing " + c.standing.toFixed(2)];
  if (c.source) facts.push(c.source);
  if (foundationOf(c)) facts.unshift(`Foundational ${foundationOf(c)[1].toLowerCase()}: read each face and write your own note`);
  right.append(el("p", "facts", facts.join(" · ")));

  const row = (lens, title, text, note) => {
    const b = el("button", "lens" + (text ? "" : " missing"));
    b.dataset.lens = lens;
    b.style.setProperty("--c", `var(--${VAR[lens]})`);
    const head = el("b", "", title);
    if (note) head.append(el("em", "", " · " + note));
    b.append(head, document.createTextNode(text || "Not written yet"));
    b.addEventListener("click", () => { [rx, ry] = POSE[lens]; pose(); });
    return b;
  };
  for (const lens of LENSES) {
    const f = c.faces[lens];
    right.append(row(lens, lens, f && f.content, faceNote(f)));
  }
  const v = c.validation;
  right.append(row("HUMAN", "HUMAN VALIDATION", v && (v.note || "Validated"),
    v ? (v.stale ? "stale, a face changed" : "by " + v.validator) : ""));
  if (c.attestation) {
    const a = c.attestation;
    right.append(el("p", "facts", a.retracted ? "Attestation retracted: " + a.retracted : "Attested by " + a.source + (a.note ? ". " + a.note : "")));
  }
  if (c.neighbours.length) right.append(el("p", "facts", "Neighbours: " + c.neighbours.join(", ")));
  (c.link_drafts || []).forEach(d => {
    const other = CUBES.find(x => x.id === d.other);
    const b = el("button", "lens");
    b.dataset.link = d.proposal_id;
    const tint = foundationOf(c) || (other && foundationOf(other));
    b.style.setProperty("--c", tint ? `rgb(${tint[2]})` : "var(--context)");
    const head = el("b", "", "SUGGESTED LINK");
    head.append(el("em", "", " · not accepted" + (d.why ? ", " + d.why : "")));
    b.append(head, document.createTextNode(other ? other.content : d.other));
    if (other) b.addEventListener("click", () => open(other));
    right.append(b);
  });
  if (c.contradicts) right.append(el("p", "facts", "Contradicts: " + c.contradicts));
  (c.overlaps || []).forEach(o => {
    const other = CUBES.find(x => x.id === o.other);
    const words = o.shared.slice(0, 3).map(s => `${s.lens.toLowerCase()}: ${s.term}`).join(", ");
    const b = el("button", "lens");
    b.dataset.other = o.other;
    b.style.setProperty("--c", "var(--human)");
    const head = el("b", "", `OVERLAP · λ ${o.lambda.toFixed(2)}`);
    head.append(el("em", "", ` · ${o.confirmed ? "confirmed, " : ""}${words}`));
    b.append(head, document.createTextNode(other ? other.content : o.other));
    if (other) b.addEventListener("click", () => open(other));
    right.append(b);
  });
  body.append(left, right);
  if (window.cubeEdit) cubeEdit.decorate(right, c);
  const dialog = document.getElementById("detail");
  if (!dialog.open) dialog.showModal();
}

function setup() {

  setupControls();
}
function renderStats() {

  [[CUBES.length, "cubes"], [n("attested"), "attested"], [n("validated"), "validated, not attested"],
   [CUBES.length - n("attested") - n("validated"), "need you"],
   [CUBES.reduce((t, c) => t + Object.values(c.faces).filter(f => f && f.unread && !f.pending).length, 0), "faces not read"]]
    .forEach(([value, label]) => {

}
function setupControls() {
  const legend = document.getElementById("legend");
  [...LENSES, "HUMAN"].forEach(lens => {
    const item = el("span");
    const swatch = el("i");
    swatch.style.background = `var(--${VAR[lens]})`;

    legend.append(item);

  const controls = document.getElementById("controls");
  const search = el("input");
  search.id = "search"; search.type = "search"; search.placeholder = "Search cubes"; search.setAttribute("aria-label", "Search cubes");
  search.addEventListener("input", () => { state.query = search.value.trim().toLowerCase(); draw(); });
  controls.append(search);
  const chips = [];
  FILTERS.forEach(([value, label]) => {

  });
  chips.forEach(([b, v]) => b.setAttribute("aria-pressed", v === "all"));
  window.gridFilter = value => chips.find(([, v]) => v === value)[0].click();
  const seen = t => CUBES.filter(c => c.tags.includes(t)).length;
  const tags = [...new Set(CUBES.flatMap(c => c.tags))].filter(t => seen(t) >= 3).sort();
  tags.forEach(tag => {
    const chip = el("button", "chip", "#" + tag);
    chip.setAttribute("aria-pressed", "false");
    chip.addEventListener("click", () => {
      state.tag = state.tag === tag ? null : tag;
      controls.querySelectorAll(".chip").forEach(b => { if (b.textContent[0] === "#") b.setAttribute("aria-pressed", b.textContent === "#" + state.tag); });
      draw();
    });
    controls.append(chip);
  });

  const dialog = document.getElementById("detail");
  document.getElementById("close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
  draw();
}
setup();
