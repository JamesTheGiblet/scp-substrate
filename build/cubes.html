<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Field</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1f24; --muted: #62666f; --line: #d9d7d0;
  --fact: #2f6fd0; --counter: #d0483f; --opinion: #d9920f; --fiction: #7d55c7;
  --context: #178a84; --human: #3b9a4b; --seal: #b98a12;
  --empty: rgba(40, 44, 52, .05); --empty-line: rgba(40, 44, 52, .32);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1e2128; --ink: #eceded; --muted: #a0a5af; --line: #333844;
    --fact: #5a95ee; --counter: #ee6f66; --opinion: #eeb030; --fiction: #a584ea;
    --context: #3fb8b0; --human: #5fc26f; --seal: #e6bb45;
    --empty: rgba(235, 238, 245, .05); --empty-line: rgba(235, 238, 245, .32);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input { font: inherit; color: inherit; }
main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 2px 0 20px; }
.stats { display: flex; flex-wrap: wrap; gap: 26px; margin-bottom: 20px; }
.stat b { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 4px 12px; cursor: pointer; color: var(--muted); font-size: 13px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#search {
  flex: 1 1 200px; max-width: 300px; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel);
}
h2 { font-size: 15px; margin: 30px 0 12px; color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 14px 12px; cursor: pointer; text-align: left; display: flex;
  flex-direction: column; align-items: center; gap: 12px; width: 100%;
}
.card:hover, .card:focus-visible { border-color: var(--muted); outline: none; }
.card p {
  margin: 0; font-size: 13px; line-height: 1.35; width: 100%;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 3.9em;
}
.meta { display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: var(--muted); }
.pill { font-weight: 600; }
.pill.attested { color: var(--seal); }
.pill.validated { color: var(--human); }
.pill.stale, .pill.retracted { color: var(--counter); }

.strip { display: flex; gap: 3px; width: 100%; }
.strip i { flex: 1; height: 7px; border-radius: 2px; background: var(--c); }
.strip i.off { background: none; border: 1px dashed var(--empty-line); }
.strip i.unread { opacity: .5; }
.stage { perspective: 620px; width: var(--s); height: var(--s); margin: calc(var(--s) * .14) 0; }
.cube {
  position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
  transform: rotateX(var(--rx, -26deg)) rotateY(var(--ry, -38deg));
  transition: transform .45s ease;
}
.card:hover .cube, .card:focus-visible .cube { --ry: 322deg; transition-duration: 1.6s; }
.side {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; letter-spacing: .04em; font-size: calc(var(--s) * .115);
  backface-visibility: hidden; border: 1px solid rgba(0, 0, 0, .22);
}
.side.empty { background: var(--empty); border: 1px dashed var(--empty-line); color: var(--muted); backface-visibility: visible; }
.side.unread { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 5px, transparent 5px 10px); }
.f-FACT { transform: translateZ(calc(var(--s) / 2)); }
.f-COUNTER { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.f-CONTEXT { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.f-FICTION { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.f-OPINION { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.f-HUMAN { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.fill-FACT { background-color: var(--fact); } .fill-COUNTER { background-color: var(--counter); }
.fill-OPINION { background-color: var(--opinion); } .fill-FICTION { background-color: var(--fiction); }
.fill-CONTEXT { background-color: var(--context); } .fill-HUMAN { background-color: var(--human); }
.stage.sealed { filter: drop-shadow(0 0 7px var(--seal)); }

#root { position: fixed; inset: 0; background: #06070d; color: #e6eaf3; overflow: hidden; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#bar { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
#bar > * { pointer-events: auto; }
#crumbs { display: flex; align-items: center; gap: 4px; margin-right: auto; }
#crumbs button { border: 0; background: none; color: #e6eaf3; cursor: pointer; padding: 3px 4px; font-weight: 600; }
#crumbs button:disabled { cursor: default; color: #9fb4d8; font-weight: 400; }
#crumbs .sep { color: #6d7a93; }
#root .chip { background: rgba(14, 18, 30, .7); border-color: #333c52; color: #c3cbdb; }
#root .chip[aria-pressed="true"] { background: #e6eaf3; color: #0a0d15; border-color: #e6eaf3; }
#fsearch { width: 170px; padding: 4px 12px; border-radius: 999px; border: 1px solid #333c52; background: rgba(14, 18, 30, .7); color: #e6eaf3; }
#modes { position: absolute; top: 56px; left: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: #93a0b8; max-width: calc(100vw - 32px); }
#modes .chip { font-size: 12px; padding: 2px 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: -3px 0 10px 15px; align-items: center; }
.tool { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 12px; }
.tool:hover { border-color: var(--muted); }
.tools textarea, .tools input { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 14px; }
.tools .warn { color: var(--muted); font-size: 12px; }
#toast { position: fixed; z-index: 5; left: 50%; bottom: 76px; transform: translateX(-50%); background: rgba(8, 11, 19, .94); color: #e6eaf3; border: 1px solid #333c52; border-radius: 8px; padding: 7px 14px; font-size: 14px; }
#toast[hidden], #addcube[hidden], #fillblanks[hidden], #checkdrafts[hidden], #lock[hidden], #unlockwrong[hidden] { display: none; }
#newcube, #unlock { --ink: #e6eaf3; --line: #333c52; --muted: #9fb4d8; background: #10131d; color: #e6eaf3; border-color: #2c3448; width: min(560px, calc(100vw - 32px)); padding: 20px; }
#unlock { width: min(360px, calc(100vw - 32px)); }
#unlockwrong { color: #f0b23a; font-size: 13px; margin: 0; }
#newcube h3, #unlock h3 { margin: 0 0 12px; font-size: 18px; }
#newcube label, #unlock label { display: block; font-size: 12px; color: #98a5bd; margin-bottom: 9px; }
#newcube textarea, #newcube input, #unlock input { display: block; width: 100%; margin-top: 3px; background: #0b0e17; color: #e6eaf3; border: 1px solid #333c52; border-radius: 6px; padding: 6px 8px; font-size: 14px; }
#newcube .actions, #unlock .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#timebar { position: absolute; left: 16px; right: 16px; bottom: 36px; display: flex; gap: 10px; align-items: center; max-width: 760px; font-size: 13px; color: #c3cbdb; }
#timerange { flex: 1; min-width: 0; accent-color: #f2be46; }
#timelabel { white-space: nowrap; font-variant-numeric: tabular-nums; }
#key { position: absolute; left: 16px; right: 16px; bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: #93a0b8; pointer-events: none; }
#key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 5px 0 12px; }
#key i:first-child { margin-left: 0; }
#tip { position: fixed; max-width: 270px; background: rgba(8, 11, 19, .92); border: 1px solid #333c52; border-radius: 6px; padding: 5px 9px; font-size: 13px; pointer-events: none; }
#panel {
  position: absolute; top: 56px; right: 16px; bottom: 16px; width: min(390px, calc(100vw - 32px));
  background: rgba(10, 13, 22, .86); border: 1px solid #2c3448; border-radius: 12px;
  padding: 18px 16px; overflow-y: auto; backdrop-filter: blur(8px);
}
#panel[hidden], #tip[hidden] { display: none; }
#panel h3 { margin: 0 30px 3px 0; font-size: 18px; line-height: 1.3; }
#panel .id, #panel .facts { color: #98a5bd; }
#panel .lens { color: #e6eaf3; font-size: 14px; }
#panel .lens:hover { background: rgba(255, 255, 255, .05); }
#panel .lens.missing { color: #8d99b0; }
#panel .lens b em { color: #98a5bd; }
.shut { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: #98a5bd; font-size: 22px; cursor: pointer; }
.hop { display: block; width: 100%; text-align: left; border: 1px solid #2c3448; background: none; color: #c9d5ea; border-radius: 6px; padding: 5px 9px; margin-bottom: 5px; cursor: pointer; font-size: 13px; }
.hop:hover { border-color: #6d7a93; }
@media (max-width: 640px) { #panel { top: auto; height: 52vh; } #key { display: none; } #fsearch { width: 120px; } #modes { top: 104px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } #modes span { display: none; } #modes .chip { flex: none; } #timebar { bottom: 12px; } }
dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
  width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
}
dialog::backdrop { background: rgba(10, 12, 16, .6); }
.detail { display: grid; grid-template-columns: 250px 1fr; gap: 8px 24px; padding: 24px; }
.left { display: flex; flex-direction: column; align-items: center; }
.left .stage { touch-action: none; cursor: grab; margin: 40px 0 44px; }
.hint { font-size: 12px; color: var(--muted); text-align: center; }
.right h3 { margin: 0 34px 4px 0; font-size: 19px; line-height: 1.3; }
.id { font-size: 12px; color: var(--muted); word-break: break-all; margin: 0 0 10px; }
.facts { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.lens {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  border-left: 4px solid var(--c); padding: 7px 11px; margin-bottom: 7px; cursor: pointer;
}
.lens:hover { background: var(--empty); }
.lens b { display: block; font-size: 12px; letter-spacing: .04em; }
.lens b em { font-style: normal; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.lens.missing { color: var(--muted); font-style: italic; }
#close {
  position: absolute; top: 12px; right: 12px; border: 0; background: none; cursor: pointer;
  font-size: 22px; line-height: 1; color: var(--muted); padding: 4px 8px;
}
.none { color: var(--muted); padding: 28px 0; }
@media (max-width: 640px) {
  main { padding: 20px 16px 48px; }
  .detail { grid-template-columns: 1fr; padding: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .cube { transition: none; }
  .card:hover .cube, .card:focus-visible .cube { --ry: -38deg; }
}

</style>
</head>
<body>
<div id="root">
  <canvas id="field" aria-label="Your cubes as a 3D field. The grid view lists the same cubes."></canvas>
  <div id="bar">
    <nav id="crumbs" aria-label="Where you are"></nav>
    <input id="fsearch" type="search" placeholder="Search" aria-label="Search cubes">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="attested" aria-pressed="false">Attested</button>
    <button class="chip" data-f="needs" aria-pressed="false">Needs you</button>
    <button class="chip" id="checkdrafts" hidden></button>
    <button class="chip" id="snap">Screenshot</button>
    <button class="chip" id="togrid">Grid</button>
  </div>
  <div id="modes" aria-label="Cluster by"></div>
  <div id="timebar">
    <button class="chip" id="timeplay">Play</button>
    <input id="timerange" type="range" min="0" max="0" value="0" aria-label="Go through time">
    <span id="timelabel" role="status"></span>
  </div>
  <div id="key"></div>
  <div id="tip" hidden></div>
  <aside id="panel" hidden></aside>
</div>
<div id="toast" role="status" hidden></div>
<dialog id="unlock">
  <form>
    <h3>Unlock editing</h3>
    <label>Password<input type="password" autocomplete="current-password" required></label>
    <p id="unlockwrong" hidden>That password is wrong.</p>
    <div class="actions"><button type="button" class="tool" id="unlockcancel">Cancel</button><button type="submit" class="tool">Unlock</button></div>
  </form>
</dialog>
<dialog id="newcube">
  <form>
    <h3>New cube</h3>
    <label>The claim<textarea name="content" rows="2" required></textarea></label>
    <label>Tags, separated by commas<input name="tags"></label>
    <label>Fact<textarea name="FACT" rows="2"></textarea></label>
    <label>Counter<textarea name="COUNTER" rows="2"></textarea></label>
    <label>Opinion<textarea name="OPINION" rows="2"></textarea></label>
    <label>Fiction<textarea name="FICTION" rows="2"></textarea></label>
    <label>Context<textarea name="CONTEXT" rows="2"></textarea></label>
    <div class="actions"><button type="button" class="tool" id="newcancel">Cancel</button><button type="submit" class="tool">Send it in</button></div>
  </form>
</dialog>
<main id="grid" hidden>
  <p><button class="chip" id="tofield">Back to the field</button> <button class="chip" id="lock" hidden>Unlock to edit</button> <button class="chip" id="addcube" hidden>+ New cube</button> <button class="chip" id="fillblanks" hidden>Fill blanks</button></p>
  <h1>Data Cubes</h1>
  <p class="sub">Each side is a lens. Solid means filled, hollow means missing, and striped means accepted without being read. The bar shows all six sides at once.</p>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="controls" id="controls"></div>
  <div id="groups"></div>
</main>
<dialog id="detail"><button id="close" aria-label="Close">&times;</button><div class="detail" id="body"></div></dialog>

<script>
// The grid view, and the data every view shares.
const CUBES = [{"id": "cube/agent-proposes-humans-decide", "created_at": "2026-11-01T15:36:10Z", "content": "The agent proposes; humans decide.", "created": "2026-11-01T15:36:10Z", "source": "kg_agent.py proposal mechanism", "tags": ["gate", "process"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Rules create proposals, and nothing changes a cube until a human accepts. Rejections stick unless the content or rationale changes.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:48:21Z"}, "COUNTER": {"content": "It costs attention. These 21 cubes alone create 84 proposals, and fatigue can turn accept into a rubber stamp.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:48:36Z"}, "OPINION": {"content": "true", "filled_by": "claude, from james's validation note", "unread": false, "at": "2026-11-01T15:58:07Z"}, "FICTION": {"content": "If proposals applied themselves, cubes would fill fast and mean little.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:48:46Z"}, "CONTEXT": {"content": "kg cube fill is still open to a human directly, and that path skips proposals.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:48:56Z"}}, "validation": {"validator": "james", "note": "true", "stale": false, "at": "2026-11-01T16:02:38Z"}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('finish', 2026-11-01), resting on his earlier 'true' note and attestation of this claim.", "retracted": null, "at": "2026-11-01T16:02:38Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/binary-database-in-git", "created_at": "2026-11-01T16:50:49Z", "content": "A database tracked in git has history but no readable diffs.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["database", "storage", "ledger"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "git stores each version of sc.db as a whole binary change, so a diff shows only that it changed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Merging two versions is not possible, and the history grows with every commit.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Acceptable for one person. I lose readable diffs, but I get a simple recovery path.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/binary-database-in-git/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If capsules were exported as text, git could show what changed in each commit.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "sc.db is tracked today and acts as the recovery path.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I accept that the database has a history, but I acknowledge that readable diffs are not available due to the nature of git's binary change storage. I understand that this limits the ability to merge changes and view individual changes made in each commit.", "neighbours": [], "contradicts": null, "overlaps": [{"lambda": 0.72, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "recovery"}], "other": "cube/events-are-audit-not-replay"}]}, {"id": "cube/british-english-everywhere", "created_at": "2026-11-01T15:36:10Z", "content": "British English everywhere, identifiers included.", "created": "2026-11-01T15:36:10Z", "source": "principle/british-english-everywhere", "tags": ["principle", "code"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as a principle. Code uses canonicalise and neighbour, and a grep at 2026-11-01 for common American spellings in code found none.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:07Z"}, "COUNTER": {"content": "Third-party names stay American, such as sqlite3.Row and the ast module, so identifiers can never be fully consistent.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:17Z"}, "OPINION": {"content": "exactly", "filled_by": "human", "unread": false, "at": "2026-11-01T15:52:15Z"}, "FICTION": {"content": "With American spelling, a search for neighbour would miss half the code.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:22Z"}, "CONTEXT": {"content": "One spelling keeps grep and capsule IDs predictable.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:26Z"}}, "validation": {"validator": "james", "note": "im english", "stale": false, "at": "2026-11-01T15:52:23Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T15:52:29Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/bulk-and-decoupling-capacitors", "created_at": "2026-11-01T16:50:48Z", "content": "Bulk capacitors absorb current spikes; small ones filter noise.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["power", "electronics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A large electrolytic near the load supplies sudden current, while a small ceramic near a chip filters fast noise.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "A capacitor smooths short spikes only. It cannot fix an undersized supply, and too large a capacitor raises inrush current.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Cheap insurance on a servo board, but I fix the supply first.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/bulk-and-decoupling-capacitors/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With no capacitors, each servo start would show up as a voltage dip across the whole board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Extends the PCA9685 capacitor cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "This claim is based on general knowledge rather than my own testing, as large electrolytics supply sudden current while small ceramics filter fast noise. However, capacitors only smooth short spikes without fixing an undersized power supply, and overly large ones increase inrush current.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/calibration-needs-ground-truth", "created_at": "2026-11-01T16:50:49Z", "content": "A trust score means little until it is checked against outcomes.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["trust"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Calibration asks whether things scored 0.7 turn out true about 70 percent of the time.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "That needs recorded outcomes, which the substrate does not yet collect, so current scores cannot be called calibrated.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Until I log outcomes, trust scores are a ranking aid at best, not probabilities.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/calibration-needs-ground-truth/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If outcomes were logged, the sigmoid could be fitted rather than assumed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "This is the open adaptive-fusion question.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the trust score is a useful ranking aid, as it suggests that 70% of outcomes with a score of 0.7 are likely to be true. However, without recorded outcomes, the score cannot be considered calibrated, and its accuracy is limited.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/canonical-json-must-match-exactly", "created_at": "2026-11-01T16:50:49Z", "content": "Signing JSON needs one exact byte form.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["crypto", "provenance"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A signature covers bytes, so verifier and signer must produce the same canonical form.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "The local convention is not RFC 8785, so another tool would need the same rules or verification fails.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "A local convention is fine while I am the only verifier. Sharing documents would mean moving to a standard.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/canonical-json-must-match-exactly/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If key order varied, an unchanged document could fail verification.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Backed by signing.canonicalise.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because a signature covers bytes, and verifier and signer must produce the same canonical form. However, I acknowledge that the local convention may not align with RFC 8785, which could lead to verification failures if shared documents are used.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/common-ground-between-supplies", "created_at": "2026-11-01T16:50:48Z", "content": "Separate supplies must share a common ground.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["power", "wiring"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A PWM or I2C signal is measured against ground, so controller and servo supplies need their grounds joined.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Heavy return current through a thin shared ground wire can inject noise, so route the servo return separately from the logic ground.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "The first thing to check when servos twitch for no clear reason.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/common-ground-between-supplies/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without a shared ground, the signal voltage would have no reference and servos would twitch at random.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Applies when the controller and servos use separate supplies, as the PCA9685 guide advises.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because PWM and I2C signals are typically referenced to ground, which is a standard practice in electronics. However, I am not aware of any evidence that a shared ground is necessary for servos to function correctly, and I would need to see more information to confirm this.", "neighbours": [], "contradicts": null, "overlaps": [{"lambda": 0.64, "confirmed": false, "shared": [{"lens": "COUNTER", "term": "ground"}, {"lens": "CONTEXT", "term": "controller"}], "other": "cube/servos-and-the-esp32-should-have"}]}, {"id": "cube/completeness-gates-attestation", "created_at": "2026-11-01T15:36:10Z", "content": "Completeness gates attestation; trust does not run in parallel.", "created": "2026-11-01T15:36:10Z", "source": "default-cube weighting rule", "tags": ["gate", "trust"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "kg cube attest refuses a cube that is not at 100 percent, and changing a face retracts the attestation.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:34Z"}, "COUNTER": {"content": "A thin face counts the same as a strong one. Weights and minimum_lenses now come from default-cube, but its unknown_required and forward_only_lens_changes rules are still ignored.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:35Z"}, "OPINION": {"content": "correct", "filled_by": "human", "unread": false, "at": "2026-11-01T15:52:38Z"}, "FICTION": {"content": "If attestation ignored completeness, a one-lens cube could carry the same trust as a fully examined one.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:35Z"}, "CONTEXT": {"content": "Five lenses at 16 percent plus human validation at 20 percent. Attestation reaches trust as an observation.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:35Z"}}, "validation": {"validator": "james", "note": "correct", "stale": false, "at": "2026-11-01T15:52:46Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T15:52:48Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/compress-in-uncertain-channels", "created_at": "2026-11-01T15:36:10Z", "content": "Default to compression in uncertain channels.", "created": "2026-11-01T15:36:10Z", "source": "minimum-viable-packet principle", "tags": ["principle", "communication"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as the minimum-viable-packet principle.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:55Z"}, "COUNTER": {"content": "Compression can lose what matters. If the channel was in fact safe, a short packet undersells the idea.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:55Z"}, "OPINION": {"content": "Useful as a default with people I do not know yet. I can always say more once the channel proves safe.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T07:17:45Z"}, "FICTION": {"content": "Sending the full packet every time would mean more misunderstandings in low-bandwidth channels.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:55Z"}, "CONTEXT": {"content": "Linked in spirit to the bandwidth-mismatch and dual-mode-interface concepts.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:55Z"}}, "validation": {"validator": "james", "note": "confirmed", "stale": false, "at": "2026-11-02T07:18:26Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T07:18:29Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/contract-as-data-enforcement-as-code", "created_at": "2026-11-01T15:36:10Z", "content": "The contract is data; enforcement is code.", "created": "2026-11-01T15:36:10Z", "source": "keystone-gate/README.md design decisions; SPEC section 15", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "sc capsules list the rules and kg_gate.py holds the checkers. A rule with no checker fails closed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}, "COUNTER": {"content": "So a contract edit alone adds nothing, and a new rule always needs code. The data is a list of names, not a language.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:51:02Z"}, "OPINION": {"content": "Right trade for now. A list of rule names is easy to read, and a new check should be real code.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:12:53Z"}, "FICTION": {"content": "With rules written in the capsule itself, the gate would need an interpreter for them.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:51:02Z"}, "CONTEXT": {"content": "Until 2026-11-01 must_not rules were listed but never checked, which shows the two halves can drift.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:51:02Z"}}, "validation": {"validator": "james", "note": "part of the forge stack", "stale": false, "at": "2026-11-02T21:13:32Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:13:37Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/copying-a-live-sqlite-file-is-risky", "created_at": "2026-11-01T16:50:49Z", "content": "Do not copy a live SQLite file; use the backup API.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["database", "storage"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A plain file copy can miss recent data held in the WAL file. The backup API takes a consistent snapshot.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Most copies seem to work, which hides the risk until one is restored.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Easy to get right once and worth doing properly, because a bad backup is found too late.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/copying-a-live-sqlite-file-is-risky/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A backup taken mid-write might open fine and silently lack the last changes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "The Keystone Gate tests use the backup API for this reason.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "This claim is based on general knowledge rather than my own testing, but using the backup API ensures a consistent snapshot whereas a plain copy can miss recent data held in the WAL file. The main limitation is that plain file copies often appear to work, which hides the risk of silent data loss until a restore is attempted.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/ed25519-signatures-are-deterministic", "created_at": "2026-11-01T16:50:49Z", "content": "Ed25519 signatures need no random number at signing time.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["crypto", "provenance"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "RFC 8032 derives the nonce from the key and message, so one message and key give one signature.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Determinism avoids bad-randomness failures, but it does nothing about timing leaks in a pure-Python implementation.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "One less thing to get wrong, though it does not fix the timing weakness.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/ed25519-signatures-are-deterministic/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With a random nonce, one weak random source could reveal the private key.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Pairs with the own-ed25519 cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe Ed25519 signatures do not require a random number at signing time, as the nonce is derived from the key and message, as stated in RFC 8032. However, I am aware that this approach does not address potential timing weaknesses in pure-Python implementations.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/emergency-stop-cuts-power", "created_at": "2026-11-01T16:50:49Z", "content": "An emergency stop should cut actuator power in hardware.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "safety"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A stop switch in the servo supply works even if the software has crashed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Removing power can drop a loaded arm, since hobby servos do not hold without power. Test what your arm does before relying on it.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Needed on any arm big enough to hurt something, but I must test what it does when power goes.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/emergency-stop-cuts-power/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A stop that depended on software would fail in exactly the situations it exists for.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Compare with the PCA9685 OE pin cube, which cuts signal instead of power.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "This is based on general knowledge that a hardware switch in the servo supply stops actuators even during a software crash. However, cutting power can cause a loaded arm to drop because hobby servos do not hold without power, and I have not tested this myself.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/esp32-brownout-resets", "created_at": "2026-11-01T16:50:49Z", "content": "An ESP32 resets itself when its supply sags.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["esp32", "power"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A brownout detector restarts the chip if voltage drops too far, and Wi-Fi transmit bursts add current peaks.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Disabling the detector hides the supply problem instead of fixing it, and leaves the chip running out of specification.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "If this shows up, the supply is the real fault. I will not disable the detector.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-brownout-resets/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If servos shared the ESP32's regulator, each big move could restart the controller.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Same failure as the PCA9685 warning on powering servos from the controller.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the ESP32 resets itself when its supply sags because the brownout detector restarts the chip if voltage drops too far, and Wi-Fi transmit bursts add current peaks. However, disabling the detector may only hide the supply problem rather than fix it, potentially leaving the chip running out of specification.", "neighbours": [], "contradicts": null, "overlaps": [{"lambda": 1.22, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "warning"}, {"lens": "FICTION", "term": "big"}, {"lens": "FACT", "term": "peaks"}], "other": "cube/servos-and-the-esp32-should-have"}]}, {"id": "cube/esp32-i2c-pins-are-configurable", "created_at": "2026-11-01T16:50:49Z", "content": "ESP32 can route I2C to most GPIO pins.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["esp32", "i2c"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The peripheral is routed through a pin matrix. Arduino on the classic ESP32 defaults to GPIO 21 for SDA and 22 for SCL.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Defaults differ across ESP32 variants, and some pins have boot-time roles. Check your exact board's pinout.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Handy, but I should stick to the defaults unless there is a reason, and write down any change.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-i2c-pins-are-configurable/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If pins were fixed, this choice would be made by the board and not by you.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Fills the ESP32 gap noted in the PCA9685 wiring cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the ESP32 can route I2C to most GPIO pins because the peripheral is routed through a pin matrix. However, I should be aware that defaults differ across ESP32 variants and some pins have boot-time roles, james", "note": "use a buck converter", "stale": false, "at": "2026-11-01T20:57:19Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T20:57:20Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/event-sourcing-needs-full-payloads", "created_at": "2026-11-01T16:50:49Z", "content": "Rebuilding state from a log needs the full state in the log.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["ledger", "substrate"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Event sourcing replays stored changes, so each event must carry what changed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Payloads grow fast, and old events must stay readable as the format changes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Not worth the storage yet. Audit is what I actually use the log for.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/event-sourcing-needs-full-payloads/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With complete events, a lost sc.db could be rebuilt from the log alone.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Contrasts with the audit-only events cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "Based on general knowledge rather than my own testing, this holds because _agent.py and the importers that day.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}}, "validation": {"validator": "james", "note": "According to the provided documentation, the claim holds because capsule writes use Substrate and direct engine writes log events within their own transactions, though I have not tested this code myself. However, the log is not a uniform row-by-row record as some engines only write summary events or log when specific values change.", "stale": false, "at": "2026-11-02T21:57:05Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:57:07Z"}, "note_draft": "According to the provided documentation, the claim holds because capsule writes use Substrate and direct engine writes log events within their own transactions, though I have not tested this code myself. However, the log is not a uniform row-by-row record as some engines only write summary events or log when specific values change.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/everything-is-capsules", "created_at": "2026-11-01T15:36:10Z", "content": "Everything can be represented as capsules.", "created": "2026-11-01T15:36:10Z", "source": "everything-is-capsules claim", "tags": ["substrate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as a claim. Foundations, rules, grammar, intents, contracts and cubes are all capsules, and the claim is the about target of scp-claim.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "SPEC section 1 names four primitives. Links and events are not capsules, and trust_scores is a separate table.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "It has held up as a way to store things. Links and events show it is a strong habit, not a literal law.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:57:15Z"}, "FICTION": {"content": "If links were capsules too, every traversal would cost more and the schema would be a single table.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "The founding idea of the substrate. Backed by obs-001, a score of 1.8 from james.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe the claim that everything can be represented as capsules holds because the foundations, rules, grammar, intents, contracts, and cubes are all encapsulated in this concept. However, I acknowledge that links and events are not considered capsules, and the schema would be overly complex if they were, as it would require a single table for every traversal. I have not tested this claim myself, but it is backed by obs-001 and has been observed to be a strong habit in storing information.", "stale": false, "at": "2026-11-02T21:57:20Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:57:27Z"}, "note_draft": "I believe the claim that everything can be represented as capsules holds because the foundations, rules, grammar, intents, contracts, and cubes are all encapsulated in this concept. However, I acknowledge that links and events are not considered capsules, and the schema would be overly complex if they were, as it would require a single table for every traversal. I have not tested this claim myself, but it is backed by obs-001 and has been observed to be a strong habit in storing information.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/gate-checks-structure-not-reasoning", "created_at": "2026-11-01T15:36:10Z", "content": "The gate judges references, not reasoning.", "created": "2026-11-01T15:36:10Z", "source": "keystone-gate/README.md design decisions", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The checkers test IDs, names, numbers, quotes and provenance. Whether the reasoning is right is left to the human.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "A lowercase invented word can pass, and a true-looking answer can be wrong. Passing the gate can read as more assurance than it gives.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "This is the right limit. A pass means the references are real, and I still have to read the answer.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:00:36Z"}, "FICTION": {"content": "An automatic judge of reasoning would be a harder problem than the one the gate solves, and would itself need gating.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "The human validation face, worth 20 percent, is where reasoning gets judged.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I note from the design documentation that the gate only checks details such as IDs, quotes and provenance, leaving the reasoning to human review. However, passing the gate can give a false sense of assurance, as flawed reasoning or invented words can still pass.", "stale": false, "at": "2026-11-02T22:00:41Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:00:46Z"}, "note_draft": "I note from the design documentation that the gate only checks details such as IDs, quotes and provenance, leaving the reasoning to human review. However, passing the gate can give a false sense of assurance, as flawed reasoning or invented words can still pass.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/gear-backlash-limits-precision", "created_at": "2026-11-01T16:50:49Z", "content": "Backlash limits how repeatable a joint can be.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Play in the gears means a joint settles differently when approached from opposite directions.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Commanded angle is not achieved angle. Hobby servos report no position, so software cannot see the error.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "I should design for this from the start instead of expecting software to hide it.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/gear-backlash-limits-precision/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With zero backlash, calibration values would hold in both directions.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Stacks along the arm, so errors add up at the tip.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the play in the gears can cause a joint to settle differently when approached from opposite directions, leading to reduced repeatability. However, the main limit of this claim is that it relies on the assumption that backlash is entirely eliminated, which may not be possible in practice, and therefore calibration values may not hold in both directions.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/i2c-bus-length-limits", "created_at": "2026-11-01T16:50:49Z", "content": "I2C is designed for short connections on one board or nearby.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["i2c", "wiring"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Bus capacitance limits rise time, and the standard allows 400 pF. Long wires reach that quickly.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Long runs through a moving arm may work on the bench and then fail in use, especially near noisy servo wiring.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Keep the controller close to the servo board and run power and signal apart.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/i2c-bus-length-limits/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If I2C ran down a two metre arm unbuffered, errors would appear only when the servos moved.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "A bus extender, or a controller near the board, is the usual answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I agree with the claim that I2C is designed for short connections on one board or nearby, as the standard allows for a bus capacitance of 400 pF, which can lead to rise time limitations with long wires. However, I believe that this limitation can be mitigated with the use of a bus extender or a controller near the board, rather than relying on physical proximity.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/i2c-needs-pull-up-resistors", "created_at": "2026-11-01T16:50:49Z", "content": "I2C lines are open-drain and need pull-up resistors.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["i2c", "electronics"], "group": "General engineering notes", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Devices only pull SDA and SCL low, so resistors must pull them high. Many breakouts include them.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Several boards on one bus put their pull-ups in parallel, and the combined resistance can become too strong. Check the total when chaining boards.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Normally handled by the breakout. Worth checking the total when chaining boards.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-01T20:55:59Z"}, "FICTION": {"content": "Without pull-ups, the bus would sit low and no device would answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Relevant to chaining PCA9685 boards.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": {"validator": "james", "note": "dont forget the local grounding", "stale": false, "at": "2026-11-01T20:56:39Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T20:56:40Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/idempotent-imports-make-re-runs-safe", "created_at": "2026-11-01T16:50:49Z", "content": "Re-running an import should change nothing.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["substrate", "ingestion"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "An idempotent step can be repeated after a failure without creating duplicates.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "It proves only that nothing new was written, not that the first run was right.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Essential for anything I run by hand, because I will run it twice.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/idempotent-imports-make-re-runs-safe/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without it, every retried import would add duplicate capsules.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "absorb_repo and the seed scripts follow this.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "Based on general knowledge, an idempotent import step can be repeated without creating duplicates, which is essential for anything I run manually. However, I have not tested this myself, and re-running it only proves that nothing new was written rather than confirming the first run was correct.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/inverse-kinematics-maps-position-to-angles", "created_at": "2026-11-01T16:50:49Z", "content": "Inverse kinematics turns a target position into joint angles.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "software"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Given a target for the tip, inverse kinematics computes the angles that reach it.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Results are only as good as the measured link lengths, and many positions have several solutions or none.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Worth doing once the joints are calibrated. Before that it gives precise-looking wrong answers.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/inverse-kinematics-maps-position-to-angles/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without it, every move would be taught by hand, joint by joint.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Backlash and calibration errors limit how exact the result can be.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "This relies on general knowledge rather than my own testing, as inverse kinematics computes the joint angles required to reach a target tip position. However, its accuracy is limited by backlash, link length errors, and calibration, with some positions having multiple solutions or none.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/it-is-intended-for-research-simulation", "created_at": "2026-11-02T06:36:34Z", "content": "It is intended for research, simulation, behavioural modelling, and experimenting with sovereign AI stacks.", "created": "2026-11-02T06:36:34Z", "source": "Worded by gemini from the keystone_gate README", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 0.8, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The keystone_gate README states that Keystone Gate is intended for research, simulation, behavioural modelling, and experimenting with sovereign AI stacks.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:14:26Z"}, "COUNTER": {"content": "A stated scope declares intent, but it doesn’t restrict use. Unless the licence says otherwise, nothing stops someone deploying it beyond that scope. The list also reads broader than what Keystone Gate actually does. “Simulation” and “behavioural modelling” describe its sibling app Replicant more than a gated, human-verified knowledge system, so the scope may have bled across from shared README wording.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:14:39Z"}, "OPINION": {"content": "Scoping Keystone Gate to research and experimentation is sensible. It sets honest expectations for a system still being built, and it keeps the focus on whether the approach works rather than on production guarantees.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:14:51Z"}, "FICTION": {"content": "Suppose a researcher uses Keystone Gate to sort claims for a paper and cites cubes as settled. Several of those cubes are still at 0.50 standing with unaccepted AI drafts. The system worked as designed, because unvalidated cubes are only working material. But the researcher treated “in the gate” as “verified”, which is the exact mistake the human-validation face exists to prevent.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:15:05Z"}, "CONTEXT": {"content": "Keystone Gate is a sibling app to Replicant, built on the shared Forge tools in the-forge repo. In it, an LLM handles language only and never decides what’s true. Rule-based tagging and cubes do the work: each cube fills five lens faces plus a final human-validation face, and only complete cubes become eligible for trust attestation. James Gilbert is the author, and the scope statement is his.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:15:18Z"}}, "validation": null, "attestation": null, "note_draft": "According to the project's README file, this claim accurately reflects the stated scope of the software. However, documented intent does not guarantee actual functionality or prevent misuse, and I have not tested the software myself.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/james-builds-for-choice-not-money", "created_at": "2026-11-02T23:11:39Z", "content": "James builds because he chooses to, not for money.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "James says money is something humanity decided mattered, and that he builds because he chooses to live.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Giblets Forge is a trading name, so money is in the picture somewhere, even if it isn't the point.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "It explains the shape of the work: sovereign, open, and built to be owned rather than sold.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a buyer offers to fund the Forge Stack on the condition that it closes. The answer shows whether this cube holds.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "It fits the motto: \"Now forge yours.\"", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/james-carpenter-by-trade", "created_at": "2026-11-02T23:11:39Z", "content": "James is a carpenter by trade.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He trained on chisels and hammers, and was self-employed with routers and jigs three years later.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Jigs speed up cuts, but they also constrain them. A tool that makes things fast can make the wrong thing fast.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The router-and-jig analogy is the clearest way he explains what AI does for him: it amplifies skill without replacing judgement.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose he'd stayed with chisels only. The ideas would exist, but most would still be parked.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "The habit of building fixtures carried over: capsules, gates and guards are jigs for code.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/james-not-one-title", "created_at": "2026-11-02T23:11:39Z", "content": "James won't be boxed in by a title.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He codes, 3D-models, draws, paints, and builds robots, 3D printers and systems.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Breadth has a cost, and many projects sit at idea stage. Range and finishing pull against each other.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The Forge Stack is what makes the breadth coherent, since one substrate sits under many projects.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose he picked one title for a year. Whether that would help or hurt is an open question.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "He's self-taught, and his brand is Giblets Forge.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/james-parks-ideas", "created_at": "2026-11-02T23:11:39Z", "content": "James parks ideas until they fit.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He documents ideas fully, then shelves them, sometimes for years.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Parked specs go stale, because the tools and assumptions they relied on move on.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Parking only works if each parked spec says what it's waiting for.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an old spec is revived and built exactly as written, against a world that has moved on.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Canon's FACT and COUNTER faces suit reviving an old idea: check what's still true.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/james-qinetiq-malvern", "created_at": "2026-11-02T23:11:40Z", "content": "James moved from facilities at OPG to QinetiQ Malvern.", "created": "2026-11-02T23:11:40Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He started at QinetiQ in September 2026, in a role that includes cutting keys, which he likes. He's relocating to the Malvern area.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-qinetiq-malvern/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "One profile line still says he works at Oxford PharmaGenesis. Only the latest one is true.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-qinetiq-malvern/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The key-cutting work has already produced a project idea, the key blank cross-reference tool.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-qinetiq-malvern/proposal/3", "drafted_by": "claude"}, "FICTION": null, "CONTEXT": {"content": "He previously wrote a tribal-knowledge handover for OPG facilities before leaving.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-qinetiq-malvern/proposal/4", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/jig-can-be-used-to-build", "created_at": "2026-11-02T06:42:29Z", "content": "JIG can be used to build a wide range of applications, including habit trackers, home-automation logic, game rules, and compliance checklists.", "created": "2026-11-02T06:42:29Z", "source": "Worded by ollama from the JIG README", "tags": ["repo", "jig", "private"], "group": "JIG", "repo": "JIG", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"What you can build Anything you can express as facts and rules over them: habit trackers, home-automation logic, game rules (including mystery games with a provably solvable truth capsule), compliance checklists and strategy audits. Some things need features planned for later phases:\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:44Z"}, "COUNTER": {"content": "While JIG can be used to build certain types of applications, its limitations in handling complex logic and conditional statements may make it less suitable for applications requiring intricate rules or conditional decision-making.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:46Z"}, "OPINION": {"content": "It's reasonable to assume that JIG can be used to build a wide range of applications, given its flexibility and customizability, but further testing and validation would be necessary to confirm its suitability for all types of applications.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:50Z"}, "FICTION": {"content": "What if JIG were to be used to build a highly complex application, such as a sophisticated AI system, and its limitations were to be exposed in a critical way?", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:52Z"}, "CONTEXT": {"content": "JIG's ability to build a wide range of applications is likely influenced by its origins as a simple, open-source tool for automating tasks, and its community-driven development process, which may have prioritized ease of use and flexibility over robustness and scalability.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:54Z"}}, "validation": {"validator": "james", "note": "I believe JIG can be used to build a wide range of applications, including habit trackers, home-automation logic, game rules, and compliance checklists, due to its flexibility and customizability. However, its limitations in handling complex logic and conditional statements may make it less suitable for applications requiring intricate rules or conditional decision-making.", "stal
