 planned for later phases:\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:44Z"}, "COUNTER": {"content": "While JIG can be used to build certain types of applications, its limitations in handling complex logic and conditional statements may make it less suitable for applications requiring intricate rules or conditional decision-making.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:46Z"}, "OPINION": {"content": "It's reasonable to assume that JIG can be used to build a wide range of applications, given its flexibility and customizability, but further testing and validation would be necessary to confirm its suitability for all types of applications.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:50Z"}, "FICTION": {"content": "What if JIG were to be used to build a highly complex application, such as a sophisticated AI system, and its limitations were to be exposed in a critical way?", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:52Z"}, "CONTEXT": {"content": "JIG's ability to build a wide range of applications is likely influenced by its origins as a simple, open-source tool for automating tasks, and its community-driven development process, which may have prioritized ease of use and flexibility over robustness and scalability.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:59:54Z"}}, "validation": {"validator": "james", "note": "I believe JIG can be used to build a wide range of applications, including habit trackers, home-automation logic, game rules, and compliance checklists, due to its flexibility and customizability. However, its limitations in handling complex logic and conditional statements may make it less suitable for applications requiring intricate rules or conditional decision-making.", "stale": false, "at": "2026-11-02T21:59:59Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:00:02Z"}, "note_draft": "I believe JIG can be used to build a wide range of applications, including habit trackers, home-automation logic, game rules, and compliance checklists, due to its flexibility and customizability. However, its limitations in handling complex logic and conditional statements may make it less suitable for applications requiring intricate rules or conditional decision-making.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/jig-is-a-deterministic-rule-engine", "created_at": "2026-11-02T06:42:29Z", "content": "JIG is a deterministic rule engine that allows users to extend it by writing capsules, which are small signed JSON documents that declare facts, rules, constraints, and goals.", "created": "2026-11-02T06:42:29Z", "source": "Worded by ollama from the JIG README", "tags": ["repo", "jig", "private"], "group": "JIG", "repo": "JIG", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"\u003cp align=\"center\">\u003cimg src=\"images/JIG%20Icon.png\" alt=\"JIG: deterministic by design\" width=\"240\">\u003c/p> # JIG **Deterministic by design.** A rule engine anyone can extend by writing capsules, and audit afterwards.\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:04Z"}, "COUNTER": {"content": "Some users have reported issues with the extensibility of JIG, citing difficulties in writing and deploying capsules, which may indicate that the claim that JIG is a deterministic rule engine is overly optimistic.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:06Z"}, "OPINION": {"content": "It is reasonable to assume that JIG's ability to extend itself through capsules is a key feature, but further investigation is needed to confirm whether this is a deterministic process.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:08Z"}, "FICTION": {"content": "What if JIG's capsules were not just signed JSON documents, but also contained a hidden backdoor that allowed the creator to manipulate the engine's behavior?", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:10Z"}, "CONTEXT": {"content": "JIG's development is closely tied to the needs of the open-source community, and its extensibility features are intended to facilitate collaboration and innovation, but the extent to which these features are deterministic is unclear.", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T22:04:14Z"}}, "validation": {"validator": "james", "note": "I believe JIG is a deterministic rule engine because the README explicitly states that it is designed to be deterministic. However, I am uncertain about the extent to which its extensibility features, such as capsules, are deterministic, as some users have reported issues with writing and deploying them, which may indicate that the claim is overly optimistic.", "stale": false, "at": "2026-11-02T22:04:20Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:04:24Z"}, "note_draft": "I believe JIG is a deterministic rule engine because the README explicitly states that it is designed to be deterministic. However, I am uncertain about the extent to which its extensibility features, such as capsules, are deterministic, as some users have reported issues with writing and deploying them, which may indicate that the claim is overly optimistic.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/jst-xh-is-3a-on-22awg", "created_at": "2026-11-03T00:10:28Z", "content": "A JST XH connector is rated 3A, but only on 22 AWG wire.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "JST's XH datasheet lists 3A AC/DC at AWG 22 and 250V, from -25 to +85°C. Digi-Key and TechOverflow agree, with wire from 22 to 30 AWG.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/jst-xh-is-3a-on-22awg/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The rating is tied to AWG 22, so thinner wire should be assumed to carry less. Many cheap parts sold as JST are copies, so the rating may not carry over.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/jst-xh-is-3a-on-22awg/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This is a good choice for balance leads and small servo runs.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/jst-xh-is-3a-on-22awg/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose XH-style connectors on 28 AWG wire feed a 2.5A servo. The connector's rating looks fine, and the wire is the problem.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/jst-xh-is-3a-on-22awg/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "XH is the usual connector on 2S balance leads.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/jst-xh-is-3a-on-22awg/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From JST's own datasheet. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-needs-a-bms", "proposal_id": "cube/jst-xh-is-3a-on-22awg/proposal/6", "why": "XH carries balance leads"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/keep-dependencies-to-one", "created_at": "2026-11-03T00:45:24Z", "content": "The code stays on the standard library, with one optional third-party package.", "created": "2026-11-03T00:45:24Z", "source": "Written by Claude from this project's code, see source/project-security", "tags": ["foundational", "preference"], "group": "Foundations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "An import scan of the project on 2 November found anthropic to be the only third-party package, used only in kg_llm.py, and requirements.txt lists that one.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/keep-dependencies-to-one/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That scan is a moment in time, and programs such as gh, Ollama and Tailscale also matter. requirements.txt sets a version range, not a hash.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/keep-dependencies-to-one/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Each new package is new code I trust without reading, so add one only with a clear reason.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/keep-dependencies-to-one/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a helper package is added for a small job. Next year a compromised release runs on every start.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/keep-dependencies-to-one/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This keeps the attack surface small, as well as keeping the project easy to run.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/keep-dependencies-to-one/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/own-ed25519-for-local-signing", "proposal_id": "cube/keep-dependencies-to-one/proposal/6", "why": "signing in pure Python avoids a crypto dependency"}, {"other": "cube/sqlite-single-file-wal-mode-chosen", "proposal_id": "cube/keep-dependencies-to-one/proposal/7", "why": "SQLite ships with Python"}, {"other": "cube/password-hash-meets-owasp-cost", "proposal_id": "cube/password-hash-meets-owasp-cost/proposal/6", "why": "scrypt comes from the standard library"}, {"other": "cube/python-for-these-tools", "proposal_id": "cube/python-for-these-tools/proposal/6", "why": "the standard library is what makes one dependency possible"}, {"other": "cube/split-files-over-400-lines", "proposal_id": "cube/split-files-over-400-lines/proposal/6", "why": "both keep the code small enough to read"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/keys-need-a-backup-and-a-rotation-plan", "created_at": "2026-11-01T16:50:49Z", "content": "A signing key needs a backup and a rotation plan.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["crypto", "provenance"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A lost key cannot sign, and a leaked one can sign as you. Each needs a planned response.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Backups create more copies to protect, so safer storage and easier recovery pull against each other.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "I should write this plan down before I need it, not after a key is lost.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/keys-need-a-backup-and-a-rotation-plan/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If the only key were lost, old signatures would still verify but nothing new could be signed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "keygen.py warns to keep the key safe and back it up offline.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe a signing key needs a backup and a rotation plan because a lost key cannot sign, and a leaked one can sign as you, each requiring a planned response. However, this approach may create a trade-off between safer storage and easier recovery, as backups can generate more copies to protect.", "neighbours": [], "link_drafts": [{"other": "cube/never-commit-secrets", "proposal_id": "cube/never-commit-secrets/proposal/7", "why": "both are about handling keys"}, {"other": "cube/rotate-a-leaked-key-immediately", "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/6", "why": "rotation needs a plan before a leak"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/keystone-gate-functions-as-a-forge", "created_at": "2026-11-02T06:36:34Z", "content": "Keystone Gate functions as a Forge Stack consumer that provides a governance layer for semantic capsule evolution.", "created": "2026-11-02T06:36:34Z", "source": "Worded by gemini from the keystone_gate README", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: “It uses the existing stack infrastructure (SCP, DataCube, Leighton Weight Engine, ChronoSCRIBE, HAL) to provide a governance layer for semantic capsule evolution.”", "filled_by": "human", "unread": false, "at": "2026-11-02T22:16:23Z"}, "COUNTER": {"content": "“Existing stack infrastructure” may be stale wording. The tools Keystone Gate builds on were rebuilt as fresh Rust crates in the-forge (scp-core, store-sqlite, chronoscribe, datacube, leighton-engine, hal) rather than reused from the original Forge Stack. DataCube’s design also changed along the way, to five lenses plus a contradicts field. “Governance” is a strong word, too: it should only stand if something actually enforces the rules, not just records them.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:16:39Z"}, "OPINION": {"content": "Governance is the right way to frame it. Corrections become new, signed, trust-scored capsules instead of retraining a model. That makes every change to the system’s knowledge traceable and reversible, which is the point of a sovereign stack.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:16:52Z"}, "FICTION": {"content": "Suppose a user drops a new capsule into sc/ that contradicts an existing one. Without a governance layer, the newer capsule would silently win. With Keystone Gate, the conflict is caught, and the change is logged in ChronoSCRIBE and weighted by Leighton. The contradiction shows up as something to resolve, and the knowledge never quietly drifts.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:17:06Z"}, "CONTEXT": {"content": "Keystone Gate is one of two sibling apps built on the shared Forge tools in the-forge repo. The other is Replicant. In Keystone Gate, the LLM handles language only and never decides what’s true. Capsules define behaviour, and corrections are captured as new declared, classified, trust-scored and audited capsules rather than being used to fine-tune the model. James Gilbert is the author.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:17:17Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nKeystone Gate is a Forge Stack consumer. It builds on the-forge’s shared crates (scp-core, store-sqlite, chronoscribe, datacube, leighton-engine, hal), and the Phase 1 foundation passed 33/33 tests.\n“Governance of capsule evolution” means changes to knowledge arrive as new signed capsules with a hash-chained audit trail. They never come from retraining.\nTrust is gated by completeness: a cube is only eligible for Leighton attestation once all its faces are filled.\nWording fix: “existing stack infrastructure” should read “the-forge’s rebuilt Forge tools”. These are not the v1 implementations.", "stale": false, "at": "2026-11-02T22:17:31Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:17:36Z"}, "note_draft": "I believe Keystone Gate functions as a Forge Stack consumer that provides a governance layer for semantic capsule evolution, as it uses the existing stack infrastructure to support this functionality. However, I acknowledge that the README's language is ambiguous and may be open to interpretation, and further clarification would be necessary to confirm this assumption.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/keystone-gate-shares-one-database", "created_at": "2026-11-01T15:36:10Z", "content": "Keystone Gate is a separate program sharing one database.", "created": "2026-11-01T15:36:10Z", "source": "keystone-gate/README.md design decisions", "tags": ["gate", "substrate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "It imports Substrate and adds no code to the substrate. All of its data is capsules in sc.db.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "The shared DB means cube data mixes with substrate data, and a bad write by either affects both.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Worth it. Checking answers against the real data matters more than clean separation.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:00:55Z"}, "FICTION": {"content": "With its own database, it could not check answers against the substrate without a second connection and a sync problem.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Removing it means dropping the keystone-gate folder, four foundations and its capsules.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe Keystone Gate is a separate program sharing one database because it imports Substrate and adds no code to the substrate, storing all its data in sc.db. However, this shared database poses a risk of data contamination, as a bad write to either the keystone-gate data or the substrate data could have unintended consequences.", "stale": false, "at": "2026-11-02T22:01:05Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:01:09Z"}, "note_draft": "I believe Keystone Gate is a separate program sharing one database because it imports Substrate and adds no code to the substrate, storing all its data in sc.db. However, this shared database poses a risk of data contamination, as a bad write to either the keystone-gate data or the substrate data could have unintended consequences.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/kiwi-drive-is-three-omni-wheels", "created_at": "2026-11-03T00:31:15Z", "content": "A kiwi drive uses three omni wheels 120 degrees apart to move any direction with fewer motors.", "created": "2026-11-03T00:31:15Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia and Luis Llamas describe three omni wheels at 120 degrees forming a holonomic base that moves any way without turning first. Wikipedia traces the name to a FIRST team's codeword for a Killough platform.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/kiwi-drive-is-three-omni-wheels/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "FIRST forum posts report less usable thrust than four-wheel designs and difficulty driving straight without feedback, with one team using a gyro. Three wheels can also feel tippy. Those are forum reports.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/kiwi-drive-is-three-omni-wheels/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "A good compromise for a small indoor robot if I have an IMU.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/kiwi-drive-is-three-omni-wheels/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a kiwi base with no gyro is told to go forward. It slowly rotates as it travels, because three motors never match exactly.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/kiwi-drive-is-three-omni-wheels/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "The M5StickC Plus2's MPU6886 gives you that gyro.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/kiwi-drive-is-three-omni-wheels/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Wikipedia and forum reports. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/m5stick-plus2-chip-and-memory", "proposal_id": "cube/kiwi-drive-is-three-omni-wheels/proposal/6", "why": "a board with a built-in gyro"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/led-resistor-at-3v3", "created_at": "2026-11-03T00:02:38Z", "content": "On 3.3V, a red LED needs about 68 ohms, and a blue one has almost no headroom.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The formula is R = (Vs - Vf) / I. At 3.3V and 20 mA, a 2V red LED needs 65 ohms, so 68. A 3V blue LED needs 15 ohms, and the WS2812B sheet lists blue at 3.0-3.4V, so it may barely light.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/led-resistor-at-3v3/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "20 mA is above the 12 mA I treat as safe for a pin, so a real design should use less, about 110 ohms for red at 12 mA. Forward voltage also varies with the LED and with current.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/led-resistor-at-3v3/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use 220 ohms for an indicator, which is bright enough and easy on the pin.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/led-resistor-at-3v3/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a blue LED is fitted with no resistor, because 3.3V looks about right. Nothing limits the current except the pin.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/led-resistor-at-3v3/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "The PCA9685 has its own LED current limits, in its cube.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/led-resistor-at-3v3/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Ohm's law, with forward voltages from a general guide. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-gpio-input-and-current-limits", "proposal_id": "cube/led-resistor-at-3v3/proposal/6", "why": "current per pin"}, {"other": "cube/pca9685-led-current-limits", "proposal_id": "cube/led-resistor-at-3v3/proposal/7", "why": "the same limit on another driver"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-2s-charging", "created_at": "2026-11-02T23:56:25Z", "content": "Charge a 2S pack with a CC-CV charger to 8.4V, and never trickle-charge it.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Samsung's sheet gives CC-CV at 1.50A to 4.20V per cell with a 150mA cut-off, and a rapid 4A charge. Battery University describes the same CC-CV method and says Li-ion takes no trickle charge.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-charging/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Those are one 30Q cell's figures, and a pack from another maker may have different limits. The 4A rapid rate gives far fewer cycles than careful charging.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-charging/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use a proper 2S charger at 1.5A or less, and do not improvise from a bench supply.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-charging/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a supply is set to 8.4V and left connected for days. The voltage looks right, and the cells still sit at full charge the whole time.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-charging/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Samsung's standard charge takes about 180 minutes. Battery University also says to avoid charging at freezing temperatures.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-charging/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Samsung and Battery University agree. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/do-not-charge-li-ion-unattended", "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/6", "why": "where and how to charge"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-2s-cut-off-voltage", "created_at": "2026-11-02T23:56:25Z", "content": "Stop discharging a 2S pack at no lower than 5V, and earlier is better.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Samsung's sheet gives end of discharge at 2.5V per cell, which is 5V for two. A 2S BMS datasheet gives over-discharge protection at 2.5V ±0.05V per cell. Battery University warns copper shunts can form below about 2V.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-cut-off-voltage/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "5V at the pack can hide one cell at 2.2V and another at 2.8V if they have drifted apart, which is why per-cell protection matters. Stopping at a higher voltage is general advice, not in Samsung's sheet.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-cut-off-voltage/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Set a low-battery warning well above 5V, for example 6V, and shut down before the BMS has to.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-cut-off-voltage/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a project is left on until the BMS cuts out, and then sits in a drawer for months. A cell can drop below 2V and may not be safe to recharge.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-cut-off-voltage/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Battery University advises discarding a cell left below 2.00V for more than a week.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-cut-off-voltage/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Samsung, a BMS datasheet and Battery University. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-brownout-resets", "proposal_id": "cube/li-ion-2s-cut-off-voltage/proposal/6", "why": "a sagging pack can reset the controller"}, {"other": "cube/li-ion-disposal", "proposal_id": "cube/li-ion-disposal/proposal/7", "why": "cells left below 2V"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-2s-is-22wh-not-6000mah", "created_at": "2026-11-02T23:56:25Z", "content": "Two 3000mAh cells in series are still 3000mAh, about 22 watt-hours.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "In series the voltage adds and the capacity does not, so 2S stays at 3000mAh. Using Samsung's 3.6V gives 21.6Wh, and using 7.4V gives 22.2Wh.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-22wh-not-6000mah/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The arithmetic is mine, from the voltages in the sources. Real capacity depends on current: Samsung rates 3000mAh at a low 0.2C discharge, and a test measured just over 3100mAh at that rate.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-22wh-not-6000mah/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Compare batteries in watt-hours, because mAh alone misleads across voltages.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-22wh-not-6000mah/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose someone expects 6000mAh from two cells. A robot built on that sum runs half as long as planned.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-22wh-not-6000mah/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Stepping down to 6V gives more current than 3000mA, which is how a 2S pack can feed a heavy servo load for a while.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-22wh-not-6000mah/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "My arithmetic from Samsung's figures. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/m5stick-plus2-battery", "proposal_id": "cube/li-ion-2s-is-22wh-not-6000mah/proposal/6", "why": "22Wh against about 0.74Wh in the M5Stick"}, {"other": "cube/pi-3-power-and-lifetime", "proposal_id": "cube/pi-3-power-and-lifetime/proposal/6", "why": "12.5W against 22Wh"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-2s-is-8v4-full", "created_at": "2026-11-02T23:56:24Z", "content": "A 7.4V Li-ion pack is two cells in series and reads 8.4V when full.", "created": "2026-11-02T23:56:24Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Samsung's 30Q sheet gives 4.20V charge per cell, so two in series is 8.4V. Battery University gives 4.20V per cell, and 2S BMS listings state 7.4V nominal and 8.4V full.", "filled_by": "draft", "at": "2026-11-02T23:56:24Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-8v4-full/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Samsung's nominal is 3.6V, which makes 7.2V, so 7.4V is a label from 3.7V cells, not a measured working voltage. The pack spends its life anywhere from 8.4V down to its cut-off.", "filled_by": "draft", "at": "2026-11-02T23:56:24Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-8v4-full/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Design for 8.4V, and treat 7.4V as just the name on the label.", "filled_by": "draft", "at": "2026-11-02T23:56:24Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-8v4-full/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a part rated to 8V is fitted because the pack says 7.4V. It works on a part-charged pack and fails on the first full one.", "filled_by": "draft", "at": "2026-11-02T23:56:24Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-8v4-full/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This assumes the common 2S layout. A pack sold as 7.4V 3000mAh could also be LiPo, which has similar voltages but a different build.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-is-8v4-full/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "The arithmetic is confirmed by Samsung and Battery University. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/dc-wire-colours-are-a-habit", "proposal_id": "cube/dc-wire-colours-are-a-habit/proposal/6", "why": "check a pack before connecting"}, {"other": "cube/do-not-charge-li-ion-unattended", "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/8", "why": "charging should stop at 8.4V for a 2S pack"}, {"other": "cube/esp32-logic-is-3v3", "proposal_id": "cube/li-ion-2s-is-8v4-full/proposal/6", "why": "the controller also needs its own regulated rail"}, {"other": "cube/uno-vin-takes-6-to-20v", "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/6", "why": "a pack that fits VIN"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-2s-needs-a-bms", "created_at": "2026-11-02T23:56:25Z", "content": "A 2S pack needs per-cell protection, because the pack voltage can look fine with one bad cell.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Battery University says Li-ion cannot tolerate overcharge, with plating and possible venting above about 4.30V on a 4.20V cell. 2S BMS documents describe per-cell monitoring, with one giving over-charge protection at 4.25V ±0.05V.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-needs-a-bms/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The BMS sources are vendor pages. Not every 2S board balances, as one listing says plainly, and balance currents of 30 to 60 mA are slow. Some packs include no protection at all.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-needs-a-bms/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Check what is inside any pack before buying, and do not assume it has a BMS.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-needs-a-bms/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose one cell ages faster. The pack still reads 8.4V at full, with one cell at 4.35V and the other at 4.05V, and only a per-cell reading would show it.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-needs-a-bms/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the safety cube of the set, because Li-ion failure can mean venting with flame.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-needs-a-bms/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Battery University is solid, and the BMS details are from vendor pages. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/jst-xh-is-3a-on-22awg", "proposal_id": "cube/jst-xh-is-3a-on-22awg/proposal/6", "why": "XH carries balance leads"}, {"other": "cube/li-ion-fire-get-out-and-call-999", "proposal_id": "cube/li-ion-fire-get-out-and-call-999/proposal/6", "why": "a BMS guards against some causes of fire, not all"}, {"other": "cube/protection-cannot-stop-internal-faults", "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/6", "why": "what a BMS can and cannot do"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-2s-runtime-estimate", "created_at": "2026-11-02T23:56:25Z", "content": "Six MG90S servos moving would run about 2 hours on this pack, as an estimate.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "22Wh at an assumed 85% converter efficiency gives about 18.7Wh, or 3.1Ah at 6V. Six MG90S moving at 250 mA each take 1.5A, which gives about 2 hours.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-runtime-estimate/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The 85% efficiency is my assumption, 250 mA is the top of the listed range, and servos do not move all the time. The controller's own draw is not counted, and capacity falls at high current.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-runtime-estimate/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Treat this as a planning figure, and measure a real session before trusting it.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-runtime-estimate/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the arm lifts a load all the time. Current rises towards stall, and the two hours shrinks to minutes.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-runtime-estimate/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is a worked example, so swap in your own servo count and duty.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-runtime-estimate/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "An estimate with stated assumptions, not a measurement. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/mg90s-stall-current", "proposal_id": "cube/li-ion-2s-runtime-estimate/proposal/6", "why": "runtime depends on servo current"}, {"other": "cube/shape-sets-the-power-budget", "proposal_id": "cube/shape-sets-the-power-budget/proposal/6", "why": "runtime depends on the shape"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-2s-too-high-for-servos", "created_at": "2026-11-02T23:56:25Z", "content": "A 2S pack cannot feed servos or a PCA9685 directly: it needs a regulator.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A full pack is 8.4V. The SG90 and MG90S are listed at 4.8 to 6V, the MG996R to 7.2V, and the PCA9685 guide says 5 to 6V on V+.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Some sellers and hobbyists do run high-voltage servos on 2S directly, but none of the servos here are rated for it. A regulator also adds its own current limit and heat.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use a step-down converter set to 6V or below, and size it for stall current rather than average.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a fresh pack is wired straight to V+. Everything may twitch once, and the board and every servo have had 8.4V.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This joins the battery to your servo and PCA9685 cubes, and it is the most important practical point in this set.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Follows from the ratings on the servo and PCA9685 cubes. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/first-power-on-checks", "proposal_id": "cube/first-power-on-checks/proposal/6", "why": "check V+ first"}, {"other": "cube/mg996r-voltage-exceeds-pca9685", "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/6", "why": "8.4V is above both limits"}, {"other": "cube/pca9685-v-plus-voltage-limit", "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/7", "why": "the pack needs stepping down for V+"}, {"other": "cube/servos-and-the-esp32-should-have", "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/8", "why": "a single pack still needs separate rails"}, {"other": "cube/uno-vin-takes-6-to-20v", "proposal_id": "cube/uno-vin-takes-6-to-20v/proposal/7", "why": "the Uno can take what servos cannot"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-3000mah-labels-need-checking", "created_at": "2026-11-02T23:56:25Z", "content": "A pack's 3000mAh label needs checking, because cells are often faked or re-wrapped.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Forum reports describe the Sony VTC6 as a frequent target for clones and re-wraps. Thunderheart's test found a genuine 30Q slightly above its label at low current, so a real cell has a clear benchmark.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-3000mah-labels-need-checking/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "This is forum reporting. I could not find bench numbers showing how far fakes fall short, so any figure would be a guess.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-3000mah-labels-need-checking/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Buy cells from a known supplier, and run one measured discharge to check.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-3000mah-labels-need-checking/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a cheap pack says 3000mAh and delivers 1500. The runtime estimate is out by half, and nothing looks wrong.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-3000mah-labels-need-checking/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "A simple capacity test, discharging at 0.2C (0.6A) to the cut-off, gives a direct comparison with Samsung's rating.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-3000mah-labels-need-checking/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From forum reports, and no bench figures for fakes were found. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/protection-cannot-stop-internal-faults", "proposal_id": "cube/protection-cannot-stop-internal-faults/proposal/7", "why": "a relabelled cell may not have the protection it claims"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-30q-current-rating", "created_at": "2026-11-02T23:56:25Z", "content": "A good 3000mAh 18650 is rated 15A, but the pack's real limit may be far lower.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Samsung's sheet gives 15A continuous at 25°C for the 30Q, and the Sony VTC6 is also listed at 15A. A 2S BMS can be rated from 3A to 20A, depending on the board.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-30q-current-rating/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Forum reports say the 30Q manages about 20A with a temperature limit, but Samsung specifies 15A. Unbranded cells may be nowhere near this, and the pack's weakest part sets the limit.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-30q-current-rating/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Find the BMS rating first, because it will usually be the limit.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-30q-current-rating/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose six MG996Rs stall together and call for 15A through a 3A BMS. It cuts out, and the whole robot goes limp mid-move.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-30q-current-rating/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the MG996R current cube, since one stall is 2.5A.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-30q-current-rating/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Samsung's figure is first-hand, and it covers that cell only. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/fuse-the-battery-positive-near-the-pack", "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/7", "why": "fuses sit against pack current"}, {"other": "cube/hexapods-stay-stable-walking", "proposal_id": "cube/hexapods-stay-stable-walking/proposal/7", "why": "what the pack must supply"}, {"other": "cube/mg996r-current", "proposal_id": "cube/li-ion-30q-current-rating/proposal/6", "why": "stall current sets the current the pack must give"}, {"other": "cube/pca9685-servo-current-sizing", "proposal_id": "cube/li-ion-30q-current-rating/proposal/7", "why": "the same supply sizing question"}, {"other": "cube/tracks-grip-but-waste-power", "proposal_id": "cube/tracks-grip-but-waste-power/proposal/6", "why": "turning current meets the BMS"}, {"other": "cube/xt60-is-30a-continuous", "proposal_id": "cube/xt60-is-30a-continuous/proposal/6", "why": "the connector can be the weak link"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-cycle-life-at-high-drain", "created_at": "2026-11-02T23:56:25Z", "content": "At maximum discharge, a 30Q is only guaranteed 60% capacity after 250 cycles.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Samsung's sheet gives capacity of at least 1,800mAh, 60% of nominal, after 250 cycles with standard charge and maximum continuous discharge at 25°C.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-cycle-life-at-high-drain/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That is a worst-case guarantee at 15A, far harder than a hobby load, so gentler use should last longer. I found no cycle figure for my use, and this is a tentative 2014 spec, version 0.0.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-cycle-life-at-high-drain/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Expect capacity to fall with use, and keep a log of runtime to see when.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-cycle-life-at-high-drain/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a project runs daily at high current. Within a year it may be doing half the runtime it first did, with no visible fault.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-cycle-life-at-high-drain/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the source of the 60 percent figure in the Samsung sheet, and it applies to this cell model only.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-cycle-life-at-high-drain/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Directly from Samsung's sheet, version 0.0. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-disposal", "created_at": "2026-11-03T00:22:02Z", "content": "Never put a Li-ion battery in a household bin, and tape the terminals before recycling it.", "created": "2026-11-03T00:22:02Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Councils and fire services say to use a recycling point, and the Recycle Your Electricals locator finds one. Southampton University says to tape terminals of damaged packs. Reading University warns puncturing a swollen cell may cause fire and explosion.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-disposal/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Acceptance varies, and some sites refuse damaged batteries, so ring first. Advice on damaged cells comes mostly from institutions rather than national guidance.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-disposal/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Keep a metal tin with sand for dead cells, and take them in when there are a few. That part is my suggestion.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-disposal/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an old cell goes in the bin. The lorry crushes it, and the load catches fire on the road.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-disposal/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the storage cube, because a dead pack is not a safe pack.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-disposal/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From UK councils, a regulator and universities, which agree.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-storage", "proposal_id": "cube/li-ion-disposal/proposal/6", "why": "a dead pack still needs care"}, {"other": "cube/li-ion-2s-cut-off-voltage", "proposal_id": "cube/li-ion-disposal/proposal/7", "why": "cells left below 2V"}, {"other": "cube/li-ion-warning-signs", "proposal_id": "cube/li-ion-warning-signs/proposal/7", "why": "a swollen pack must be retired"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-fire-get-out-and-call-999", "created_at": "2026-11-03T00:22:02Z", "content": "In a Li-ion fire, get people out and call 999: the fumes are dangerous and it can re-ignite.", "created": "2026-11-03T00:22:02Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Battery University says runaway can reach about 500°C, smoke or gas may be more toxic than ordinary fires, you should leave if they are present, and cells can keep igniting. It advises ventilating the area.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-fire-get-out-and-call-999/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Battery University's two pages differ: one says to dowse a Li-ion fire with water, the other says to use water only to stop it spreading. They also suggest letting it burn out outdoors. Carrying a failing pack is my concern, as it can flare. Call 999 was not in the text I read, and is my addition.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-fire-get-out-and-call-999/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Do not fight it or carry it. Get out, shut the door, and call 999.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-fire-get-out-and-call-999/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a small pack flares and seems to die down. It is put in a bin to deal with later, and a second cell lights it up.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-fire-get-out-and-call-999/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Class D extinguishers are for lithium metal, not Li-ion, according to Battery University.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-fire-get-out-and-call-999/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Battery University's pages disagree on water, so this puts getting out first, which is my judgement.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-needs-a-bms", "proposal_id": "cube/li-ion-fire-get-out-and-call-999/proposal/6", "why": "a BMS guards against some causes of fire, not all"}, {"other": "cube/li-ion-warning-signs", "proposal_id": "cube/li-ion-warning-signs/proposal/6", "why": "what to do next"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-storage", "created_at": "2026-11-02T23:56:25Z", "content": "Store Li-ion at about 40 percent charge somewhere cool, not full and not empty.", "created": "2026-11-02T23:56:25Z", "source": "Cross-referenced by Claude, see source/li-ion-2s-packs", "tags": ["battery", "hardware"], "group": "7.4V Li-ion packs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Battery University recommends about 40 percent charge and about 15°C. Its table shows Li-ion kept a year at 25°C held about 96% at 40 percent charge, and about 80% when full.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-storage/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That is one source, though a well-regarded one. Samsung's sheet has its own storage section, which I did not compare in detail.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-storage/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Leave packs at about 3.8V per cell, or 7.6V for two, if they will sit for weeks.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-storage/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a fully charged pack is left in a hot car all summer. At 40°C it could lose about 35 percent of its capacity in a year, by the same table.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-storage/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Battery University gives about 3.82V per cell at 40 percent, after 90 minutes' rest. Removable packs also ship at about 30 percent charge.", "filled_by": "draft", "at": "2026-11-02T23:56:25Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-storage/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Battery University, one source. I have not tested this on my own pack.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-disposal", "proposal_id": "cube/li-ion-disposal/proposal/6", "why": "a dead pack still needs care"}, {"other": "cube/li-ion-warning-signs", "proposal_id": "cube/li-ion-warning-signs/proposal/8", "why": "check stored packs for the warning signs"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/li-ion-warning-signs", "created_at": "2026-11-03T00:22:02Z", "content": "If a Li-ion cell gets hot, bulges or hisses, stop using it at once.", "created": "2026-11-03T00:22:02Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The Isles of Scilly service says to unplug at once if a battery gets hot, bulges or hisses. Battery University says to stop if temperature rises over 10°C on a normal charge, and to move an overheating cell onto something non-combustible.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-warning-signs/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "A protected pack can fail with no warning, and unplugging may not stop a failure that has begun, according to Battery University. Absence of these signs does not prove a pack is safe.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-warning-signs/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Retire any pack that swells, with no second chances.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-warning-signs/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a slightly puffy pack still works well. It is tempting to use it for one more session, and that is exactly the pack that fails.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-warning-signs/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Battery University lists heat build-up and bulging as early signs of a problem.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/li-ion-warning-signs/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a UK fire service and Battery University, which agree.", "neighbours": [], "link_drafts": [{"other": "cube/do-not-charge-li-ion-unattended", "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/7", "why": "what to watch for"}, {"other": "cube/li-ion-fire-get-out-and-call-999", "proposal_id": "cube/li-ion-warning-signs/proposal/6", "why": "what to do next"}, {"other": "cube/li-ion-disposal", "proposal_id": "cube/li-ion-warning-signs/proposal/7", "why": "a swollen pack must be retired"}, {"other": "cube/li-ion-storage", "proposal_id": "cube/li-ion-warning-signs/proposal/8", "why": "check stored packs for the warning signs"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/life-in-capsules", "created_at": "2026-11-02T23:11:39Z", "content": "James has always defined his life in capsules.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private", "defining"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He says only now, with the Forge Stack and SCP, do the capsules fit him.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "A capsule is a boundary, and describing a life in boundaries can flatten what doesn't fit them.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The fact that the tool matches how he already thinks is probably why he finally finishes things in it.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the capsules hadn't fit. SCP would have been another parked idea.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "His daily routine is modelled as circadian capsules too.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/life-in-capsules/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/llm-handles-language-not-truth", "created_at": "2026-11-01T15:36:10Z", "content": "The LLM handles language, never truth.", "created": "2026-11-01T15:36:10Z", "source": "keystone-gate/README.md", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The walker finds the facts and Claude only rewords them. Any failure or refusal shows the walker's answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Rewording can still change meaning. The gate proves each claim quotes evidence, not that the sentence means the same as its quote.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "This is the core rule of the project. Models are useful for wording and should not be the source of facts.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:01:23Z"}, "FICTION": {"content": "If the LLM could answer from its own knowledge, the gate would have nothing to check against.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "The core rule of Keystone Gate, enforced by sc/claude-answerer in kg_llm.py. No live call had been made at 2026-11-01.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "The LLM handles language, never truth, as it rewords facts found by the walker, and its core rule is that models should not be the source of facts. However, this rule may not prevent changes in meaning due to rewording, and it is unclear whether the LLM could answer from its own knowledge if it were possible.", "stale": false, "at": "2026-11-02T22:01:30Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:01:35Z"}, "note_draft": "The LLM handles language, never truth, as it rewords facts found by the walker, and its core rule is that models should not be the source of facts. However, this rule may not prevent changes in meaning due to rewording, and it is unclear whether the LLM could answer from its own knowledge if it were possible.", "neighbours": [], "link_drafts": [{"other": "cube/models-word-people-decide", "proposal_id": "cube/models-word-people-decide/proposal/7", "why": "models word answers but do not decide truth"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/llms-unlocked-execution", "created_at": "2026-11-02T23:11:39Z", "content": "LLMs made his work buildable.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private", "defining"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "James says it wasn't until LLMs arrived that he could build his work and dreams.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The ideas predate LLMs, because he documents ideas fully and parks them for years. LLMs unlocked execution, not vision.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "That distinction matters, because it's why his stack never lets the LLM decide what's true.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose LLM access vanished tomorrow. The specs would survive, and the build rate wouldn't.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "He uses models for specs and drafting, and builds deliberately around their unreliability.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/llms-unlocked-execution/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/log-everything-fail-loud", "created_at": "2026-11-01T15:36:10Z", "content": "Log everything; fail loud and public; fix first.", "created": "2026-11-01T15:36:10Z", "source": "principle/fail-loud-public", "tags": ["principle", "process", "foundational", "preference"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as a principle. The gate follows it: a rule with no checker is a violation, and a refused answer is withheld.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "It took work to make true. Until 2026-11-01 nine places caught Exception and carried on silently. They are fixed and a test now guards it, but a narrow except can still hide a problem.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Quiet failures cost the most to find later, so I want them loud even when it is annoying.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:01:47Z"}, "FICTION": {"content": "If failures stayed quiet, a broken gate would look exactly like a healthy one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Sits behind the event log and the gate's fail-closed behaviour.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe this claim holds because it is a principle that has been implemented and tested, with the gate's fail-closed behaviour sitting behind the event log. However, its main limit is that it may not catch all exceptions, as it took work to make true and a narrow exception can still hide a problem.", "stale": false, "at": "2026-11-02T22:02:08Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:02:12Z"}, "note_draft": "I believe this claim holds because it is a principle that has been implemented and tested, with the gate's fail-closed behaviour sitting behind the event log. However, its main limit is that it may not catch all exceptions, as it took work to make true and a narrow exception can still hide a problem.", "neighbours": [], "link_drafts": [{"other": "cube/every-write-goes-through-substrate", "proposal_id": "cube/log-everything-fail-loud/proposal/6", "why": "every write leaves a logged event"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/m5stick-plus2-battery", "created_at": "2026-11-02T23:46:56Z", "content": "The Plus2 has a 200mAh battery.", "created": "2026-11-02T23:46:56Z", "source": "Cross-referenced by Claude, see source/m5stickc-plus2", "tags": ["m5stick", "hardware"], "group": "M5StickC Plus2", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "M5Stack's docs, CNX Software, Atomic14 and Switch Science all give 200 mAh, and M5Stack and CNX Software give 3.7V. The original Plus had 120 mAh.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-battery/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That is a small battery. I found no measured runtime for this board in any source, so how long it lasts on Wi-Fi is unknown.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-battery/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Measure it on my own workload before planning anything around it.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-battery/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose it runs a Wi-Fi logger overnight. It would probably stop long before morning, but only a test would say when.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-battery/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the best-agreed number here, and it links to the ESP32 brownout cube, since Wi-Fi bursts on a small cell can pull the supply down.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-battery/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Cross-checked by Claude against four sources that agree. Runtime is not known. I have not tested it on a device.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-is-22wh-not-6000mah", "proposal_id": "cube/li-ion-2s-is-22wh-not-6000mah/proposal/6", "why": "22Wh against about 0.74Wh in the M5Stick"}, {"other": "cube/esp32-brownout-resets", "proposal_id": "cube/m5stick-plus2-battery/proposal/6", "why": "Wi-Fi bursts on a small battery"}, {"other": "cube/mg996r-current", "proposal_id": "cube/mg996r-current/proposal/10", "why": "one stall is far beyond a 200mAh cell"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/m5stick-plus2-buttons", "created_at": "2026-11-02T23:46:56Z", "content": "Button A is G37, B is G39, and C is G35, which also wakes the device.", "created": "2026-11-02T23:46:56Z", "source": "Cross-referenced by Claude, see source/m5stickc-plus2", "tags": ["m5stick", "hardware"], "group": "M5StickC Plus2", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "M5Stack's docs give these three pins. M5Unified sets 35, 37 and 39 as inputs for this board and uses 35 as the wake pin.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-buttons/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The docs also describe a separate power/reset button, so labels can mislead: C is the power button in M5Unified's code. All three are input-only pins on the ESP32, so they cannot drive anything.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-buttons/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Check by pressing them, as button names are the sort of thing that differs between diagrams and code.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-buttons/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a menu uses C for select. A long press would switch the device off in the middle of a choice.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-buttons/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Button C holding for over 2 seconds powers it on, and over 6 seconds powers it off on battery.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-buttons/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Cross-checked by Claude against M5Stack's docs and M5Unified. I have not tested it on a device.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-pull-ups-for-switches", "proposal_id": "cube/esp32-pull-ups-for-switches/proposal/6", "why": "buttons sit on input-only pins"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/m5stick-plus2-chip-and-memory", "created_at": "2026-11-02T23:46:56Z", "content": "The M5StickC Plus2 runs an ESP32-PICO-V3-02 with 8MB flash and 2MB PSRAM.", "created": "2026-11-02T23:46:56Z", "source": "Cross-referenced by Claude, see source/m5stickc-plus2", "tags": ["m5stick", "hardware"], "group": "M5StickC Plus2", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "M5Stack's docs and Espressif's datasheet agree: ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM. The datasheet also gives 3.0~3.6 V and -40~85 °C for the chip. M5GFX also identifies this board by that chip package.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-chip-and-memory/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "CNX Software's introduction says 2MB flash, though its own spec list says 8MB, and a distributor lists 2MB SRAM. Both look like errors, because Espressif's figures are the primary source. The PSRAM is also slower than internal SRAM.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-chip-and-memory/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This is the one to trust most, because the chip maker and the board maker agree.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-chip-and-memory/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a sketch assumes all 2MB is ordinary fast memory. It would run, then slow down badly in the one loop that matters.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-chip-and-memory/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "The original Plus used an ESP32-PICO-D4 with 4MB flash and no PSRAM, so this is the main reason to choose the Plus2.", "filled_by": "draft", "at": "2026-11-02T23:46:56Z", "unread": true, "pending": true, "proposal_id": "cube/m5stick-plus2-chip-and-memory/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Cross-checked by Claude against M5Stack's docs, Espressif's datasheet and M5GFX. I have not tested it on a device.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-c3-is-single-core-risc-v", "proposal_id": "cube/esp32-c3-is-single-core-risc-v/proposal/6", "why": "one core against two"}, {"other": "cube/kiwi-drive-is-three-omni-wheels", "proposal_id": "cube/kiwi-drive-is-three-omni-wheels/proposal/6", "why": "a board with a built-in gyro"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/m5stick-plus2-end-of-life", "created_at": "2026-11-02T23:46:56Z", "content": "The Plus2 is end-of-life, with the M5StickS3 as its successor.
