und no hobby guidance on this.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/emergency-stop-and-gravity/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use the stop anyway, and design so that a dropped arm lands somewhere safe.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/emergency-stop-and-gravity/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the stop is pressed with a load held high. The danger of motion is gone, and a falling load takes its place.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/emergency-stop-and-gravity/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This builds on the emergency stop cube and on normally closed switches.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/emergency-stop-and-gravity/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a standards summary and a commercial manual, applied here by my judgement.", "neighbours": [], "link_drafts": [{"other": "cube/emergency-stop-cuts-power", "proposal_id": "cube/emergency-stop-and-gravity/proposal/6", "why": "what happens after the stop"}, {"other": "cube/normally-closed-limit-switches", "proposal_id": "cube/emergency-stop-and-gravity/proposal/7", "why": "failing safe"}, {"other": "cube/arm-base-joint-carries-the-most-torque", "proposal_id": "cube/emergency-stop-and-gravity/proposal/8", "why": "cutting power drops the load the base joint was holding"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/emergency-stop-cuts-power", "created_at": "2026-11-01T16:50:49Z", "content": "An emergency stop should cut actuator power in hardware.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "safety", "foundational"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A stop switch in the servo supply works even if the software has crashed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Removing power can drop a loaded arm, since hobby servos do not hold without power. Test what your arm does before relying on it.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Needed on any arm big enough to hurt something, but I must test what it does when power goes.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/emergency-stop-cuts-power/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A stop that depended on software would fail in exactly the situations it exists for.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Compare with the PCA9685 OE pin cube, which cuts signal instead of power.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "This is based on general knowledge that a hardware switch in the servo supply stops actuators even during a software crash. However, cutting power can cause a loaded arm to drop because hobby servos do not hold without power, and I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/emergency-stop-and-gravity", "proposal_id": "cube/emergency-stop-and-gravity/proposal/6", "why": "what happens after the stop"}, {"other": "cube/normally-closed-limit-switches", "proposal_id": "cube/normally-closed-limit-switches/proposal/6", "why": "failing to the safe state"}, {"other": "cube/pca9685-oe-pin-disables-outputs", "proposal_id": "cube/pca9685-oe-pin-disables-outputs/proposal/6", "why": "OE stops the signals, not the power"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/esp32-brownout-resets", "created_at": "2026-11-01T16:50:49Z", "content": "An ESP32 resets itself when its supply sags.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["esp32", "power"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A brownout detector restarts the chip if voltage drops too far, and Wi-Fi transmit bursts add current peaks.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Disabling the detector hides the supply problem instead of fixing it, and leaves the chip running out of specification.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "If this shows up, the supply is the real fault. I will not disable the detector.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-brownout-resets/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If servos shared the ESP32's regulator, each big move could restart the controller.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Same failure as the PCA9685 warning on powering servos from the controller.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the ESP32 resets itself when its supply sags because the brownout detector restarts the chip if voltage drops too far, and Wi-Fi transmit bursts add current peaks. However, disabling the detector may only hide the supply problem rather than fix it, potentially leaving the chip running out of specification.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-cut-off-voltage", "proposal_id": "cube/li-ion-2s-cut-off-voltage/proposal/6", "why": "a sagging pack can reset the controller"}, {"other": "cube/m5stick-plus2-battery", "proposal_id": "cube/m5stick-plus2-battery/proposal/6", "why": "Wi-Fi bursts on a small battery"}], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 1.21, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "warning"}, {"lens": "FICTION", "term": "big"}, {"lens": "FACT", "term": "peaks"}], "other": "cube/servos-and-the-esp32-should-have"}]}, {"id": "cube/esp32-c3-is-single-core-risc-v", "created_at": "2026-11-03T00:10:29Z", "content": "The ESP32-C3 is a single-core 160MHz RISC-V chip with Wi-Fi and Bluetooth LE.", "created": "2026-11-03T00:10:29Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Espressif's datasheet v2.4 gives a 32-bit RISC-V single core up to 160 MHz, 400 KB SRAM, 384 KB ROM, 2.4 GHz Wi-Fi and Bluetooth 5 (LE).", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-is-single-core-risc-v/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "It is one core, where the classic ESP32 in the M5Stick has two, so Wi-Fi shares time with my code. Bluetooth is LE only in this sheet's description, so check before planning on Classic audio.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-is-single-core-risc-v/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This is my first choice for a small connected sensor node.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-is-single-core-risc-v/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a servo loop runs alongside heavy Wi-Fi on the one core. Timing jitters, and the servo twitches for no obvious reason.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-is-single-core-risc-v/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "RISC-V is a different instruction set to the classic ESP32's, so anything compiled for one needs rebuilding for the other.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-is-single-core-risc-v/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Espressif's datasheet v2.4. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/m5stick-plus2-chip-and-memory", "proposal_id": "cube/esp32-c3-is-single-core-risc-v/proposal/6", "why": "one core against two"}, {"other": "cube/pico-is-a-cheap-dual-core", "proposal_id": "cube/pico-is-a-cheap-dual-core/proposal/6", "why": "two cores against one"}, {"other": "cube/self-balancing-needs-a-fast-loop", "proposal_id": "cube/self-balancing-needs-a-fast-loop/proposal/6", "why": "control loops against Wi-Fi"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/esp32-c3-pins-are-limited", "created_at": "2026-11-03T00:10:29Z", "content": "An ESP32-C3 has at most 22 GPIOs, and in-package flash takes 6 of them.", "created": "2026-11-03T00:10:29Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Espressif's datasheet gives 22 programmable GPIOs, with 3 strapping GPIOs and 6 allocated to in-package flash on those variants. Inputs allow 3.6V at most, with 40 mA source at maximum drive and 1000 mA cumulative.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-pins-are-limited/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "A dev board brings out only some of them, and which depends on the board. I read no dev board's own guide, so the usable count is unknown here.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-pins-are-limited/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use it with I2C parts or a PCA9685, not as a board for lots of direct wires.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-pins-are-limited/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a design needs ten switches and four LEDs. The pins run out, and a strapping pin gets used by mistake and stops the board booting.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-pins-are-limited/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "The input limit is the same 3.6V as the classic ESP32, so all the 5V warnings still apply.", "filled_by": "draft", "at": "2026-11-03T00:10:29Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-c3-pins-are-limited/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Espressif's datasheet v2.4. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-gpio-input-and-current-limits", "proposal_id": "cube/esp32-c3-pins-are-limited/proposal/6", "why": "the same 3.6V input limit"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/esp32-gpio-input-and-current-limits", "created_at": "2026-11-03T00:02:37Z", "content": "ESP32 pins allow 3.6V at most, and give about 40mA at full drive.", "created": "2026-11-03T00:02:37Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Espressif's datasheet lists allowed input voltage of -0.3 to 3.6 V, high-level source current of 40 mA at maximum drive on most pins, sink of 28 mA, and 1200 mA cumulative output.", "filled_by": "draft", "at": "2026-11-03T00:02:37Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-gpio-input-and-current-limits/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Forum posts still quote 12 mA from older documents, and that is the safer working figure. The 40 mA is a typical value at maximum drive strength, with the output sagging to 2.64 V, not a target to run at.", "filled_by": "draft", "at": "2026-11-03T00:02:37Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-gpio-input-and-current-limits/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Treat 12 mA as my working limit and 40 mA as what the chip can survive doing, and use a transistor above that.", "filled_by": "draft", "at": "2026-11-03T00:02:37Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-gpio-input-and-current-limits/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a project drives ten LEDs at 20 mA from ten pins. It is within the 1200 mA total, and each pin is already past the safer limit.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-gpio-input-and-current-limits/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This gives Espressif's figures for the existing 3.3V logic cube, and every sensor in this set depends on it.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-gpio-input-and-current-limits/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Read directly from Espressif's datasheet, version 5.3. The 12 mA working limit is my caution. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/dupont-jumpers-are-for-signals", "proposal_id": "cube/dupont-jumpers-are-for-signals/proposal/6", "why": "fine for signals, not power"}, {"other": "cube/esp32-c3-pins-are-limited", "proposal_id": "cube/esp32-c3-pins-are-limited/proposal/6", "why": "the same 3.6V input limit"}, {"other": "cube/esp32-logic-is-3v3", "proposal_id": "cube/esp32-gpio-input-and-current-limits/proposal/6", "why": "Espressif's figures for the same claim"}, {"other": "cube/first-power-on-checks", "proposal_id": "cube/first-power-on-checks/proposal/7", "why": "check pin voltages"}, {"other": "cube/led-resistor-at-3v3", "proposal_id": "cube/led-resistor-at-3v3/proposal/6", "why": "current per pin"}, {"other": "cube/static-can-kill-parts-silently", "proposal_id": "cube/static-can-kill-parts-silently/proposal/7", "why": "bare ESP32 pins have little margin"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/esp32-i2c-pins-are-configurable", "created_at": "2026-11-01T16:50:49Z", "content": "ESP32 can route I2C to most GPIO pins.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["esp32", "i2c"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The peripheral is routed through a pin matrix. Arduino on the classic ESP32 defaults to GPIO 21 for SDA and 22 for SCL.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Defaults differ across ESP32 variants, and some pins have boot-time roles. Check your exact board's pinout.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Handy, but I should stick to the defaults unless there is a reason, and write down any change.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-i2c-pins-are-configurable/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If pins were fixed, this choice would be made by the board and not by you.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Fills the ESP32 gap noted in the PCA9685 wiring cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the ESP32 can route I2C to most GPIO pins because the peripheral is routed through a pin matrix. However, I should be aware that defaults differ across ESP32 variants and some pins have boot-time roles, which may affect this claim. I will stick to the defaults unless there is a reason to change them and document any modifications.", "neighbours": [], "link_drafts": [{"other": "cube/m5stick-plus2-grove-port", "proposal_id": "cube/m5stick-plus2-grove-port/proposal/7", "why": "the port's I2C runs on chosen pins"}], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 1.0, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "esp32"}, {"lens": "FACT", "term": "arduino"}, {"lens": "COUNTER", "term": "default"}], "other": "cube/pca9685-wiring-for-controllers"}]}, {"id": "cube/esp32-logic-is-3v3", "created_at": "2026-11-01T16:50:49Z", "content": "ESP32 GPIO runs at 3.3V and is not 5V tolerant.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["esp32", "electronics"], "group": "General engineering notes", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "ESP32 inputs expect 3.3V logic, so feeding them 5V risks damage.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Some people report 5V surviving for a while, but that is not a rating. Pull-ups to 5V on an I2C bus are the common trap: match VCC to 3.3V.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "I will run the whole I2C bus at 3.3V and avoid the question.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-01T20:56:56Z"}, "FICTION": {"content": "A 5V I2C bus wired straight to an ESP32 might work for weeks and then fail.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Set PCA9685 VCC to 3.3V when driven from an ESP32.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": {"validator": "james", "note": "use a buck converter", "stale": false, "at": "2026-11-01T20:57:19Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T20:57:20Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/esp32-gpio-input-and-current-limits", "proposal_id": "cube/esp32-gpio-input-and-current-limits/proposal/6", "why": "Espressif's figures for the same claim"}, {"other": "cube/hc-sr04-echo-is-5v", "proposal_id": "cube/hc-sr04-echo-is-5v/proposal/6", "why": "a 5V output on a 3.3V input"}, {"other": "cube/li-ion-2s-is-8v4-full", "proposal_id": "cube/li-ion-2s-is-8v4-full/proposal/6", "why": "the controller also needs its own regulated rail"}, {"other": "cube/m5stick-plus2-grove-port", "proposal_id": "cube/m5stick-plus2-grove-port/proposal/6", "why": "same 3.3V limit on a port that offers 5V"}, {"other": "cube/microbit-power-limits", "proposal_id": "cube/microbit-power-limits/proposal/6", "why": "another 3.3V family board"}, {"other": "cube/sharp-gp2y0a21-ir-distance", "proposal_id": "cube/sharp-gp2y0a21-ir-distance/proposal/6", "why": "5V power with a read at 3.3V"}, {"other": "cube/ws2812b-needs-level-shifting", "proposal_id": "cube/ws2812b-needs-level-shifting/proposal/6", "why": "3.3V logic below the threshold"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/esp32-pull-ups-for-switches", "created_at": "2026-11-03T00:02:38Z", "content": "A contact switch to ground can use the ESP32's internal pull-up of about 45k, except on input-only pins.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Espressif's datasheet gives internal pull-up and pull-down resistance of 45 kilohms typical. It says the input-only pins lack pull-up and pull-down resistors, and there are 6 input-only GPIOs.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-pull-ups-for-switches/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "A 45k pull-up is weak, so long wires near motors can pick up noise, and an external 4.7k or 10k is steadier. That advice is general, not from Espressif.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-pull-ups-for-switches/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use the internal pull-up on the bench, and an external one on anything with long wires.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-pull-ups-for-switches/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a limit switch is wired to GPIO 35 with internal pull-up turned on in code. The pin floats, and the switch triggers by itself.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-pull-ups-for-switches/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "That is why the M5Stick's buttons on G35, G37 and G39 rely on the board's own circuit, which I infer rather than read.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/esp32-pull-ups-for-switches/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Espressif's datasheet, with general advice on external resistors. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/m5stick-plus2-buttons", "proposal_id": "cube/esp32-pull-ups-for-switches/proposal/6", "why": "buttons sit on input-only pins"}, {"other": "cube/switch-contacts-bounce", "proposal_id": "cube/switch-contacts-bounce/proposal/6", "why": "both shape a clean input"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/event-sourcing-needs-full-payloads", "created_at": "2026-11-01T16:50:49Z", "content": "Rebuilding state from a log needs the full state in the log.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["ledger", "substrate"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Event sourcing replays stored changes, so each event must carry what changed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Payloads grow fast, and old events must stay readable as the format changes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Not worth the storage yet. Audit is what I actually use the log for.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/event-sourcing-needs-full-payloads/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With complete events, a lost sc.db could be rebuilt from the log alone.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Contrasts with the audit-only events cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "Based on general knowledge rather than my own testing, this holds because replaying stored changes requires each event to carry what changed. However, the main limitation is that payloads grow rapidly and old events must remain readable as formats change.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/events-are-audit-not-replay", "created_at": "2026-11-01T15:36:10Z", "content": "Events are for audit, not for replay.", "created": "2026-11-01T15:36:10Z", "source": "SPEC section 5", "tags": ["substrate", "ledger"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "SPEC section 5: nothing reconstructs state from events, by deliberate choice. Replay is a v2 concern.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}, "COUNTER": {"content": "It limits recovery. capsule.written records only the foundation, not the state, so the log cannot rebuild a lost capsule.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}, "OPINION": {"content": "Fine while git holds sc.db. If recovery ever depends on the log, this needs another look.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:14:01Z"}, "FICTION": {"content": "With full state in every event, sc.db could be rebuilt from the log, at the cost of a much larger ledger.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}, "CONTEXT": {"content": "sc.db is tracked in git, which is the recovery path today.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}}, "validation": {"validator": "james", "note": "part of the forge stack", "stale": false, "at": "2026-11-02T21:14:39Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:14:41Z"}, "note_draft": null, "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 0.72, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "recovery"}], "other": "cube/binary-database-in-git"}]}, {"id": "cube/every-write-goes-through-substrate", "created_at": "2026-11-01T15:36:10Z", "content": "Every write is logged, through Substrate or by the engine that makes it.", "created": "2026-11-01T15:36:10Z", "source": "STRUCTURE write path; SPEC section 5", "tags": ["substrate", "ledger"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Capsule writes go through Substrate. trust.py, rules.py, feedback.py, parse.py, generate.py, scps and fill_styles.py write SQL directly and log their own events in the same transaction.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}, "COUNTER": {"content": "Engine events are not uniform. Parse cleanup logs one summary event for a whole session, and trust_scores rows log only when the score changes, so the log is not a row-by-row record.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}, "OPINION": {"content": "What matters is that every change leaves a record, not which function made it.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:54:52Z"}, "FICTION": {"content": "If everything went through Substrate.write, an engine could not make a link and its event atomic without a new method.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}, "CONTEXT": {"content": "docs/STRUCTURE.md claimed nothing outside substrate.py writes, corrected on 2026-11-01. Direct updates were also removed from kg_agent.py and the importers that day.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}}, "validation": {"validator": "james", "note": "According to the provided documentation, the claim holds because capsule writes use Substrate and direct engine writes log events within their own transactions, though I have not tested this code myself. However, the log is not a uniform row-by-row record as some engines only write summary events or log when specific values change.", "stale": false, "at": "2026-11-02T21:57:05Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:57:07Z"}, "note_draft": "According to the provided documentation, the claim holds because capsule writes use Substrate and direct engine writes log events within their own transactions, though I have not tested this code myself. However, the log is not a uniform row-by-row record as some engines only write summary events or log when specific values change.", "neighbours": [], "link_drafts": [{"other": "cube/log-everything-fail-loud", "proposal_id": "cube/log-everything-fail-loud/proposal/6", "why": "every write leaves a logged event"}, {"other": "cube/writes-need-token-and-unlock", "proposal_id": "cube/writes-need-token-and-unlock/proposal/7", "why": "both guard how writes happen"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/everything-is-capsules", "created_at": "2026-11-01T15:36:10Z", "content": "Everything can be represented as capsules.", "created": "2026-11-01T15:36:10Z", "source": "everything-is-capsules claim", "tags": ["substrate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as a claim. Foundations, rules, grammar, intents, contracts and cubes are all capsules, and the claim is the about target of scp-claim.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "SPEC section 1 names four primitives. Links and events are not capsules, and trust_scores is a separate table.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "It has held up as a way to store things. Links and events show it is a strong habit, not a literal law.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:57:15Z"}, "FICTION": {"content": "If links were capsules too, every traversal would cost more and the schema would be a single table.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "The founding idea of the substrate. Backed by obs-001, a score of 1.8 from james.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe the claim that everything can be represented as capsules holds because the foundations, rules, grammar, intents, contracts, and cubes are all encapsulated in this concept. However, I acknowledge that links and events are not considered capsules, and the schema would be overly complex if they were, as it would require a single table for every traversal. I have not tested this claim myself, but it is backed by obs-001 and has been observed to be a strong habit in storing information.", "stale": false, "at": "2026-11-02T21:57:20Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:57:27Z"}, "note_draft": "I believe the claim that everything can be represented as capsules holds because the foundations, rules, grammar, intents, contracts, and cubes are all encapsulated in this concept. However, I acknowledge that links and events are not considered capsules, and the schema would be overly complex if they were, as it would require a single table for every traversal. I have not tested this claim myself, but it is backed by obs-001 and has been observed to be a strong habit in storing information.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/first-power-on-checks", "created_at": "2026-11-03T00:22:03Z", "content": "Before first power-on: meter the leads, check for shorts, use a current limit, and keep hands clear.", "created": "2026-11-03T00:22:03Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "This gathers the other cubes: measure pack polarity, fit a fuse, check V+ is 6V or less after the regulator, keep 3.3V pins below 3.6V, confirm ground is common, and start the arm in a safe pose.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/first-power-on-checks/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "This is my synthesis, not a standard, and no list is complete. A current-limited bench supply for first power-on is general practice I did not source.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/first-power-on-checks/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Follow this every time with new wiring, however small the change.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/first-power-on-checks/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a small change goes straight onto the battery because it is only one wire. That one wire is on the wrong rail.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/first-power-on-checks/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the practical summary of the hardware cubes, so it is the one to read before building.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/first-power-on-checks/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "My summary of the other cubes, not a standard.", "neighbours": [], "link_drafts": [{"other": "cube/pca9685-servo-plug-orientation", "proposal_id": "cube/first-power-on-checks/proposal/10", "why": "plug orientation is worth checking first"}, {"other": "cube/li-ion-2s-too-high-for-servos", "proposal_id": "cube/first-power-on-checks/proposal/6", "why": "check V+ first"}, {"other": "cube/esp32-gpio-input-and-current-limits", "proposal_id": "cube/first-power-on-checks/proposal/7", "why": "check pin voltages"}, {"other": "cube/common-ground-between-supplies", "proposal_id": "cube/first-power-on-checks/proposal/8", "why": "confirm a common ground"}, {"other": "cube/fuse-the-battery-positive-near-the-pack", "proposal_id": "cube/first-power-on-checks/proposal/9", "why": "fit the fuse first"}, {"other": "cube/static-can-kill-parts-silently", "proposal_id": "cube/static-can-kill-parts-silently/proposal/6", "why": "static damage can show at first power-on"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/foundational-cubes-are-rigid", "created_at": "2026-11-03T00:45:23Z", "content": "Foundational cubes follow fixed rules that the code enforces and no shortcut can bypass.", "created": "2026-11-03T00:45:23Z", "source": "Written by Claude from this project's code, see source/project-security", "tags": ["security", "foundational"], "group": "Foundations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The code refuses to bulk-accept a foundational face, refuses to validate one unless all five faces are accepted, refuses a validation note copied from the suggestion, and will not let models draft or suggest for one.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/foundational-cubes-are-rigid/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "These rules are only enforced through kg_cube.py and kg_fill.py. Anyone with direct access to sc.db can still change it, and the rules check process, not truth.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/foundational-cubes-are-rigid/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Slowing down is the point here, as these are the cubes that can hurt someone if wrong.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/foundational-cubes-are-rigid/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a tired evening of bulk accepting reaches these cubes. The code says no, and that is the moment the rule earns its place.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/foundational-cubes-are-rigid/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "They sit in three groups around you at the centre of the field: orange for safety, pink for security and blue for preferences.", "filled_by": "draft", "at": "2026-11-03T00:45:23Z", "unread": true, "pending": true, "proposal_id": "cube/foundational-cubes-are-rigid/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/models-word-people-decide", "proposal_id": "cube/foundational-cubes-are-rigid/proposal/6", "why": "the rule enforced"}, {"other": "cube/contract-as-data-enforcement-as-code", "proposal_id": "cube/foundational-cubes-are-rigid/proposal/7", "why": "the rules are enforced in code"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/fuse-the-battery-positive-near-the-pack", "created_at": "2026-11-03T00:22:03Z", "content": "Fuse the positive lead close to the battery, rated to protect the wire.", "created": "2026-11-03T00:22:03Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "FIRST Tech Challenge rules require an in-line fuse on the main battery's positive cable. A forum citing ABYC marine standards puts the fuse within about 7 inches of the terminal. Sources agree the fuse protects the wire.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Those are robot competition and marine rules, not a standard for hobby packs, and the forum post is second-hand. That the fuse must be below the wire's rating is my general knowledge. A fuse does nothing upstream of itself.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Fit one on every pack that leaves the bench, sized between normal peak current and the wire's limit.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a chafed wire shorts at the servo end with no fuse. The wire itself becomes the fuse, inside the robot.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Forum reports warn lithium packs can deliver huge short-circuit currents, and a fuse needs enough interrupt rating. Those numbers were for larger packs.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From competition rules and forum posts, plus general knowledge. No hobby standard was found.", "neighbours": [], "link_drafts": [{"other": "cube/first-power-on-checks", "proposal_id": "cube/first-power-on-checks/proposal/9", "why": "fit the fuse first"}, {"other": "cube/wire-current-ratings-depend-on-assumptions", "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/6", "why": "the fuse protects the wire"}, {"other": "cube/li-ion-30q-current-rating", "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/7", "why": "fuses sit against pack current"}, {"other": "cube/xt60-is-30a-continuous", "proposal_id": "cube/fuse-the-battery-positive-near-the-pack/proposal/8", "why": "the fuse and the connector should suit the same current"}, {"other": "cube/shape-sets-the-power-budget", "proposal_id": "cube/shape-sets-the-power-budget/proposal/8", "why": "fuse for the chosen shape"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/gate-checks-structure-not-reasoning", "created_at": "2026-11-01T15:36:10Z", "content": "The gate judges references, not reasoning.", "created": "2026-11-01T15:36:10Z", "source": "keystone-gate/README.md design decisions", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The checkers test IDs, names, numbers, quotes and provenance. Whether the reasoning is right is left to the human.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "A lowercase invented word can pass, and a true-looking answer can be wrong. Passing the gate can read as more assurance than it gives.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "This is the right limit. A pass means the references are real, and I still have to read the answer.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:00:36Z"}, "FICTION": {"content": "An automatic judge of reasoning would be a harder problem than the one the gate solves, and would itself need gating.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "The human validation face, worth 20 percent, is where reasoning gets judged.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I note from the design documentation that the gate only checks details such as IDs, quotes and provenance, leaving the reasoning to human review. However, passing the gate can give a false sense of assurance, as flawed reasoning or invented words can still pass.", "stale": false, "at": "2026-11-02T22:00:41Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:00:46Z"}, "note_draft": "I note from the design documentation that the gate only checks details such as IDs, quotes and provenance, leaving the reasoning to human review. However, passing the gate can give a false sense of assurance, as flawed reasoning or invented words can still pass.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/gear-backlash-limits-precision", "created_at": "2026-11-01T16:50:49Z", "content": "Backlash limits how repeatable a joint can be.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Play in the gears means a joint settles differently when approached from opposite directions.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Commanded angle is not achieved angle. Hobby servos report no position, so software cannot see the error.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "I should design for this from the start instead of expecting software to hide it.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/gear-backlash-limits-precision/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With zero backlash, calibration values would hold in both directions.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Stacks along the arm, so errors add up at the tip.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the play in the gears can cause a joint to settle differently when approached from opposite directions, leading to reduced repeatability. However, the main limit of this claim is that it relies on the assumption that backlash is entirely eliminated, which may not be possible in practice, and therefore calibration values may not hold in both directions.", "neighbours": [], "link_drafts": [{"other": "cube/bipeds-need-active-balance", "proposal_id": "cube/bipeds-need-active-balance/proposal/6", "why": "backlash matters most here"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/grove-is-for-signals", "created_at": "2026-11-03T00:10:28Z", "content": "Grove HY2.0 connectors are for sensors, at up to about 2A, not for motors.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A Chinese datasheet gives 2.0A for the HY2.0 connector, and a retailer lists 2A. A Grove cable listing gives 1A maximum, so the cable may be the limit.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/grove-is-for-signals/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "These figures are from a part sheet and retailers rather than M5Stack or Seeed. No servo current from an M5Stick is sensible here anyway.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/grove-is-for-signals/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Keep Grove for I2C sensors, and never feed a servo from it.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/grove-is-for-signals/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an MG996R is run from the Stick's Grove port. A 2.5A stall meets a 1A cable and a 200mAh battery.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/grove-is-for-signals/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the M5Stick Grove port cube and the VL53L0X, which draws very little by comparison.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/grove-is-for-signals/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a part sheet and retailers. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/m5stick-plus2-grove-port", "proposal_id": "cube/grove-is-for-signals/proposal/6", "why": "the current limit on that port"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/hc-sr04-echo-is-5v", "created_at": "2026-11-03T00:02:38Z", "content": "A 5V HC-SR04 needs its Echo line divided down for an ESP32.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The HC-SR04 sheet lists 5V supply, and Trigger and Echo as TTL signals. Espressif allows 3.6V at most on an input. A guide suggests 1k and 2k as a divider, which gives about 3.3V.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-echo-is-5v/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The sheet does not state Echo's voltage outright, so that it is 5V is from guides. Two 10k resistors give 2.5V, just above the 0.75 x VDD (2.48V) high threshold, so that divider is marginal.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-echo-is-5v/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use a 3.3V version if I am buying new, and otherwise the 1k and 2k divider.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-echo-is-5v/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose Echo goes straight to a pin and it works for weeks. The chip has been run beyond its limit the whole time, and it may fail later for no visible reason.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-echo-is-5v/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "An HC-SR04-33 sheet lists 3.3V to 5V working voltage. One guide says range falls by about a metre at 3.3V, and I could not confirm that.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-echo-is-5v/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From the HC-SR04 sheets, Espressif and guides. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-logic-is-3v3", "proposal_id": "cube/hc-sr04-echo-is-5v/proposal/6", "why": "a 5V output on a 3.3V input"}, {"other": "cube/uno-r3-is-5v-with-2kb-ram", "proposal_id": "cube/uno-r3-is-5v-with-2kb-ram/proposal/6", "why": "the Uno needs no divider"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/hc-sr04-range-and-limits", "created_at": "2026-11-03T00:02:38Z", "content": "An HC-SR04 reads 2cm to 4m within a 15 degree cone, on hard flat targets.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The ElecFreaks sheet gives 2cm to 400cm, a 15 degree measuring angle, 15mA, and a 10us trigger pulse. It also says 40Hz, which is a typo for the 40kHz ultrasonic burst that other sources give.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-range-and-limits/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Accuracy is listed as 3mm, which is a best case. Foam, fabric and angled surfaces absorb or deflect the sound. The speed of sound also changes with temperature, so readings drift.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-range-and-limits/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Good and cheap for detecting a wall, and poor for measuring precisely.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-range-and-limits/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a robot meets a sofa. The sound soaks in, no echo returns, and it reports open space and drives on.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-range-and-limits/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Ultrasonic does not care about colour or light, so it covers the gaps of optical sensors.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/hc-sr04-range-and-limits/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From the ElecFreaks sheet, with the surface limits from guides. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/no-one-distance-sensor-sees-everything", "proposal_id": "cube/hc-sr04-range-and-limits/proposal/6", "why": "sound's blind spots"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/hexapods-stay-stable-walking", "created_at": "2026-11-03T00:31:16Z", "content": "A hexapod can always keep three legs down, so it stays stable while walking.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A Zbotic guide says a hexapod standing is passively stable, and a tripod gait keeps three legs down. Static stability needs the centre of mass over the support polygon formed by the feet.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/hexapods-stay-stable-walking/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The guide is a retailer's. That 18 servos at 3 per leg is usual is from a product page. That is a heavy budget: 18 MG90S moving draw about 4.5A, and 12.6A if all stall, using your cubes.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/hexapods-stay-stable-walking/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The most forgiving legged robot, and the most expensive in servos and current.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/hexapods-stay-stable-walking/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a hexapod runs from a 3A BMS. It stands well, and on the first step up a slope it cuts out.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/hexapods-stay-stable-walking/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "About 40 minutes of runtime is possible from 3.1Ah at 4.5A, which is my arithmetic from the battery runtime cube.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/hexapods-stay-stable-walking/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a retailer's guide, plus my arithmetic. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/mg90s-stall-current", "proposal_id": "cube/hexapods-stay-stable-walking/proposal/6", "why": "12.6A with 18 servos"}, {"other": "cube/li-ion-30q-current-rating", "proposal_id": "cube/hexapods-stay-stable-walking/proposal/7", "why": "what the pack must supply"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/i2c-bus-length-limits", "created_at": "2026-11-01T16:50:49Z", "content": "I2C is designed for short connections on one board or nearby.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["i2c", "wiring"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Bus capacitance limits rise time, and the standard allows 400 pF. Long wires reach that quickly.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Long runs through a moving arm may work on the bench and then fail in use, especially near noisy servo wiring.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Keep the controller close to the servo board and run power and signal apart.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/i2c-bus-length-limits/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If I2C ran down a two metre arm unbuffered, errors would appear only when the servos moved.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "A bus extender, or a controller near the board, is the usual answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I agree with the claim that I2C is designed for short connections on one board or nearby, as the standard allows for a bus capacitance of 400 pF, which can lead to rise time limitations with long wires. However, I believe that this limitation can be mitigated with the use of a bus extender or a controller near the board, rather than relying on physical proximity.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/i2c-needs-pull-up-resistors", "created_at": "2026-11-01T16:50:49Z", "content": "I2C lines are open-drain and need pull-up resistors.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["i2c", "electronics"], "group": "General engineering notes", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Devices only pull SDA and SCL low, so resistors must pull them high. Many breakouts include them.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Several boards on one bus put their pull-ups in parallel, and the combined resistance can become too strong. Check the total when chaining boards.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Normally handled by the breakout. Worth checking the total when chaining boards.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-01T20:55:59Z"}, "FICTION": {"content": "Without pull-ups, the bus would sit low and no device would answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Relevant to chaining PCA9685 boards.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": {"validator": "james", "note": "dont forget the local grounding", "stale": false, "at": "2026-11-01T20:56:39Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T20:56:40Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/vl53l0x-voltage-and-address", "proposal_id": "cube/vl53l0x-voltage-and-address/proposal/6", "why": "it shares the I2C bus"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/idempotent-imports-make-re-runs-safe", "created_at": "2026-11-01T16:50:49Z", "content": "Re-running an import should change nothing.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["substrate", "ingestion"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "An idempotent step can be repeated after a failure without creating duplicates.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "It proves only that nothing new was written, not that the first run was right.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Essential for anything I run by hand, because I will run it twice.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/idempotent-imports-make-re-runs-safe/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without it, every retried import would add duplicate capsules.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "absorb_repo and the seed scripts follow this.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "Based on general knowledge, an idempotent import step can be repeated without creating duplicates, which is essential for anything I run manually. However, I have not tested this myself, and re-running it only proves that nothing new was written rather than confirming the first run was correct.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/inverse-kinematics-maps-position-to-angles", "created_at": "2026-11-01T16:50:49Z", "content": "Inverse kinematics turns a target position into joint angles.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "software"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Given a target for the tip, inverse kinematics computes the angles that reach it.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Results are only as good as the measured link lengths, and many positions have several solutions or none.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Worth doing once the joints are calibrated. Before that it gives precise-looking wrong answers.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/inverse-kinematics-maps-position-to-angles/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without it, every move would be taught by hand, joint by joint.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Backlash and calibration errors limit how exact the result can be.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "This relies on general knowledge rather than my own testing, as inverse kinematics computes the joint angles required to reach a target tip position. However, its accuracy is limited by backlash, link length errors, and calibration, with some positions having multiple solutions or none.", "neighbours": [], "link_drafts": [{"other": "cube/set-software-joint-limits", "proposal_id": "cube/set-software-joint-limits/proposal/6", "why": "inverse kinematics can ask for angles past a limit"}, {"other": "cube/six-joints-for-any-pose", "proposal_id": "cube/six-joints-for-any-pose/proposal/6", "why": "how joints are solved"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/it-is-intended-for-research-simulation", "created_at": "2026-11-02T06:36:34Z", "content": "It is intended for research, simulation, behavioural modelling, and experimenting with sovereign AI stacks.", "created": "2026-11-02T06:36:34Z", "source": "Worded by gemini from the keystone_gate README", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 0.8, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The keystone_gate README states that Keystone Gate is intended for research, simulation, behavioural modelling, and experimenting with sovereign AI stacks.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:14:26Z"}, "COUNTER": {"content": "A stated scope declares intent, but it doesn’t restrict use. Unless the licence says otherwise, nothing stops someone deploying it beyond that scope. The list also reads broader than what Keystone Gate actually does. “Simulation” and “behavioural modelling” describe its sibling app Replicant more than a gated, human-verified knowledge system, so the scope may have bled across from shared README wording.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:14:39Z"}, "OPINION": {"content": "Scoping Keystone Gate to research and experimentation is sensible. It sets honest expectations for a system still being built, and it keeps the focus on whether the approach works rather than on production guarantees.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:14:51Z"}, "FICTION": {"content": "Suppose a researcher uses Keystone Gate to sort claims for a paper and cites cubes as settled. Several of those cubes are still at 0.50 standing with unaccepted AI drafts. The system worked as designed, because unvalidated cubes are only working material. But the researcher treated “in the gate” as “verified”, which is the exact mistake the human-validation face exists to prevent.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:15:05Z"}, "CONTEXT": {"content": "Keystone Gate is a sibling app to Replicant, built on the shared Forge tools in the-forge repo. In it, an LLM handles language only and never decides what’s true. Rule-based tagging and cubes do the work: each cube fills five lens faces plus a final human-validation face, and only complete cubes become eligible for trust attestation. James Gilbert is the author, and the scope statement is his.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:15:18Z"}}, "validation": null, "attestation": null, "note_draft": "According to the project's README file, this claim accurately reflects the stated scope of the software. However, documented intent does not guarantee actual functionality or prevent misuse, and I have not tested the software myself.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/james-builds-for-choice-not-money", "created_at": "2026-11-02T23:11:39Z", "content": "James builds because he chooses to, not for money.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private", "defining"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "James says money is something humanity decided mattered, and that he builds because he chooses to live.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Giblets Forge is a trading name, so money is in the picture somewhere, even if it isn't the point.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "It explains the shape of the work: sovereign, open, and built to be owned rather than sold.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a buyer offers to fund the Forge Stack on the condition that it closes. The answer shows whether this cube holds.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "It fits the motto: \"Now forge yours.\"", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-builds-for-choice-not-money/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/james-carpenter-by-trade", "created_at": "2026-11-02T23:11:39Z", "content": "James is a carpenter by trade.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private", "defining"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He trained on chisels and hammers, and was self-employed with routers and jigs three years later.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Jigs speed up cuts, but they also constrain them. A tool that makes things fast can make the wrong thing fast.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The router-and-jig analogy is the clearest way he explains what AI does for him: it amplifies skill without replacing judgement.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose he'd stayed with chisels only. The ideas would exist, but most would still be parked.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "The habit of building fixtures carried over: capsules, gates and guards are jigs for code.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-carpenter-by-trade/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "link_drafts": [{"other": "cube/cartesian-machines-are-simple-to-control", "proposal_id": "cube/cartesian-machines-are-simple-to-control/proposal/6", "why": "jigs and fixtures"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/james-not-one-title", "created_at": "2026-11-02T23:11:39Z", "content": "James won't be boxed in by a title.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private", "defining"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He codes, 3D-models, draws, paints, and builds robots, 3D printers and systems.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Breadth has a cost, and many projects sit at idea stage. Range and finishing pull against each other.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The Forge Stack is what makes the breadth coherent, since one substrate sits under many projects.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose he picked one title for a year. Whether that would help or hurt is an open question.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "He's self-taught, and his brand is Giblets Forge.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-not-one-title/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/james-parks-ideas", "created_at": "2026-11-02T23:11:39Z", "content": "James parks ideas until they fit.", "created": "2026-11-02T23:11:39Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private", "defining"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He documents ideas fully, then shelves them, sometimes for years.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Parked specs go stale, because the tools and assumptions they relied on move on.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Parking only works if each parked spec says what it's waiting for.", "filled_by": "draft", "at": "2026-11-02T23:11:39Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an old spec is revived and built exactly as written, against a world that has moved on.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Canon's FACT and COUNTER faces suit reviving an old idea: check what's still true.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-parks-ideas/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/james-qinetiq-malvern", "created_at": "2026-11-02T23:11:40Z", "content": "James moved from facilities at OPG to QinetiQ Malvern.", "created": "2026-11-02T23:11:40Z", "source": "Written by Claude from conversation with James", "tags": ["james", "private", "defining"], "group": "James Gilbert", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "He started at QinetiQ in September 2026, in a role that includes cutting keys, which he likes. He's relocating to the Malvern area.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-qinetiq-malvern/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "One profile line still says he works at Oxford PharmaGenesis. Only the latest one is true.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-qinetiq-malvern/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "The key-cutting work has already produced a project idea, the key blank cross-reference tool.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-qinetiq-malvern/proposal/3", "drafted_by": "claude"}, "FICTION": null, "CONTEXT": {"content": "He previously wrote a tribal-knowledge handover for OPG facilities before leaving.", "filled_by": "draft", "at": "2026-11-02T23:11:40Z", "unread": true, "pending": true, "proposal_id": "cube/james-qinetiq-malvern/proposal/4", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Confirmed by James, about himself, 2026-11-02.", "neighbours": [], "link_drafts": [{"other": "cube/private-text-stays-on-this-machine", "proposal_id": "cube/private-text-stays-on-this-machine/proposal/6", "why": "personal cubes are covered"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/jig-can-be-used-to-build", "created_at": "2026-11-02T06:42:29Z", "content": "JIG can be used to build a wide range of applications, including habit trackers, home-automation logic, game rules, and compliance checklists.", "created": "2026-11-02T06:42:29Z", "source": "Worded by ollama from the JIG README", "tags": ["repo", "jig", "private"], "group": "JIG", "repo": "JIG", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"What you can build Anything you can express as facts and rules over them: habit trackers, home-automation logic, game rules (including mystery games with a provably solvable truth capsule), compliance checklists and strategy audits. Some things need features
