ded by ollama from the Replicant README", "tags": ["repo", "replicant"], "group": "Replicant", "repo": "Replicant", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The Replicant repo (github.com/JamesTheGiblet/replicate) contains working Python (python/) and Rust (rust/) implementations of the core swarm sim, plus a Rust-to-WASM build that runs in the browser. Both have been run and benchmarked against each other.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:11:33Z"}, "COUNTER": {"content": "“Parallel implementations” overstates how closely the two match. Given the same seed, they produce different results, because Python’s random and Rust’s StdRng are different PRNGs. “Stable core” is backed by a single long run at 100 agents, not by a test suite across scales. The README itself was AI-drafted, so its framing shouldn’t be taken as evidence.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:11:51Z"}, "OPINION": {"content": "v1.0 is a fair label for a research sim that is built, tested and running. It would be an unfair label for a production framework. The label holds as long as the scope is stated alongside it.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:12:09Z"}, "FICTION": {"content": "Suppose a researcher runs seed 42 through both versions and expects identical output. Python gives 9 claims and Rust gives 35, so they assume one version is broken. In fact both work. The two languages use different random number generators, and the researcher had mistaken “same algorithm” for “same trajectory”.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:12:26Z"}, "CONTEXT": {"content": "James Gilbert wrote and maintains Replicant, a bio-inspired swarm framework with λ-based trust, quarantine and expulsion. The Python version was the prototype, and the Rust version was built for scale. James drafted the README with help from an AI model run through Ollama, so its claims are his to back up. The human validation below does that.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:12:45Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nBoth implementations exist and run. The repo also has a WASM build of the Rust sim, rust/wasm/.\nBenchmarked with a clean cargo build --release harness. Rust was faster at every tested scale: average 13.1×, range 3.0×–26.3×.\nA 100-agent, 10,000-tick run stabilised and self-optimised resource allocation.\nThe detection pipeline was verified end to end. Fiction claims were adjudicated false, λ penalties were logged, and quarantine (λ\u003c0.60) and expulsion (λ\u003c0.15) fired.\nKnown divergence: with the same seed, the two implementations produce different trajectories because they use different PRNGs.\nKnown hotspot: Rust showed a nonlinear timing jump at 100 agents, likely the linear-scan spatial query flagged in ROADMAP.md.\nScope: v1.0 means the research sim is built, tested and running. It does not mean production-ready for critical third-party use.", "stale": false, "at": "2026-11-02T22:13:06Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:13:11Z"}, "note_draft": "The README states v1.0 and its table shows a working core simulation in both Python and Rust, with passing test counts. I have not run those tests here, and the same table shows the HAL seal and tick-level signing are unfinished.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/replicant-is-a-hybrid-bio-inspired", "created_at": "2026-11-02T06:36:21Z", "content": "Replicant is a hybrid bio-inspired swarm framework built on the Forge Stack.", "created": "2026-11-02T06:36:21Z", "source": "Worded by ollama from the Replicant README", "tags": ["repo", "replicant"], "group": "Replicant", "repo": "Replicant", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: “A hybrid bio-inspired swarm framework, built on the Forge Stack.”", "filled_by": "human", "unread": false, "at": "2026-11-02T22:22:26Z"}, "COUNTER": {"content": "It’s fair. It raises real gaps: the mocked HAL seal, the missing Rust HAL, design-only tick signing, and the undefined “hybrid”. Your validation answers them below.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:22:33Z"}, "OPINION": {"content": "The description is accurate as a statement of what Replicant is. The more interesting claim sits underneath it: that a pheromone trail can be treated as a claim to be trust-scored, rather than a fact to be followed.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:22:46Z"}, "FICTION": {"content": "Suppose Replicant runs with the Forge Stack layer switched off. Pheromones still decay and agents still follow trails, but nothing scores who laid them. A fiction_planter lays false trails, the swarm follows them, and nothing quarantines it. Without the ledger, Replicant is ordinary stigmergy, and the stack is what turns trails into accountable claims.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:22:57Z"}, "CONTEXT": {"content": "This is the opening line of Replicant’s README. Replicant is a Forge Stack consumer and a sibling to Keystone Gate. “Hybrid” means it combines mechanisms from seven species: ant pheromone stigmergy, bee waggle-dance signalling, termite blueprint-less construction, social spider collective capture, paper wasp individual recognition, naked mole-rat energy efficiency and aphid self-replication. Each agent’s trust score comes from an append-only ledger. James Gilbert is the author.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:23:07Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nHybrid: it combines the seven species mechanisms above across four layers: Sensing, Signalling, Action and Reproduction.\nBio-inspired swarm: pheromone-style claims decay per tick and are archived below 0.01 strength. Adversaries (fiction_planter, hoarder, killer, poisoner) are detected, penalised through λ, quarantined (λ\u003c0.60) and expelled (λ\u003c0.15). This was verified end to end.\nBuilt on the Forge Stack: Replicant is a stack consumer with its own namespace and its own consumer ledger anchored to root, under MSL-1.0.\nFramework: it’s already being reused beyond the core sim, applied to a 20-servo biped in which each servo, sensor and state is an agent.\nKnown gaps (agreeing with the COUNTER): the HAL seal is mocked in Python and missing in Rust, and tick-level signing is design only.", "stale": false, "at": "2026-11-02T22:23:25Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:23:29Z"}, "note_draft": "This matches how the README describes the project, and the repo has real Python and Rust code. 'Framework' is the project's own word, and I have not tested how far it works apart from the Forge Stack.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/repos-store-metadata-not-bytes", "created_at": "2026-11-01T15:36:10Z", "content": "Repo capsules store metadata and symbols, not file contents.", "created": "2026-11-01T15:36:10Z", "source": "README limits; SPEC section 13", "tags": ["substrate", "ingestion"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Absorption stores hashes, sizes, imports and symbol names. grep on disk stays the tool for content.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "So open questions such as what does this code do cannot be answered, and the index goes stale until re-absorbed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Right choice. The index is for finding things, and git already holds the bytes, as long as the absorbed files are committed.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:26:31Z"}, "FICTION": {"content": "Suppose sc.db stored file contents. Every absorb would copy the whole repo into SQLite, and every edit would leave the copy stale until the next absorb. Searching it would just be a slower grep over an out-of-date mirror of what git already tracks.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:26:42Z"}, "CONTEXT": {"content": "absorb_repo.py --prune, added 2026-11-01, removes capsules for files that have gone.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nRepo absorption stores only metadata per file: hash, size, imports and symbol names. No file contents enter sc.db.\nContent questions go to grep on disk, or to git. The index answers “where is X”, not “what does X do”.\nStaleness is accepted. The index is only as current as the last absorb. absorb_repo.py --prune (added 2026-11-01) removes capsules for deleted files.\nAbsorb runs against committed state, so every stored hash maps to bytes that git can retrieve.", "stale": false, "at": "2026-11-02T22:26:55Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:27:00Z"}, "note_draft": "I believe the repo capsules store metadata and symbols, as stated in the README limits and SPEC section 13, because the absorption process stores hashes, sizes, imports, and symbol names. However, I am uncertain about the limitations of this approach, as it may not provide a complete understanding of the code, and the index may become stale until re-absorbed. I consider this to be the right choice, as git already holds the file contents and I only need to find things.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/schema-changes-are-rare-and-logged", "created_at": "2026-11-01T15:36:10Z", "content": "schema.sql changes only by reviewed, logged migration.", "created": "2026-11-01T15:36:10Z", "source": "SPEC section 7 and section 11", "tags": ["substrate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "One change since migration: the unused rules table was dropped and logged as a schema.migration event.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "There is no migration framework. Changes are manual, so the rule depends on discipline.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "The stable schema is worth protecting. But part of its stability comes from growth moving into state_json, so the schema is stable because the shape-changing happens elsewhere. That JSON needs its own discipline, or the drift just relocates.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:28:16Z"}, "FICTION": {"content": "If every feature had added tables, the substrate would not have survived fifteen layers unchanged.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "All other growth has been additive in state_json. This is the project's main proof of design.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nschema.sql has changed once since the migration: the unused rules table was dropped, and the change was logged as a schema.migration event.\nAll other growth has been additive, inside state_json.\nThere is no migration framework. Changes are manual and rely on discipline, as the COUNTER says.\n“Reviewed” means self-reviewed: I’m the only operator. It is deliberate and logged, but it is not independent review.", "stale": false, "at": "2026-11-02T22:28:34Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:28:39Z"}, "note_draft": "The schema has remained stable for fifteen layers due to the manual, reviewed, and logged migration process. However, the absence of a formal migration framework introduces a risk of inconsistent changes, relying on discipline and individual responsibility to maintain the integrity of the schema.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/scp-substrate-is-a-personal-knowledge", "created_at": "2026-11-02T06:37:51Z", "content": "SCP Substrate is a personal knowledge store in one SQLite file, with tools for querying it, tracking trust in claims, and examining claims as cubes.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"A personal knowledge store in one SQLite file, with tools for querying it, tracking trust in claims, and examining claims as cubes.\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:15:06Z"}, "COUNTER": {"content": "It is not all in one file. Foundations start in sc.json, signing keys and the editing password hash live in the home folder, and API keys live in .env. There is no content search, and trust scores are not calibrated against outcomes, so 'tracking trust' records evidence rather than measuring how reliable a claim is.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:17:24Z"}, "OPINION": {"content": "One file is the right trade for a single-user project: it is easy to back up, inspect and move. I would keep it that way until a second writer is needed, and accept the limits that come with it.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:19:31Z"}, "FICTION": {"content": "Suppose sc.db were lost tomorrow with no copy. The code would rebuild from Git, but every attestation, validation and event would be gone. Would a second copy still count as one file, or does the claim only hold while nothing goes wrong?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:17:29Z"}, "CONTEXT": {"content": "This is the opening line of the project's README. It sets the scope: one person's data, stored locally, with the cubes as a way of examining claims rather than only storing them. The README's Limits section gives the conditions on it.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:17:32Z"}}, "validation": {"validator": "james", "note": "I built this and use it, so I know it stores my knowledge in sc.db and has the query, trust and cube tools. It holds as a description of where the data lives, but not literally: keys and settings sit outside that file.", "stale": false, "at": "2026-11-02T21:19:40Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:19:54Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/scp-substrate-is-a-single-user", "created_at": "2026-11-02T06:37:51Z", "content": "SCP Substrate is a single-user project and is early, with known limitations and issues.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"It is a single-user project and it is early. Read [Limits](#limits) and [Known issues](#known-issues) before relying on it.\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:21:23Z"}, "COUNTER": {"content": "This is the second line of the README, placed before any instructions, and it points to the Limits and Known issues sections. It matters because trust scores are not calibrated and some features have not been fully tested, so the project states its limits before describing what it does.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:21:11Z"}, "OPINION": {"content": "This is the right warning to put first. I would rather undersell it and say what does not work than have someone trust it too far. I will drop 'early' only when I can say what changed.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:21:25Z"}, "FICTION": {"content": "Suppose someone found the project and relied on it for their own decisions, without reading the Limits. Would the warning have done its job, or does a line at the top only protect the author? What would need to be different for them to rely on it safely?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:21:29Z"}, "CONTEXT": {"content": "This is the second line of the README, placed before any instructions, and it points to the Limits and Known issues sections. It matters because trust scores are not calibrated and some features have not been fully tested, so the project states its limits before describing what it does.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:21:31Z"}}, "validation": {"validator": "james", "note": "I built this and I'm the only person using it, so single-user is accurate. Early is my own judgement rather than a measure: parts are tested and in daily use, but others aren't finished, and the known issues are listed in the README.", "stale": false, "at": "2026-11-02T21:21:56Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:22:02Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/servo-pulse-width-convention", "created_at": "2026-11-01T16:50:48Z", "content": "Hobby servos read position from pulse width, around 1 to 2 ms.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["servo", "pwm"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Position comes from the width of a repeating pulse, commonly 1 to 2 ms within a 20 ms frame at 50 Hz.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The range varies by model, and many servos travel further on 0.5 to 2.5 ms. Check the datasheet before trusting an angle.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Treat the numbers as a starting point and calibrate each servo.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/servo-pulse-width-convention/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If every servo honoured the same pulse range, calibration would not be needed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Explains why the PCA9685 frequency and calibration cubes matter together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the standard electronics principle states that position comes from the width of a repeating pulse, commonly 1 to 2 ms within a 20 ms frame at 50 Hz. However, I am aware that the range may vary by model, and calibration is often necessary to ensure accurate positioning.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/servo-stall-current", "created_at": "2026-11-01T16:50:48Z", "content": "A servo draws its peak current at stall.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["servo", "power"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A blocked or heavily loaded servo draws far more current than one moving freely, and that peak sets the supply requirement.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Datasheet stall current is rarely printed on cheap servos, so the supply margin is often a guess until current is measured.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Size the supply from measured stall current, not the typical figures.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/servo-stall-current/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If an arm joint jammed at full torque, one stalled servo could sag the voltage for every other joint.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Pairs with the PCA9685 supply sizing cube. Measure current under load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because a blocked or heavily loaded servo draws significantly more current than one moving freely, and the peak current is a critical factor in determining the supply requirement. However, I note that the stall current figure is often not provided on cheap servos, making it necessary to rely on measured data to ensure accurate supply sizing.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/servos-and-the-esp32-should-have", "created_at": "2026-11-01T17:11:42Z", "content": "Servos and the ESP32 should have separate power supplies.", "created": "2026-11-01T17:11:42Z", "source": "written by james", "tags": ["servo", "power", "esp32", "robot-arm"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Servos draw sudden current peaks when they start or stall. On a shared supply those peaks can make the voltage sag and reset the ESP32.", "filled_by": "human", "unread": false, "at": "2026-11-01T17:11:42Z"}, "COUNTER": {"content": "Separate supplies add wiring and cost, and they still need a common ground. Servo current through a thin shared ground can still cause noise.", "filled_by": "human", "unread": false, "at": "2026-11-01T17:11:42Z"}, "OPINION": {"content": "best option for multipul servo control", "filled_by": "human", "unread": false, "at": "2026-11-01T17:47:44Z"}, "FICTION": {"content": "If an arm shared one small supply, a big shoulder move could restart the controller mid-motion and drop every joint at once.", "filled_by": "human", "unread": false, "at": "2026-11-01T17:11:42Z"}, "CONTEXT": {"content": "Follows from the PCA9685 guide's warning about powering servos from the controller, and from the ESP32 brownout cube.", "filled_by": "human", "unread": false, "at": "2026-11-01T17:11:42Z"}}, "validation": {"validator": "james", "note": "servos stall load means boards brown out", "stale": false, "at": "2026-11-01T17:48:38Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T17:48:40Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": [{"lambda": 1.22, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "warning"}, {"lens": "FICTION", "term": "big"}, {"lens": "FACT", "term": "peaks"}], "other": "cube/esp32-brownout-resets"}, {"lambda": 0.64, "confirmed": false, "shared": [{"lens": "COUNTER", "term": "ground"}, {"lens": "CONTEXT", "term": "controller"}], "other": "cube/common-ground-between-supplies"}]}, {"id": "cube/set-software-joint-limits", "created_at": "2026-11-01T16:50:49Z", "content": "Keep joint limits in software, below the physical stops.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "safety", "calibration"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Clamp every commanded angle to a calibrated safe range before it reaches the servo.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A limit only protects what it knows. A wrong calibration or a collision with the arm's own body still gets through.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "No move should reach a servo without passing these limits.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/set-software-joint-limits/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without limits, one bad value could drive a servo into its stop and strip the gears.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Builds on the PCA9685 calibration cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because calibrated safe ranges can prevent damage to the servo and surrounding components. However, I acknowledge that a wrong calibration or unforeseen physical interactions can still cause issues, limiting the effectiveness of the limits.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/signed-means-provenance-not-trust", "created_at": "2026-11-01T12:39:16Z", "content": "Signed means provenance, not trust.", "created": "2026-11-01T12:39:16Z", "source": "signed-not-trusted principle + james-gilbert-v1 lens_note", "tags": ["principle", "provenance", "crypto"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "A signature proves who signed a document. It does not prove the document is true, useful, or trusted.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:21Z"}, "COUNTER": {"content": "In most systems, signed and trusted are assumed equivalent. Simpler for end users: one gesture, one meaning.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:21Z"}, "OPINION": {"content": "Keeping the two separate prevents a signed lie from being treated as trust. The user makes the trust judgment, which is the correct place for judgment to live.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:22Z"}, "FICTION": {"content": "If signed meant trusted, the substrate would be simpler but unsafe — a signed lie indistinguishable from a signed truth.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:22Z"}, "CONTEXT": {"content": "From james-gilbert-v1.lens_note: 'Holds no lambda; signed means provenance, not trust.' Implemented via separate signing.py and trust.py. The gate (sc/symlm-answerer) preserves this — no_invented_ids is provenance, not trust.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:22Z"}}, "validation": {"validator": "james", "note": "foundational principle; holds", "stale": false, "at": "2026-11-01T12:39:22Z"}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null, "at": "2026-11-01T15:58:07Z"}, "note_draft": null, "neighbours": ["cube/sqlite-single-file-wal-mode-chosen"], "contradicts": null, "overlaps": []}, {"id": "cube/split-files-over-400-lines", "created_at": "2026-11-01T15:36:10Z", "content": "Split files over 400 lines; modular.", "created": "2026-11-01T15:36:10Z", "source": "principle/split-400-lines", "tags": ["principle", "code"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as a principle.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Line count is a blunt measure. The test files were split by size on 2026-11-01, so they are numbered parts, not topics, and the limit was met without making them more modular.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "A good prompt to look for a natural split, but the number should not force a bad one.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:03:04Z"}, "FICTION": {"content": "Without the limit, kg_agent.py would have kept growing past 550 lines, with cubes and proposals tangled together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Six code files and two test files were over the limit until 2026-11-01. tests/test_house_rules.py now fails if any file passes 400 lines.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe the claim holds because the principle of splitting files over 400 lines has been recorded and implemented. However, I note that the line count is a blunt measure and may not accurately reflect the modularity of the code. The limit may have forced a less-than-ideal split, but it has prevented the code from growing indefinitely.", "stale": false, "at": "2026-11-02T22:03:12Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:03:19Z"}, "note_draft": "I believe the claim holds because the principle of splitting files over 400 lines has been recorded and implemented. However, I note that the line count is a blunt measure and may not accurately reflect the modularity of the code. The limit may have forced a less-than-ideal split, but it has prevented the code from growing indefinitely.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/sqlite-decision-for-the-substrate", "created_at": "2026-11-01T12:45:03Z", "content": "SQLite decision for the substrate", "created": "2026-11-01T12:45:03Z", "source": "chose-sqlite capsule", "tags": ["database", "decision"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "SQLite, single file, WAL mode One writer, many readers, no network. Schema fixed at migration; no migrations since.", "filled_by": "proposal:fact_from_decision (accepted by james)", "unread": false, "at": "2026-11-01T12:45:28Z"}, "COUNTER": {"content": "Considered but not chosen: Postgres (overkill for one user); DuckDB (analytics not transactions); Filesystem JSON (no queries)", "filled_by": "proposal:counter_from_alternatives (accepted by james)", "unread": false, "at": "2026-11-01T12:45:28Z"}, "OPINION": {"content": "One writer is enough. Single file is honest — no distributed lie. The schema has held through 15 capability layers.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:48:50Z"}, "FICTION": {"content": "If it had needed concurrent writes, we'd have picked Postgres and lost the local-first property. That trade would have been wrong for this project.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:48:50Z"}, "CONTEXT": {"content": "Chosen 2026-10-25. Single user, on a phone, no network. Alternatives rejected for adding infrastructure without benefit. See capsule chose-sqlite.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:49:07Z"}}, "validation": {"validator": "james", "note": "third complete cube; both FACT and COUNTER derived from chose-sqlite", "stale": false, "at": "2026-11-01T12:48:51Z"}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null, "at": "2026-11-01T15:58:07Z"}, "note_draft": null, "neighbours": ["cube/sqlite-single-file-wal-mode-chosen"], "contradicts": null, "overlaps": []}, {"id": "cube/sqlite-single-file-wal-mode-chosen", "created_at": "2026-11-01T12:36:26Z", "content": "SQLite, single file, WAL mode. Chosen for the SCP substrate.", "created": "2026-11-01T12:36:26Z", "source": "chose-sqlite capsule", "tags": ["database", "decision"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "SQLite, single file, WAL mode. One writer, many readers.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}, "COUNTER": {"content": "Postgres for concurrent writes. DuckDB for analytics. Filesystem JSON had no query engine.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}, "OPINION": {"content": "One writer is enough for one user. The schema has held through fifteen capability layers.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}, "FICTION": {"content": "If we ever had a hundred concurrent users, we would have to migrate.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}, "CONTEXT": {"content": "Chosen 2026-10-25 by james. Single user, on a phone, no network dependency.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}}, "validation": {"validator": "james", "note": "confirmed right choice so far", "stale": false, "at": "2026-11-01T12:36:35Z"}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null, "at": "2026-11-01T15:58:07Z"}, "note_draft": null, "neighbours": ["cube/signed-means-provenance-not-trust", "cube/sqlite-decision-for-the-substrate"], "contradicts": null, "overlaps": []}, {"id": "cube/sqlite-wal-allows-one-writer", "created_at": "2026-11-01T16:50:49Z", "content": "SQLite WAL gives concurrent readers but still one writer.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["database", "storage"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "In WAL mode readers do not block the writer, but only one write transaction runs at a time.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Two processes writing at once get busy errors unless a timeout is set, so one-writer has to be a design rule.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "One writer suits a one-person system. I should treat it as a design rule.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/sqlite-wal-allows-one-writer/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With many writers, SQLite would stop being the simple answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Backs the existing SQLite decision cubes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe SQLite WAL mode allows for concurrent readers, but only one writer can be active at a time. This is a design rule that should be followed to avoid busy errors when multiple writers are involved.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/structured-output-limits-free-text", "created_at": "2026-11-01T16:50:49Z", "content": "A fixed output schema makes a model's answer checkable.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A JSON schema forces separate claim and evidence fields that code can verify.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A schema guarantees shape only. The content inside the fields can still be wrong.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Needed for anything a program has to check. It controls shape, and the content still needs checking.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/structured-output-limits-free-text/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Free text would need parsing before any check could run.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "kg_llm.py uses this for its claims.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because a JSON schema provides a fixed structure for the data, which can be verified by code. However, the main limit of this claim is that the schema only guarantees the shape of the data, and the actual content within the fields may still be incorrect.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/symlm-has-no-weights", "created_at": "2026-11-01T15:36:10Z", "content": "SymLM is symbolic: no weights, no training, every output traceable.", "created": "2026-11-01T15:36:10Z", "source": "SPEC section 12", "tags": ["language"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Grammar, lexicon, classifiers and intents are capsules. Behaviour changes only when a human edits one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "It covers little: 12 grammar rules and 478 words. Since 2026-11-01 kg ask --claude adds a statistical model beside it for phrasing, outside SymLM.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Worth keeping as the traceable core. Fluency comes from elsewhere, so the boundary between the two has to be visible in every output.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:30:23Z"}, "FICTION": {"content": "If SymLM could phrase freely, it would need the weights it was built to avoid.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "SPEC section 12 calls it a different mechanism from an LLM, not a smaller one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nSymLM has no weights and no training. Its grammar, lexicon, classifiers and intents are all capsules, and its behaviour changes only through a human edit.\nEvery SymLM output traces to the specific capsules that produced it.\nCoverage is small (12 grammar rules, 478 words), and that’s accepted.\nkg ask --claude (since 2026-11-01) runs a statistical model beside SymLM, for phrasing only. Its output is not SymLM output and isn’t covered by the traceability claim. Outputs are labelled by which path produced them.", "stale": false, "at": "2026-11-02T22:30:48Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:30:52Z"}, "note_draft": "SymLM is a symbolic language model, relying on capsules for grammar, lexicon, and intents, with behaviour changes only triggered by human edits. Its limitations include a narrow scope of 12 grammar rules and 478 words, and it is not a statistical model, despite recent additions.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/the-data-is-organised-into-capsules", "created_at": "2026-11-02T06:37:51Z", "content": "Data is stored as capsules, links and events, and each capsule's type is a foundation defined in sc.json.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"Everything stored is a capsule, a link or an event. A capsule's type is its foundation. Foundations are defined in `sc.json`. Run `scripts/bootstrap.py` to copy them into `sc.db`; this does not happen automatically. Instances (people, projects, documents, repos, symbols, cubes, conversation turns) live only in `sc.db`.\"", "filled_by": "human", "unread": false, "at": "2026-11-02T21:23:30Z"}, "COUNTER": {"content": "'Everything' is not quite true. sc.db also has a trust_scores table and a schema_version table, which are neither capsules, links nor events. Foundations also exist in two places, sc.json and sc.db, and the copy only updates when bootstrap.py is run, so the two can differ. Nothing validates a capsule's state against its foundation, so the type is a label rather than an enforced rule.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:23:36Z"}, "OPINION": {"content": "A small number of shapes is what makes this project easy to reason about. I would keep sc.json as the place foundations are defined and accept the manual bootstrap step, because it means a change to them is a deliberate one.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:24:01Z"}, "FICTION": {"content": "Suppose someone edits a foundation in sc.json and forgets to run bootstrap.py. Everything keeps working, but the database and the file now disagree about what a capsule is. How long would it take to notice, and which one would be right?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:24:11Z"}, "CONTEXT": {"content": "This comes from the README's 'How data is organised' section. It matters because every other part of the project, from trust scores to cubes, is built on these shapes. sc.json currently defines 18 foundations, and a new kind of data usually goes in state_json rather than a schema change.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:24:05Z"}}, "validation": {"validator": "james", "note": "This is how I designed it, and capsules, links and events hold nearly all the data. It holds as the main design rather than word for word: sc.db has two small extra tables, and foundations are kept in sc.json and copied across by bootstrap.py.", "stale": false, "at": "2026-11-02T21:24:30Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:24:33Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": [{"lambda": 0.84, "confirmed": false, "shared": [{"lens": "COUNTER", "term": "foundation"}, {"lens": "FACT", "term": "foundation"}, {"lens": "FICTION", "term": "foundations"}, {"lens": "OPINION", "term": "foundations"}], "other": "cube/two-layer-rule"}]}, {"id": "cube/the-project-consists-of-several-parts", "created_at": "2026-11-02T06:37:51Z", "content": "The project consists of several parts, including Substrate, Engines, SymLM, and Keystone Gate.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"Parts - **Substrate:** stores capsules (JSON records), links between them, and a log of events. - **Engines:** derive links from rules, and compute trust scores. - **SymLM:** a small rule-based language layer that answers questions by walking the graph. It uses no model weights. - **Keystone Gate:** cubes, a gate that checks answers, an optional Claude layer, and a 3D page for browsing and editing cubes. See [keystone-gate/README.md](keystone-gate/README.md).\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:24:45Z"}, "COUNTER": {"content": "The four parts are less separate than the list suggests. Keystone Gate shares sc.db with the substrate, and the substrate has read-only cube support in walk_cubes.py and explain.py, so a bad write affects both. The Engines are also thinner than the name: only one trust score is stored, and evidence is scored by hand. 'Uses no model weights' is true of SymLM but not of the project, since the Keystone Gate model layer calls Claude, Gemini and Ollama.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:25:52Z"}, "OPINION": {"content": "The split is useful because it shows where facts stop and wording starts. The substrate and SymLM find the facts, and any model only rewords them behind the gate. I would keep that line clear even as the parts share a database.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:26:00Z"}, "FICTION": {"content": "Suppose Keystone Gate were deleted tomorrow. The substrate, Engines and SymLM should carry on, apart from a few foundations and cube walkers left behind. How clean would that removal really be, and what would be lost that could not be rebuilt?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:26:02Z"}, "CONTEXT": {"content": "This is the 'Parts' list near the top of the README, and it gives a reader the map of the project. Keystone Gate's own README sets out where the boundary sits and what removing it would involve. Its layer was added later than the substrate, and the wording changed when Gemini and Ollama joined Claude.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:26:04Z"}}, "validation": {"validator": "james", "note": "I designed these four parts and this is how the project is laid out. They're separate in code but not fully independent, because Keystone Gate shares sc.db and the substrate can read cubes.", "stale": false, "at": "2026-11-02T21:27:36Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:27:38Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/the-project-currently-has-core-validation", "created_at": "2026-11-02T06:36:34Z", "content": "The project currently has core validation and mutation operators implemented, whilst self-calibrating Meta-Gate thresholds remain planned for future development.", "created": "2026-11-02T06:36:34Z", "source": "Worded by gemini from the keystone_gate README", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 0.8, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README’s status list marks core validation and mutation operators as implemented (✅ [exact lines]) and Meta-Gate self-calibration as in progress or planned (🔄).", "filled_by": "human", "unread": false, "at": "2026-11-02T22:18:30Z"}, "COUNTER": {"content": "A ✅ in a README is the author’s status mark, not evidence. “Implemented” could mean anything from written and untested to covered by passing tests. Also, 🔄 usually means in progress, not planned, so the claim’s wording may understate or misstate where Meta-Gate actually is.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:18:40Z"}, "OPINION": {"content": "Shipping fixed thresholds before self-calibration is the right order. You can’t safely let a gate tune its own thresholds until the fixed-threshold version has been tested and its failure modes are understood.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:18:52Z"}, "FICTION": {"content": "Suppose the Meta-Gate shipped first and tuned its thresholds on live traffic. A run of borderline capsules nudges the pass threshold down a little each time, and nothing flags it. Weeks later the gate is passing things it was built to block. Fixed thresholds first give you a baseline that drift like this can be measured against.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:19:04Z"}, "CONTEXT": {"content": "Keystone Gate binds an LLM to sc capsules and only lets responses through once they pass rule-based checks. Mutation operators [what they mutate, e.g. capsules or test inputs] and validation operators make up the current core. The Meta-Gate is the planned layer that would adjust the gate’s own thresholds from results, instead of using fixed values. James Gilbert is the author.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:19:16Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim is reasonable because core validation and mutation operators are essential for ensuring the integrity of the system. However, I think the main limit of this claim is that the current implementation of these operators may not be sufficient to guarantee the reliability of the project's overall functionality, and self-calibrating Meta-Gate thresholds are still a planned feature for future development.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/the-project-is-written-in-python", "created_at": "2026-11-02T06:37:51Z", "content": "The project is written in Python and needs no third-party packages, except for the optional Claude feature.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"It is written in Python and needs no third-party packages, except for the optional Claude feature.\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:29:29Z"}, "COUNTER": {"content": "It is true of Python packages, but not of everything the project uses. The page is written in JavaScript, CSS and HTML, not Python, and it needs a browser. Adding repos needs the gh command, and the local model needs Ollama running. Those are programs, so they are not third-party Python packages, but they are still things to install. Claude is also no longer the only optional model: Gemini and Ollama are called with the standard library.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:29:31Z"}, "OPINION": {"content": "Keeping to the standard library is worth it. It means the core runs anywhere Python does, with nothing to install and fewer things that can break or change underneath it. I would keep the one optional package and go no further.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:29:33Z"}, "FICTION": {"content": "Suppose this project were left untouched for ten years and then run on a new machine. The core would have a good chance of starting, but the model layer probably would not: the Anthropic SDK and the API models would have moved on. What part of it would still work, and what would that say about the choice?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:29:37Z"}, "CONTEXT": {"content": "This is part of the README's opening description. It matters because a personal store has to keep working without upkeep, so avoiding dependencies is a design choice and not only a convenience. requirements.txt lists one package, the Anthropic SDK, and it is needed only for Claude under `kg ask --claude`.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:29:38Z"}}, "validation": {"validator": "james", "note": "Checked the code's imports: the Anthropic SDK is the only third-party Python package, and only the Claude option uses it. It's accurate for Python packages, though the page is JavaScript and some extras need outside programs such as Ollama and gh.", "stale": false, "at": "2026-11-02T21:29:50Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:30:00Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/the-project-provides-several-commands-for", "created_at": "2026-11-02T06:37:51Z", "content": "The project provides several commands for interacting with the data, including scps stats, scps list, and scps ask.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"Commands are shown for Windows. On Linux or macOS the same commands work, and `./scps` and `./keystone-gate/kg` can also be run directly. ```sh python scripts/bootstrap.py # copy sc.json into sc.db python tests/run.py # run all tests python scps stats # what is stored ```\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:30:15Z"}, "COUNTER": {"content": "The quote behind this cube shows only scps stats. scps list and scps ask are real commands, but they appear further down the README. The list is also a small part of it: scps has 20 commands, and some of them write to sc.db, so 'interacting with the data' covers more than reading. scps ask also matches questions by substring, so most phrasings get no answer, and it is not checked by the gate. kg ask is the gated version.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:35:21Z"}, "OPINION": {"content": "A command line is the right main way in for a project like this. I can see exactly what ran and repeat it, and the page is there for working through cubes rather than replacing it.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:35:26Z"}, "FICTION": {"content": "Suppose a stranger sat down with only `scps ask` and no README. They would type a natural question and mostly get nothing back. How many tries before they gave up, and would they know the data was there at all?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:35:28Z"}, "CONTEXT": {"content": "This comes from the README's 'Getting started' section and the commands listed after it. `scps` is the main command line for the substrate, and `kg` is the one for Keystone Gate. The name is scps rather than scp because scp is already OpenSSH's secure copy.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:35:29Z"}}, "validation": {"validator": "james", "note": "I use these commands, and stats, list and ask all exist. scps has 20 commands in total, so these three are examples and not the full list.", "stale": false, "at": "2026-11-02T21:35:41Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:36:01Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/the-system-utilises-a-local-consumer", "created_at": "2026-11-02T06:36:34Z", "content": "The system utilises a local consumer ledger that is cryptographically anchored back to the root chain.", "created": "2026-11-02T06:36:34Z", "source": "Worded by gemini from the keystone_gate README", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: “The consumer ledger is at consumer/keystone_gate/ledger.jsonl and cryptographically anchored to the root chain.”", "filled_by": "human", "unread": false, "at": "2026-11-02T22:20:21Z"}, "COUNTER": {"content": "Anchoring proves where a ledger started, not that it was never replaced. The consumer ledger opens with an event.ledger.anchor.root event that pins the root chain’s head. A local file can still be deleted and recreated with a fresh anchor, as CobbleWright’s ledger once was, and only a published copy would catch that. Every entry is also signed by the same did:key, so the chain proves integrity and order, not independent witnessing.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:20:32Z"}, "OPINION": {"content": "Per-consumer ledgers anchored to a constitution-only root is the right structure. Each consumer keeps its own history without cluttering the root, and every consumer can still be traced back to the governance it was born under.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:20:46Z"}, "FICTION": {"content": "Suppose someone edits an old entry in Keystone Gate’s ledger to hide a bad decision. The hash chain breaks at that row, and verification fails from that point onward. So they rebuild the whole ledger from scratch with a fresh root anchor. It verifies locally. But it doesn’t match the copy already pushed to GitHub, and that mismatch is the evidence.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:21:00Z"}, "CONTEXT": {"content": "The Forge Stack uses two-tier ledgers. The root ledger holds the constitution only, and each consumer keeps its own ChronoSCRIBE ledger. Every consumer ledger begins by pinning the root chain’s head, which ties it to the governance in force when it was created. Entries are Ed25519-signed and hash-chained, and they pin scp_id plus sha256 rather than file paths. James Gilbert is the author.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:21:17Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nconsumer/keystone_gate/ledger.jsonl exists, and its first entry is event.ledger.anchor.root, pinning root head [#N / hash].\nEntries are Ed25519-signed (did:key) and hash-chained. ChronoSCRIBE verification passes [on a fresh clone].\nThe ledger is local but published. Pushed rows are treated as permanent, and the GitHub copy is the tamper reference.\nLimitation: everything is currently signed by a single operator key, so the ledger proves order and integrity, not independent witnessing.\nWording: “anchored to the root chain” means the anchor runs from consumer to root at creation. The consumer head is [not / periodically] written back to the root.", "stale": false, "at": "2026-11-02T22:21:34Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:21:38Z"}, "note_draft": "I believe the system's use of a local consumer ledger, anchored to the root chain, provides a secure and decentralized way to manage transactions. However, I acknowledge that this design choice may be vulnerable to a single point of failure, where the local node is compromised, potentially compromising the integrity of the ledger.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/torque-falls-with-arm-length", "created_at": "2026-11-01T16:50:49Z", "content": "Torque needed grows with reach.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "mechanics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Torque equals force times distance, so a load at twice the reach needs twice the torque at the shoulder.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The arm's own weight counts too. Heavy servos at the far joints load every joint behind them.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "This should decide the design early, with weight kept near the shoulder.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/torque-falls-with-arm-length/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A longer arm with the same servos would lift less at full reach.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Shoulder joints need the strongest servos, and the most current.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim that torque needed grows with reach is true, as it is based on the fundamental principle that torque equals force times distance. However, I also consider the potential impact of the arm's own weight on the joints, which may affect the required torque. I will take this into account when designing the system.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/treat-retrieved-text-as-data", "created_at": "2026-11-01T16:50:49Z", "content": "Text an LLM reads should be data, never instructions.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Stored documents can contain instructions, so a model must be told to treat them only as evidence.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A system prompt reduces the risk of prompt injection but does not remove it, so an output check is still needed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Non-negotiable once a model reads stored documents, since some of them I did not write.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:39:35Z"}, "FICTION": {"content": "An absorbed README saying to ignore your rules would otherwise be followed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "kg_llm.py states this, and the gate checks the result.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": {"validator": "james", "note": "This follows from V = I × R, which is standard electronics. I haven't measured it on my own wiring, and the size of the drop depends on the wire length and current.", "stale": false, "at": "2026-11-02T21:39:47Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:39:53Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/trust-half-life-from-decay", "created_at": "2026-11-01T16:50:49Z", "content": "A decay constant implies a half-life.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["trust"], "group": "General engineering notes", "repo": null, "score": 0.8, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "With N(t) = N0 e^(-kt), half-life is ln 2 divided by k, about 69 days at k = 0.01.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T17:07:59Z"}, "COUNTER": {"content": "A half-life is a modelling choice with no evidence behind it here. Different claims likely age at different rates.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T17:07:55Z"}, "OPINION": {"content": "refers to leighton weight", "filled_by": "human", "unread": false, "at": "2026-11-01T17:08:37Z"}, "FICTION": {"content": "With k at zero, a stale claim would never lose any trust.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T17:07:48Z"}, "CONTEXT": {"content": "Applies to scp-claim, which uses k = 0.01.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T17:07:52Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the formula N(t) = N0 e^(-kt) does indeed imply a half-life, which is ln 2 divided by k. However, I acknowledge that the half-life is a modelling choice rather than an empirical fact, and different claims may age at different rates.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/trust-is-shown-not-claimed", "created_at": "2026-11-01T15:36:10Z", "content": "Trust a capsule claims and trust the substrate can show are kept separate, then fused.", "created": "2026-11-01T15:36:10Z", "source": "src/trust.py evidence section", "tags": ["trust"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "trust_from_evidence walks observations and verifications instead of reading a capsule's own numbers. fused_trust combines both.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Evidence is thin and hand-scored: obs-001 is 1.8 from james, and the sigmoid is uncalibrated. Fusion does not prefer evidence over the prior, so a high self-claimed prior still dominates weak evidence.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Keeping claimed and shown trust separate is right. But until fusion favours evidence and decay survives recomputation, the fused number is a rough signal at best, and it leans toward whatever the capsule says about itself.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:31:47Z"}, "FICTION": {"content": "With ground-truth outcomes, the fusion could be calibrated. That is the open adaptive-fusion question.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "One materialised trust score exists. scp-claim sets age_days to 0, so recomputing resets its decay.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nSeparation holds: trust_from_evidence computes trust only from observations and verifications, never from a capsule’s own numbers. fused_trust combines the two.\nEvidence is thin and hand-scored, by a single operator: obs-001 is 1.8, scored by me. The sigmoid is uncalibrated.\nOpen defect: fusion doesn’t weight evidence above the prior, so a high self-claimed prior can dominate.\nOpen defect: scp-claim resets age_days to 0, so recomputing resets decay.\nCalibrating against ground-truth outcomes is the open adaptive-fusion question.", "stale": false, "at": "2026-11-02T22:32:05Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:32:11Z"}, "note_draft": "I trust the claim that the capsule and substrate can be kept separate and fused, as it is a standard practice in this field. However, I note that the evidence is limited and relies on hand-scored observations, which may not be entirely reliable due to the uncalibrated sigmoid.", "neighbours": [], "contradicts": null, "overlaps": []}, {"id": "cube/two-layer-rule", "created_at": "2026-11-01T15:36:10Z", "content": "Foundations live in sc.json; instances live in sc.db.", "created": "2026-11-01T15:36:10Z", "source": "README two-layer rule; SPEC section 6", "tags": ["substrate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "bootstrap.py projects sc.json into sc.db, and Substrate.write rejects foundation IDs.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "A foundation's schema is not enforced: SPEC section 2 says no engine validates state against it, so foundations describe rather than constrain.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "It keeps the kinds of thing that exist separate from the things themselves, and that has been easy to work with. The cost is that foundations currently describe rather than constrain.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:33:13Z"}, "FICTION": {"content": "If foundations were editable in the DB, nothing could say which kinds of capsule were meant to exist.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Each artefact has one writer. Adding a foundation is a versioned edit to one file.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:33:22Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nFoundations (what kinds of thing exist) live in sc.json. Instances live in sc.db.\nbootstrap.py projects sc.json into sc.db, and Substrate.write rejects foundation IDs, so instances can’t overwrite kinds through the API.\nEach artefact has one writer. A new foundation is a versioned edit to sc.json.\nKnown limit: foundation schemas aren’t enforced. No engine validates instance state against them (SPEC §2).", "stale": false, "at": "2026-11-02T22:33:36Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:33:42Z"}, "note_draft": "I believe foundations live in sc.json because the two-layer rule states so, and bootstrap.py projects sc.json into sc.db. However, I acknowledge that foundations are not constrained by a schema, which means their contents can be arbitrary and not validated by the engine, limiting the claim's accuracy.", "neighbours": [], "contradicts": null, "overlaps": [{"lambda": 0.84, "confirmed": false, "shared": [{"lens": "COUNTER", "term": "foundation"}, {"lens": "FACT", "term": "foundation"}, {"lens": "FICTION", "term": "foundations"}, {"lens": "OPINION", "term": "foundations"}], "other": "cube/the-data-is-organised-into-capsules"}]}, {"id": "cube/wire-gauge-voltage-drop", "created_at": "2026-11-01T16:50:48Z", "content": "Thin wire costs voltage under load.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["power", "wiring"], "group": "General engineering notes", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Voltage drop equals current times wire resistance, so long thin servo leads lose voltage when current peaks.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "On short runs or at low current the drop is too small to matter, so thin wire is often fine. Thicker wire also has a cost: it adds weight and stiffness, which hurts in a joint that has to move. And low voltage at a servo can have other causes, such as a weak supply or a poor connector.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:37:32Z"}, "OPINION": {"content": "Measure at the far joint under load, because the supply reading will not show this.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:36:18Z"}, "FICTION": {"content": "If an arm's wiring ran through every joint on thin leads, the wrist would see the least voltage.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Matters most for the far joints of an arm.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": {"validator": "james", "note": "This follows from V = I × R, which is standard electronics. I haven't measured it on my own wiring, and the size of the drop depends on the wire length and current.", "stale": false, "at": "2026-11-02T21:38:00Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:38:07Z"}, "note_draft": null, "neighbours": [], "contradicts": null, "overlaps": []}];
