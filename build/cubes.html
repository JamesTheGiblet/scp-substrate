<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Field</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1f24; --muted: #62666f; --line: #d9d7d0;
  --fact: #2f6fd0; --counter: #d0483f; --opinion: #d9920f; --fiction: #7d55c7;
  --context: #178a84; --human: #3b9a4b; --seal: #b98a12;
  --empty: rgba(40, 44, 52, .05); --empty-line: rgba(40, 44, 52, .32);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1e2128; --ink: #eceded; --muted: #a0a5af; --line: #333844;
    --fact: #5a95ee; --counter: #ee6f66; --opinion: #eeb030; --fiction: #a584ea;
    --context: #3fb8b0; --human: #5fc26f; --seal: #e6bb45;
    --empty: rgba(235, 238, 245, .05); --empty-line: rgba(235, 238, 245, .32);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input { font: inherit; color: inherit; }
main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 2px 0 20px; }
.stats { display: flex; flex-wrap: wrap; gap: 26px; margin-bottom: 20px; }
.stat b { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 4px 12px; cursor: pointer; color: var(--muted); font-size: 13px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#search {
  flex: 1 1 200px; max-width: 300px; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel);
}
h2 { font-size: 15px; margin: 30px 0 12px; color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 14px 12px; cursor: pointer; text-align: left; display: flex;
  flex-direction: column; align-items: center; gap: 12px; width: 100%;
}
.card.foundational { border-color: var(--found); box-shadow: inset 0 0 0 1px var(--found); }
.card:hover, .card:focus-visible { border-color: var(--muted); outline: none; }
.card p {
  margin: 0; font-size: 13px; line-height: 1.35; width: 100%;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 3.9em;
}
.meta { display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: var(--muted); }
.pill { font-weight: 600; }
.pill.attested { color: var(--seal); }
.pill.validated { color: var(--human); }
.pill.stale, .pill.retracted { color: var(--counter); }

.strip { display: flex; gap: 3px; width: 100%; }
.strip i { flex: 1; height: 7px; border-radius: 2px; background: var(--c); }
.strip i.off { background: none; border: 1px dashed var(--empty-line); }
.strip i.unread { opacity: .5; }
.stage { perspective: 620px; width: var(--s); height: var(--s); margin: calc(var(--s) * .14) 0; }
.cube {
  position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
  transform: rotateX(var(--rx, -26deg)) rotateY(var(--ry, -38deg));
  transition: transform .45s ease;
}
.card:hover .cube, .card:focus-visible .cube { --ry: 322deg; transition-duration: 1.6s; }
.side {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; letter-spacing: .04em; font-size: calc(var(--s) * .115);
  backface-visibility: hidden; border: 1px solid rgba(0, 0, 0, .22);
}
.side.empty { background: var(--empty); border: 1px dashed var(--empty-line); color: var(--muted); backface-visibility: visible; }
.side.unread { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 5px, transparent 5px 10px); }
.f-FACT { transform: translateZ(calc(var(--s) / 2)); }
.f-COUNTER { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.f-CONTEXT { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.f-FICTION { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.f-OPINION { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.f-HUMAN { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.fill-FACT { background-color: var(--fact); } .fill-COUNTER { background-color: var(--counter); }
.fill-OPINION { background-color: var(--opinion); } .fill-FICTION { background-color: var(--fiction); }
.fill-CONTEXT { background-color: var(--context); } .fill-HUMAN { background-color: var(--human); }
.stage.sealed { filter: drop-shadow(0 0 7px var(--seal)); }

#root { position: fixed; inset: 0; background: #06070d; color: #e6eaf3; overflow: hidden; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#bar { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
#bar > * { pointer-events: auto; }
#crumbs { display: flex; align-items: center; gap: 4px; margin-right: auto; min-width: 0; }
#crumbs button { border: 0; background: none; color: #e6eaf3; cursor: pointer; padding: 3px 4px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; }
@media (max-width: 640px) { #crumbs button { max-width: 38vw; } }
#crumbs button:disabled { cursor: default; color: #9fb4d8; font-weight: 400; }
#crumbs .sep { color: #6d7a93; }
#root .chip { background: rgba(14, 18, 30, .7); border-color: #333c52; color: #c3cbdb; }
#root .chip[aria-pressed="true"] { background: #e6eaf3; color: #0a0d15; border-color: #e6eaf3; }
#fsearch { width: 170px; padding: 4px 12px; border-radius: 999px; border: 1px solid #333c52; background: rgba(14, 18, 30, .7); color: #e6eaf3; }
#modes { position: absolute; top: 56px; left: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: #93a0b8; max-width: calc(100vw - 32px); }
#modes .chip { font-size: 12px; padding: 2px 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: -3px 0 10px 15px; align-items: center; }
.tool { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 12px; }
.tool:hover { border-color: var(--muted); }
.tools textarea, .tools input { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 14px; }
.tools .warn { color: var(--muted); font-size: 12px; }
#toast { position: fixed; z-index: 5; left: 50%; bottom: 76px; transform: translateX(-50%); background: rgba(8, 11, 19, .94); color: #e6eaf3; border: 1px solid #333c52; border-radius: 8px; padding: 7px 14px; font-size: 14px; }
#toast[hidden], #addcube[hidden], #fillblanks[hidden], #checkdrafts[hidden], #lock[hidden], #unlockwrong[hidden] { display: none; }
#newcube, #unlock { --ink: #e6eaf3; --line: #333c52; --muted: #9fb4d8; background: #10131d; color: #e6eaf3; border-color: #2c3448; width: min(560px, calc(100vw - 32px)); padding: 20px; }
#unlock { width: min(360px, calc(100vw - 32px)); }
#unlockwrong { color: #f0b23a; font-size: 13px; margin: 0; }
#newcube h3, #unlock h3 { margin: 0 0 12px; font-size: 18px; }
#newcube label, #unlock label { display: block; font-size: 12px; color: #98a5bd; margin-bottom: 9px; }
#newcube textarea, #newcube input, #unlock input { display: block; width: 100%; margin-top: 3px; background: #0b0e17; color: #e6eaf3; border: 1px solid #333c52; border-radius: 6px; padding: 6px 8px; font-size: 14px; }
#newcube .actions, #unlock .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#timebar { position: absolute; left: 16px; right: 16px; bottom: 36px; display: flex; gap: 10px; align-items: center; max-width: 760px; font-size: 13px; color: #c3cbdb; }
#timerange { flex: 1; min-width: 0; accent-color: #f2be46; }
#timelabel { white-space: nowrap; font-variant-numeric: tabular-nums; }
#key { position: absolute; left: 16px; right: 16px; bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: #93a0b8; pointer-events: none; }
#key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 5px 0 12px; }
#key i:first-child { margin-left: 0; }
#tip { position: fixed; max-width: 270px; background: rgba(8, 11, 19, .92); border: 1px solid #333c52; border-radius: 6px; padding: 5px 9px; font-size: 13px; pointer-events: none; }
#panel {
  position: absolute; top: 56px; right: 16px; bottom: 16px; width: min(390px, calc(100vw - 32px));
  background: rgba(10, 13, 22, .86); border: 1px solid #2c3448; border-radius: 12px;
  padding: 18px 16px; overflow-y: auto; backdrop-filter: blur(8px);
}
#panel[hidden], #tip[hidden] { display: none; }
#panel h3 { margin: 0 30px 3px 0; font-size: 18px; line-height: 1.3; }
#panel .id, #panel .facts { color: #98a5bd; }
#panel .lens { color: #e6eaf3; font-size: 14px; }
#panel .lens:hover { background: rgba(255, 255, 255, .05); }
#panel .lens.missing { color: #8d99b0; }
#panel .lens b em { color: #98a5bd; }
#panel .said { display: block; margin: 6px 0 0; color: #c3cbdb; font-size: 13px; }
#panel mark { background: rgba(255, 214, 102, .28); color: #fff3cf; border-radius: 3px; padding: 0 2px; }
.shut { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: #98a5bd; font-size: 22px; cursor: pointer; }
.hop { display: block; width: 100%; text-align: left; border: 1px solid #2c3448; background: none; color: #c9d5ea; border-radius: 6px; padding: 5px 9px; margin-bottom: 5px; cursor: pointer; font-size: 13px; }
.hop:hover { border-color: #6d7a93; }
@media (max-width: 640px) { #panel { top: auto; height: 52vh; } #key { display: none; } #fsearch { width: 120px; } #modes { top: 104px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } #modes span { display: none; } #modes .chip { flex: none; } #timebar { bottom: 12px; } }
dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
  width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
}
dialog::backdrop { background: rgba(10, 12, 16, .6); }
.detail { display: grid; grid-template-columns: 250px 1fr; gap: 8px 24px; padding: 24px; }
.left { display: flex; flex-direction: column; align-items: center; }
.left .stage { touch-action: none; cursor: grab; margin: 40px 0 44px; }
.hint { font-size: 12px; color: var(--muted); text-align: center; }
.right h3 { margin: 0 34px 4px 0; font-size: 19px; line-height: 1.3; }
.id { font-size: 12px; color: var(--muted); word-break: break-all; margin: 0 0 10px; }
.facts { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.lens {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  border-left: 4px solid var(--c); padding: 7px 11px; margin-bottom: 7px; cursor: pointer;
}
.lens:hover { background: var(--empty); }
.lens b { display: block; font-size: 12px; letter-spacing: .04em; }
.lens b em { font-style: normal; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.lens.missing { color: var(--muted); font-style: italic; }
#close {
  position: absolute; top: 12px; right: 12px; border: 0; background: none; cursor: pointer;
  font-size: 22px; line-height: 1; color: var(--muted); padding: 4px 8px;
}
.none { color: var(--muted); padding: 28px 0; }
@media (max-width: 640px) {
  main { padding: 20px 16px 48px; }
  .detail { grid-template-columns: 1fr; padding: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .cube { transition: none; }
  .card:hover .cube, .card:focus-visible .cube { --ry: -38deg; }
}

</style>
</head>
<body>
<div id="root">
  <canvas id="field" aria-label="Your cubes as a 3D field. The grid view lists the same cubes."></canvas>
  <div id="bar">
    <nav id="crumbs" aria-label="Where you are"></nav>
    <input id="fsearch" type="search" placeholder="Search" aria-label="Search cubes">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="attested" aria-pressed="false">Attested</button>
    <button class="chip" data-f="needs" aria-pressed="false">Needs you</button>
    <button class="chip" id="checkdrafts" hidden></button>
    <button class="chip" id="snap">Screenshot</button>
    <button class="chip" id="togrid">Grid</button>
  </div>
  <div id="modes" aria-label="Cluster by"></div>
  <div id="timebar">
    <button class="chip" id="timeplay">Play</button>
    <input id="timerange" type="range" min="0" max="0" value="0" aria-label="Go through time">
    <span id="timelabel" role="status"></span>
  </div>
  <div id="key"></div>
  <div id="tip" hidden></div>
  <aside id="panel" hidden></aside>
</div>
<div id="toast" role="status" hidden></div>
<dialog id="unlock">
  <form>
    <h3>Unlock editing</h3>
    <label>Password<input type="password" autocomplete="current-password" required></label>
    <p id="unlockwrong" hidden>That password is wrong.</p>
    <div class="actions"><button type="button" class="tool" id="unlockcancel">Cancel</button><button type="submit" class="tool">Unlock</button></div>
  </form>
</dialog>
<dialog id="newcube">
  <form>
    <h3>New cube</h3>
    <label>The claim<textarea name="content" rows="2" required></textarea></label>
    <label>Tags, separated by commas<input name="tags"></label>
    <label>Fact<textarea name="FACT" rows="2"></textarea></label>
    <label>Counter<textarea name="COUNTER" rows="2"></textarea></label>
    <label>Opinion<textarea name="OPINION" rows="2"></textarea></label>
    <label>Fiction<textarea name="FICTION" rows="2"></textarea></label>
    <label>Context<textarea name="CONTEXT" rows="2"></textarea></label>
    <div class="actions"><button type="button" class="tool" id="newcancel">Cancel</button><button type="submit" class="tool">Send it in</button></div>
  </form>
</dialog>
<main id="grid" hidden>
  <p><button class="chip" id="tofield">Back to the field</button> <button class="chip" id="lock" hidden>Unlock to edit</button> <button class="chip" id="addcube" hidden>+ New cube</button> <button class="chip" id="fillblanks" hidden>Fill blanks</button></p>
  <h1>Data Cubes</h1>
  <p class="sub">Each side is a lens. Solid means filled, hollow means missing, and striped means accepted without being read. The bar shows all six sides at once.</p>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="controls" id="controls"></div>
  <div id="groups"></div>
</main>
<dialog id="detail"><button id="close" aria-label="Close">&times;</button><div class="detail" id="body"></div></dialog>

const CUBES = [{"id": "cube/ackermann-steering-suits-car-shapes", "created_at": "2026-11-03T00:31:15Z", "content": "Ackermann steering turns the inner wheel more than the outer, so a car-shaped robot turns without tyre scrub.", "created": "2026-11-03T00:31:15Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia says the wheels on a turn trace circles of different radii, so the linkage turns the inner wheel more to avoid sideways slip. It says pure Ackermann suits low speeds.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/ackermann-steering-suits-car-shapes/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "It needs a linkage and a steering servo. That it cannot rotate in place follows from fixed rear wheels, which is my inference, as the article does not say so.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/ackermann-steering-suits-car-shapes/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Choose it for outdoor speed, and not for tight indoor spaces.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/ackermann-steering-suits-car-shapes/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a car-shaped robot meets a dead end. Where a differential base just turns, this one has to make a three-point turn.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/ackermann-steering-suits-car-shapes/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "An SG90 or MG90S suits the steering on a small car, as it only needs to reach an angle and hold it.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/ackermann-steering-suits-car-shapes/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Wikipedia, plus my inference on turning in place. I have not built this.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/active-vs-passive-buzzer", "created_at": "2026-11-03T00:02:38Z", "content": "An active buzzer sounds on DC, and a passive one needs a tone from the controller.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "CircuitDigest and MakerGuides agree: an active buzzer has an internal oscillator and a fixed pitch, while a passive one needs a square wave that sets the pitch. On 5V DC an active buzzer beeps, and a passive one only clicks.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/active-vs-passive-buzzer/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Sources disagree on current, and one gives 25-30 mA active and 2-10 mA passive. Magnetic buzzers can draw much more, so check the part. Guides are not datasheets.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/active-vs-passive-buzzer/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use passive when I want different tones, as with the M5Stick, and active for a simple alarm.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/active-vs-passive-buzzer/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an active buzzer is sent a melody. Instead of a tune, it just chops one fixed tone on and off.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/active-vs-passive-buzzer/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "The M5StickC Plus2's buzzer is passive, on G2, according to M5Stack's docs.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/active-vs-passive-buzzer/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From guides that agree, not a datasheet. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/m5stick-plus2-pins-moved", "proposal_id": "cube/active-vs-passive-buzzer/proposal/6", "why": "the Stick's buzzer is passive"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/agent-proposes-humans-decide", "created_at": "2026-11-01T15:36:10Z", "content": "The agent proposes; humans decide.", "created": "2026-11-01T15:36:10Z", "source": "kg_agent.py proposal mechanism", "tags": ["gate", "process"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Rules create proposals, and nothing changes a cube until a human accepts. Rejections stick unless the content or rationale changes.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:48:21Z"}, "COUNTER": {"content": "It costs attention. These 21 cubes alone create 84 proposals, and fatigue can turn accept into a rubber stamp.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:48:36Z"}, "OPINION": {"content": "true", "filled_by": "claude, from james's validation note", "unread": false, "at": "2026-11-01T15:58:07Z"}, "FICTION": {"content": "If proposals applied themselves, cubes would fill fast and mean little.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:48:46Z"}, "CONTEXT": {"content": "kg cube fill is still open to a human directly, and that path skips proposals.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:48:56Z"}}, "validation": {"validator": "james", "note": "true", "stale": false, "at": "2026-11-01T16:02:38Z"}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('finish', 2026-11-01), resting on his earlier 'true' note and attestation of this claim.", "retracted": null, "at": "2026-11-01T16:02:38Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/models-word-people-decide", "proposal_id": "cube/models-word-people-decide/proposal/6", "why": "the same principle"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/arm-base-joint-carries-the-most-torque", "created_at": "2026-11-03T00:31:16Z", "content": "On a hobby arm, torque is what limits it, and the joint nearest the base works hardest.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Torque is force times distance, so 200 g held 15 cm out needs 3 kg-cm, more than an SG90's 1.8 kg-cm at best. An MG996R's 9.4 to 11 kg-cm covers it, with the arm's own weight and the outer servos to add.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The sum is mine, as my search found no source on the shoulder carrying the most, and it leaves out the arm's own weight. A real arm also needs a margin, and stall is a limit, not a working load.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use MG996R at the shoulder, MG90S further out, and SG90 only at the gripper.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose every joint uses an SG90 because it fits. The arm holds itself up, and can lift nothing else.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This builds on your cube that torque needed grows with reach. Keep heavy servos near the base, because each one is a load on all before it.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "My arithmetic from the servo cubes, not a sourced design rule. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/torque-falls-with-arm-length", "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/6", "why": "the same claim with figures"}, {"other": "cube/mg996r-torque", "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/7", "why": "the shoulder servo"}, {"other": "cube/sg90-torque-figures-disagree", "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/8", "why": "the gripper servo"}, {"other": "cube/emergency-stop-and-gravity", "proposal_id": "cube/emergency-stop-and-gravity/proposal/8", "why": "cutting power drops the load the base joint was holding"}, {"other": "cube/scara-is-stiff-up-and-down", "proposal_id": "cube/scara-is-stiff-up-and-down/proposal/6", "why": "gravity is on the structure"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/awg-lower-number-is-thicker", "created_at": "2026-11-03T00:10:28Z", "content": "In AWG, a smaller number is thicker wire, and resistance grows fast as wire thins.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia's AWG table and PowerStream agree on copper at about: 18 AWG 21 ohms/km, 22 AWG 53, 24 AWG 84, 26 AWG 134, 28 AWG 213, 30 AWG 339. Each 3 AWG steps roughly doubles resistance.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/awg-lower-number-is-thicker/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Those are for solid copper at 20°C. Cheap wire may be copper-clad aluminium with higher resistance, though I did not source figures for that, and resistance rises as wire warms.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/awg-lower-number-is-thicker/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Learn 22 AWG as the everyday power wire and 28 AWG as signal only.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/awg-lower-number-is-thicker/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose thin wire is chosen because it looks tidy. It routes beautifully and browns out the first time a servo stalls.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/awg-lower-number-is-thicker/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "UK suppliers often sell by mm2: 22 AWG is about 0.33 mm2 and 18 AWG about 0.82 mm2.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/awg-lower-number-is-thicker/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Two sources agree on the table. I have not tested this myself.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/binary-database-in-git", "created_at": "2026-11-01T16:50:49Z", "content": "A database tracked in git has history but no readable diffs.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["database", "storage", "ledger"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "git stores each version of sc.db as a whole binary change, so a diff shows only that it changed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Merging two versions is not possible, and the history grows with every commit.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Acceptable for one person. I lose readable diffs, but I get a simple recovery path.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/binary-database-in-git/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If capsules were exported as text, git could show what changed in each commit.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "sc.db is tracked today and acts as the recovery path.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I accept that the database has a history, but I acknowledge that readable diffs are not available due to the nature of git's binary change storage. I understand that this limits the ability to merge changes and view individual changes made in each commit.", "neighbours": [], "link_drafts": [{"other": "cube/sc-db-needs-real-backups", "proposal_id": "cube/sc-db-needs-real-backups/proposal/8", "why": "git history is not a tested backup"}, {"other": "cube/this-repo-stays-private", "proposal_id": "cube/this-repo-stays-private/proposal/7", "why": "sc.db is tracked in the repo"}], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 0.72, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "recovery"}], "other": "cube/events-are-audit-not-replay"}]}, {"id": "cube/bipeds-need-active-balance", "created_at": "2026-11-03T00:31:16Z", "content": "A biped falls over without active balance, so it is the hardest shape here.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A Zbotic guide says a biped without active balance control will fall when pushed or on uneven ground. A standing biped needs active control or wide flat feet, and balance uses IMU feedback at ankles and hips.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/bipeds-need-active-balance/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That guide is a retailer's, and small desktop bipeds with big feet do manage slow static walks, which is general knowledge. Hobby servos have backlash, which makes fine balance harder.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/bipeds-need-active-balance/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Leave this until after everything else on this list.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/bipeds-need-active-balance/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a biped steps on a cable. A hexapod would not notice, and the biped goes over with its servos still driving.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/bipeds-need-active-balance/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the backlash cube, which matters more here than on any other shape.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/bipeds-need-active-balance/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a retailer's guide and general knowledge. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/gear-backlash-limits-precision", "proposal_id": "cube/bipeds-need-active-balance/proposal/6", "why": "backlash matters most here"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/british-english-everywhere", "created_at": "2026-11-01T15:36:10Z", "content": "British English everywhere, identifiers included.", "created": "2026-11-01T15:36:10Z", "source": "principle/british-english-everywhere", "tags": ["principle", "code", "foundational", "preference"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as a principle. Code uses canonicalise and neighbour, and a grep at 2026-11-01 for common American spellings in code found none.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:07Z"}, "COUNTER": {"content": "Third-party names stay American, such as sqlite3.Row and the ast module, so identifiers can never be fully consistent.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:17Z"}, "OPINION": {"content": "exactly", "filled_by": "human", "unread": false, "at": "2026-11-01T15:52:15Z"}, "FICTION": {"content": "With American spelling, a search for neighbour would miss half the code.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:22Z"}, "CONTEXT": {"content": "One spelling keeps grep and capsule IDs predictable.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:26Z"}}, "validation": {"validator": "james", "note": "im english", "stale": false, "at": "2026-11-01T15:52:23Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T15:52:29Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/plain-words-in-docs", "proposal_id": "cube/british-english-everywhere/proposal/5", "why": "both are about how things are written"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/bulk-and-decoupling-capacitors", "created_at": "2026-11-01T16:50:48Z", "content": "Bulk capacitors absorb current spikes; small ones filter noise.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["power", "electronics"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A large electrolytic near the load supplies sudden current, while a small ceramic near a chip filters fast noise.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "A capacitor smooths short spikes only. It cannot fix an undersized supply, and too large a capacitor raises inrush current.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Cheap insurance on a servo board, but I fix the supply first.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/bulk-and-decoupling-capacitors/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With no capacitors, each servo start would show up as a voltage dip across the whole board.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Extends the PCA9685 capacitor cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "This claim is based on general knowledge rather than my own testing, as large electrolytics supply sudden current while small ceramics filter fast noise. However, capacitors only smooth short spikes without fixing an undersized power supply, and overly large ones increase inrush current.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/calibration-needs-ground-truth", "created_at": "2026-11-01T16:50:49Z", "content": "A trust score means little until it is checked against outcomes.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["trust"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Calibration asks whether things scored 0.7 turn out true about 70 percent of the time.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "That needs recorded outcomes, which the substrate does not yet collect, so current scores cannot be called calibrated.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Until I log outcomes, trust scores are a ranking aid at best, not probabilities.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/calibration-needs-ground-truth/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If outcomes were logged, the sigmoid could be fitted rather than assumed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "This is the open adaptive-fusion question.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the trust score is a useful ranking aid, as it suggests that 70% of outcomes with a score of 0.7 are likely to be true. However, without recorded outcomes, the score cannot be considered calibrated, and its accuracy is limited.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/canonical-json-must-match-exactly", "created_at": "2026-11-01T16:50:49Z", "content": "Signing JSON needs one exact byte form.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["crypto", "provenance"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A signature covers bytes, so verifier and signer must produce the same canonical form.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "The local convention is not RFC 8785, so another tool would need the same rules or verification fails.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "A local convention is fine while I am the only verifier. Sharing documents would mean moving to a standard.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/canonical-json-must-match-exactly/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If key order varied, an unchanged document could fail verification.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Backed by signing.canonicalise.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because a signature covers bytes, and verifier and signer must produce the same canonical form. However, I acknowledge that the local convention may not align with RFC 8785, which could lead to verification failures if shared documents are used.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/cartesian-machines-are-simple-to-control", "created_at": "2026-11-03T00:31:16Z", "content": "A Cartesian robot moves straight along right-angled axes, as 3D printers and CNC machines do.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia says the three main axes are linear and at right angles, which simplifies control and gives high reliability and precision. It names CNC machines, 3D printers and pen plotters as the same layout, and says gantries are often large.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/cartesian-machines-are-simple-to-control/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The article lists no drawbacks. The robot must also be larger than what it works on, which is general knowledge, and linear axes need rails rather than hobby servos.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/cartesian-machines-are-simple-to-control/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This is the jig of robots, and the right choice for anything precise on a flat bed.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/cartesian-machines-are-simple-to-control/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a pen plotter is the first arm project. It teaches more, with much less maths, than a six-axis arm.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/cartesian-machines-are-simple-to-control/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Stepper motors are usual here, and they are not in this store yet.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/cartesian-machines-are-simple-to-control/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Wikipedia. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/james-carpenter-by-trade", "proposal_id": "cube/cartesian-machines-are-simple-to-control/proposal/6", "why": "jigs and fixtures"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/cheap-servos-may-not-be-tower-pro", "created_at": "2026-11-02T23:52:13Z", "content": "A cheap SG90, MG90S or MG996R is often not a real Tower Pro part.", "created": "2026-11-02T23:52:13Z", "source": "Cross-referenced by Claude, see source/hobby-servos", "tags": ["servo", "hardware"], "group": "Hobby servos", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ProtoSupplies sells its SG90 and MG90S as generic, made in China, and one reseller states its MG996R units are not original Tower Pro.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/cheap-servos-may-not-be-tower-pro/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Those are only a few sellers saying so, and I found no count of how common it is. Generic units can also work fine: ProtoSupplies reports no stripping at maximum load.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/cheap-servos-may-not-be-tower-pro/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Trust my own measurements over any listing, and buy a few to compare.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/cheap-servos-may-not-be-tower-pro/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose two bags of SG90s from different sellers go in one robot. They will not be matched, and one joint will behave differently.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/cheap-servos-may-not-be-tower-pro/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is why published figures disagree so much. I did not find Tower Pro's own datasheets, so every figure here comes from a copy or a seller.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/cheap-servos-may-not-be-tower-pro/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a few sellers' statements, not a survey. I have not measured this on my own servos.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/choose-a-dev-board-by-job", "created_at": "2026-11-03T00:10:30Z", "content": "Choose a board by the job: Uno for 5V parts, C3 for wireless, Pico for pins, micro:bit for no wiring, Pi for Linux.", "created": "2026-11-03T00:10:30Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Each comes from the other cubes: Uno at 5V, C3 with Wi-Fi, Pico with 26 GPIOs, micro:bit with built-in sensors, and Pi 3 with Linux and 1GB.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/choose-a-dev-board-by-job/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "This is my judgement rather than a sourced ranking, and I have not used a benchmark. Boards also overlap, and what you already know matters a lot.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/choose-a-dev-board-by-job/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "For your robots, a Pi for thinking with a microcontroller for moving seems the natural split.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/choose-a-dev-board-by-job/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a project starts on an Uno and then needs Wi-Fi. Moving to a C3 also means moving from 5V to 3.3V on every sensor.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/choose-a-dev-board-by-job/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Top 5 here means common in hobby use, chosen by you and me, not a measured ranking. The fifth, the Pico, was my pick.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/choose-a-dev-board-by-job/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "My judgement built on the other cubes, not a sourced ranking. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/dev-board-memory-spans-500000-times", "proposal_id": "cube/dev-board-memory-spans-500000-times/proposal/6", "why": "both compare the five"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/common-ground-between-supplies", "created_at": "2026-11-01T16:50:48Z", "content": "Separate supplies must share a common ground.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["power", "wiring"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A PWM or I2C signal is measured against ground, so controller and servo supplies need their grounds joined.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Heavy return current through a thin shared ground wire can inject noise, so route the servo return separately from the logic ground.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "The first thing to check when servos twitch for no clear reason.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/common-ground-between-supplies/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without a shared ground, the signal voltage would have no reference and servos would twitch at random.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Applies when the controller and servos use separate supplies, as the PCA9685 guide advises.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because PWM and I2C signals are typically referenced to ground, which is a standard practice in electronics. However, I am not aware of any evidence that a shared ground is necessary for servos to function correctly, and I would need to see more information to confirm this.", "neighbours": [], "link_drafts": [{"other": "cube/first-power-on-checks", "proposal_id": "cube/first-power-on-checks/proposal/8", "why": "confirm a common ground"}], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 0.64, "confirmed": false, "shared": [{"lens": "COUNTER", "term": "ground"}, {"lens": "CONTEXT", "term": "controller"}], "other": "cube/servos-and-the-esp32-should-have"}]}, {"id": "cube/completeness-gates-attestation", "created_at": "2026-11-01T15:36:10Z", "content": "Completeness gates attestation; trust does not run in parallel.", "created": "2026-11-01T15:36:10Z", "source": "default-cube weighting rule", "tags": ["gate", "trust"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "kg cube attest refuses a cube that is not at 100 percent, and changing a face retracts the attestation.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:34Z"}, "COUNTER": {"content": "A thin face counts the same as a strong one. Weights and minimum_lenses now come from default-cube, but its unknown_required and forward_only_lens_changes rules are still ignored.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:35Z"}, "OPINION": {"content": "correct", "filled_by": "human", "unread": false, "at": "2026-11-01T15:52:38Z"}, "FICTION": {"content": "If attestation ignored completeness, a one-lens cube could carry the same trust as a fully examined one.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:35Z"}, "CONTEXT": {"content": "Five lenses at 16 percent plus human validation at 20 percent. Attestation reaches trust as an observation.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:35Z"}}, "validation": {"validator": "james", "note": "correct", "stale": false, "at": "2026-11-01T15:52:46Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T15:52:48Z"}, "note_draft": null, "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/compress-in-uncertain-channels", "created_at": "2026-11-01T15:36:10Z", "content": "Default to compression in uncertain channels.", "created": "2026-11-01T15:36:10Z", "source": "minimum-viable-packet principle", "tags": ["principle", "communication", "foundational", "preference"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as the minimum-viable-packet principle.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:55Z"}, "COUNTER": {"content": "Compression can lose what matters. If the channel was in fact safe, a short packet undersells the idea.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:55Z"}, "OPINION": {"content": "Useful as a default with people I do not know yet. I can always say more once the channel proves safe.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T07:17:45Z"}, "FICTION": {"content": "Sending the full packet every time would mean more misunderstandings in low-bandwidth channels.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:55Z"}, "CONTEXT": {"content": "Linked in spirit to the bandwidth-mismatch and dual-mode-interface concepts.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:50:55Z"}}, "validation": {"validator": "james", "note": "confirmed", "stale": false, "at": "2026-11-02T07:18:26Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T07:18:29Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/plain-words-in-docs", "proposal_id": "cube/compress-in-uncertain-channels/proposal/6", "why": "short, plain wording survives a noisy channel"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/contract-as-data-enforcement-as-code", "created_at": "2026-11-01T15:36:10Z", "content": "The contract is data; enforcement is code.", "created": "2026-11-01T15:36:10Z", "source": "keystone-gate/README.md design decisions; SPEC section 15", "tags": ["gate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "sc capsules list the rules and kg_gate.py holds the checkers. A rule with no checker fails closed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:45Z"}, "COUNTER": {"content": "So a contract edit alone adds nothing, and a new rule always needs code. The data is a list of names, not a language.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:51:02Z"}, "OPINION": {"content": "Right trade for now. A list of rule names is easy to read, and a new check should be real code.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T21:12:53Z"}, "FICTION": {"content": "With rules written in the capsule itself, the gate would need an interpreter for them.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:51:02Z"}, "CONTEXT": {"content": "Until 2026-11-01 must_not rules were listed but never checked, which shows the two halves can drift.", "filled_by": "proposal:claude-draft (accepted by james)", "unread": false, "at": "2026-11-01T15:51:02Z"}}, "validation": {"validator": "james", "note": "part of the forge stack", "stale": false, "at": "2026-11-02T21:13:32Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:13:37Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/foundational-cubes-are-rigid", "proposal_id": "cube/foundational-cubes-are-rigid/proposal/7", "why": "the rules are enforced in code"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/copying-a-live-sqlite-file-is-risky", "created_at": "2026-11-01T16:50:49Z", "content": "Do not copy a live SQLite file; use the backup API.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["database", "storage"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A plain file copy can miss recent data held in the WAL file. The backup API takes a consistent snapshot.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Most copies seem to work, which hides the risk until one is restored.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "Easy to get right once and worth doing properly, because a bad backup is found too late.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/copying-a-live-sqlite-file-is-risky/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "A backup taken mid-write might open fine and silently lack the last changes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "The Keystone Gate tests use the backup API for this reason.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "This claim is based on general knowledge rather than my own testing, but using the backup API ensures a consistent snapshot whereas a plain copy can miss recent data held in the WAL file. The main limitation is that plain file copies often appear to work, which hides the risk of silent data loss until a restore is attempted.", "neighbours": [], "link_drafts": [{"other": "cube/sc-db-needs-real-backups", "proposal_id": "cube/sc-db-needs-real-backups/proposal/6", "why": "how to copy it safely"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/crimp-over-solder-for-vibration", "created_at": "2026-11-03T00:10:28Z", "content": "In anything that vibrates, a good crimp is usually safer than solder on stranded wire.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Vendor guides say solder wicks up stranded wire and makes a rigid section where fatigue starts, and that a crimp keeps the strands flexible. They also say not to tin a wire before crimping, because solder creeps and loosens.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/crimp-over-solder-for-vibration/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "These are vendor blogs selling harnesses, and I found no NASA or IPC text or test data. A bad crimp is worse than good solder, and a good crimp needs the right tool. Support matters either way.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/crimp-over-solder-for-vibration/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Crimp connectors with a proper tool, and solder with strain relief on boards that do not move.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/crimp-over-solder-for-vibration/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a soldered servo lead sits on a walking robot. After months, it breaks just past the joint, and the insulation hides the break.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/crimp-over-solder-for-vibration/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "A forum poster adds that the wire must be mechanically supported whichever method is used.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/crimp-over-solder-for-vibration/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Vendor sources only, no standard or test data read. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/stranded-wire-notation", "proposal_id": "cube/crimp-over-solder-for-vibration/proposal/6", "why": "both protect moving wire"}, {"other": "cube/solder-fume-is-a-real-hazard", "proposal_id": "cube/solder-fume-is-a-real-hazard/proposal/6", "why": "another reason to crimp"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/dc-wire-colours-are-a-habit", "created_at": "2026-11-03T00:10:28Z", "content": "Red for positive and black for negative is a habit in DC work, so measure before connecting.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Hobby leads follow red positive and black or brown negative, as Core Electronics and servo sources show. I found no standard for general low-voltage DC in this search.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dc-wire-colours-are-a-habit/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "A claim of habit is hard to source. Some cheap modules and imported packs are known to swap colours, though I have no source for that, and wire colour proves nothing.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dc-wire-colours-are-a-habit/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Put a meter on any battery or supply lead before connecting it for the first time.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dc-wire-colours-are-a-habit/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an imported pack has its leads reversed. The first connection could destroy everything on the rail.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dc-wire-colours-are-a-habit/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Sticking to my own colours inside a project matters more than which ones I choose.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dc-wire-colours-are-a-habit/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Convention, with no standard found. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-is-8v4-full", "proposal_id": "cube/dc-wire-colours-are-a-habit/proposal/6", "why": "check a pack before connecting"}, {"other": "cube/prevent-reversed-battery", "proposal_id": "cube/prevent-reversed-battery/proposal/6", "why": "colour alone will not protect you"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/delta-robots-keep-motors-on-the-base", "created_at": "2026-11-03T00:31:16Z", "content": "A delta robot keeps its motors on the base, so its light arms can move very fast.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia describes three arms joined to a small platform, with the actuators above the workspace. Low moving mass allows high speed, some up to 300 picks per minute, and parallelograms keep the platform level. It came from Clavel's team at EPFL in the early 1980s.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/delta-robots-keep-motors-on-the-base/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Wikipedia says joining all arms reduces working volume, and it is stiffer for that. Its small payload and its maths are harder than a Cartesian machine's. Three good servos may also be needed, with backlash multiplying at the tool.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/delta-robots-keep-motors-on-the-base/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This is a fun build, and it shows off speed more than usefulness.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/delta-robots-keep-motors-on-the-base/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a chocolate factory needs thousands of quick, gentle moves. That really was the original motive, according to Wikipedia.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/delta-robots-keep-motors-on-the-base/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the opposite of a serial arm, whose motors ride on the arm itself.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/delta-robots-keep-motors-on-the-base/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Wikipedia. I have not built this.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/dev-board-memory-spans-500000-times", "created_at": "2026-11-03T00:10:30Z", "content": "These five boards span from 2KB to 1GB of RAM, about 500,000 times.", "created": "2026-11-03T00:10:30Z", "source": "Cross-referenced by Claude, see source/dev-boards", "tags": ["board", "hardware"], "group": "Dev boards", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Uno 2 KB, micro:bit V2 128 KB, Pico 264 KB, ESP32-C3 400 KB, Pi 3 1 GB, from the other cubes' sources.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/dev-board-memory-spans-500000-times/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "RAM alone does not make a board better, as the Pi's memory comes with Linux and a 2.5A power budget. The C3's 400 KB also includes 16 KB for cache, and Wi-Fi uses a share of it.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/dev-board-memory-spans-500000-times/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Choose the smallest board that does the job.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/dev-board-memory-spans-500000-times/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose every project used a Pi 3. A door sensor would need 2.5A and a clean shutdown to do what a coin cell could.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/dev-board-memory-spans-500000-times/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is a comparison across the board cubes, so check those for sources.", "filled_by": "draft", "at": "2026-11-03T00:10:30Z", "unread": true, "pending": true, "proposal_id": "cube/dev-board-memory-spans-500000-times/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "My comparison of figures in the other cubes. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/choose-a-dev-board-by-job", "proposal_id": "cube/dev-board-memory-spans-500000-times/proposal/6", "why": "both compare the five"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/differential-drive-is-the-simple-base", "created_at": "2026-11-03T00:31:15Z", "content": "Differential drive steers two wheels by speed alone, which makes it the simplest mobile base.", "created": "2026-11-03T00:31:15Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia says equal speeds go straight, and opposite speeds rotate about the axle centre. No steering motion is needed, and casters are typically used to stop it tilting. Forward speed is the average of the wheel speeds, and turn rate is their difference over the wheel spacing.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/differential-drive-is-the-simple-base/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Its heading depends entirely on the wheel speeds, so small differences make it drift, and those rates need sensing. The maths assumes no slip. The claim that nearly all consumer robots use it is tagged as needing a citation.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/differential-drive-is-the-simple-base/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This is where I would start any mobile robot.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/differential-drive-is-the-simple-base/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose two cheap motors differ by 3%. It is told to go straight, and it draws a long curve across the floor.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/differential-drive-is-the-simple-base/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This needs geared motors, or continuous-rotation servos such as the 360 degree ones sold under the same names as your servos.", "filled_by": "draft", "at": "2026-11-03T00:31:15Z", "unread": true, "pending": true, "proposal_id": "cube/differential-drive-is-the-simple-base/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Wikipedia. I have not built this.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/do-not-charge-li-ion-unattended", "created_at": "2026-11-03T00:22:02Z", "content": "Do not charge Li-ion unattended or overnight, and use the right charger on a hard surface.", "created": "2026-11-03T00:22:02Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Nottinghamshire Fire and Rescue says not to charge overnight, to use the chargers provided, and not to cover chargers or packs. Leicestershire and Devon and Somerset say the same on unattended charging, and West Sussex says to use a flat, solid surface.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "This guidance is written mainly for e-bikes and e-scooters, whose packs are far larger than a 22Wh 2S pack. The same fire mechanism applies, though the size of a fire would differ. I did not find the national NFCC or OPSS text.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Charge on a non-flammable surface, away from anything that burns and from the way out, while I am awake and nearby.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a pack charges on a bed overnight. If it fails at 3am, nobody is there, and it is sitting on fuel.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This goes with the charging and BMS cubes. A smoke alarm where you charge is the obvious companion, which is general advice.", "filled_by": "draft", "at": "2026-11-03T00:22:02Z", "unread": true, "pending": true, "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From UK fire services, whose advice agrees. It is written mainly for larger packs.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-charging", "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/6", "why": "where and how to charge"}, {"other": "cube/li-ion-warning-signs", "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/7", "why": "what to watch for"}, {"other": "cube/li-ion-2s-is-8v4-full", "proposal_id": "cube/do-not-charge-li-ion-unattended/proposal/8", "why": "charging should stop at 8.4V for a 2S pack"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/dupont-jumpers-are-for-signals", "created_at": "2026-11-03T00:10:28Z", "content": "Dupont jumpers are for signals and light loads, not servo power.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "One seller lists 26 AWG 2.54mm jumpers at 1A. The wire table gives a 20cm out-and-back run in 26 AWG about 0.05 ohms, so 2.5A would lose over 0.13V before the contacts.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dupont-jumpers-are-for-signals/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "I found no maker's rating or measurement for Dupont-style connectors, and the housings come from many makers. The 1A is a seller's claim, and contact resistance is unknown.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dupont-jumpers-are-for-signals/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use them on the bench, and solder or crimp anything that stays.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dupont-jumpers-are-for-signals/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a working prototype is left on jumpers and put in a moving robot. One pin works loose, and the fault comes and goes.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/dupont-jumpers-are-for-signals/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "They do not lock, unlike XH or XT connectors. That they work loose under vibration is a common view, not a sourced fact.", "filled_by": "draft", "at": "2026-11-03T00:10:50Z", "unread": true, "pending": true, "proposal_id": "cube/dupont-jumpers-are-for-signals/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From a seller's claim and my arithmetic, no measurement found. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-gpio-input-and-current-limits", "proposal_id": "cube/dupont-jumpers-are-for-signals/proposal/6", "why": "fine for signals, not power"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/ed25519-signatures-are-deterministic", "created_at": "2026-11-01T16:50:49Z", "content": "Ed25519 signatures need no random number at signing time.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["crypto", "provenance"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "RFC 8032 derives the nonce from the key and message, so one message and key give one signature.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "COUNTER": {"content": "Determinism avoids bad-randomness failures, but it does nothing about timing leaks in a pure-Python implementation.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "OPINION": {"content": "One less thing to get wrong, though it does not fix the timing weakness.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/ed25519-signatures-are-deterministic/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With a random nonce, one weak random source could reveal the private key.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}, "CONTEXT": {"content": "Pairs with the own-ed25519 cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:39Z"}}, "validation": null, "attestation": null, "note_draft": "I believe Ed25519 signatures do not require a random number at signing time, as the nonce is derived from the key and message, as stated in RFC 8032. However, I am aware that this approach does not address potential timing weaknesses in pure-Python implementations.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/emergency-stop-and-gravity", "created_at": "2026-11-03T00:22:03Z", "content": "Cutting power stops the motors, but it does not hold up an arm.", "created": "2026-11-03T00:22:03Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A CMU summary defines stop category 0 as immediate removal of power from actuators. A commercial arm's manual says its joints have fail-safe brakes for this reason. Your existing cube says an emergency stop should cut actuator power in hardware.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/emergency-stop-and-gravity/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Hobby servos have no brakes, so a loaded arm falls when power goes. For a small arm that may matter little, and for a heavy one it does. I fo
