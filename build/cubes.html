const LENSES = ["FACT", "COUNTER", "OPINION", "FICTION", "CONTEXT"];
const VAR = { FACT: "fact", COUNTER: "counter", OPINION: "opinion", FICTION: "fiction", CONTEXT: "context", HUMAN: "human" };
const LABEL = { attested: "Attested", validated: "Validated", stale: "Validation stale", retracted: "Attestation retracted", draft: "Needs you" };
const POSE = { FACT: [-18, -24], COUNTER: [-18, -114], CONTEXT: [-18, -204], FICTION: [-18, 66], OPINION: [-72, -24], HUMAN: [72, -24] };
const FILTERS = [["all", "All"], ["attested", "Attested"], ["validated", "Validated"], ["needs", "Needs you"], ["drafts", "Drafts to check"]];

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const state = { filter: "all", tag: null, query: "" };
const faceNote = f => !f ? "" : f.pending ? `draft by ${f.drafted_by || "a model"}, not accepted` : f.unread ? "accepted without reading" : "";

function cubeNode(c, size) {
  const stage = el("div", "stage" + (c.status === "attested" ? " sealed" : ""));
  stage.style.setProperty("--s", size + "px");
  const cube = el("div", "cube");
  for (const lens of [...LENSES, "HUMAN"]) {
    const face = lens === "HUMAN" ? c.validation : c.faces[lens];
    const live = lens === "HUMAN" ? c.validation && !c.validation.stale : Boolean(face && !face.pending);
    const side = el("div", `side f-${lens} ` + (live ? `fill-${lens}` : "empty"));
    if (live && lens !== "HUMAN" && face.unread) side.classList.add("unread");
    if (size > 100) side.textContent = lens === "HUMAN" ? "YOU" : lens;
    cube.append(side);
  }
  stage.append(cube);
  return stage;
}

function matches(c) {
  if (state.filter === "needs" && ["attested", "validated"].includes(c.status)) return false;
  if (state.filter === "drafts" && !Object.values(c.faces).some(f => f && f.pending)) return false;
  if (["attested", "validated"].includes(state.filter) && c.status !== state.filter) return false;
  if (state.tag && !c.tags.includes(state.tag)) return false;
  if (state.query) {
    const hay = [c.id, c.content, ...Object.values(c.faces).map(f => f ? f.content : "")].join(" ").toLowerCase();
    if (!hay.includes(state.query)) return false;
  }
  return true;
}

function card(c) {
  const button = el("button", "card");
  button.setAttribute("aria-label", `${c.content} ${LABEL[c.status]}`);
  const strip = el("div", "strip");
  for (const lens of [...LENSES, "HUMAN"]) {
    const face = lens === "HUMAN" ? c.validation : c.faces[lens];
    const live = lens === "HUMAN" ? c.validation && !c.validation.stale : Boolean(face && !face.pending);
    const bit = el("i", live ? (face.unread ? "unread" : "") : "off");
    bit.style.setProperty("--c", `var(--${VAR[lens]})`);
    bit.title = lens;
    strip.append(bit);
  }
  button.append(cubeNode(c, 74), strip, el("p", "", c.content));
  const meta = el("div", "meta");
  meta.append(el("span", "pill " + c.status, LABEL[c.status]), el("span", "", Math.round(c.score * 100) + "%"));
  button.append(meta);
  button.addEventListener("click", () => open(c));
  return button;
}

function draw() {
  const root = document.getElementById("groups");
  root.replaceChildren();
  const shown = CUBES.filter(matches);
  if (!shown.length) root.append(el("p", "none", "No cubes match that."));
  const order = g => (g === "Project claims" ? "" : g);
  for (const group of [...new Set(shown.map(c => c.group))].sort((a, b) => order(a).localeCompare(order(b)))) {
    root.append(el("h2", "", group));
    const grid = el("div", "grid");
    shown.filter(c => c.group === group)
      .sort((a, b) => b.score - a.score || a.id.localeCompare(b.id))
      .forEach(c => grid.append(card(c)));
    root.append(grid);
  }
}

function open(c) {
  const body = document.getElementById("body");
  body.replaceChildren();
  const left = el("div", "left");
  const stage = cubeNode(c, 150);
  const cube = stage.querySelector(".cube");
  left.append(stage, el("div", "hint", "Drag to turn it. Pick a lens to face it."));

  let rx = -26, ry = -38, from = null;
  const pose = () => { cube.style.setProperty("--rx", rx + "deg"); cube.style.setProperty("--ry", ry + "deg"); };
  stage.addEventListener("pointerdown", e => { from = [e.clientX, e.clientY]; stage.setPointerCapture(e.pointerId); cube.style.transition = "none"; });
  stage.addEventListener("pointermove", e => {
    if (!from) return;
    ry += (e.clientX - from[0]) * .6; rx -= (e.clientY - from[1]) * .6;
    from = [e.clientX, e.clientY]; pose();
  });
  stage.addEventListener("pointerup", () => { from = null; cube.style.transition = ""; });

  const right = el("div", "right");
  right.append(el("h3", "", c.content), el("p", "id", c.id));
  const facts = [LABEL[c.status], Math.round(c.score * 100) + "% complete", "standing " + c.standing.toFixed(2)];
  if (c.source) facts.push(c.source);
  right.append(el("p", "facts", facts.join(" · ")));

  const row = (lens, title, text, note) => {
    const b = el("button", "lens" + (text ? "" : " missing"));
    b.dataset.lens = lens;
    b.style.setProperty("--c", `var(--${VAR[lens]})`);
    const head = el("b", "", title);
    if (note) head.append(el("em", "", " · " + note));
    b.append(head, document.createTextNode(text || "Not written yet"));
    b.addEventListener("click", () => { [rx, ry] = POSE[lens]; pose(); });
    return b;
  };
  for (const lens of LENSES) {
    const f = c.faces[lens];
    right.append(row(lens, lens, f && f.content, faceNote(f)));
  }
  const v = c.validation;
  right.append(row("HUMAN", "HUMAN VALIDATION", v && (v.note || "Validated"),
    v ? (v.stale ? "stale, a face changed" : "by " + v.validator) : ""));
  if (c.attestation) {
    const a = c.attestation;
    right.append(el("p", "facts", a.retracted ? "Attestation retracted: " + a.retracted : "Attested by " + a.source + (a.note ? ". " + a.note : "")));
  }
  if (c.neighbours.length) right.append(el("p", "facts", "Neighbours: " + c.neighbours.join(", ")));
  if (c.contradicts) right.append(el("p", "facts", "Contradicts: " + c.contradicts));
  body.append(left, right);
  if (window.cubeEdit) cubeEdit.decorate(right, c);
  const dialog = document.getElementById("detail");
  if (!dialog.open) dialog.showModal();
}

function setup() {
  renderStats();
  setupControls();
}
function renderStats() {
  const n = s => CUBES.filter(c => c.status === s).length;
  const stats = document.getElementById("stats");
  stats.replaceChildren();
  [[CUBES.length, "cubes"], [n("attested"), "attested"], [n("validated"), "validated, not attested"],

   [CUBES.reduce((t, c) => t + Object.values(c.faces).filter(f => f && f.unread && !f.pending).length, 0), "faces not read"]]
    .forEach(([value, label]) => {

<script>
(() => {

  const rand = (seed, n) => { const x = Math.sin(seed * 12.9898 + n * 78.233) * 43758.5453; return x - Math.floor(x); };

  // --- the world -----------------------------------------------------------
  const groupNames = [...new Set(CUBES.map(c => c.group))].sort((a, b) =>
    (a === "Project claims" ? "" : a).localeCompare(b === "Project claims" ? "" : b));

  function topicOf(c, peers) {
    const count = t => peers.filter(p => p.tags.includes(t)).length;
    const usable = c.tags.filter(t => count(t) >= 2 && count(t) < peers.length);
    usable.sort((a, b) => count(b) - count(a) || a.localeCompare(b));

  const clusters = [], nodes = [];
  const focus = { cluster: null, node: null, lens: null };

    const peers = CUBES.filter(c => c.group === group);

    const home = groupNames.length > 1 ? [Math.cos(angle) * 640, 0, Math.sin(angle) * 640] : [0, 0, 0];
    const topics = [...new Set(peers.map(c => topicOf(c, peers)))].sort();

      const cluster = { group, topic, home: add(home, [Math.cos(a) * r * 340, y * 290, Math.sin(a) * r * 340]),
                        nodes: [], c: [0, 0, 0], half: 40 };
      clusters.push(cluster);
      peers.filter(c => topicOf(c, peers) === topic).forEach((c, i) => {
        const seed = hash(c.id);
        const node = {
          c, cluster, seed, sats: [], open: 0, hover: 0, r: 11 + c.score * 6,
          p: add(cluster.home, [rand(seed, 1) * 80 - 40, rand(seed, 2) * 80 - 40, rand(seed, 3) * 80 - 40]),
          v: [0, 0, 0], ry: rand(seed, 4) * 6, rx: rand(seed, 5) * 6, spin: .1 + rand(seed, 6) * .2,

    const count = cl.nodes.length;

      const y = count > 1 ? 1 - (2 * i) / (count - 1) : 0, r = Math.sqrt(1 - y * y), a = i * 2.399963;

  const link = (a, b, kind) => {

  clusters.forEach(cl => cl.nodes.forEach((n, i) => {

  const tagLinks = [...links];

  function physics(dt, time) {
    for (const n of nodes) {

      const grip = open ? 7 : n.fresh > 0 ? 2.4 : .3;

    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {

      const d = [a.p[0] - b.p[0], a.p[1] - b.p[1], a.p[2] - b.p[2]];

    }

      if (l.kind === "bridge" || l.a.cluster !== l.b.cluster) continue;
      const d = [l.b.p[0] - l.a.p[0], l.b.p[1] - l.a.p[1], l.b.p[2] - l.a.p[2]];
      const pull = (Math.hypot(...d) - 110) * .28 * dt / Math.max(Math.hypot(...d), 1);

    list.forEach(n => n.p.forEach((v, k) => { lo[k] = Math.min(lo[k], v); hi[k] = Math.max(hi[k], v); }));
    return { c: lo.map((v, k) => (v + hi[k]) / 2), half: Math.max(...lo.map((v, k) => (hi[k] - v) / 2)) + 30 };
  };
  const tagGroups = groupNames.map(name => ({ name, list: nodes.filter(n => n.c.group === name), c: [0,0,0], half: 100 }));
  let groups = tagGroups;

                  p: add(world.c, [Math.cos(a) * far, -far * .5, Math.sin(a) * far]), v: [0, 0, 0],

  const cam = { yaw: .6, pitch: .34, dist: 1300, t: [...world.c], toDist: 1300 };

    if (view.filter === "attested" && c.status !== "attested") return false;
    if (view.filter === "needs" && c.status === "attested") return false;
    if (!view.query) return true;
    const text = [c.id, c.content, ...Object.values(c.faces).map(f => f ? f.content : "")].join(" ").toLowerCase();
    return text.includes(view.query);
  }

  function getFilteredFaces(faces) {
    if (!view.cutoff) return faces;
    const result = {};
    for (const lens in faces) {
      const f = faces[lens];
      if (f && f.filled_at && f.filled_at > view.cutoff) {
        result[lens] = null;
      } else {
        result[lens] = f;
      }
    }
    return result;

    const faces = getFilteredFaces(item.faces);

    (rand(i, 1) - .5) * 4800, (rand(i, 2) - .5) * 4800, (rand(i, 3) - .5) * 4800]);
  const faceMap = n => {
    const out = {};
    LENSES.forEach(l => { const f = n.c.faces[l]; if (f && !f.pending) out[l] = f.unread ? "unread" : "read"; });

    sky.addColorStop(0, "#141a2c"); sky.addColorStop(1, "#06070d");
    ctx.fillStyle = sky;

      const q = project(d);
      if (!q) continue;
      ctx.fillStyle = `rgba(190,205,235,${.09 + .3 * fog(q.d)})`;

    groups.forEach(g => wire(g.c, g.half, "120,205,235", inside ? .1 : .36));
    clusters.forEach(cl => {
      const on = focus.cluster === cl;
      wire(cl.c, cl.half, on ? "150,215,255" : "110,150,205", on ? .5 : inside ? .06 : .22);
    });

    // Threads, with a pulse travelling along each
    const lit = focus.node;
    for (const l of links) {
      const a = project(l.a.p), b = project(l.b.p);
      if (!a || !b) continue;
      const touches = lit && (l.a === lit || l.b === lit);
      const base = l.kind === "bridge" ? .08 : l.kind === "neighbour" ? .55 : l.kind === "lens" ? .42 : .2;
      const alpha = (lit ? (touches ? .7 : .04) : base) * fog((a.d + b.d) / 2);
      const rgb = l.kind === "lens" ? RGB[l.lens].join(",") : l.kind === "neighbour" ? "242,200,100"
        : l.kind === "contra" ? "240,104,96" : "120,185,255";
      ctx.strokeStyle = `rgba(${rgb},${alpha})`;

      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      if (!calm && l.kind !== "bridge") {

        const dot = { x: mix(a.x, b.x, t), y: mix(a.y, b.y, t) };
        ctx.fillStyle = `rgba(${rgb},${Math.min(1, alpha * 2.2)})`;
        ctx.beginPath(); ctx.arc(dot.x, dot.y, touches ? 2.2 : 1.3, 0, 7); ctx.fill();

    // Cubes and their lenses, furthest first
    const items = [];
    for (const n of nodes) {

      n.rx += dt * n.spin * .4 * (calm ? 0 : 1);

      n.hover = mix(n.hover, hover === n ? 1 : 0, 1 - Math.exp(-dt * 10));
      if (n.fresh > 0) {

        n.trail = n.trail || [];

        if (n.trail.length > 46) n.trail.shift();
      } else if (n.trail && n.trail.length) n.trail.shift();
      const q = project(n.p);
      if (n.trail && n.trail.length > 1) {
        n.trail.forEach((p, i) => {
          const dot = project(p);
          if (dot) glow(dot, 3 + i * .14, "120,235,255", .03 + i / n.trail.length * .2);
        });
      }
      if (!q) continue;
      const near = !focus.cluster || focus.cluster === n.cluster;
      const fade = (matches(n.c) ? 1 : .07) * (focus.node && focus.node !== n ? .13 : near ? 1 : .1);
      items.push({ type: "cube", n, d: q.d, q, p: n.p, size: n.r * (1 + n.hover * .18) * (1 - n.open * .25),
                   ry: n.ry, rx: n.rx, faces: faceMap(n), alpha: fade * fog(q.d) });
      if (n.open > .02) n.sats.forEach((sat, i) => {
        const dir = OUT[sat.lens], turn = time * .22 + i * .12, c = Math.cos(turn), s = Math.sin(turn);
        const off = [dir[0] * c + dir[2] * s, dir[1], -dir[0] * s + dir[2] * c];
        sat.p = add(n.p, off, n.r * 3.1 * n.open);
        const sq = project(sat.p);
        if (!sq) return;
        const live = n.c.faces[sat.lens];
        const present = sat.lens === "HUMAN" ? n.c.validation && !n.c.validation.stale : Boolean(live && !live.pending);
        sat.q = sq;
        items.push({ type: "lens", sat, q: sq, d: sq.d, p: sat.p, size: n.r * .42 * n.open * (focus.lens === sat.lens ? 1.5 : 1),
                     ry: time * .5 + i, rx: time * .3 + i, alpha: n.open, present });
      });
    }
    items.sort((a, b) => b.d - a.d);
    ctx.lineJoin = "round";
    for (const it of items) {
      if (it.type === "cube" && it.n.fresh > 0) glow(it.q, it.size * it.q.k * 4.2, "120,235,255", Math.min(.6, it.n.fresh * .2));
      if (it.type === "cube" && it.n.c.status === "attested") glow(it.q, it.size * it.q.k * 3.2, "242,190,70", .34 * it.alpha);
      if (it.type === "lens") {
        const from = project(it.sat.node.p);
        if (from) {
          ctx.strokeStyle = `rgba(${RGB[it.sat.lens].join(",")},${.55 * it.alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(it.q.x, it.q.y); ctx.stroke();
        }
        drawLens(it, RGB[it.sat.lens]);
        continue;
      }
      drawCube(it);
    }

    // Names
    if (!focus.node) clusters.forEach(cl => {
      const q = project(add(cl.c, [0, -cl.half - 8, 0]));
      if (q && (!focus.cluster || focus.cluster === cl)) label("#" + cl.topic, q, focus.cluster ? 16 : 13, focus.cluster ? .95 : .85 * fog(q.d));
    });
    if (!inside) groups.forEach(g => {
      const q = project(add(g.c, [0, -g.half - 12, 0]));
      if (q) label(g.name, q, 16, .95, 700);
    });
    if (focus.cluster && !focus.node) {
      // Nearest names first; one that would land on another waits for hover
      const placed = [];
      focus.cluster.nodes
        .map(n => ({ n, q: project(add(n.p, [0, n.r * 2.1, 0])) }))
        .filter(x => x.q && matches(x.n.c))
        .sort((a, b) => a.q.d - b.q.d)
        .forEach(({ n, q }) => {
          const text = shorten(n.c.content, 34);
          ctx.font = '500 12px system-ui, "Segoe UI", sans-serif';
          const half = ctx.measureText(text).width / 2 + 6;
          if (placed.some(p => Math.abs(p.x - q.x) < p.half + half && Math.abs(p.y - q.y) < 17)) return;
          placed.push({ x: q.x, y: q.y, half });
          label(text, q, 12, .9, 500);
        });
    }
    if (focus.node) focus.node.sats.forEach(sat => {
      if (sat.q) label(sat.lens === "HUMAN" ? "YOU" : sat.lens, { x: sat.q.x, y: sat.q.y + 26 + focus.node.r * .4 * sat.q.k }, 11, .9, 700);
    });
    requestAnimationFrame(frame);
  }

  function drawLens(it, rgb) {
    // A lens cube is one colour on every side
    const saved = { ...RGB };
    SIDES.forEach(([name]) => { RGB[name] = rgb; });
    drawCube({ ...it, faces: it.present ? Object.fromEntries(SIDES.map(([name]) => [name, "read"])) : {} });
    Object.assign(RGB, saved);
    if (it.present) glow(it.q, it.size * it.q.k * 2.4, rgb.join(","), .22);
  }

  const shorten = (text, n) => (text.length > n ? text.slice(0, n - 1).trimEnd() + "…" : text);


// Part of the cube field. kg_view.py joins these inside one function.
  // --- moving around -------------------------------------------------------
  const crumbs = document.getElementById("crumbs");
  const panel = document.getElementById("panel");

  function setCrumbs() {
    const parts = [["Everything", goHome]];
    if (focus.cluster) parts.push(["#" + focus.cluster.topic, () => goCluster(focus.cluster)]);
    if (focus.node) parts.push([shorten(focus.node.c.content, 30), null]);
    crumbs.replaceChildren();
    parts.forEach(([text, go], i) => {
      if (i) crumbs.append(el("span", "sep", "›"));
      const b = el("button", "", text);
      if (go) b.addEventListener("click", go); else b.disabled = true;
      crumbs.append(b);
    });
  }
  function goHome() {
    focus.cluster = focus.node = focus.lens = null;
    cam.toDist = world.half * 2.42;
    panel.hidden = true; setCrumbs();
  }
  function goCluster(cl) {
    focus.cluster = cl; focus.node = focus.lens = null;
    cam.toDist = cl.spread * 3 + 150;
    panel.hidden = true; setCrumbs();
  }
  function goNode(n) {
    focus.cluster = n.cluster; focus.node = n; focus.lens = null;
    cam.toDist = n.r * 11;
    fillPanel(n); setCrumbs();
  }
  const back = () => focus.node ? goCluster(focus.node.cluster) : goHome();

  function fillPanel(n) {
    const c = n.c;
    panel.replaceChildren();
    const shut = el("button", "shut", "×");
    shut.setAttribute("aria-label", "Back out");
    shut.addEventListener("click", back);
    panel.append(shut, el("h3", "", c.content), el("p", "id", c.id));
    const facts = [LABEL[c.status], Math.round(c.score * 100) + "% complete", "standing " + c.standing.toFixed(2)];
    panel.append(el("p", "facts", facts.join(" · ")));
    const row = (lens, title, text, note) => {
      const b = el("button", "lens" + (text ? "" : " missing"));
      b.dataset.lens = lens;
      b.style.setProperty("--c", `rgb(${RGB[lens].join(",")})`);
      const head = el("b", "", title);
      if (note) head.append(el("em", "", " · " + note));
      b.append(head, document.createTextNode(text || "Not written yet"));
      b.addEventListener("click", () => { focus.lens = focus.lens === lens ? null : lens; });
      return b;
    };
    LENSES.forEach(lens => {
      const f = c.faces[lens];
      panel.append(row(lens, lens, f && f.content, faceNote(f)));
    });
    const v = c.validation;
    panel.append(row("HUMAN", "HUMAN VALIDATION", v && (v.note || "Validated"), v ? (v.stale ? "stale, a face changed" : "by " + v.validator) : ""));
    if (c.source) panel.append(el("p", "facts", "Source: " + c.source));
    if (c.attestation) panel.append(el("p", "facts", c.attestation.retracted
      ? "Attestation retracted: " + c.attestation.retracted
      : "Attested by " + c.attestation.source + (c.attestation.note ? ". " + c.attestation.note : "")));
    const near = links.filter(l => l.a === n || l.b === n);
    if (near.length) {
      panel.append(el("p", "facts", "Linked cubes"));
      near.slice(0, 7).forEach(l => {
        const m = l.a === n ? l.b : l.a;
        const why = l.lens ? `${l.lens}, "${l.term}": ` : "";
        const b = el("button", "hop", why + shorten(m.c.content, 52));
        b.addEventListener("click", () => goNode(m));
        panel.append(b);
      });
    }
    if (window.cubeEdit) {
      const edit = el("button", "hop", "Open in the grid to edit");
      edit.addEventListener("click", () => { document.getElementById("togrid").click(); open(c); });
      panel.append(edit);
    }
    panel.hidden = false;
  }

  function pick(x, y) {
    let best = null, bestGap = 1e9;
    if (focus.node) for (const sat of focus.node.sats) {
      if (sat.q && Math.hypot(sat.q.x - x, sat.q.y - y) < 26) return { sat };
    }
    for (const n of nodes) {
      const q = project(n.p);
      if (!q) continue;
      const gap = Math.hypot(q.x - x, q.y - y);
      if (gap < Math.max(n.r * q.k * 1.5, 11) && gap < bestGap) { best = n; bestGap = gap; }
    }
    return best ? { node: best } : null;
  }
  function clusterAt(x, y) {
    let best = null, bestGap = 1e9;
    for (const cl of clusters) {
      const q = project(cl.c);
      if (!q) continue;
      const gap = Math.hypot(q.x - x, q.y - y);
      if (gap < cl.half * q.k * 1.25 && gap < bestGap) { best = cl; bestGap = gap; }
    }
    return best;
  }

  let drag = null, hover = null;
  const points = new Map();
  const tip = document.getElementById("tip");
  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    points.set(e.pointerId, [e.clientX, e.clientY]);
    drag = { x: e.clientX, y: e.clientY, moved: 0, spread: 0 };
   
  });
  canvas.addEventListener("pointermove", e => {
    if (points.has(e.pointerId)) points.set(e.pointerId, [e.clientX, e.clientY]);
    if (drag && points.size === 2) {
      const [a, b] = [...points.values()], spread = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (drag.spread) cam.toDist *= drag.spread / spread;
      drag.spread = spread; drag.moved = 99;
      return;
    }
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      cam.yaw -= dx * .006;
      cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + dy * .005));
      drag.x = e.clientX; drag.y = e.clientY;
      return;
    }
    const found = pick(e.clientX, e.clientY);
    hover = found && found.node || null;
    canvas.style.cursor = found || clusterAt(e.clientX, e.clientY) ? "pointer" : "grab";
    tip.hidden = !hover;
    if (hover) {
      tip.textContent = `${hover.c.content} (${LABEL[hover.c.status]})`;
      tip.style.left = Math.min(e.clientX + 14, W - 280) + "px";
      tip.style.top = e.clientY + 14 + "px";
    }
  });
  canvas.addEventListener("pointerup", e => {
    points.delete(e.pointerId);
    const moved = drag ? drag.moved : 99;
    drag = null;
    if (moved > 6) return;
    const found = pick(e.clientX, e.clientY);
    if (found && found.sat) { focus.lens = found.sat.lens; return; }
    if (found && focus.cluster && found.node.cluster === focus.cluster) return goNode(found.node);
    const cl = found ? found.node.cluster : clusterAt(e.clientX, e.clientY);
    if (cl && cl !== focus.cluster && !focus.node) return goCluster(cl);
    if (found && focus.node) return goNode(found.node);
    if (focus.cluster && !found) back();
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    cam.toDist = Math.max(60, Math.min(7000, cam.toDist * Math.exp(e.deltaY * .001)));
  }, { passive: false });
  addEventListener("keydown", e => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.querySelector("dialog[open]");
    if (e.key === "Escape" && !typing && !document.getElementById("root").hidden) back();
  });

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
    F = Math.min(W, H) * .95;
  }
  addEventListener("resize", resize);
  resize();

  window.cubeField = {
    setFilter(filter) { view.filter = filter; },
    setQuery(query) { view.query = query; },
    show() { resize(); },
    mode() { return mode; },
    setMode: applyMode,
    update,
    refresh() { if (focus.node) fillPanel(focus.node); },
    // The current view as a PNG, stamped with where you are
    snapshot() {
      const shot = document.createElement("canvas");
      shot.width = canvas.width; shot.height = canvas.height;
      const out = shot.getContext("2d");
      out.drawImage(canvas, 0, 0);
      out.scale(devicePixelRatio, devicePixelRatio);
      out.font = '600 14px system-ui, "Segoe UI", sans-serif';
      out.fillStyle = "rgba(226,232,244,.85)";
      out.fillText(["Cube Field", focus.cluster && "#" + focus.cluster.topic, focus.node && focus.node.c.content]
        .filter(Boolean).join("  ›  "), 16, H - 16);
      return new Promise(done => shot.toBlob(done, "image/png"));
    },
    screenOf(id) { return project(byId[id].p); },
    clusterOf(id) { return project(byId[id].cluster.c); },
    state() { return { cluster: focus.cluster && focus.cluster.topic, node: focus.node && focus.node.c.id, panel: !panel.hidden }; },
  };

  panelReady = true;
  applyMode(MODES.ALL ? "ALL" : "TAGS");
  cam.dist = cam.toDist * 1.25;
  const hashText = decodeURIComponent(location.hash).slice(1);
  if (hashText.startsWith("mode:") && MODES[hashText.slice(5)]) applyMode(hashText.slice(5));
  if (hashText.startsWith("mode:") || hashText === "") {
    for (let i = 0; i < 400; i++) physics(.03, i * .03);
    fitBoxes();
  }
  const openCluster = clusters.find(cl => "topic:" + cl.topic === hashText);
  if (openCluster) {
    goCluster(openCluster);
    for (let i = 0; i < 300; i++) physics(.03, i * .03);
    fitBoxes();
    cam.t = [...openCluster.c];
    cam.dist = cam.toDist;
  }
  const linked = byId[hashText];
  if (linked) {
    goNode(linked);
    cam.t = [...linked.p];
    cam.dist = cam.toDist;
    linked.open = 1;
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
// Working on cubes in the grid. Only active under `kg cube serve`, and only once unlocked.
(() => {
  const api = null;
  if (!api) return;
  const $ = id => document.getElementById(id);
  const toast = $("toast"), detail = $("detail"), form = $("newcube"), fresh = $("addcube");
  const fill = $("fillblanks"), check = $("checkdrafts"), title = document.title;
  const lockButton = $("lock"), unlock = $("unlock"), wrong = $("unlockwrong");
  let key = null, shown = null, seen = null, lastError = null;

  const say = text => {
    (detail.open ? detail : document.body).append(toast);
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(say.timer);
    say.timer = setTimeout(() => { toast.hidden = true; }, 3200);
  };
  const reopen = () => {
    const c = CUBES.find(x => x.id === shown);
    if (detail.open && c) open(c);
  };
  const setKey = value => {
    key = value;
    fresh.hidden = fill.hidden = !key;
    lockButton.textContent = key ? "Lock" : "Unlock to edit";
    reopen();
  };

  async function post(path, data) {
    const headers = { "Content-Type": "application/json", "X-Cube-Token": api.token };
    if (key) headers["X-Cube-Key"] = key;
    const res = await fetch(path, { method: "POST", headers, body: JSON.stringify(data) });
    return [res, await res.json()];
  }

  async function act(data, flyId, message) {
    let res, reply;
    try {
      [res, reply] = await post("/api/do", data);
    } catch (e) {
      return say("The server has stopped. Run kg cube serve again.");
    }
    if (res.status === 401) {
      setKey(null);
      return say("Locked. Unlock to edit.");
    }
    if (!res.ok) return say(reply.error || "That did not work.");
    cubeField.update(reply.cubes, reply.modes, flyId || (reply.result && reply.result.cube_id) || data.cube_id);
    cubeField.refresh();
    reopen();
    if (message) say(message);
    return reply;
  }

  const button = (text, onClick, cls = "tool") => {
    const b = el("button", cls, text);
    b.addEventListener("click", onClick);
    return b;
  };

  function writer(tools, c, label, current, warning, save) {
    tools.replaceChildren();
    const box = el("textarea");
    box.value = current || "";
    box.rows = 3;
    box.setAttribute("aria-label", label);
    tools.append(box, button("Save", () => { if (box.value.trim()) save(box.value); }), button("Cancel", () => open(c)));
    if (warning) tools.append(el("span", "warn", warning));
    box.focus();
  }

  function lensTools(row, c) {
    const lens = row.dataset.lens, face = c.faces[lens];
    const tools = el("div", "tools");
    if (face && face.pending) {
      tools.append(
        button("Accept", () => act({ action: "accept", proposal_id: face.proposal_id }, c.id)),
        button("Reject", () => act({ action: "reject", proposal_id: face.proposal_id }, c.id)));
    }
    const warning = c.validation && !c.validation.stale ? "Changing this voids your validation." : "";
    tools.append(button(face ? "Edit" : "Write", () => writer(tools, c, `${lens} text`, face && face.content, warning,
      content => act({ action: "fill", cube_id: c.id, lens, content }, c.id, `${lens} saved`))));
    row.after(tools);
  }

  function humanTools(row, c) {
    const tools = el("div", "tools"), v = c.validation;
    const left = LENSES.filter(l => !c.faces[l] || c.faces[l].pending).length;
    const valid = v && !v.stale, attested = c.attestation && !c.attestation.retracted;
    if (v || !left) {
      const label = !v ? "Validate" : v.stale ? "Validate again" : "Edit";
      tools.append(button(label, () => writer(tools, c, "Why does this hold?", v && v.note, "",
        note => act({ action: "validate", cube_id: c.id, note }, c.id, "Validated"))));
    } else {
      tools.append(el("span", "warn", `Accept or write the ${left} unfinished ${left === 1 ? "face" : "faces"} to validate.`));
    }
    if (valid && !left && !attested) {
      tools.append(button("I stand behind this", () => act({ action: "attest", cube_id: c.id }, c.id, "Attested")));
    }
    row.after(tools);
  }

  function decorate(box, c) {
    shown = c.id;
    if (!key) return;
    box.querySelectorAll(".lens[data-lens]").forEach(row =>
      (row.dataset.lens === "HUMAN" ? humanTools : lensTools)(row, c));
  }

  lockButton.hidden = false;
  lockButton.addEventListener("click", async () => {
    if (!key) {
      wrong.hidden = true;
      return unlock.showModal();
    }
    try { await post("/api/lock", {}); } catch (e) { say("The server has stopped. Run kg cube serve again."); }
    setKey(null);
  });
  $("unlockcancel").addEventListener("click", () => unlock.close());
  unlock.querySelector("form").addEventListener("submit", async e => {
    e.preventDefault();
    const input = unlock.querySelector("input");
    let res, reply;
    try {
      [res, reply] = await post("/api/unlock", { password: input.value });
    } catch (err) {
      unlock.close();
      return say("The server has stopped. Run kg cube serve again.");
    }
    input.value = "";
    if (!res.ok) {
      wrong.hidden = false;
      return;
    }
    unlock.close();
    setKey(reply.key);
  });

  // The server drafts in the background, so ask it what has arrived
  async function poll() {
    let res, reply;
    try {
      [res, reply] = await post("/api/status", { seen });
    } catch (e) {
      return;
    }
    const typing = document.querySelector("#body .tools textarea, dialog[open] form");
    if (!res.ok || (reply.cubes && typing)) return;
    if (reply.cubes) {
      cubeField.update(reply.cubes, reply.modes);
      cubeField.refresh();
      reopen();
    }
    const fresh = seen === null ? 0 : reply.pending - seen;
    if (fresh > 0) say(`${fresh} new ${fresh === 1 ? "draft" : "drafts"} ready to check`);
    seen = reply.pending;
    if (reply.error && reply.error !== lastError) say(`Drafting failed. ${reply.error}`.slice(0, 160));
    lastError = reply.error;
    document.title = seen ? `(${seen}) ${title}` : title;
    check.hidden = !seen && !reply.drafting;
    check.textContent = reply.drafting ? `Drafting, ${seen} to check` : `${seen} to check`;
  }
  check.addEventListener("click", () => { $("togrid").click(); gridFilter("drafts"); });
  fill.addEventListener("click", async () => {
    const reply = await act({ action: "draft" });
    if (reply) say(reply.result.queued ? `Drafting ${reply.result.queued} cubes` : "Every face is filled or has a draft waiting.");
    poll();
  });
  poll();
  setInterval(poll, 8000);

  fresh.addEventListener("click", () => form.showModal());
  $("newcancel").addEventListener("click", () => form.close());
  form.querySelector("form").addEventListener("submit", async e => {
    e.preventDefault();
    const field = name => form.querySelector(`[name="${name}"]`);
    const faces = Object.fromEntries(LENSES.map(l => [l, field(l).value]));
    const tags = field("tags").value.split(",");
    form.close();
    const reply = await act({ action: "new", content: field("content").value, tags, faces }, null, "Here it comes");
    if (reply) {
      e.target.reset();
      $("tofield").click();
    }
  });

  window.cubeEdit = { decorate };
})();

</script>
<script>
const TIME_DATA = {"min": "2026-10-30 23:59:26", "max": "2026-11-02 07:18:29"};
// The top bar: view switching, filters and cluster modes.
(() => {
  const root = document.getElementById("root"), grid = document.getElementById("grid");
  const swap = showGrid => {
    root.hidden = showGrid; root.style.display = showGrid ? "none" : "";
    grid.hidden = !showGrid;
    if (!showGrid) cubeField.show();
  };
  document.getElementById("togrid").addEventListener("click", () => swap(true));
  document.getElementById("snap").addEventListener("click", async e => {
    const blob = await cubeField.snapshot();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `cube-field-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, "-")}.png`;
    link.click();
    URL.revokeObjectURL(link.href);
    e.target.textContent = "Saved";
    setTimeout(() => { e.target.textContent = "Screenshot"; }, 1400);
  });
  document.getElementById("tofield").addEventListener("click", () => swap(false));
  const chips = [...document.querySelectorAll("[data-f]")];
  chips.forEach(chip => chip.addEventListener("click", () => {
    chips.forEach(c => c.setAttribute("aria-pressed", c === chip));
    cubeField.setFilter(chip.dataset.f);
  }));
  document.getElementById("fsearch").addEventListener("input", e => cubeField.setQuery(e.target.value.trim().toLowerCase()));
  const modeBar = document.getElementById("modes");
  modeBar.append(el("span", "", "Cluster by"));
  const names = { ALL: "All lenses", TAGS: "Tags", REPOS: "Repos" };
  const modes = [...Object.keys(MODES), "TAGS"];
  const modeChips = modes.map(mode => {
    const chip = el("button", "chip", names[mode] || mode[0] + mode.slice(1).toLowerCase());
    chip.setAttribute("aria-pressed", mode === cubeField.mode());
    chip.addEventListener("click", () => {
      modeChips.forEach(c => c.setAttribute("aria-pressed", c === chip));
      cubeField.setMode(mode);
    });
    modeBar.append(chip);
    return chip;
  });
  const key = document.getElementById("key");
  [...LENSES, "HUMAN"].forEach(lens => {
    const swatch = el("i");
    swatch.style.background = `var(--${VAR[lens]})`;
    key.append(swatch, document.createTextNode(lens === "HUMAN" ? "You" : lens[0] + lens.slice(1).toLowerCase()));
  });
  key.append(document.createTextNode("   ·   Gold glow: attested   ·   Hollow: missing   ·   Dim: unread   ·   Thread colour: the lens two cubes share   ·   Click to go in, Esc to back out, scroll to zoom"));
})();

  // --- timeline -------------------------------------------------------------
  const timeSlider = document.getElementById("ftimeline");
  if (timeSlider && typeof TIME_DATA !== "undefined" && TIME_DATA) {
    const minMs = new Date(TIME_DATA.min).getTime();
    const maxMs = new Date(TIME_DATA.max).getTime();
    
    timeSlider.addEventListener("input", () => {
      const val = parseInt(timeSlider.value, 10);
      if (val === 100) {
        view.cutoff = null;
      } else {
        const ms = minMs + (maxMs - minMs) * (val / 100);
        view.cutoff = new Date(ms).toISOString().replace("T", " ").substring(0, 19);
      }
      if (typeof draw === "function") draw();
    });
  }

</script>
</body>
