ons have left scratchpad copies, which are temporary storage.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/sc-db-needs-real-backups/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "I have not seen a restore tested. A GitHub copy depends on one account, and the existing cube warns that copying a live SQLite file is risky.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/sc-db-needs-real-backups/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Keep one offline copy, and try restoring it once.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/sc-db-needs-real-backups/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose the PC dies and the account is locked on the same day. Hours of validation would rest on one untested assumption.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/sc-db-needs-real-backups/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This protects the sign-offs, which only you can recreate.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/sc-db-needs-real-backups/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/copying-a-live-sqlite-file-is-risky", "proposal_id": "cube/sc-db-needs-real-backups/proposal/6", "why": "how to copy it safely"}, {"other": "cube/sqlite-single-file-wal-mode-chosen", "proposal_id": "cube/sc-db-needs-real-backups/proposal/7", "why": "one file holds everything"}, {"other": "cube/binary-database-in-git", "proposal_id": "cube/sc-db-needs-real-backups/proposal/8", "why": "git history is not a tested backup"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/scara-is-stiff-up-and-down", "created_at": "2026-11-03T00:31:16Z", "content": "A SCARA arm is stiff vertically and slightly compliant sideways, which suits assembly.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia says SCARA stands for selective compliance assembly robot arm. It uses parallel-axis joints, stays stiff vertically and gives slightly sideways, suiting a pin into a hole. It says they are faster than Cartesian robots and use less floor space.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/scara-is-stiff-up-and-down/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Wikipedia also says they cost more than Cartesian systems and need inverse kinematics for straight lines. They are industrial examples, so a hobby version with servos will have backlash.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/scara-is-stiff-up-and-down/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Gravity is carried by the structure, so this suits weak servos better than a vertical arm.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/scara-is-stiff-up-and-down/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a SCARA is built with SG90s. They only swing the arm sideways, so they barely fight gravity at all.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/scara-is-stiff-up-and-down/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "That is why the shape matters as much as the servo: the same motor does far more in a horizontal arm.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/scara-is-stiff-up-and-down/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Wikipedia. The hobby point is my judgement. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/arm-base-joint-carries-the-most-torque", "proposal_id": "cube/scara-is-stiff-up-and-down/proposal/6", "why": "gravity is on the structure"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/schema-changes-are-rare-and-logged", "created_at": "2026-11-01T15:36:10Z", "content": "schema.sql changes only by reviewed, logged migration.", "created": "2026-11-01T15:36:10Z", "source": "SPEC section 7 and section 11", "tags": ["substrate"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "One change since migration: the unused rules table was dropped and logged as a schema.migration event.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "There is no migration framework. Changes are manual, so the rule depends on discipline.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "The stable schema is worth protecting. But part of its stability comes from growth moving into state_json, so the schema is stable because the shape-changing happens elsewhere. That JSON needs its own discipline, or the drift just relocates.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:28:16Z"}, "FICTION": {"content": "If every feature had added tables, the substrate would not have survived fifteen layers unchanged.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "All other growth has been additive in state_json. This is the project's main proof of design.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nschema.sql has changed once since the migration: the unused rules table was dropped, and the change was logged as a schema.migration event.\nAll other growth has been additive, inside state_json.\nThere is no migration framework. Changes are manual and rely on discipline, as the COUNTER says.\n“Reviewed” means self-reviewed: I’m the only operator. It is deliberate and logged, but it is not independent review.", "stale": false, "at": "2026-11-02T22:28:34Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:28:39Z"}, "note_draft": "The schema has remained stable for fifteen layers due to the manual, reviewed, and logged migration process. However, the absence of a formal migration framework introduces a risk of inconsistent changes, relying on discipline and individual responsibility to maintain the integrity of the schema.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/scp-substrate-is-a-personal-knowledge", "created_at": "2026-11-02T06:37:51Z", "content": "SCP Substrate is a personal knowledge store in one SQLite file, with tools for querying it, tracking trust in claims, and examining claims as cubes.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"A personal knowledge store in one SQLite file, with tools for querying it, tracking trust in claims, and examining claims as cubes.\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:15:06Z"}, "COUNTER": {"content": "It is not all in one file. Foundations start in sc.json, signing keys and the editing password hash live in the home folder, and API keys live in .env. There is no content search, and trust scores are not calibrated against outcomes, so 'tracking trust' records evidence rather than measuring how reliable a claim is.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:17:24Z"}, "OPINION": {"content": "One file is the right trade for a single-user project: it is easy to back up, inspect and move. I would keep it that way until a second writer is needed, and accept the limits that come with it.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:19:31Z"}, "FICTION": {"content": "Suppose sc.db were lost tomorrow with no copy. The code would rebuild from Git, but every attestation, validation and event would be gone. Would a second copy still count as one file, or does the claim only hold while nothing goes wrong?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:17:29Z"}, "CONTEXT": {"content": "This is the opening line of the project's README. It sets the scope: one person's data, stored locally, with the cubes as a way of examining claims rather than only storing them. The README's Limits section gives the conditions on it.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:17:32Z"}}, "validation": {"validator": "james", "note": "I built this and use it, so I know it stores my knowledge in sc.db and has the query, trust and cube tools. It holds as a description of where the data lives, but not literally: keys and settings sit outside that file.", "stale": false, "at": "2026-11-02T21:19:40Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:19:54Z"}, "note_draft": null, "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/scp-substrate-is-a-single-user", "created_at": "2026-11-02T06:37:51Z", "content": "SCP Substrate is a single-user project and is early, with known limitations and issues.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"It is a single-user project and it is early. Read [Limits](#limits) and [Known issues](#known-issues) before relying on it.\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:21:23Z"}, "COUNTER": {"content": "This is the second line of the README, placed before any instructions, and it points to the Limits and Known issues sections. It matters because trust scores are not calibrated and some features have not been fully tested, so the project states its limits before describing what it does.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:21:11Z"}, "OPINION": {"content": "This is the right warning to put first. I would rather undersell it and say what does not work than have someone trust it too far. I will drop 'early' only when I can say what changed.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:21:25Z"}, "FICTION": {"content": "Suppose someone found the project and relied on it for their own decisions, without reading the Limits. Would the warning have done its job, or does a line at the top only protect the author? What would need to be different for them to rely on it safely?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:21:29Z"}, "CONTEXT": {"content": "This is the second line of the README, placed before any instructions, and it points to the Limits and Known issues sections. It matters because trust scores are not calibrated and some features have not been fully tested, so the project states its limits before describing what it does.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:21:31Z"}}, "validation": {"validator": "james", "note": "I built this and I'm the only person using it, so single-user is accurate. Early is my own judgement rather than a measure: parts are tested and in daily use, but others aren't finished, and the known issues are listed in the README.", "stale": false, "at": "2026-11-02T21:21:56Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:22:02Z"}, "note_draft": null, "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/self-balancing-needs-a-fast-loop", "created_at": "2026-11-03T00:31:16Z", "content": "A two-wheel balancer is an inverted pendulum, so it falls without constant correction from an IMU.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A Cornell project describes the design as inherently unstable. A 2023 arXiv paper uses geared DC motors with encoders, an IMU and PID. Another project fuses gyro and accelerometer readings into a tilt angle with a complementary filter.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/self-balancing-needs-a-fast-loop/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "These are student projects and one paper, not a design standard. A slow control loop or Wi-Fi jitter can make it fail, which is my inference from the C3 cube. Hobby servos are not a good fit, as motors need quick reversals.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/self-balancing-needs-a-fast-loop/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "A great control project, and a poor way to get a useful robot quickly.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/self-balancing-needs-a-fast-loop/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a balancer runs on a single core during a Wi-Fi burst. A few missed readings, and it is on its face.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/self-balancing-needs-a-fast-loop/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "One project needed a heat sink on its motor driver because of high motor current.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/self-balancing-needs-a-fast-loop/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From student projects and one paper. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-c3-is-single-core-risc-v", "proposal_id": "cube/self-balancing-needs-a-fast-loop/proposal/6", "why": "control loops against Wi-Fi"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/servo-pulse-range-needs-checking", "created_at": "2026-11-02T23:52:13Z", "content": "Datasheets say 1 to 2 ms, but listings say 500 to 2400 us, so a servo's real range must be measured.", "created": "2026-11-02T23:52:13Z", "source": "Cross-referenced by Claude, see source/hobby-servos", "tags": ["servo", "hardware"], "group": "Hobby servos", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The MG90S datasheet copy gives 1.5 ms as middle and about 2 ms and 1 ms as the ends. ProtoSupplies and Circuit Rocks give 1 to 2 ms with a 20 ms frame. Some SG90 listings give 500 to 2400 us.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/servo-pulse-range-needs-checking/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "I could not find a test showing which range real units accept. Listings may be right for some units, and pushing past the mechanical end can stall a servo.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/servo-pulse-range-needs-checking/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Start at 1 to 2 ms and widen in small steps while watching for the end stops.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/servo-pulse-range-needs-checking/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a library sends 500 us to a servo that ends at 1 ms. It grinds against its stop, drawing stall current the whole time.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/servo-pulse-range-needs-checking/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This backs up the pulse width cube and the PCA9685 calibration cube.", "filled_by": "draft", "at": "2026-11-02T23:52:13Z", "unread": true, "pending": true, "proposal_id": "cube/servo-pulse-range-needs-checking/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Sources disagree on the range, and I found no test of it. I have not measured this on my own servos.", "neighbours": [], "link_drafts": [{"other": "cube/servo-pulse-width-convention", "proposal_id": "cube/servo-pulse-range-needs-checking/proposal/6", "why": "sources for the 1 to 2 ms convention"}, {"other": "cube/pca9685-calibrate-before-trusting-angles", "proposal_id": "cube/servo-pulse-range-needs-checking/proposal/7", "why": "the range differs per servo"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/servo-pulse-width-convention", "created_at": "2026-11-01T16:50:48Z", "content": "Hobby servos read position from pulse width, around 1 to 2 ms.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["servo", "pwm"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Position comes from the width of a repeating pulse, commonly 1 to 2 ms within a 20 ms frame at 50 Hz.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "The range varies by model, and many servos travel further on 0.5 to 2.5 ms. Check the datasheet before trusting an angle.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Treat the numbers as a starting point and calibrate each servo.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/servo-pulse-width-convention/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If every servo honoured the same pulse range, calibration would not be needed.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Explains why the PCA9685 frequency and calibration cubes matter together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because the standard electronics principle states that position comes from the width of a repeating pulse, commonly 1 to 2 ms within a 20 ms frame at 50 Hz. However, I am aware that the range may vary by model, and calibration is often necessary to ensure accurate positioning.", "neighbours": [], "link_drafts": [{"other": "cube/servo-pulse-range-needs-checking", "proposal_id": "cube/servo-pulse-range-needs-checking/proposal/6", "why": "sources for the 1 to 2 ms convention"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/servo-stall-current", "created_at": "2026-11-01T16:50:48Z", "content": "A servo draws its peak current at stall.", "created": "2026-11-01T16:50:48Z", "source": "General knowledge, drafted by Claude", "tags": ["servo", "power"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A blocked or heavily loaded servo draws far more current than one moving freely, and that peak sets the supply requirement.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Datasheet stall current is rarely printed on cheap servos, so the supply margin is often a guess until current is measured.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Size the supply from measured stall current, not the typical figures.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/servo-stall-current/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "If an arm joint jammed at full torque, one stalled servo could sag the voltage for every other joint.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Pairs with the PCA9685 supply sizing cube. Measure current under load.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because a blocked or heavily loaded servo draws significantly more current than one moving freely, and the peak current is a critical factor in determining the supply requirement. However, I note that the stall current figure is often not provided on cheap servos, making it necessary to rely on measured data to ensure accurate supply sizing.", "neighbours": [], "link_drafts": [{"other": "cube/mg90s-stall-current", "proposal_id": "cube/mg90s-stall-current/proposal/6", "why": "real figures for the general claim"}, {"other": "cube/mg996r-current", "proposal_id": "cube/mg996r-current/proposal/6", "why": "real figures for the general claim"}, {"other": "cube/sg90-stall-current", "proposal_id": "cube/sg90-stall-current/proposal/6", "why": "real figures for the general claim"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/servo-wire-colours", "created_at": "2026-11-03T00:10:28Z", "content": "On servos, red is power, the darkest wire is ground, and the lightest is signal.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Flite Test gives the rule that the lightest colour is signal and the darkest is negative. Forum lists give Futaba as red, black, white, and JR as red, brown, orange. Your SG90 and MG90S listing gives brown, red and orange.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/servo-wire-colours/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Sources disagree on the JR signal, orange or yellow. Colours are a convention on cheap parts, not a guarantee, so check the sheet.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/servo-wire-colours/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Red in the middle is why a reversed servo plug often survives, and I would still check before power-on.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/servo-wire-colours/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an unknown servo has three grey wires. No rule helps, and only its documentation or a meter will.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/servo-wire-colours/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This sits with the PCA9685 plug orientation cube, where ground goes to the bottom row.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/servo-wire-colours/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Flite Test, forum lists and ProtoSupplies. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/pca9685-servo-plug-orientation", "proposal_id": "cube/servo-wire-colours/proposal/6", "why": "colour tells you which way round"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/servos-and-the-esp32-should-have", "created_at": "2026-11-01T17:11:42Z", "content": "Servos and the ESP32 should have separate power supplies.", "created": "2026-11-01T17:11:42Z", "source": "written by james", "tags": ["servo", "power", "esp32", "robot-arm"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Servos draw sudden current peaks when they start or stall. On a shared supply those peaks can make the voltage sag and reset the ESP32.", "filled_by": "human", "unread": false, "at": "2026-11-01T17:11:42Z"}, "COUNTER": {"content": "Separate supplies add wiring and cost, and they still need a common ground. Servo current through a thin shared ground can still cause noise.", "filled_by": "human", "unread": false, "at": "2026-11-01T17:11:42Z"}, "OPINION": {"content": "best option for multipul servo control", "filled_by": "human", "unread": false, "at": "2026-11-01T17:47:44Z"}, "FICTION": {"content": "If an arm shared one small supply, a big shoulder move could restart the controller mid-motion and drop every joint at once.", "filled_by": "human", "unread": false, "at": "2026-11-01T17:11:42Z"}, "CONTEXT": {"content": "Follows from the PCA9685 guide's warning about powering servos from the controller, and from the ESP32 brownout cube.", "filled_by": "human", "unread": false, "at": "2026-11-01T17:11:42Z"}}, "validation": {"validator": "james", "note": "servos stall load means boards brown out", "stale": false, "at": "2026-11-01T17:48:38Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-01T17:48:40Z"}, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-too-high-for-servos", "proposal_id": "cube/li-ion-2s-too-high-for-servos/proposal/8", "why": "a single pack still needs separate rails"}, {"other": "cube/mg996r-current", "proposal_id": "cube/mg996r-current/proposal/8", "why": "the strongest case for separate supplies"}, {"other": "cube/pi-3-power-and-lifetime", "proposal_id": "cube/pi-3-power-and-lifetime/proposal/7", "why": "the same separate supply rule"}, {"other": "cube/ws2812b-power-and-protection", "proposal_id": "cube/ws2812b-power-and-protection/proposal/6", "why": "the same separate supply rule"}], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 1.21, "confirmed": false, "shared": [{"lens": "CONTEXT", "term": "warning"}, {"lens": "FICTION", "term": "big"}, {"lens": "FACT", "term": "peaks"}], "other": "cube/esp32-brownout-resets"}, {"lambda": 0.64, "confirmed": false, "shared": [{"lens": "COUNTER", "term": "ground"}, {"lens": "CONTEXT", "term": "controller"}], "other": "cube/common-ground-between-supplies"}]}, {"id": "cube/set-software-joint-limits", "created_at": "2026-11-01T16:50:49Z", "content": "Keep joint limits in software, below the physical stops.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["robot-arm", "safety", "calibration", "foundational"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Clamp every commanded angle to a calibrated safe range before it reaches the servo.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A limit only protects what it knows. A wrong calibration or a collision with the arm's own body still gets through.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "No move should reach a servo without passing these limits.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/set-software-joint-limits/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Without limits, one bad value could drive a servo into its stop and strip the gears.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Builds on the PCA9685 calibration cube.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe this claim holds because calibrated safe ranges can prevent damage to the servo and surrounding components. However, I acknowledge that a wrong calibration or unforeseen physical interactions can still cause issues, limiting the effectiveness of the limits.", "neighbours": [], "link_drafts": [{"other": "cube/inverse-kinematics-maps-position-to-angles", "proposal_id": "cube/set-software-joint-limits/proposal/6", "why": "inverse kinematics can ask for angles past a limit"}, {"other": "cube/pca9685-calibrate-before-trusting-angles", "proposal_id": "cube/set-software-joint-limits/proposal/7", "why": "limits rest on calibrated angles"}, {"other": "cube/mg996r-travel-is-120-degrees", "proposal_id": "cube/set-software-joint-limits/proposal/8", "why": "travel varies by servo"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/sg90-stall-current", "created_at": "2026-11-02T23:52:12Z", "content": "An SG90 stall current is listed between 360 and 750 mA.", "created": "2026-11-02T23:52:12Z", "source": "Cross-referenced by Claude, see source/hobby-servos", "tags": ["servo", "hardware"], "group": "Hobby servos", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "ProtoSupplies measured 360 mA on a generic unit, Circuit Rocks gives about 550 mA, and a Chinese datasheet gives 750 mA ±10%. Idle is about 10 mA, and moving is 100 to 250 mA.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-stall-current/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The figures differ by a factor of two, and the only labelled measurement is one seller's. It is also the low end, so it should not be used for sizing.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-stall-current/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Size power for 750 mA per servo, the highest figure, because being wrong that way costs little.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-stall-current/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose four SG90s jam at once on a 1A supply sized from the 360 mA figure. On the 750 mA figure they could draw 3A.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-stall-current/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This gives real numbers to the general servo stall current cube.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-stall-current/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Sources disagree, and I am using the highest figure for sizing. I have not measured this on my own servos.", "neighbours": [], "link_drafts": [{"other": "cube/servo-stall-current", "proposal_id": "cube/sg90-stall-current/proposal/6", "why": "real figures for the general claim"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/sg90-torque-figures-disagree", "created_at": "2026-11-02T23:52:12Z", "content": "SG90 stall torque is published anywhere from 1.2 to 1.8 kg-cm.", "created": "2026-11-02T23:52:12Z", "source": "Cross-referenced by Claude, see source/hobby-servos", "tags": ["servo", "hardware"], "group": "Hobby servos", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Rapid's SG90 sheet and Circuit Rocks give 1.8 kg-cm at 4.8V. Other datasheet copies give 1.2 at 4.8V, and a Chinese datasheet gives 1.3. ProtoSupplies measured 1.7 on a generic unit.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-torque-figures-disagree/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "These may describe different products sold under one name, so no single figure is the SG90's. The measured 1.7 comes from one seller and one kind of unit. Stall torque is also a limit, not a working load.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-torque-figures-disagree/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Plan around about 1 kg-cm of useful torque, and treat 1.8 as a ceiling.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-torque-figures-disagree/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an arm is designed to use exactly 1.8 kg-cm. A batch from another seller arrives at 1.2, and the arm can no longer lift.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-torque-figures-disagree/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "A forum rule of thumb is to halve the stall figure for real use. That is advice, not a measurement.", "filled_by": "draft", "at": "2026-11-02T23:52:12Z", "unread": true, "pending": true, "proposal_id": "cube/sg90-torque-figures-disagree/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Sources disagree, so this records the spread, not one true value. I have not measured this on my own servos.", "neighbours": [], "link_drafts": [{"other": "cube/arm-base-joint-carries-the-most-torque", "proposal_id": "cube/arm-base-joint-carries-the-most-torque/proposal/8", "why": "the gripper servo"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/shape-sets-the-power-budget", "created_at": "2026-11-03T00:31:17Z", "content": "The robot's shape sets its servo count, which sets everything else about power.", "created": "2026-11-03T00:31:17Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Using this store's figures: a 4-joint MG90S arm stalls at about 2.8A, an 18-servo MG90S hexapod at 12.6A, and a 6-joint MG996R arm at 15A, while your 2S pack holds about 22Wh.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/shape-sets-the-power-budget/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "This is my arithmetic from your cubes, and every servo stalling at once is a worst case. The servo counts are illustrative, not sourced standards, and real duty is much lower.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/shape-sets-the-power-budget/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Choose the shape first, then size the regulator, wire, fuse and BMS from its count.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/shape-sets-the-power-budget/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a hexapod is designed around a 5A regulator. It fine-tunes its gait for weeks, and the fix was always the power stage.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/shape-sets-the-power-budget/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the link between the shape cubes and the servo, battery, wiring and safety cubes.", "filled_by": "draft", "at": "2026-11-03T00:31:17Z", "unread": true, "pending": true, "proposal_id": "cube/shape-sets-the-power-budget/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "My arithmetic from the other cubes. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/li-ion-2s-runtime-estimate", "proposal_id": "cube/shape-sets-the-power-budget/proposal/6", "why": "runtime depends on the shape"}, {"other": "cube/pca9685-servo-current-sizing", "proposal_id": "cube/shape-sets-the-power-budget/proposal/7", "why": "the same sizing question"}, {"other": "cube/fuse-the-battery-positive-near-the-pack", "proposal_id": "cube/shape-sets-the-power-budget/proposal/8", "why": "fuse for the chosen shape"}, {"other": "cube/robots-can-move-without-warning", "proposal_id": "cube/shape-sets-the-power-budget/proposal/9", "why": "more joints, more moving parts"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/sharp-gp2y0a21-ir-distance", "created_at": "2026-11-03T00:02:38Z", "content": "The Sharp GP2Y0A21 measures 10 to 80cm as a 5V analog voltage.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Sharp's datasheet gives 10 to 80 cm, analog output, 4.5 to 5.5 V supply and typical 30 mA. A tutorial reports about 2.3V at 10cm and 0.4V at 80cm.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/sharp-gp2y0a21-ir-distance/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "The output is not linear. The voltage figures come from a tutorial, and I did not read the output table. Check the range on an ESP32 ADC, and note this was not the 3.3V part. Its 30 mA is an average, and I could not confirm the advice to add a capacitor.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/sharp-gp2y0a21-ir-distance/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "This suits a fixed job in a narrow range, but the VL53L0X is easier for new work.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/sharp-gp2y0a21-ir-distance/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose something comes closer than 10cm. The curve folds back, and a near object can read as far away.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/sharp-gp2y0a21-ir-distance/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "It needs 5V power while the ESP32 reads its output, so it needs both rails.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/sharp-gp2y0a21-ir-distance/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Range and supply are from Sharp's datasheet, and the output voltages from a tutorial. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-logic-is-3v3", "proposal_id": "cube/sharp-gp2y0a21-ir-distance/proposal/6", "why": "5V power with a read at 3.3V"}, {"other": "cube/no-one-distance-sensor-sees-everything", "proposal_id": "cube/sharp-gp2y0a21-ir-distance/proposal/7", "why": "a third way of measuring"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/signed-means-provenance-not-trust", "created_at": "2026-11-01T12:39:16Z", "content": "Signed means provenance, not trust.", "created": "2026-11-01T12:39:16Z", "source": "signed-not-trusted principle + james-gilbert-v1 lens_note", "tags": ["principle", "provenance", "crypto"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "A signature proves who signed a document. It does not prove the document is true, useful, or trusted.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:21Z"}, "COUNTER": {"content": "In most systems, signed and trusted are assumed equivalent. Simpler for end users: one gesture, one meaning.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:21Z"}, "OPINION": {"content": "Keeping the two separate prevents a signed lie from being treated as trust. The user makes the trust judgment, which is the correct place for judgment to live.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:22Z"}, "FICTION": {"content": "If signed meant trusted, the substrate would be simpler but unsafe — a signed lie indistinguishable from a signed truth.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:22Z"}, "CONTEXT": {"content": "From james-gilbert-v1.lens_note: 'Holds no lambda; signed means provenance, not trust.' Implemented via separate signing.py and trust.py. The gate (sc/symlm-answerer) preserves this — no_invented_ids is provenance, not trust.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:39:22Z"}}, "validation": {"validator": "james", "note": "foundational principle; holds", "stale": false, "at": "2026-11-01T12:39:22Z"}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null, "at": "2026-11-01T15:58:07Z"}, "note_draft": null, "neighbours": ["cube/sqlite-single-file-wal-mode-chosen"], "link_drafts": [{"other": "cube/rotate-a-leaked-key-immediately", "proposal_id": "cube/rotate-a-leaked-key-immediately/proposal/7", "why": "a leaked signing key lets anyone sign as you"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/six-joints-for-any-pose", "created_at": "2026-11-03T00:31:16Z", "content": "An arm needs six joints to reach any position at any orientation.", "created": "2026-11-03T00:31:16Z", "source": "Cross-referenced by Claude, see source/robot-configurations", "tags": ["robot", "hardware"], "group": "Robot configurations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia's serial manipulator article describes joints placing an object at an arbitrary position and orientation. Three cover position and three rotation, making six the minimum for a full pose.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/six-joints-for-any-pose/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "Many jobs need far fewer: a 4-joint pick-and-place arm keeps a tool pointing down. An arm also reaches any pose only within its workspace, and singularities lose directions of motion.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/six-joints-for-any-pose/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Start with four joints and a gripper, because six costs a lot more for little gain.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/six-joints-for-any-pose/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a six-servo arm meets a singularity mid-move. Two joints try to spin fast for a tiny move of the tool.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/six-joints-for-any-pose/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the inverse kinematics cube, and designs with three intersecting wrist axes have closed-form solutions.", "filled_by": "draft", "at": "2026-11-03T00:31:16Z", "unread": true, "pending": true, "proposal_id": "cube/six-joints-for-any-pose/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From Wikipedia and robotics papers. I have not built this.", "neighbours": [], "link_drafts": [{"other": "cube/inverse-kinematics-maps-position-to-angles", "proposal_id": "cube/six-joints-for-any-pose/proposal/6", "why": "how joints are solved"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/solder-fume-is-a-real-hazard", "created_at": "2026-11-03T00:22:03Z", "content": "Rosin solder fume can cause permanent asthma, so extract it rather than breathe it.", "created": "2026-11-03T00:22:03Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "HSE describes rosin-based solder fume as one of the most significant causes of occupational asthma in Britain, with fully developed effects being permanent. It expects local exhaust ventilation for most production soldering.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/solder-fume-is-a-real-hazard/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "HSE's guidance is for workplaces, and occasional hobby use is a smaller exposure. HSE says positioning and ventilation may be enough for small-scale, very infrequent soldering with no rosin flux, so rosin itself still needs care. Some documents I saw are older.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/solder-fume-is-a-real-hazard/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use a fan that pulls fume away and a window open, and do not lean over the joint. Wash my hands too, which is general advice for leaded solder.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/solder-fume-is-a-real-hazard/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose years of evenings spent over an iron bring on a cough. By the time it is diagnosed, the damage cannot be undone.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/solder-fume-is-a-real-hazard/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This links to the crimp cube, since HSE's first suggestion is to replace soldering where possible.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/solder-fume-is-a-real-hazard/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "From HSE guidance for workplaces, applied to hobby use.", "neighbours": [], "link_drafts": [{"other": "cube/crimp-over-solder-for-vibration", "proposal_id": "cube/solder-fume-is-a-real-hazard/proposal/6", "why": "another reason to crimp"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/split-files-over-400-lines", "created_at": "2026-11-01T15:36:10Z", "content": "Split files over 400 lines; modular.", "created": "2026-11-01T15:36:10Z", "source": "principle/split-400-lines", "tags": ["principle", "code", "foundational", "preference"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Recorded as a principle.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "Line count is a blunt measure. The test files were split by size on 2026-11-01, so they are numbered parts, not topics, and the limit was met without making them more modular.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "A good prompt to look for a natural split, but the number should not force a bad one.", "filled_by": "proposal:claude-draft-opinion (accepted by james)", "unread": false, "at": "2026-11-02T22:03:04Z"}, "FICTION": {"content": "Without the limit, kg_agent.py would have kept growing past 550 lines, with cubes and proposals tangled together.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "Six code files and two test files were over the limit until 2026-11-01. tests/test_house_rules.py now fails if any file passes 400 lines.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "I believe the claim holds because the principle of splitting files over 400 lines has been recorded and implemented. However, I note that the line count is a blunt measure and may not accurately reflect the modularity of the code. The limit may have forced a less-than-ideal split, but it has prevented the code from growing indefinitely.", "stale": false, "at": "2026-11-02T22:03:12Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:03:19Z"}, "note_draft": "I believe the claim holds because the principle of splitting files over 400 lines has been recorded and implemented. However, I note that the line count is a blunt measure and may not accurately reflect the modularity of the code. The limit may have forced a less-than-ideal split, but it has prevented the code from growing indefinitely.", "neighbours": [], "link_drafts": [{"other": "cube/keep-dependencies-to-one", "proposal_id": "cube/split-files-over-400-lines/proposal/6", "why": "both keep the code small enough to read"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/sqlite-decision-for-the-substrate", "created_at": "2026-11-01T12:45:03Z", "content": "SQLite decision for the substrate", "created": "2026-11-01T12:45:03Z", "source": "chose-sqlite capsule", "tags": ["database", "decision"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "SQLite, single file, WAL mode One writer, many readers, no network. Schema fixed at migration; no migrations since.", "filled_by": "proposal:fact_from_decision (accepted by james)", "unread": false, "at": "2026-11-01T12:45:28Z"}, "COUNTER": {"content": "Considered but not chosen: Postgres (overkill for one user); DuckDB (analytics not transactions); Filesystem JSON (no queries)", "filled_by": "proposal:counter_from_alternatives (accepted by james)", "unread": false, "at": "2026-11-01T12:45:28Z"}, "OPINION": {"content": "One writer is enough. Single file is honest — no distributed lie. The schema has held through 15 capability layers.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:48:50Z"}, "FICTION": {"content": "If it had needed concurrent writes, we'd have picked Postgres and lost the local-first property. That trade would have been wrong for this project.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:48:50Z"}, "CONTEXT": {"content": "Chosen 2026-10-25. Single user, on a phone, no network. Alternatives rejected for adding infrastructure without benefit. See capsule chose-sqlite.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:49:07Z"}}, "validation": {"validator": "james", "note": "third complete cube; both FACT and COUNTER derived from chose-sqlite", "stale": false, "at": "2026-11-01T12:48:51Z"}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null, "at": "2026-11-01T15:58:07Z"}, "note_draft": null, "neighbours": ["cube/sqlite-single-file-wal-mode-chosen"], "link_drafts": [], "link_reasons": {"cube/sqlite-single-file-wal-mode-chosen": "shared tags: ['database', 'decision']"}, "contradicts": null, "overlaps": []}, {"id": "cube/sqlite-single-file-wal-mode-chosen", "created_at": "2026-11-01T12:36:26Z", "content": "SQLite, single file, WAL mode. Chosen for the SCP substrate.", "created": "2026-11-01T12:36:26Z", "source": "chose-sqlite capsule", "tags": ["database", "decision"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "SQLite, single file, WAL mode. One writer, many readers.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}, "COUNTER": {"content": "Postgres for concurrent writes. DuckDB for analytics. Filesystem JSON had no query engine.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}, "OPINION": {"content": "One writer is enough for one user. The schema has held through fifteen capability layers.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}, "FICTION": {"content": "If we ever had a hundred concurrent users, we would have to migrate.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}, "CONTEXT": {"content": "Chosen 2026-10-25 by james. Single user, on a phone, no network dependency.", "filled_by": "human", "unread": false, "at": "2026-11-01T12:36:35Z"}}, "validation": {"validator": "james", "note": "confirmed right choice so far", "stale": false, "at": "2026-11-01T12:36:35Z"}, "attestation": {"source": "james", "note": "Run by Claude on james's instruction ('fix all', 2026-11-01), resting on his validation note.", "retracted": null, "at": "2026-11-01T15:58:07Z"}, "note_draft": null, "neighbours": ["cube/signed-means-provenance-not-trust", "cube/sqlite-decision-for-the-substrate"], "link_drafts": [{"other": "cube/keep-dependencies-to-one", "proposal_id": "cube/keep-dependencies-to-one/proposal/7", "why": "SQLite ships with Python"}, {"other": "cube/sc-db-needs-real-backups", "proposal_id": "cube/sc-db-needs-real-backups/proposal/7", "why": "one file holds everything"}], "link_reasons": {"cube/sqlite-decision-for-the-substrate": "shared tags: ['database', 'decision']"}, "contradicts": null, "overlaps": []}, {"id": "cube/sqlite-wal-allows-one-writer", "created_at": "2026-11-01T16:50:49Z", "content": "SQLite WAL gives concurrent readers but still one writer.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["database", "storage"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "In WAL mode readers do not block the writer, but only one write transaction runs at a time.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "Two processes writing at once get busy errors unless a timeout is set, so one-writer has to be a design rule.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "One writer suits a one-person system. I should treat it as a design rule.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/sqlite-wal-allows-one-writer/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "With many writers, SQLite would stop being the simple answer.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "Backs the existing SQLite decision cubes.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe SQLite WAL mode allows for concurrent readers, but only one writer can be active at a time. This is a design rule that should be followed to avoid busy errors when multiple writers are involved.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/static-can-kill-parts-silently", "created_at": "2026-11-03T00:22:03Z", "content": "Static can damage parts with no visible sign, so touch ground before handling bare boards.", "created": "2026-11-03T00:22:03Z", "source": "Cross-referenced by Claude, see source/hardware-safety", "tags": ["safety", "hardware", "foundational"], "group": "Hardware safety", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "My search on this found no source, so this is general knowledge: a charge on a person can discharge through a sensitive component, and the damage may not show at first.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/static-can-kill-parts-silently/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "With no source here, treat it as unverified. Hobby parts on boards are fairly tough, and a strap may be excessive at home.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/static-can-kill-parts-silently/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Touch something earthed, and hold boards by the edges.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/static-can-kill-parts-silently/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose an ESP32 works, then starts failing weeks later. The cause was a spark nobody felt.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/static-can-kill-parts-silently/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "This is the lowest risk in this set, as it threatens parts, not people.", "filled_by": "draft", "at": "2026-11-03T00:22:03Z", "unread": true, "pending": true, "proposal_id": "cube/static-can-kill-parts-silently/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "General knowledge with no source found.", "neighbours": [], "link_drafts": [{"other": "cube/first-power-on-checks", "proposal_id": "cube/static-can-kill-parts-silently/proposal/6", "why": "static damage can show at first power-on"}, {"other": "cube/esp32-gpio-input-and-current-limits", "proposal_id": "cube/static-can-kill-parts-silently/proposal/7", "why": "bare ESP32 pins have little margin"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/stranded-wire-notation", "created_at": "2026-11-03T00:10:28Z", "content": "Stranded wire is named by total area, so 22 AWG 7/30 is seven 30 AWG strands.", "created": "2026-11-03T00:10:28Z", "source": "Cross-referenced by Claude, see source/wiring", "tags": ["wiring", "hardware"], "group": "Wiring and connectors", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Wikipedia says a stranded wire's AWG reflects the strands' combined area, and that it is about 13% wider than solid wire of the same gauge. It gives 22 AWG 7/30 as seven 30 AWG strands.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/stranded-wire-notation/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That source covers notation, not flexibility. That more strands bend better is general knowledge, and I did not source any fatigue figures.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/stranded-wire-notation/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Use stranded in anything that moves, and silicone wire with many strands at joints.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/stranded-wire-notation/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose solid wire runs through an arm's elbow. It works for weeks, then breaks inside the insulation where nobody can see it.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/stranded-wire-notation/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Solid wire is still useful on a breadboard, where it holds its shape.", "filled_by": "draft", "at": "2026-11-03T00:10:28Z", "unread": true, "pending": true, "proposal_id": "cube/stranded-wire-notation/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Notation from Wikipedia, and the advice is general knowledge. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/crimp-over-solder-for-vibration", "proposal_id": "cube/crimp-over-solder-for-vibration/proposal/6", "why": "both protect moving wire"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/structured-output-limits-free-text", "created_at": "2026-11-01T16:50:49Z", "content": "A fixed output schema makes a model's answer checkable.", "created": "2026-11-01T16:50:49Z", "source": "General knowledge, drafted by Claude", "tags": ["gate", "language"], "group": "General engineering notes", "repo": null, "score": 0.64, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "A JSON schema forces separate claim and evidence fields that code can verify.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "COUNTER": {"content": "A schema guarantees shape only. The content inside the fields can still be wrong.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "OPINION": {"content": "Needed for anything a program has to check. It controls shape, and the content still needs checking.", "filled_by": "draft", "at": "2026-11-01T20:32:43Z", "unread": true, "pending": true, "proposal_id": "cube/structured-output-limits-free-text/proposal/5", "drafted_by": "claude"}, "FICTION": {"content": "Free text would need parsing before any check could run.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}, "CONTEXT": {"content": "kg_llm.py uses this for its claims.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T20:32:40Z"}}, "validation": null, "attestation": null, "note_draft": "I believe the claim holds because a JSON schema provides a fixed structure for the data, which can be verified by code. However, the main limit of this claim is that the schema only guarantees the shape of the data, and the actual content within the fields may still be incorrect.", "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/switch-contacts-bounce", "created_at": "2026-11-03T00:02:38Z", "content": "Switch contacts bounce for over a millisecond, so input must be debounced.", "created": "2026-11-03T00:02:38Z", "source": "Cross-referenced by Claude, see source/sensors-and-outputs", "tags": ["sensor", "hardware"], "group": "Sensors and outputs", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "Ganssle tested a set of switches, pressing each 300 times. EE Journal reports an average bounce of 1557 microseconds and a maximum of 6200. Ganssle excluded one switch that bounced for 157 ms.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/switch-contacts-bounce/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "I could not open Ganssle's page, so these come via EE Journal and search summaries. It was his sample of switches, and new switches may differ. Ganssle also says bounce can reach hundreds of milliseconds.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/switch-contacts-bounce/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Debounce for 20 ms in software, and check a real switch with a scope if it matters.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/switch-contacts-bounce/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose a bump counter uses a plain interrupt. One hit counts as seven, and the robot thinks it has been hit seven times.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/switch-contacts-bounce/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "An ESP32 runs far faster than a bounce, so without debouncing it sees every one.", "filled_by": "draft", "at": "2026-11-03T00:02:38Z", "unread": true, "pending": true, "proposal_id": "cube/switch-contacts-bounce/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": "Figures reported by EE Journal from Ganssle, and I did not read the original. The 20 ms is my judgement. I have not tested this myself.", "neighbours": [], "link_drafts": [{"other": "cube/esp32-pull-ups-for-switches", "proposal_id": "cube/switch-contacts-bounce/proposal/6", "why": "both shape a clean input"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/symlm-has-no-weights", "created_at": "2026-11-01T15:36:10Z", "content": "SymLM is symbolic: no weights, no training, every output traceable.", "created": "2026-11-01T15:36:10Z", "source": "SPEC section 12", "tags": ["language"], "group": "Project claims", "repo": null, "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "Grammar, lexicon, classifiers and intents are capsules. Behaviour changes only when a human edits one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "COUNTER": {"content": "It covers little: 12 grammar rules and 478 words. Since 2026-11-01 kg ask --claude adds a statistical model beside it for phrasing, outside SymLM.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "OPINION": {"content": "Worth keeping as the traceable core. Fluency comes from elsewhere, so the boundary between the two has to be visible in every output.", "filled_by": "human", "unread": false, "at": "2026-11-02T22:30:23Z"}, "FICTION": {"content": "If SymLM could phrase freely, it would need the weights it was built to avoid.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}, "CONTEXT": {"content": "SPEC section 12 calls it a different mechanism from an LLM, not a smaller one.", "filled_by": "proposal:claude-draft (accepted by james (bulk accept, not read line by line))", "unread": true, "at": "2026-11-01T15:53:46Z"}}, "validation": {"validator": "james", "note": "Validated by James Gilbert (author/maintainer), 2026-11-02.\n\nSymLM has no weights and no training. Its grammar, lexicon, classifiers and intents are all capsules, and its behaviour changes only through a human edit.\nEvery SymLM output traces to the specific capsules that produced it.\nCoverage is small (12 grammar rules, 478 words), and that’s accepted.\nkg ask --claude (since 2026-11-01) runs a statistical model beside SymLM, for phrasing only. Its output is not SymLM output and isn’t covered by the traceability claim. Outputs are labelled by which path produced them.", "stale": false, "at": "2026-11-02T22:30:48Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T22:30:52Z"}, "note_draft": "SymLM is a symbolic language model, relying on capsules for grammar, lexicon, and intents, with behaviour changes only triggered by human edits. Its limitations include a narrow scope of 12 grammar rules and 478 words, and it is not a statistical model, despite recent additions.", "neighbours": [], "link_drafts": [{"other": "cube/python-for-these-tools", "proposal_id": "cube/python-for-these-tools/proposal/8", "why": "SymLM is Python rules, with no model to load"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/the-data-is-organised-into-capsules", "created_at": "2026-11-02T06:37:51Z", "content": "Data is stored as capsules, links and events, and each capsule's type is a foundation defined in sc.json.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"Everything stored is a capsule, a link or an event. A capsule's type is its foundation. Foundations are defined in `sc.json`. Run `scripts/bootstrap.py` to copy them into `sc.db`; this does not happen automatically. Instances (people, projects, documents, repos, symbols, cubes, conversation turns) live only in `sc.db`.\"", "filled_by": "human", "unread": false, "at": "2026-11-02T21:23:30Z"}, "COUNTER": {"content": "'Everything' is not quite true. sc.db also has a trust_scores table and a schema_version table, which are neither capsules, links nor events. Foundations also exist in two places, sc.json and sc.db, and the copy only updates when bootstrap.py is run, so the two can differ. Nothing validates a capsule's state against its foundation, so the type is a label rather than an enforced rule.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:23:36Z"}, "OPINION": {"content": "A small number of shapes is what makes this project easy to reason about. I would keep sc.json as the place foundations are defined and accept the manual bootstrap step, because it means a change to them is a deliberate one.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:24:01Z"}, "FICTION": {"content": "Suppose someone edits a foundation in sc.json and forgets to run bootstrap.py. Everything keeps working, but the database and the file now disagree about what a capsule is. How long would it take to notice, and which one would be right?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:24:11Z"}, "CONTEXT": {"content": "This comes from the README's 'How data is organised' section. It matters because every other part of the project, from trust scores to cubes, is built on these shapes. sc.json currently defines 18 foundations, and a new kind of data usually goes in state_json rather than a schema change.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:24:05Z"}}, "validation": {"validator": "james", "note": "This is how I designed it, and capsules, links and events hold nearly all the data. It holds as the main design rather than word for word: sc.db has two small extra tables, and foundations are kept in sc.json and copied across by bootstrap.py.", "stale": false, "at": "2026-11-02T21:24:30Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:24:33Z"}, "note_draft": null, "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": [{"lambda": 0.84, "confirmed": false, "shared": [{"lens": "COUNTER", "term": "foundation"}, {"lens": "FACT", "term": "foundation"}, {"lens": "FICTION", "term": "foundations"}, {"lens": "OPINION", "term": "foundations"}], "other": "cube/two-layer-rule"}]}, {"id": "cube/the-page-is-never-public", "created_at": "2026-11-03T00:45:24Z", "content": "The cube server stays on 127.0.0.1, and reaches the phone only through a private Tailscale link.", "created": "2026-11-03T00:45:24Z", "source": "Written by Claude from this project's code, see source/project-security", "tags": ["security", "foundational"], "group": "Foundations", "repo": null, "score": 0.0, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "kg_serve.py binds to 127.0.0.1. Tailscale says Serve is reachable only by devices on your tailnet, and that Funnel is for public access, so a port can be switched by running a command.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/the-page-is-never-public/proposal/1", "drafted_by": "claude"}, "COUNTER": {"content": "That means one Funnel command would publish it. The page's text is readable to any device that gets through, as reading needs only the page's own token. Other devices on your tailnet are also trusted.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/the-page-is-never-public/proposal/2", "drafted_by": "claude"}, "OPINION": {"content": "Never run tailscale funnel on this machine, and keep the tailnet to my own devices.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/the-page-is-never-public/proposal/3", "drafted_by": "claude"}, "FICTION": {"content": "Suppose funnel is used to show a friend the page. Your whole store is one link away from anyone.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/the-page-is-never-public/proposal/4", "drafted_by": "claude"}, "CONTEXT": {"content": "Old devices on the tailnet, such as those last seen months ago, are worth removing.", "filled_by": "draft", "at": "2026-11-03T00:45:24Z", "unread": true, "pending": true, "proposal_id": "cube/the-page-is-never-public/proposal/5", "drafted_by": "claude"}}, "validation": null, "attestation": null, "note_draft": null, "neighbours": [], "link_drafts": [{"other": "cube/writes-need-token-and-unlock", "proposal_id": "cube/the-page-is-never-public/proposal/6", "why": "two layers on one door"}], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/the-project-consists-of-several-parts", "created_at": "2026-11-02T06:37:51Z", "content": "The project consists of several parts, including Substrate, Engines, SymLM, and Keystone Gate.", "created": "2026-11-02T06:37:51Z", "source": "Worded by ollama from the scp-substrate README", "tags": ["repo", "scp-substrate", "private"], "group": "scp-substrate", "repo": "scp-substrate", "score": 1.0, "status": "attested", "standing": 0.73, "faces": {"FACT": {"content": "The README says: \"Parts - **Substrate:** stores capsules (JSON records), links between them, and a log of events. - **Engines:** derive links from rules, and compute trust scores. - **SymLM:** a small rule-based language layer that answers questions by walking the graph. It uses no model weights. - **Keystone Gate:** cubes, a gate that checks answers, an optional Claude layer, and a 3D page for browsing and editing cubes. See [keystone-gate/README.md](keystone-gate/README.md).\"", "filled_by": "proposal:model-draft:ollama (accepted by james)", "unread": false, "at": "2026-11-02T21:24:45Z"}, "COUNTER": {"content": "The four parts are less separate than the list suggests. Keystone Gate shares sc.db with the substrate, and the substrate has read-only cube support in walk_cubes.py and explain.py, so a bad write affects both. The Engines are also thinner than the name: only one trust score is stored, and evidence is scored by hand. 'Uses no model weights' is true of SymLM but not of the project, since the Keystone Gate model layer calls Claude, Gemini and Ollama.", "filled_by": "human", "unread": false, "at": "2026-11-02T21:25:52Z"}, "OPINION": {"content": "The split is useful because it shows where facts stop and wording starts. The substrate and SymLM find the facts, and any model only rewords them behind the gate. I would keep that line clear even as the parts share a database.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:26:00Z"}, "FICTION": {"content": "Suppose Keystone Gate were deleted tomorrow. The substrate, Engines and SymLM should carry on, apart from a few foundations and cube walkers left behind. How clean would that removal really be, and what would be lost that could not be rebuilt?", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:26:02Z"}, "CONTEXT": {"content": "This is the 'Parts' list near the top of the README, and it gives a reader the map of the project. Keystone Gate's own README sets out where the boundary sits and what removing it would involve. Its layer was added later than the substrate, and the wording changed when Gemini and Ollama joined Claude.", "filled_by": "proposal:model-draft:claude (accepted by james)", "unread": false, "at": "2026-11-02T21:26:04Z"}}, "validation": {"validator": "james", "note": "I designed these four parts and this is how the project is laid out. They're separate in code but not fully independent, because Keystone Gate shares sc.db and the substrate can read cubes.", "stale": false, "at": "2026-11-02T21:27:36Z"}, "attestation": {"source": "james", "note": null, "retracted": null, "at": "2026-11-02T21:27:38Z"}, "note_draft": null, "neighbours": [], "link_drafts": [], "link_reasons": {}, "contradicts": null, "overlaps": []}, {"id": "cube/the-project-currently-has-core-validation", "created_at": "2026-11-02T06:36:34Z", "content": "The project currently has core validation and mutation operators implemented, whilst self-calibrating Meta-Gate thresholds remain planned for future development.", "created": "2026-11-02T06:36:34Z", "source": "Worded by gemini from the keystone_gate README", "tags": ["repo", "keystone-gate"], "group": "keystone_gate", "repo": "keystone_gate", "score": 0.8, "status": "draft", "standing": 0.5, "faces": {"FACT": {"content": "The README’s status list marks core validation and mutation operators as implemented (✅ [exact lines]) and Meta-Gate self-calibration as in progress or planned (🔄).", "filled_by": "human", "unread": false, "at": "2026-11-02T22:18:30Z"}, "COUNTER": {"content": "A ✅ in a README is the author’s status mark, not evidence. “Implemented” could mean anything from written and untested to covered by passing tests. Also, 🔄 usually means in progress, not planned, so the claim’s wording may understate or misstate where Meta-Gate actually is.", "filled_by": "human", "unread": false, "at": "2026-11-02T22
