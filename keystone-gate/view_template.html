<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Field</title>
<style>
/*STYLE*/
</style>
</head>
<body>
<div id="root">
  <canvas id="field" aria-label="Your cubes as a 3D field. The grid view lists the same cubes."></canvas>
  <div id="bar">
    <nav id="crumbs" aria-label="Where you are"></nav>
    <input id="fsearch" type="search" placeholder="Search" aria-label="Search cubes">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="attested" aria-pressed="false">Attested</button>
    <button class="chip" data-f="needs" aria-pressed="false">Needs you</button>
    <button class="chip" id="addcube" hidden>+ New cube</button>
    <button class="chip" id="snap">Screenshot</button>
    <button class="chip" id="togrid">Grid</button>
  </div>
  <div id="modes" aria-label="Cluster by"></div>
  <div id="key"></div>
  <div id="tip" hidden></div>
  <aside id="panel" hidden></aside>
  <div id="toast" role="status" hidden></div>
</div>
<dialog id="newcube">
  <form>
    <h3>New cube</h3>
    <label>The claim<textarea name="content" rows="2" required></textarea></label>
    <label>Tags, separated by commas<input name="tags"></label>
    <label>Fact<textarea name="FACT" rows="2"></textarea></label>
    <label>Counter<textarea name="COUNTER" rows="2"></textarea></label>
    <label>Opinion<textarea name="OPINION" rows="2"></textarea></label>
    <label>Fiction<textarea name="FICTION" rows="2"></textarea></label>
    <label>Context<textarea name="CONTEXT" rows="2"></textarea></label>
    <div class="actions"><button type="button" class="tool" id="newcancel">Cancel</button><button type="submit" class="tool">Send it in</button></div>
  </form>
</dialog>
<main id="grid" hidden>
  <p><button class="chip" id="tofield">Back to the field</button></p>
  <h1>Data Cubes</h1>
  <p class="sub">Each side is a lens. Solid means filled, hollow means missing, and striped means accepted without being read. The bar shows all six sides at once.</p>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="controls" id="controls"></div>
  <div id="groups"></div>
</main>
<dialog id="detail"><button id="close" aria-label="Close">&times;</button><div class="detail" id="body"></div></dialog>

<script>
/*GRID*/
</script>
<script>
/*FIELD*/
</script>
<script>
/*EDIT*/
</script>
<script>
/*BAR*/
</script>
</body>
</html>
