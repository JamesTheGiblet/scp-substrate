<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Field</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1d1f24; --muted: #62666f; --line: #d9d7d0;
  --fact: #2f6fd0; --counter: #d0483f; --opinion: #d9920f; --fiction: #7d55c7;
  --context: #178a84; --human: #3b9a4b; --seal: #b98a12;
  --empty: rgba(40, 44, 52, .05); --empty-line: rgba(40, 44, 52, .32);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161b; --panel: #1e2128; --ink: #eceded; --muted: #a0a5af; --line: #333844;
    --fact: #5a95ee; --counter: #ee6f66; --opinion: #eeb030; --fiction: #a584ea;
    --context: #3fb8b0; --human: #5fc26f; --seal: #e6bb45;
    --empty: rgba(235, 238, 245, .05); --empty-line: rgba(235, 238, 245, .32);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input { font: inherit; color: inherit; }
main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 2px 0 20px; }
.stats { display: flex; flex-wrap: wrap; gap: 26px; margin-bottom: 20px; }
.stat b { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 4px 12px; cursor: pointer; color: var(--muted); font-size: 13px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#search {
  flex: 1 1 200px; max-width: 300px; padding: 5px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel);
}
h2 { font-size: 15px; margin: 30px 0 12px; color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 14px 12px; cursor: pointer; text-align: left; display: flex;
  flex-direction: column; align-items: center; gap: 12px; width: 100%;
}
.card:hover, .card:focus-visible { border-color: var(--muted); outline: none; }
.card p {
  margin: 0; font-size: 13px; line-height: 1.35; width: 100%;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 3.9em;
}
.meta { display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: var(--muted); }
.pill { font-weight: 600; }
.pill.attested { color: var(--seal); }
.pill.validated { color: var(--human); }
.pill.stale, .pill.retracted { color: var(--counter); }

.strip { display: flex; gap: 3px; width: 100%; }
.strip i { flex: 1; height: 7px; border-radius: 2px; background: var(--c); }
.strip i.off { background: none; border: 1px dashed var(--empty-line); }
.strip i.unread { opacity: .5; }
.stage { perspective: 620px; width: var(--s); height: var(--s); margin: calc(var(--s) * .14) 0; }
.cube {
  position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
  transform: rotateX(var(--rx, -26deg)) rotateY(var(--ry, -38deg));
  transition: transform .45s ease;
}
.card:hover .cube, .card:focus-visible .cube { --ry: 322deg; transition-duration: 1.6s; }
.side {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; letter-spacing: .04em; font-size: calc(var(--s) * .115);
  backface-visibility: hidden; border: 1px solid rgba(0, 0, 0, .22);
}
.side.empty { background: var(--empty); border: 1px dashed var(--empty-line); color: var(--muted); backface-visibility: visible; }
.side.unread { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 5px, transparent 5px 10px); }
.f-FACT { transform: translateZ(calc(var(--s) / 2)); }
.f-COUNTER { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.f-CONTEXT { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.f-FICTION { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.f-OPINION { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.f-HUMAN { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.fill-FACT { background-color: var(--fact); } .fill-COUNTER { background-color: var(--counter); }
.fill-OPINION { background-color: var(--opinion); } .fill-FICTION { background-color: var(--fiction); }
.fill-CONTEXT { background-color: var(--context); } .fill-HUMAN { background-color: var(--human); }
.stage.sealed { filter: drop-shadow(0 0 7px var(--seal)); }

#root { position: fixed; inset: 0; background: #06070d; color: #e6eaf3; overflow: hidden; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#bar { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
#bar > * { pointer-events: auto; }
#crumbs { display: flex; align-items: center; gap: 4px; margin-right: auto; }
#crumbs button { border: 0; background: none; color: #e6eaf3; cursor: pointer; padding: 3px 4px; font-weight: 600; }
#crumbs button:disabled { cursor: default; color: #9fb4d8; font-weight: 400; }
#crumbs .sep { color: #6d7a93; }
#root .chip { background: rgba(14, 18, 30, .7); border-color: #333c52; color: #c3cbdb; }
#root .chip[aria-pressed="true"] { background: #e6eaf3; color: #0a0d15; border-color: #e6eaf3; }
#fsearch { width: 170px; padding: 4px 12px; border-radius: 999px; border: 1px solid #333c52; background: rgba(14, 18, 30, .7); color: #e6eaf3; }
#modes { position: absolute; top: 56px; left: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: #93a0b8; max-width: calc(100vw - 32px); }
#modes .chip { font-size: 12px; padding: 2px 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: -3px 0 10px 15px; align-items: center; }
.tool { border: 1px solid #333c52; background: none; color: #c3cbdb; border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 12px; }
.tool:hover { border-color: #9fb4d8; color: #fff; }
.tools textarea, .tools input { width: 100%; background: #0b0e17; color: #e6eaf3; border: 1px solid #333c52; border-radius: 6px; padding: 6px 8px; font-size: 14px; }
.tools .warn { color: #f0b23a; font-size: 12px; }
#toast { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); background: rgba(8, 11, 19, .94); border: 1px solid #333c52; border-radius: 8px; padding: 7px 14px; font-size: 14px; }
#toast[hidden], #addcube[hidden] { display: none; }
#newcube { background: #10131d; color: #e6eaf3; border-color: #2c3448; width: min(560px, calc(100vw - 32px)); padding: 20px; }
#newcube h3 { margin: 0 0 12px; font-size: 18px; }
#newcube label { display: block; font-size: 12px; color: #98a5bd; margin-bottom: 9px; }
#newcube textarea, #newcube input { display: block; width: 100%; margin-top: 3px; background: #0b0e17; color: #e6eaf3; border: 1px solid #333c52; border-radius: 6px; padding: 6px 8px; font-size: 14px; }
#newcube .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#key { position: absolute; left: 16px; bottom: 12px; font-size: 12px; color: #93a0b8; pointer-events: none; }
#key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 5px 0 12px; }
#key i:first-child { margin-left: 0; }
#tip { position: fixed; max-width: 270px; background: rgba(8, 11, 19, .92); border: 1px solid #333c52; border-radius: 6px; padding: 5px 9px; font-size: 13px; pointer-events: none; }
#panel {
  position: absolute; top: 56px; right: 16px; bottom: 16px; width: min(390px, calc(100vw - 32px));
  background: rgba(10, 13, 22, .86); border: 1px solid #2c3448; border-radius: 12px;
  padding: 18px 16px; overflow-y: auto; backdrop-filter: blur(8px);
}
#panel[hidden], #tip[hidden] { display: none; }
#panel h3 { margin: 0 30px 3px 0; font-size: 18px; line-height: 1.3; }
#panel .id, #panel .facts { color: #98a5bd; }
#panel .lens { color: #e6eaf3; font-size: 14px; }
#panel .lens:hover { background: rgba(255, 255, 255, .05); }
#panel .lens.missing { color: #8d99b0; }
#panel .lens b em { color: #98a5bd; }
.shut { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: #98a5bd; font-size: 22px; cursor: pointer; }
.hop { display: block; width: 100%; text-align: left; border: 1px solid #2c3448; background: none; color: #c9d5ea; border-radius: 6px; padding: 5px 9px; margin-bottom: 5px; cursor: pointer; font-size: 13px; }
.hop:hover { border-color: #6d7a93; }
@media (max-width: 640px) { #panel { top: auto; height: 52vh; } #key { display: none; } #fsearch { width: 120px; } }
dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink);
  width: min(880px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0;
}
dialog::backdrop { background: rgba(10, 12, 16, .6); }
.detail { display: grid; grid-template-columns: 250px 1fr; gap: 8px 24px; padding: 24px; }
.left { display: flex; flex-direction: column; align-items: center; }
.left .stage { touch-action: none; cursor: grab; margin: 40px 0 44px; }
.hint { font-size: 12px; color: var(--muted); text-align: center; }
.right h3 { margin: 0 34px 4px 0; font-size: 19px; line-height: 1.3; }
.id { font-size: 12px; color: var(--muted); word-break: break-all; margin: 0 0 10px; }
.facts { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.lens {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  border-left: 4px solid var(--c); padding: 7px 11px; margin-bottom: 7px; cursor: pointer;
}
.lens:hover { background: var(--empty); }
.lens b { display: block; font-size: 12px; letter-spacing: .04em; }
.lens b em { font-style: normal; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.lens.missing { color: var(--muted); font-style: italic; }
#close {
  position: absolute; top: 12px; right: 12px; border: 0; background: none; cursor: pointer;
  font-size: 22px; line-height: 1; color: var(--muted); padding: 4px 8px;
}
.none { color: var(--muted); padding: 28px 0; }
@media (max-width: 640px) {
  main { padding: 20px 16px 48px; }
  .detail { grid-template-columns: 1fr; padding: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .cube { transition: none; }
  .card:hover .cube, .card:focus-visible .cube { --ry: -38deg; }
}
</style>
</head>
<body>
<div id="root">
  <canvas id="field" aria-label="Your cubes as a 3D field. The grid view lists the same cubes."></canvas>
  <div id="bar">
    <nav id="crumbs" aria-label="Where you are"></nav>
    <input id="fsearch" type="search" placeholder="Search" aria-label="Search cubes">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="attested" aria-pressed="false">Attested</button>
    <button class="chip" data-f="needs" aria-pressed="false">Needs you</button>
    <button class="chip" id="addcube" hidden>+ New cube</button>
    <button class="chip" id="snap">Screenshot</button>
    <button class="chip" id="togrid">Grid</button>
  </div>
  <div id="modes" aria-label="Cluster by"></div>
  <div id="key"></div>
  <div id="tip" hidden></div>
  <aside id="panel" hidden></aside>
  <div id="toast" role="status" hidden></div>
</div>
<dialog id="newcube">
  <form>
    <h3>New cube</h3>
    <label>The claim<textarea name="content" rows="2" required></textarea></label>
    <label>Tags, separated by commas<input name="tags"></label>
    <label>Fact<textarea name="FACT" rows="2"></textarea></label>
    <label>Counter<textarea name="COUNTER" rows="2"></textarea></label>
    <label>Opinion<textarea name="OPINION" rows="2"></textarea></label>
    <label>Fiction<textarea name="FICTION" rows="2"></textarea></label>
    <label>Context<textarea name="CONTEXT" rows="2"></textarea></label>
    <div class="actions"><button type="button" class="tool" id="newcancel">Cancel</button><button type="submit" class="tool">Send it in</button></div>
  </form>
</dialog>
<main id="grid" hidden>
  <p><button class="chip" id="tofield">Back to the field</button></p>
  <h1>Data Cubes</h1>
  <p class="sub">Each side is a lens. Solid means filled, hollow means missing, and striped means accepted without being read. The bar shows all six sides at once.</p>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="controls" id="controls"></div>
  <div id="groups"></div>
</main>
<dialog id="detail"><button id="close" aria-label="Close">&times;</button><div class="detail" id="body"></div></dialog>

<script>
const CUBES = /*CUBES*/[];
const MODES = /*MODES*/{};
const LENSES = ["FACT", "COUNTER", "OPINION", "FICTION", "CONTEXT"];
const VAR = { FACT: "fact", COUNTER: "counter", OPINION: "opinion", FICTION: "fiction", CONTEXT: "context", HUMAN: "human" };
const LABEL = { attested: "Attested", validated: "Validated", stale: "Validation stale", retracted: "Attestation retracted", draft: "Needs you" };
const POSE = { FACT: [-18, -24], COUNTER: [-18, -114], CONTEXT: [-18, -204], FICTION: [-18, 66], OPINION: [-72, -24], HUMAN: [72, -24] };
const FILTERS = [["all", "All"], ["attested", "Attested"], ["validated", "Validated"], ["needs", "Needs you"]];

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const state = { filter: "all", tag: null, query: "" };

function cubeNode(c, size) {
  const stage = el("div", "stage" + (c.status === "attested" ? " sealed" : ""));
  stage.style.setProperty("--s", size + "px");
  const cube = el("div", "cube");
  for (const lens of [...LENSES, "HUMAN"]) {
    const face = lens === "HUMAN" ? c.validation : c.faces[lens];
    const live = lens === "HUMAN" ? c.validation && !c.validation.stale : Boolean(face && !face.pending);
    const side = el("div", `side f-${lens} ` + (live ? `fill-${lens}` : "empty"));
    if (live && lens !== "HUMAN" && face.unread) side.classList.add("unread");
    if (size > 100) side.textContent = lens === "HUMAN" ? "YOU" : lens;
    cube.append(side);
  }
  stage.append(cube);
  return stage;
}

function matches(c) {
  if (state.filter === "needs" && ["attested", "validated"].includes(c.status)) return false;
  if (["attested", "validated"].includes(state.filter) && c.status !== state.filter) return false;
  if (state.tag && !c.tags.includes(state.tag)) return false;
  if (state.query) {
    const hay = [c.id, c.content, ...Object.values(c.faces).map(f => f ? f.content : "")].join(" ").toLowerCase();
    if (!hay.includes(state.query)) return false;
  }
  return true;
}

function card(c) {
  const button = el("button", "card");
  button.setAttribute("aria-label", `${c.content} ${LABEL[c.status]}`);
  const strip = el("div", "strip");
  for (const lens of [...LENSES, "HUMAN"]) {
    const face = lens === "HUMAN" ? c.validation : c.faces[lens];
    const live = lens === "HUMAN" ? c.validation && !c.validation.stale : Boolean(face && !face.pending);
    const bit = el("i", live ? (face.unread ? "unread" : "") : "off");
    bit.style.setProperty("--c", `var(--${VAR[lens]})`);
    bit.title = lens;
    strip.append(bit);
  }
  button.append(cubeNode(c, 74), strip, el("p", "", c.content));
  const meta = el("div", "meta");
  meta.append(el("span", "pill " + c.status, LABEL[c.status]), el("span", "", Math.round(c.score * 100) + "%"));
  button.append(meta);
  button.addEventListener("click", () => open(c));
  return button;
}

function draw() {
  const root = document.getElementById("groups");
  root.replaceChildren();
  const shown = CUBES.filter(matches);
  if (!shown.length) root.append(el("p", "none", "No cubes match that."));
  const order = g => (g === "Project claims" ? "" : g);
  for (const group of [...new Set(shown.map(c => c.group))].sort((a, b) => order(a).localeCompare(order(b)))) {
    root.append(el("h2", "", group));
    const grid = el("div", "grid");
    shown.filter(c => c.group === group)
      .sort((a, b) => b.score - a.score || a.id.localeCompare(b.id))
      .forEach(c => grid.append(card(c)));
    root.append(grid);
  }
}

function open(c) {
  const body = document.getElementById("body");
  body.replaceChildren();
  const left = el("div", "left");
  const stage = cubeNode(c, 150);
  const cube = stage.querySelector(".cube");
  left.append(stage, el("div", "hint", "Drag to turn it. Pick a lens to face it."));

  let rx = -26, ry = -38, from = null;
  const pose = () => { cube.style.setProperty("--rx", rx + "deg"); cube.style.setProperty("--ry", ry + "deg"); };
  stage.addEventListener("pointerdown", e => { from = [e.clientX, e.clientY]; stage.setPointerCapture(e.pointerId); cube.style.transition = "none"; });
  stage.addEventListener("pointermove", e => {
    if (!from) return;
    ry += (e.clientX - from[0]) * .6; rx -= (e.clientY - from[1]) * .6;
    from = [e.clientX, e.clientY]; pose();
  });
  stage.addEventListener("pointerup", () => { from = null; cube.style.transition = ""; });

  const right = el("div", "right");
  right.append(el("h3", "", c.content), el("p", "id", c.id));
  const facts = [LABEL[c.status], Math.round(c.score * 100) + "% complete", "standing " + c.standing.toFixed(2)];
  if (c.source) facts.push(c.source);
  right.append(el("p", "facts", facts.join(" · ")));

  const row = (lens, title, text, note) => {
    const b = el("button", "lens" + (text ? "" : " missing"));
    b.style.setProperty("--c", `var(--${VAR[lens]})`);
    const head = el("b", "", title);
    if (note) head.append(el("em", "", " · " + note));
    b.append(head, document.createTextNode(text || "Not written yet"));
    b.addEventListener("click", () => { [rx, ry] = POSE[lens]; pose(); });
    return b;
  };
  for (const lens of LENSES) {
    const f = c.faces[lens];
    right.append(row(lens, lens, f && f.content, f && f.pending ? "draft, not accepted" : f && f.unread ? "accepted without reading" : ""));
  }
  const v = c.validation;
  right.append(row("HUMAN", "HUMAN VALIDATION", v && (v.note || "Validated"),
    v ? (v.stale ? "stale, a face changed" : "by " + v.validator) : ""));
  if (c.attestation) {
    const a = c.attestation;
    right.append(el("p", "facts", a.retracted ? "Attestation retracted: " + a.retracted : "Attested by " + a.source + (a.note ? ". " + a.note : "")));
  }
  if (c.neighbours.length) right.append(el("p", "facts", "Neighbours: " + c.neighbours.join(", ")));
  if (c.contradicts) right.append(el("p", "facts", "Contradicts: " + c.contradicts));
  body.append(left, right);
  document.getElementById("detail").showModal();
}

function setup() {
  renderStats();
  setupControls();
}
function renderStats() {
  const n = s => CUBES.filter(c => c.status === s).length;
  const stats = document.getElementById("stats");
  stats.replaceChildren();
  [[CUBES.length, "cubes"], [n("attested"), "attested"], [n("validated"), "validated, not attested"],
   [CUBES.length - n("attested") - n("validated"), "need you"],
   [CUBES.reduce((t, c) => t + Object.values(c.faces).filter(f => f && f.unread && !f.pending).length, 0), "faces not read"]]
    .forEach(([value, label]) => {
      const s = el("div", "stat");
      s.append(el("b", "", value), el("span", "", label));
      stats.append(s);
    });
}
function setupControls() {
  const legend = document.getElementById("legend");
  [...LENSES, "HUMAN"].forEach(lens => {
    const item = el("span");
    const swatch = el("i");
    swatch.style.background = `var(--${VAR[lens]})`;
    item.append(swatch, document.createTextNode(lens === "HUMAN" ? "Your validation" : lens[0] + lens.slice(1).toLowerCase()));
    legend.append(item);
  });

  const controls = document.getElementById("controls");
  const search = el("input");
  search.id = "search"; search.type = "search"; search.placeholder = "Search cubes"; search.setAttribute("aria-label", "Search cubes");
  search.addEventListener("input", () => { state.query = search.value.trim().toLowerCase(); draw(); });
  controls.append(search);
  const chips = [];
  FILTERS.forEach(([value, label]) => {
    const chip = el("button", "chip", label);
    chips.push([chip, value]);
    chip.addEventListener("click", () => {
      state.filter = value;
      chips.forEach(([b, v]) => b.setAttribute("aria-pressed", v === value));
      draw();
    });
    controls.append(chip);
  });
  chips.forEach(([b, v]) => b.setAttribute("aria-pressed", v === "all"));
  const seen = t => CUBES.filter(c => c.tags.includes(t)).length;
  const tags = [...new Set(CUBES.flatMap(c => c.tags))].filter(t => seen(t) >= 3).sort();
  tags.forEach(tag => {
    const chip = el("button", "chip", "#" + tag);
    chip.setAttribute("aria-pressed", "false");
    chip.addEventListener("click", () => {
      state.tag = state.tag === tag ? null : tag;
      controls.querySelectorAll(".chip").forEach(b => { if (b.textContent[0] === "#") b.setAttribute("aria-pressed", b.textContent === "#" + state.tag); });
      draw();
    });
    controls.append(chip);
  });

  const dialog = document.getElementById("detail");
  document.getElementById("close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });
  draw();
}
setup();
</script>

<script>
(() => {
  const root = document.getElementById("root"), grid = document.getElementById("grid");
  const swap = showGrid => {
    root.hidden = showGrid; root.style.display = showGrid ? "none" : "";
    grid.hidden = !showGrid;
    if (!showGrid) cubeField.show();
  };
  document.getElementById("togrid").addEventListener("click", () => swap(true));
  document.getElementById("snap").addEventListener("click", async e => {
    const blob = await cubeField.snapshot();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `cube-field-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, "-")}.png`;
    link.click();
    URL.revokeObjectURL(link.href);
    e.target.textContent = "Saved";
    setTimeout(() => { e.target.textContent = "Screenshot"; }, 1400);
  });
  document.getElementById("tofield").addEventListener("click", () => swap(false));
  const chips = [...document.querySelectorAll("[data-f]")];
  chips.forEach(chip => chip.addEventListener("click", () => {
    chips.forEach(c => c.setAttribute("aria-pressed", c === chip));
    cubeField.setFilter(chip.dataset.f);
  }));
  document.getElementById("fsearch").addEventListener("input", e => cubeField.setQuery(e.target.value.trim().toLowerCase()));
  const modeBar = document.getElementById("modes");
  modeBar.append(el("span", "", "Cluster by"));
  const names = { ALL: "All lenses", TAGS: "Tags" };
  const modes = [...Object.keys(MODES), "TAGS"];
  const modeChips = modes.map(mode => {
    const chip = el("button", "chip", names[mode] || mode[0] + mode.slice(1).toLowerCase());
    chip.setAttribute("aria-pressed", mode === cubeField.mode());
    chip.addEventListener("click", () => {
      modeChips.forEach(c => c.setAttribute("aria-pressed", c === chip));
      cubeField.setMode(mode);
    });
    modeBar.append(chip);
    return chip;
  });
  const key = document.getElementById("key");
  [...LENSES, "HUMAN"].forEach(lens => {
    const swatch = el("i");
    swatch.style.background = `var(--${VAR[lens]})`;
    key.append(swatch, document.createTextNode(lens === "HUMAN" ? "You" : lens[0] + lens.slice(1).toLowerCase()));
  });
  key.append(document.createTextNode("   ·   Gold glow: attested   ·   Hollow: missing   ·   Dim: unread   ·   Thread colour: the lens two cubes share   ·   Click to go in, Esc to back out, scroll to zoom"));
})();
</script>
